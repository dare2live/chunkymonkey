kind: profile
name: chunkymonkey
# Moth 0.3.0 resolves a relative repo_path against the process cwd, not this file.
# Callers must `cd` into the target snapshot and pass `--repo .`; safe_commit enforces it.
repo_path: .
codegraph_root: .
evidence_paths:
  goal: goal.md
  rules: CLAUDE.md
  sandbox: sandbox/README.md
instruction_sources:
  active:
    - CLAUDE.md
    - goal.md
    - live tooling output
  context_only:
    - chunkyctl history
  ignored_by_default: []
notes: >
  Controller-first ChunkyMonkey profile. Moth owns shared tooling state such as
  dirty worktree, CodeGraph, complexity, and evidence path discovery. Repo audit
  scripts and chunkyctl own business gates and local execution-surface checks
  such as data integrity, taxonomy/PIT, strategy promotion, and data health.
  goal.md is the compact live controller board and CLAUDE.md is the sole
  project rules file; history has no file — query it with `scripts/chunkyctl
  history --grep <term>` / `--eras` (git is the original).
assertion_packs:
  - .moth/assertions/claims.yaml
