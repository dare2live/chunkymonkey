  - id: holder-report-date-single-format
    claim: "fact_top10_holder_period report_date 全 YYYYMMDD 单格式 (2026-06-22 双真相源消灭 mythos§4: 旧 migrate_holders_to_tdxhub verbatim 搬运旧库 ISO → 同字段两套格式[474k YYYYMMDD ingest + 209k ISO migration], 致 MERGE-on-grain 重复 + audit MAX('2026-06-02'<'20260429') 误选丢最新 + 不归一消费者漏命中. writer 加 _compact_date_sql 归一 + 事务回填 dedup 89565 YMD孪生→594128行0丢失. >0 = ISO 复发=双真相源回潮. owner=backend/scripts/migrate_holders_to_tdxhub.py)"
