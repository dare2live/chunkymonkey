kind: assertion_pack
name: chunkymonkey-claims
# 声称-实况对账弹仓 (claims vs reality) — 2026-06-12 创立
# 规则: 文档/commit 里任何带数字的关键声称, 在这里挂一条可执行断言;
# 声称变化 (新决策) 时同 commit 更新断言 — 弹仓漂移 = 文档腐烂警报。
# 全部只读; duckdb 连接由 moth 引擎强制 read_only。
assertions:
  - id: smartmoney-constraint-tables
    claim: "PK/UNIQUE 约束表 >= 169 (2026-06-12 拆分回归二轮整改: 164 张 upsert 目标表 PK 全量恢复)"
    type: duckdb_sql
    database: data/smartmoney.duckdb
    query: "SELECT count(DISTINCT table_name) FROM duckdb_constraints() WHERE constraint_type IN ('PRIMARY KEY','UNIQUE')"
    expect: {op: ">=", value: 169}
  - id: smartmoney-indexes
    claim: "索引 348 (拆分后从旧库 DDL 全量重放, 缺 = 回归)"
    type: duckdb_sql
    database: data/smartmoney.duckdb
    query: "SELECT count(*) FROM duckdb_indexes()"
    expect: {op: ">=", value: 348}
  - id: smartmoney-tables
    claim: "343 表 (拆分 validation 口径; 增删表应显式过决策)"
    type: duckdb_sql
    database: data/smartmoney.duckdb
    query: "SELECT count(*) FROM duckdb_tables()"
    expect: {op: ">=", value: 343}
  - id: smartmoney-size-band
    claim: "库体量 20-30GB 带内 (goal.md '24G'; 越界 = 异常膨胀或错库)"
    type: file_size
    path: data/smartmoney.duckdb
    expect: {op: between, low: 20000000000, high: 30000000000}
  - id: calendar-floor
    claim: "交易日历起点 == 2005-01-04 (2026-06-12 扩展+七项验证 PASS; 回退 = 静默 clamp 复发)"
    type: duckdb_sql
    database: data/smartmoney.duckdb
    query: "SELECT CAST(min(trade_date) AS VARCHAR) FROM dim_trading_calendar"
    expect: {op: "==", value: "2005-01-04"}
  - id: retired-db-retained
    claim: "旧库保留至 2026-06-26 (goal.md 拆分回滚保险; 到期人工删除后移除本断言)"
    type: file_exists
    path: data/smartmoney_v1_retired_20260612.duckdb
    expect: {op: "==", value: true}
  - id: dc-member-truncation-pin
    claim: "dc_member 近 30 日无整 5000 行截断签名 (2026-06-12 发现静默截断; chain9 分页重拉后应转绿)"
    type: duckdb_sql
    database: data/tushare_raw.duckdb
    query: "SELECT count(*) FROM (SELECT trade_date, count(*) AS n FROM raw_tushare_dc_member GROUP BY 1 ORDER BY 1 DESC LIMIT 30) WHERE n % 5000 = 0"
    expect: {op: "==", value: 0}
  - id: watermark-utc-contract
    claim: "source_watermarks.py 保留 UTC 口径警示头注 (两次 UTC 误读事故防线)"
    type: shell
    command: ["grep", "-ci", "utc", "backend/services/source_watermarks.py"]
    expect: {op: ">=", value: 1}
  - id: doc-governance
    claim: "文档治理执法器 PASS (幽灵引用/superseded 断链/goal 行数/docs 文件数; 状态标头契约 owner=docs/README.md)"
    type: shell
    command: ["python3", "backend/scripts/check_doc_governance.py"]
    expect: {op: regex, pattern: "verdict=PASS"}
  - id: quota-circuit-breaker
    claim: "信道配额熔断在盘 (2026-06-13 代理 jiaoch.site 反刷量墙定层; 删除=逐日续戳烧配额复发)"
    type: shell
    command: ["grep", "-c", "_is_quota_wall\\|QuotaExhaustedError", "backend/services/data_sources/sync_runner.py"]
    expect: {op: ">=", value: 3}
  - id: watermark-refresher-wired
    claim: "kline 水位刷新器接在 daily_update Step 2.97 (2026-06-13 修孤儿化; 检查器写器两器官缺一即水位卡死)"
    type: shell
    command: ["grep", "-c", "refresh_source_watermarks.py", "scripts/daily_update.sh"]
    expect: {op: ">=", value: 1}
  - id: lhb-exit-verdict-go
    claim: "LHB 上榜即退出判决 = GO (2026-06-13 第一个判正 alpha, 三判官全过; 判负归档前应在)"
    type: shell
    command: ["bash", "-c", "grep -o '\"verdict\": \"GO\"' analysis/lhb_exit_verdict_20260612.json | head -1 | grep -c GO"]
    expect: {op: "==", value: 1}
  - id: concept-event-no-phantom
    claim: "概念事件幻影残留杀线: 平滑重建后 BORN+DEAD 日均 < 5 (2026-06-13 平滑窗3根治 4612→79)"
    type: duckdb_sql
    database: data/smartmoney.duckdb
    query: "WITH e AS (SELECT event_date, count(*) FILTER (WHERE event_type IN ('concept_born','concept_dead')) AS c FROM fact_concept_event WHERE as_of_mode='reconstructed' GROUP BY 1) SELECT CASE WHEN count(*)=0 THEN 999 ELSE sum(c)*1.0/count(*) END FROM e"
    expect: {op: "<", value: 5}
