kind: assertion_pack
name: chunkymonkey-claims
# 声称-实况对账弹仓 (claims vs reality) — 2026-06-12 创立
# 规则: 文档/commit 里任何带数字的关键声称, 在这里挂一条可执行断言;
# 声称变化 (新决策) 时同 commit 更新断言 — 弹仓漂移 = 文档腐烂警报。
# 全部只读; duckdb 连接由 moth 引擎强制 read_only。
assertions:
  - id: smartmoney-constraint-tables
    claim: "PK/UNIQUE 约束表 >= 39 (2026-06-14 地基-reset: 删整个模型/特征/寻优层后只剩地基+展示+治理 85 表)"
    type: duckdb_sql
    database: data/smartmoney.duckdb
    query: "SELECT count(DISTINCT table_name) FROM duckdb_constraints() WHERE constraint_type IN ('PRIMARY KEY','UNIQUE')"
    expect: {op: ">=", value: 39}
  - id: smartmoney-indexes
    claim: "索引 >=94 (2026-06-16 重启清理 drop 探索表/缓存后 99→94; 缺=回归)"
    type: duckdb_sql
    database: data/smartmoney.duckdb
    query: "SELECT count(*) FROM duckdb_indexes()"
    expect: {op: ">=", value: 94}
  - id: smartmoney-tables
    claim: "表 >=84 (2026-06-16 重启清理 drop 9 张探索/缓存/0行表后 85→84; 增表应显式过决策)"
    type: duckdb_sql
    database: data/smartmoney.duckdb
    query: "SELECT count(*) FROM duckdb_tables()"
    expect: {op: ">=", value: 84}
  - id: smartmoney-size-band
    claim: "库体量 2-6GB 带内 (2026-06-14 地基-reset 26.6→2.5G; 越界 = 异常膨胀或错库/数据丢失)"
    type: file_size
    path: data/smartmoney.duckdb
    expect: {op: between, low: 2000000000, high: 6000000000}
  - id: calendar-floor
    claim: "交易日历起点 == 2005-01-04 (2026-06-12 扩展+七项验证 PASS; 回退 = 静默 clamp 复发)"
    type: duckdb_sql
    database: data/smartmoney.duckdb
    query: "SELECT CAST(min(trade_date) AS VARCHAR) FROM dim_trading_calendar"
    expect: {op: "==", value: "2005-01-04"}
  # retired-db-retained 断言已移除 (2026-06-13 用户授权提前删 v1 旧库 34G — 新库稳定一日重负载验证通过,
  # 回滚窗提前关; 按断言自身契约"到期人工删除后移除本断言"执行)
  - id: dc-member-truncation-pin
    claim: "dc_member 近 30 日无整 5000 行截断签名 (2026-06-12 发现静默截断; chain9 分页重拉后应转绿)"
    type: duckdb_sql
    database: data/tushare_raw.duckdb
    query: "SELECT count(*) FROM (SELECT trade_date, count(*) AS n FROM raw_tushare_dc_member GROUP BY 1 ORDER BY 1 DESC LIMIT 30) WHERE n % 5000 = 0"
    expect: {op: "==", value: 0}
  - id: watermark-utc-contract
    claim: "source_watermarks.py 保留 UTC 口径警示头注 (两次 UTC 误读事故防线)"
    type: shell
    command: ["grep", "-ci", "utc", "backend/services/source_watermarks.py"]
    expect: {op: ">=", value: 1}
  - id: doc-governance
    claim: "文档治理执法器 PASS (幽灵引用/superseded 断链/goal 行数/docs 文件数; 状态标头契约 owner=docs/README.md)"
    type: shell
    command: ["python3", "backend/scripts/check_doc_governance.py"]
    expect: {op: regex, pattern: "verdict=PASS"}
  - id: quota-circuit-breaker
    claim: "信道配额熔断在盘 (2026-06-13 代理 jiaoch.site 反刷量墙定层; 删除=逐日续戳烧配额复发)"
    type: shell
    command: ["grep", "-c", "_is_quota_wall\\|QuotaExhaustedError", "backend/services/data_sources/sync_runner.py"]
    expect: {op: ">=", value: 3}
  - id: doc-drift
    claim: "活索引文档 (PROJECT_INDEX/goal) 不引用已删代码文件路径 (2026-06-14 立: mythos §16 漂移默认态对账要机器做 + 用户'及时更新文档'; 历史叙事/模板豁免)"
    type: shell
    command: ["bash", "-c", "cd $(git rev-parse --show-toplevel) && PYTHONPATH=backend python backend/scripts/check_doc_drift.py --check | python3 -c 'import json,sys; sys.exit(0 if json.load(sys.stdin)[\"overall\"]==\"PASS\" else 1)' && echo DOC_OK"]
    expect: {op: regex, pattern: "DOC_OK"}
  - id: data-layer-integrity
    claim: "每张活表必在 data_layers.yaml 声明 layer (2026-06-14 地基-reset 立: 层级声明化根治'隐式分层→反复推导+耦合无法分离'; 未声明=违纪, 新表必须先声明)"
    type: shell
    command: ["bash", "-c", "cd $(git rev-parse --show-toplevel) && PYTHONPATH=backend python backend/scripts/data_layer_audit.py --check | python3 -c 'import json,sys; sys.exit(0 if json.load(sys.stdin)[\"overall\"]==\"PASS\" else 1)' && echo LAYER_OK"]
    expect: {op: regex, pattern: "LAYER_OK"}
  - id: minimal-module-main-routers
    claim: "main.py 挂载 router 数有上界 (反例 2026-06-14: main import 全 router 致地基-reset 时闭包拉不开; 最小化模块纪律, 涨破阈值=耦合回潮须拆)"
    type: shell
    command: ["bash", "-c", "grep -c 'include_router' backend/main.py"]
    expect: {op: "<=", value: 45}
  - id: minimal-module-no-new-godfile
    claim: "god-file (>800行) 数 ratchet <=0 (硬门, dossier 全迁完) (2026-06-14 立基线: data_quality 4286/scoring 2712/signals_v2 2156 等违最小化模块; 禁新增, 存量逐步拆; 涨破=耦合回潮)"
    type: shell
    command: ["bash", "-c", "find backend -name '*.py' -not -path '*/__pycache__/*' -not -path '*/tests/*' | xargs wc -l 2>/dev/null | awk '$1>800 && $2!=\"total\"{n++} END{print n+0}'"]
    expect: {op: "<=", value: 23}
  - id: watermark-refresher-wired
    claim: "kline 水位刷新器接在 daily_update Step 2.97 (2026-06-13 修孤儿化; 检查器写器两器官缺一即水位卡死)"
    type: shell
    command: ["grep", "-c", "refresh_source_watermarks.py", "scripts/daily_update.sh"]
    expect: {op: ">=", value: 1}
  - id: optuna-require-walk-forward
    claim: "optuna_config 守 require_walk_forward=true (2026-06-14 L0 立: 防过拟合核心 — 业务表禁 in-sample fit 入库; 翻 false = 估计死红线破, stage_opt leakage 反例复发)"
    type: shell
    command: ["bash", "-c", "grep -c 'require_walk_forward: true' backend/config/optuna_config.yaml"]
    expect: {op: ">=", value: 1}
  - id: optuna-realistic-sharpe-cap
    claim: "optuna_config 守 max_realistic_sharpe 熔断 (2026-06-14 L0 立: 异常高数字=leakage警报非成就; 删=裸K线基准'太好'无人核查)"
    type: shell
    command: ["bash", "-c", "grep -c 'max_realistic_sharpe' backend/config/optuna_config.yaml"]
    expect: {op: ">=", value: 1}
  - id: l0-search-governance-wired
    claim: "L0 寻参 runner 接 plan_validator 搜索空间闸 + DSR deflate (2026-06-14: 防过拟合多重比较校正 + 防 29/34 白跑反例; 反孤儿 mythos §14 删任一=寻参失治理)"
    type: shell
    command: ["bash", "-c", "grep -cE 'enforce_search_space_nonempty|deflated_sharpe_ratio' backend/services/optimization/formula_param_search.py"]
    expect: {op: ">=", value: 2}
  - id: legacy-flow-no-pollution
    claim: "老流程污染清除 ratchet (2026-06-14 工具化 reset 教训; 重构验收 gate). 进度: C1 daily_update 无缺失脚本调用 PASS (855->457行删19缺失脚本) + C3 append-only 必 retention PASS (3表声明) + C2 wiped 孤儿引用 238->29 (退役7死serving router/删schema_versions 23版本条目/7config @archived). 余 C2<=43 (2026-06-16 重启清理 drop fact_feature_panel/缓存/探索表 +14 代码 DDL/audit 引用, 待 rebuild 层重构降回; 原 29) = updater 死 builder (build_profiles/trends/industry_stat/screening/sector_momentum 建已删 L2/L3 表) 嵌在 live update-DAG (RUNNERS/STEPS/HARD_DEPS, data_sources/etf 依赖) = 显式 P2 增量解耦 (framework §6: 禁 big-bang 反复破CI). ratchet C2<=29 防回潮, P2 收口后降 0. owner=analysis/refactor_execution_plan_20260614.md"
    type: shell
    command: ["bash", "-c", "cd $(git rev-parse --show-toplevel) && PYTHONPATH=backend python -c \"import json,subprocess,os; e=dict(os.environ,PYTHONPATH='backend'); d=json.loads(subprocess.run(['python','backend/scripts/check_legacy_flow_integrity.py'],capture_output=True,text=True,env=e).stdout); c=d['checks']; ok=c['daily_update_scripts']['verdict']=='PASS' and c['append_only_retention']['verdict']=='PASS' and c['no_wiped_refs']['n_stale_refs']<=43; print('LEGACY_OK' if ok else 'LEGACY_PENDING')\""]
    expect: {op: regex, pattern: "LEGACY_OK"}
  - id: validation-r1-symmetric-gate
    claim: "R1 对称可交易性门在岗 (2026-06-15 8-lens 对抗复审根因 R1 反哺): anomaly_verdict 是单边门(只抓IC太高), 数学上抓不到 'IC真但long-only含成本亏钱'(Phase B 33σ REAL_EDGE 仍 gross -34.6%). experiment_harness 必有 tradability_verdict -> IC>0 且 net<=0 标 IC_POSITIVE_BUT_UNTRADABLE. 删=R1盲点复发. owner=docs/strategy_validation_contract.md C-R1"
    type: shell
    command: ["bash", "-c", "grep -cE 'def tradability_verdict|IC_POSITIVE_BUT_UNTRADABLE' backend/services/experiment_harness.py"]
    expect: {op: ">=", value: 2}
  - id: validation-promotion-needs-money
    claim: "转正章必须看过钱 (2026-06-15 缺陷 N3/自欺死): confirmed_by_owner=1 不许纯凭 IC 置换显著性盖, 必带含成本绝对收益证据 (record_verdict guard raise). 删=系统最强章盖时没看过含成本收益. owner=docs/strategy_validation_contract.md C-R1"
    type: shell
    command: ["bash", "-c", "grep -cE '_has_money_evidence|C-R1 BLOCK' backend/services/experiment_store.py"]
    expect: {op: ">=", value: 2}
  - id: validation-promotion-needs-leakage-clean
    claim: "转正章必须 leakage-clean — 真金白银门不可自批绕过 (2026-06-15 用户: commit 时 SKIP_LEAKAGE_AUDIT 自批=门是摆设, 本地 hook 终究可 --no-verify 逃). 真正强制移到提交者够不到的**转正门**: record_verdict confirmed_by_owner=1 须带 leakage-clean 证据 (judges 含 leakage_gate/leakage_clean/pit_audit 显示 clean), 否则 C-LEAK BLOCK raise. 配套: safe_commit Step3.5/3.6 已移除 SKIP 自批逃生 (改硬门; 误报=修 verifier 非 skip). 删=泄漏隐患可盖最强章上 live. owner=docs/strategy_validation_contract.md"
    type: shell
    command: ["bash", "-c", "grep -cE '_has_leakage_clean|C-LEAK BLOCK' backend/services/experiment_store.py"]
    expect: {op: ">=", value: 2}
  - id: leakage-gate-no-self-bypass
    claim: "leakage commit 门无自批 SKIP 逃生 (2026-06-15 用户: 自批绕过=摆设). safe_commit Step3.5/3.6 HIGH=硬 exit 4, 不再认 SKIP_LEAKAGE_AUDIT 自批 (含义性 grep: 不应再有 'SKIP_LEAKAGE_AUDIT.*proceeding' 放行). 误报正解=修 verifier 精度/config (永久), 真紧急=--no-verify(核选项留疤). 复活自批=门退回摆设."
    type: shell
    command: ["bash", "-c", "grep -c 'SKIP_LEAKAGE_AUDIT.*bypass.*proceeding\\|SKIP_LEAKAGE_AUDIT=1 bypass' scripts/safe_commit.sh || true"]
    expect: {op: "==", value: 0}
  - id: validation-winreturn-codex
    claim: "C-WinReturn 联合验收门在岗 (2026-06-15 用户: 除胜率还要考核收益率, 目的是真能赚钱非证明有效): experiment_harness.kpi_verdict 须联合 年化 AND max_dd AND 月胜率 AND 胜率x盈亏比期望(positive_expectancy); 胜率=诊断量收益+max_dd=目标量. 删=单凭胜率/IC 放行. owner=docs/strategy_validation_contract.md C-WinReturn"
    type: shell
    command: ["bash", "-c", "grep -cE 'def kpi_verdict|positive_expectancy|payoff_ratio' backend/services/experiment_harness.py"]
    expect: {op: ">=", value: 3}
  - id: validation-engine-execution-aware
    claim: "execution-aware 引擎在岗 (2026-06-15 P1 重建, 根因 R2): portfolio_execbacktest 须含 T+1 open 入场 + 涨跌停一字板剔篮 + 非对称成本栈(卖方印花) + 容量诊断 + 停牌冻结. 旧 portfolio_returnbacktest(close 无条件成交)已删. 删=R2 无摩擦市场假设复发, '含成本裁决'变假裁决. owner=docs/strategy_validation_contract.md C-R2"
    type: shell
    command: ["bash", "-c", "grep -cE 'def run_execution_backtest|_is_one_line_up|stamp_duty_sell_pct|entry_at_open|capacity' backend/services/portfolio_execbacktest.py"]
    expect: {op: ">=", value: 4}
  - id: validation-integrity-gate-green
    claim: "策略验证完整性 gate 全绿 (2026-06-15 P1 收口): check_strategy_validation_integrity overall=PASS (anomaly_symmetric + promotion_needs_money + kpi_joint_codex + engine_execution_aware 四检查全过). 任一红=R1/R2/C-WinReturn 制度被破坏"
    type: shell
    command: ["bash", "-c", "cd $(git rev-parse --show-toplevel) && PYTHONPATH=backend python backend/scripts/check_strategy_validation_integrity.py 2>/dev/null | python3 -c 'import json,sys; print(\"GATE_\"+json.load(sys.stdin)[\"overall\"])'"]
    expect: {op: regex, pattern: "GATE_PASS"}
  - id: coupling-no-orphan-refs
    claim: "无孤儿耦合引用 (2026-06-16 用户: 删除暴露 表↔代码↔配置↔DB↔文档↔测试 耦合; moth coupling (引擎全局) 防'删脚本→孤儿测试崩CI collection'/'drop表→moth断言悬空'复发. 删前用 --impact <name> 看爆炸半径)"
    type: shell
    command: ["bash", "-c", "cd $(git rev-parse --show-toplevel) && moth coupling --repo . 2>&1 | grep -o 'verdict=[A-Z]*' | head -1"]
    expect: {op: regex, pattern: "verdict=PASS"}
