kind: assertion_pack
name: chunkymonkey-claims
# 声称-实况对账弹仓 (claims vs reality) — 2026-06-12 创立
# 规则: 文档/commit 里任何带数字的关键声称, 在这里挂一条可执行断言;
# 声称变化 (新决策) 时同 commit 更新断言 — 弹仓漂移 = 文档腐烂警报。
# 全部只读; duckdb 连接由 moth 引擎强制 read_only。
# ── severity (2026-08-14 立) ────────────────────────────────────────────────
# 背景: 此前 38 条断言**在任何地方都没有阻断力** —— CI 完全不跑 moth, 而 safe_commit 里
# moth 属 scaffold 组 = warn-only。于是每次提交花 47 秒得到一份拦不住任何东西的清单,
# 其中却混着真正的数据不变量(calendar-floor 注释写着「回退=静默 clamp 复发」、
# dc-member-truncation-pin 写着「2026-06-12 发现静默截断」)。实测这两条在 pytest 里覆盖为 0,
# 即 moth 是它们**唯一**的执法点, 而那个执法点不执法。
# 根因: moth 是**一道门**, 38 条断言按整体继承了它的分组 —— 粗粒度分组悄悄改了不该改的
# 东西的强制级别(与 warn-only 短路吞检查同一形态)。
#
# 判据(只此一条, 不要扩张): **违反它意味着数据/平台此刻就是错的**, 而不是「登记没跟上」。
#   blocking  → 数据此刻是错的。例: 主键丢了 / 日历起点回退 / 分页静默截断 / Type A 混入泄漏列
#   (默认)     → 棘轮与脚手架。例: 表数 >= N(增表要显式过决策) / 文档地图陈旧 / grep 防删除
# 阈值型棘轮(smartmoney-tables/indexes/constraint-tables/size-band)**刻意不列 blocking**:
# 它们触发时说明「登记没跟上」, 不是「数据错了」—— 拿它挡提交就是本轮要消灭的那种张力。
assertions:
  - id: smartmoney-size-band
    claim: "smartmoney 当前 control/serving 库体量 0.2-15GB 带内 (…2026-07-24 ~8.72GB→9GB; 2026-07-25 org trunc sharded repair 实测 ~11.16GB → 抬 9GB→12GB; 2026-08-05 日更 drain 合法增长实测 13.69GB (dc_member +644k 回填 + holders/org 增量, 无 wal, 单文件派生自 accepted partition) → 抬 12GB→15GB, 仍单文件派生自 accepted partition 非 bloat; 2026-08-12 日更后实测 16.69GB, `pragma_database_size` 显示 free 1554/total 63660 = 2.44%(wal=0) 即 97.6% 活数据 → 抬 15GB→20GB; 2026-08-16 日更后实测 20.04GB, free 1566/total 76432 = 2.05%(wal=0) 即 97.95% 活数据 → 抬 20GB→26GB)；越界提示错库或 retention 漂移。**膨胀本身改由 [[smartmoney-bloat-ratio]] 断言直接测**, 本条只管绝对量级 —— 因为绝对带对「DROP/UPDATE 完没 compact」是瞎的"
    type: file_size
    path: data/smartmoney.duckdb
    expect: {op: between, low: 200000000, high: 26000000000}
  - id: smartmoney-bloat-ratio
    severity: blocking
    claim: "smartmoney 死块占比 < 10%。绝对体量带是棘轮 (9→12→15→20→26GB), 对「DELETE/UPDATE 完没 compact」瞎。2026-08-26: qfq 增量一次全表 UPDATE 把 market 从 0.03% 打回 ~25%, 25% 阈值会放过这次事故, 故各库死块带降到 10%。超阈: `python backend/scripts/db_compact.py --db smartmoney --execute`。"
    type: duckdb_sql
    database: data/smartmoney.duckdb
    query: "SELECT CAST(round(100.0 * free_blocks / nullif(total_blocks, 0), 2) AS DOUBLE) FROM pragma_database_size()"
    expect: {op: "<", value: 10.0}
  - id: market-bloat-ratio
    severity: blocking
    claim: "market.duckdb 死块占比 < 10%。2026-08-26 qfq 增量在跳过 compact 的假设下把 free_blocks 从 0.03% 打到 ~25% (全表 stamp factor_as_of); size-band 看不到这件事。超阈: `python backend/scripts/db_compact.py --db market --execute`。"
    type: duckdb_sql
    database: data/market.duckdb
    query: "SELECT CAST(round(100.0 * free_blocks / nullif(total_blocks, 0), 2) AS DOUBLE) FROM pragma_database_size()"
    expect: {op: "<", value: 10.0}
  - id: org-holding-bloat-ratio
    severity: blocking
    claim: "org_holding.duckdb 死块占比 < 10%。拆库后若断言仍只盯 smartmoney, 新文件膨胀不会被发现。超阈: `python backend/scripts/db_compact.py --db org_holding --execute`。"
    type: duckdb_sql
    database: data/org_holding.duckdb
    query: "SELECT CAST(round(100.0 * free_blocks / nullif(total_blocks, 0), 2) AS DOUBLE) FROM pragma_database_size()"
    expect: {op: "<", value: 10.0}
  - id: tushare-raw-bloat-ratio
    claim: "tushare_raw.duckdb 死块占比 < 25% (写面, compact 不进日常回收, 但仍要看见膨胀)。超阈先 owner 判断再 `db_compact.py --db tushare_raw --execute`。"
    type: duckdb_sql
    database: data/tushare_raw.duckdb
    query: "SELECT CAST(round(100.0 * free_blocks / nullif(total_blocks, 0), 2) AS DOUBLE) FROM pragma_database_size()"
    expect: {op: "<", value: 25.0}
  - id: feature-store-bloat-ratio
    severity: blocking
    claim: "feature_store.duckdb 死块占比 < 10%。institution_profile / rally_gt 是 DROP+CREATE+CHECKPOINT，CHECKPOINT 不回收块。超阈: `python backend/scripts/db_compact.py --db feature_store --execute`。"
    type: duckdb_sql
    database: data/feature_store.duckdb
    query: "SELECT CAST(round(100.0 * free_blocks / nullif(total_blocks, 0), 2) AS DOUBLE) FROM pragma_database_size()"
    expect: {op: "<", value: 10.0}
  - id: calendar-floor
    severity: blocking
    claim: "交易日历起点 == 2005-01-04 (2026-06-12 扩展+七项验证 PASS; 回退 = 静默 clamp 复发)。2026-06-27 §9 拆库: dim_trading_calendar 迁 reference.duckdb, 断言库改 reference"
    type: duckdb_sql
    database: data/reference.duckdb
    query: "SELECT CAST(min(trade_date) AS VARCHAR) FROM dim_trading_calendar"
    expect: {op: "==", value: "2005-01-04"}
  - id: section9-dims-in-reference
    severity: blocking
    claim: "§9 reference 拆库: 2 dim (active/trading_calendar) 全在 reference.duckdb (2026-06-27 Stage E 迁移真相源; 缺=迁移丢失/回滚)。原 4 dim 含 all_ever_listed/listing_status 2026-07-07 整表退役物删 (0 存活 writer / 0 业务读者), 断言集从 4 缩至 2, 见 git log --grep dim_all_ever_listed"
    type: duckdb_sql
    database: data/reference.duckdb
    query: "SELECT count(*) FROM duckdb_tables() WHERE table_name IN ('dim_active_a_stock','dim_trading_calendar')"
    expect: {op: "==", value: 2}
  - id: reference-dims-have-pk
    severity: blocking
    claim: "不变量#1 主键: reference 2 dim (active/trading_calendar) 全有 DB 强制 PRIMARY KEY (2026-06-28 修 §9 迁移丢 PK 缺口; <2 = de-facto 唯一退化, 真主键不变量破; 2026-07-07 all_ever_listed/listing_status 退役后集合缩至 2)"
    type: duckdb_sql
    database: data/reference.duckdb
    query: "SELECT count(DISTINCT table_name) FROM duckdb_constraints() WHERE constraint_type='PRIMARY KEY' AND table_name IN ('dim_active_a_stock','dim_trading_calendar')"
    expect: {op: "==", value: 2}
  - id: section9-dims-absent-smartmoney
    severity: blocking
    claim: "§9 reference 拆库: 2 dim (active/trading_calendar) 已从 smartmoney 物删, 不得重建 (2026-06-27 Stage E; >0 = schema-init DDL 重建路径回潮 undo 物删, 不变量#2 读写边界破; 2026-07-07 all_ever_listed/listing_status 从此断言集移除因表本身已整体退役非仅迁库)"
    type: duckdb_sql
    database: data/smartmoney.duckdb
    query: "SELECT count(*) FROM duckdb_tables() WHERE table_name IN ('dim_active_a_stock','dim_trading_calendar')"
    expect: {op: "==", value: 0}
  # retired-db-retained 断言已移除 (2026-06-13 用户授权提前删 v1 旧库 34G — 新库稳定一日重负载验证通过,
  # 回滚窗提前关; 按断言自身契约"到期人工删除后移除本断言"执行)
  - id: dc-member-truncation-pin
    severity: blocking
    claim: "dc_member 近 30 日无整 5000 行截断签名 (2026-06-12 发现静默截断; chain9 分页重拉后应转绿)"
    type: duckdb_sql
    database: data/tushare_raw.duckdb
    query: "SELECT count(*) FROM (SELECT trade_date, count(*) AS n FROM raw_tushare_dc_member GROUP BY 1 ORDER BY 1 DESC LIMIT 30) WHERE n % 5000 = 0"
    expect: {op: "==", value: 0}
  - id: watermark-utc-contract
    claim: "source_watermarks.py 保留 UTC 口径警示头注 (两次 UTC 误读事故防线)"
    type: shell
    command: ["grep", "-ci", "utc", "backend/services/source_watermarks.py"]
    expect: {op: ">=", value: 1}
  - id: bestchoice-frozen-evidence
    claim: "BestChoice 仅是冻结 challenger 证据包；两个实现与两份机器证据的 hash、shape、唯一键、candidate/reject 和五公式分布必须与 manifest 精确一致"
    type: shell
    command: ["python3", "-B", "-m", "bestchoice.scripts.verify_frozen_evidence"]
    expect: {op: regex, pattern: "verify_frozen_evidence: ok"}
  - id: quota-circuit-breaker
    claim: "信道配额熔断在盘 (2026-06-13 代理 jiaoch.site 反刷量墙定层; 删除=逐日续戳烧配额复发)"
    type: shell
    command: ["grep", "-c", "_is_quota_wall\\|QuotaExhaustedError", "backend/services/data_sources/sync_runner.py"]
    expect: {op: ">=", value: 3}
  - id: tinyshare-runtime-payload
    claim: "TinyShare 不只存在 dist-info；版本化 pyc 运行载荷必须导出 pro_api 和权限/连接异常类型，防全仓 cache 清理误删 provider 本体后仍假装已安装"
    type: shell
    command: [".venv/bin/python", "-c", "import tinyshare; assert hasattr(tinyshare,'pro_api'); assert hasattr(tinyshare,'TinySharePermissionError'); assert hasattr(tinyshare,'TinyShareConnectionError'); print('TINYSHARE_RUNTIME_OK')"]
    expect: {op: regex, pattern: "TINYSHARE_RUNTIME_OK"}
  - id: data-layer-integrity
    severity: blocking
    claim: "每张活表必在 data_layers.yaml 声明 layer + Type A 列纯度 (2026-06-14 层级声明化 + 2026-06-28 加工分层 A/B: asset_class=A 层[L1_foundation/L1k/display=确定性PIT重排]表禁含 forward/label/score/signal/ic/predicted 等 Type B 列, 防策略派生伪装混入平台; 未声明 or Type A 含泄漏列=FAIL)"
    type: shell
    command: ["bash", "-c", "cd $(git rev-parse --show-toplevel) && PYTHONPATH=backend .venv/bin/python3 backend/scripts/data_layer_audit.py --check | python3 -c 'import json,sys; sys.exit(0 if json.load(sys.stdin)[\"overall\"]==\"PASS\" else 1)' && echo LAYER_OK"]
    expect: {op: regex, pattern: "LAYER_OK"}
  - id: minimal-module-main-routers
    claim: "main.py 挂载 router 数有上界 (反例 2026-06-14: main import 全 router 致地基-reset 时闭包拉不开; 最小化模块纪律, 涨破阈值=耦合回潮须拆)"
    type: shell
    command: ["bash", "-c", "grep -c 'include_router' backend/main.py"]
    expect: {op: "<=", value: 45}
  - id: watermark-refresher-wired
    claim: "kline 水位刷新器接在 daily_update 管线 store 阶段 (2026-06-13 修孤儿化; 2026-06-23 重设计后接线在 pipeline/store.py 而非 daily_update.sh; 检查器写器两器官缺一即水位卡死)"
    type: shell
    command: ["grep", "-c", "refresh_source_watermarks.py", "backend/services/pipeline/store.py"]
    expect: {op: ">=", value: 1}
  - id: coupling-no-orphan-refs
    claim: "Moth 可枚举的表/脚本/config/assertion 耦合无孤儿；source/config→文档引用由独立 doc-drift assertion 覆盖，不把本 claim 夸大为全仓证明"
    type: shell
    command: ["bash", "-c", "cd $(git rev-parse --show-toplevel) && moth coupling --repo . 2>&1 | grep -o 'verdict=[A-Z]*' | head -1"]
    expect: {op: regex, pattern: "verdict=PASS"}
  - id: exploration-isolated-in-sandbox
    claim: "探索隔离在 sandbox/ 不污染主代码 (2026-06-17 用户根治: 探索脚本/findings草稿/结果散进 backend/scripts+analysis+docs = 反复污染根因, 本对话清~100文件). sandbox/ gitignored 且默认整包清理; 探索 runner (experiment_*/analyze_*) 不许在 backend/scripts (该在 sandbox/<exp>/). 需要晋升的结果必须按现行 Tier3 契约重写、经 Rule 10 审核并由正式 owner 接管; 当前没有跨删存活的 verdict writer. 复活旧路径=污染根因复发. owner=sandbox/README.md"
    type: shell
    command: ["bash", "-c", "{ ls backend/scripts/experiment_*.py backend/scripts/analyze_*.py 2>/dev/null || true; } | wc -l | tr -d ' '"]
    expect: {op: "==", value: 0}
  - id: sandbox-boundary-guard-present
    claim: "沙盒边界硬门在岗 (2026-06-17 用户: 边界要水密非约定; 审计 wf_6185abb2 实测沙脚本能裸 duckdb.connect 主库 rw 真写了 market 库). services.sandbox_guard 提供 enable_sandbox_guard (monkeypatch 挡 rw 打开 database_manifest 登记的主存储并 raise SandboxBoundaryError) + read_only_main (只读正路) + sandbox_scratch (per-exp); sandbox.sh new 模板首行调 guard. 删=边界退回纯约定, 探索可写坏主库. owner=sandbox/README.md"
    type: shell
    command: ["bash", "-c", "grep -c 'def enable_sandbox_guard\\|class SandboxBoundaryError\\|def read_only_main' backend/services/sandbox_guard.py"]
    expect: {op: ">=", value: 3}
  - id: holder-report-date-single-format
    severity: blocking
    claim: "canonical_top10_float_holders_period report_date 全 YYYYMMDD 单格式 (holders fact DROPPED 2026-07-26; 守 formal SSOT 归一. >0 = ISO 复发=双真相源回潮)"
    type: duckdb_sql
    database: data/smartmoney.duckdb
    query: "SELECT count(*) FROM canonical_top10_float_holders_period WHERE CAST(report_date AS VARCHAR) LIKE '%-%'"
    expect: {op: "==", value: 0}
  - id: qfq-lineage-guard
    severity: blocking
    claim: "2026-09-08 换心重写。历史: 本断言 09-01 改自 qfq-serving-tushare-only (那条查 v_price_kline_qfq.source_name<>'tushare', 而 source_name 是视图字面量非物理列, count 数学上恒为 0, 从建立起没真查过任何东西); 09-01 又二次收紧, 把静态半边从「全文找 'raw_tushare_adj_factor' 这个字符串」改成「解析源码里两处生成 qfq 价格列的 JOIN/CTE 图, 抽出因子来源物理表集合, 严格等于 {raw_tushare_adj_factor}」, 并把 45 天窗去掉改全历史扫 ingest_batch。当时的 claim 里写明「该域一旦切换完成, 本断言的期望物理表集合需同步改, 否则重演门锁死昨天真相的同一种病」—— 今天就是那一天。 || 本次改两处。(1) 期望集合 {raw_tushare_adj_factor} -> {canonical_nominal_ohlcv_daily}: tushare_sunset.yaml 的 domains.adj_factor 09-08 由 replace->tdxhub 改判 derive(status:done), 复权因子不再来自任何供应商表, 改由 services/adjust_factor.py 从 canonical 的 pre_close 自算 (ratio[t]=close[t-1]/pre_close[t])。(2) 判据从「正则扫源码文本」改成「import builder 调纯函数 build_select_sql() 拿到实际要跑的那条 SQL 再解析」—— 旧问法要求源码里恰好出现 8 次 d.<col> * 分子 / 分母 AS <col>, 它实际在问「作者有没有按我预期的写法写」, 而想守的是「因子来自哪张物理表」。新 builder 的表达式由 _rebase() 拼装, 旧正则会匹配 0 次并以「解析器假设失效」退出, 而那时真正的血缘恰恰是对的 —— 门问的问题和它想守的东西不是一回事。 || 判据同时变强: 自算的全部要义是「一个真相源喂所有列」, 所以直接断言「生成 SQL 里出现的物理表集合 == {canonical_nominal_ohlcv_daily}」+「每个 FROM/JOIN 目标必须是同句 CTE 或那张唯一物理表」。多出任何第二张表, 按定义就是供应商因子表/兜底源/COALESCE 备胎混进来了 —— 一条等式覆盖了旧门要靠别名递归解析才能抓的三种情形, 且不再依赖作者写法。黑名单半边(2026-06-22 移除的 akshare/tdxhub 自算 qfq 兜底: 把复权因子当乘数用反, 复权价分叉最高 89%)原样保留 —— 禁的是那个具体算法, 不是「自算」这件事。ingest_batch 半边(全历史扫 tier0.market_data.nominal_ohlcv_daily 的 ACCEPTED source_name ∈ {tushare, tdxhub})一字未改。 || 命中黑名单、物理表集合不等于期望、出现计划外 FROM/JOIN 目标、builder 无法 import 或函数签名变了、或出现裁决外供货商, 任一即 FAIL (import 失败不吞异常 —— 查不了不等于通过)。qfq 仍非 nominal/execution truth。"
    type: shell
    command:
      - bash
      - -c
      - |
        cd $(git rev-parse --show-toplevel) && .venv/bin/python3 - <<'PY'
        import importlib.util, pathlib, re, sys, duckdb

        REPO = pathlib.Path(".").resolve()
        BUILDER = REPO / "backend" / "scripts" / "build_price_kline_qfq_tushare.py"

        # ── 半边一: 黑名单 (全文任何位置, 含注释) ──────────────────────────────
        # 2026-06-22 移除的 akshare/tdxhub 自算 qfq 兜底系统性错 (把复权因子当乘数用反,
        # 复权价分叉最高 89%)。它与 2026-09-08 起的自算不是一回事: 后者从 canonical.pre_close
        # 推 ratio, 前者是拿供应商因子反向用。禁的是那个具体算法, 不是"自算"这件事。
        FORBIDDEN = re.compile(r"price_kline_tdxhub|akshare|tdxhub_adj_factor|adj_factor_tdxhub", re.I)
        src = BUILDER.read_text(encoding="utf-8")
        hit = FORBIDDEN.search(src)
        if hit:
            sys.exit(f"复活被禁的 qfq 兜底模式: {hit.group(0)!r}")

        # ── 半边二: 解析**真正要跑的那条 SQL**, 不是生成它的源码文本 ────────────
        # 2026-09-08 重写。旧判据用正则在源码里找 `d.<col> * 分子 / 分母 AS <col>` 且要求恰好
        # 出现 8 次, 于是它其实在问"作者有没有按我预期的写法写", 而想守的是"因子来自哪张物理表"。
        # 换源后表达式改由 _rebase() 拼装, 正则匹配 0 次 —— 门会以"解析器假设失效"退出, 而那时
        # 真正的血缘其实是对的。现在改成 import 模块、调纯函数拿到实际 SQL 再解析: 作者怎么写
        # 源码都无所谓, 问的是最终执行的东西。
        #
        # 判据也随之变强。自算的全部要义是「一个真相源喂所有列」, 所以:
        #   生成 SQL 里出现的物理表集合  ==  {canonical_nominal_ohlcv_daily}
        # 多出任何第二张表, 按定义就是供应商因子表 / 兜底源 / COALESCE 备胎混进来了 ——
        # 这一条同时覆盖了旧门要靠别名递归解析才能抓的三种情形。
        EXPECTED_PHYSICAL_TABLES = {"canonical_nominal_ohlcv_daily"}

        sys.path.insert(0, str(REPO / "backend"))
        spec = importlib.util.spec_from_file_location("_qfq_builder", BUILDER)
        if spec is None or spec.loader is None:
            sys.exit(f"无法加载 builder 模块: {BUILDER}")
        mod = importlib.util.module_from_spec(spec)
        spec.loader.exec_module(mod)          # import 失败即 FAIL, 不吞异常
        sql = mod.build_select_sql(mod.load_config(), batch_id="_gate", ingested_at="1970-01-01T00:00:00Z")

        attach_alias = mod.SOURCE_RELATION.split(".", 1)[0] if "." in mod.SOURCE_RELATION else None
        if not attach_alias:
            sys.exit(f"SOURCE_RELATION 不再是 <alias>.<table> 形状: {mod.SOURCE_RELATION!r}")
        observed = set(re.findall(rf"\b{re.escape(attach_alias)}\.(\w+)\b", sql))
        if observed != EXPECTED_PHYSICAL_TABLES:
            sys.exit("qfq 生成 SQL 的物理表集合与期望不符: "
                     f"observed={sorted(observed)} expected={sorted(EXPECTED_PHYSICAL_TABLES)}")

        # 每个 FROM/JOIN 目标必须是同句 CTE 或那张唯一物理表 —— 堵住"用别的 attach 别名
        # 或裸表名引第二个源"这条绕过 (上面的 alias 正则只看得见 tr.*)。
        cte_names = set(re.findall(r"(?:WITH|,)\s*(\w+)\s+AS\s*\(", sql, re.I))
        targets = set(re.findall(r"\b(?:FROM|JOIN)\s+([\w.]+)", sql, re.I))
        strays = {t for t in targets if t not in cte_names and t != mod.SOURCE_RELATION}
        if strays:
            sys.exit(f"qfq 生成 SQL 出现计划外的 FROM/JOIN 目标: {sorted(strays)} "
                     f"(合法 = 同句 CTE {sorted(cte_names)} 或 {mod.SOURCE_RELATION})")

        # ── 半边三: ingest_batch 真血缘 (全历史扫描, 与 2026-09-01 版一致, 未改) ──
        con = duckdb.connect("data/tushare_raw.duckdb", read_only=True)
        try:
            rows = con.execute(
                "SELECT DISTINCT source_name FROM ingest_batch "
                "WHERE dataset_id = 'tier0.market_data.nominal_ohlcv_daily' AND status = 'ACCEPTED'"
            ).fetchall()
        finally:
            con.close()
        bad = sorted({r[0] for r in rows} - {"tushare", "tdxhub"})
        if bad:
            sys.exit(f"nominal_ohlcv_daily 出现裁决外供货商: {bad}")

        print("QFQ_LINEAGE_GUARD_OK")
        PY
