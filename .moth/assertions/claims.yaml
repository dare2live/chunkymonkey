kind: assertion_pack
name: chunkymonkey-claims
# 声称-实况对账弹仓 (claims vs reality) — 2026-06-12 创立
# 规则: 文档/commit 里任何带数字的关键声称, 在这里挂一条可执行断言;
# 声称变化 (新决策) 时同 commit 更新断言 — 弹仓漂移 = 文档腐烂警报。
# 全部只读; duckdb 连接由 moth 引擎强制 read_only。
assertions:
  - id: smartmoney-constraint-tables
    claim: "PK/UNIQUE 约束表 >= 18 (2026-06-29 批4刷新: 批3c/3c2 退役机构旧表 inst_holdings/inst_institutions/fact_common_major_holder_stock 后实测20, 阈值留2缓冲防误报; 增表显式过决策)"
    type: duckdb_sql
    database: data/smartmoney.duckdb
    query: "SELECT count(DISTINCT table_name) FROM duckdb_constraints() WHERE constraint_type IN ('PRIMARY KEY','UNIQUE')"
    expect: {op: ">=", value: 18}
  - id: smartmoney-indexes
    claim: "索引 >=21 (2026-06-29 批4刷新: 同上批次退役后实测23, 阈值留2缓冲)"
    type: duckdb_sql
    database: data/smartmoney.duckdb
    query: "SELECT count(*) FROM duckdb_indexes()"
    expect: {op: ">=", value: 21}
  - id: smartmoney-tables
    claim: "表 >=29 (2026-06-29 批4刷新: 批3c/3c2/3e机构旧表+孤儿表退役后实测31, 阈值留2缓冲防误报; 增表显式过决策)"
    type: duckdb_sql
    database: data/smartmoney.duckdb
    query: "SELECT count(*) FROM duckdb_tables()"
    expect: {op: ">=", value: 29}
  - id: smartmoney-size-band
    claim: "smartmoney 当前 control/serving 库体量 0.2-12GB 带内 (…2026-07-24 ~8.72GB→9GB; 2026-07-25 org trunc sharded repair 实测 ~11.16GB → 抬 9GB→12GB，仍单文件派生自 accepted partition 非 bloat/无 wal)；越界提示异常膨胀、错库或 retention 漂移，不代表项目是纯数据平台"
    type: file_size
    path: data/smartmoney.duckdb
    expect: {op: between, low: 200000000, high: 12000000000}
  - id: calendar-floor
    claim: "交易日历起点 == 2005-01-04 (2026-06-12 扩展+七项验证 PASS; 回退 = 静默 clamp 复发)。2026-06-27 §9 拆库: dim_trading_calendar 迁 reference.duckdb, 断言库改 reference"
    type: duckdb_sql
    database: data/reference.duckdb
    query: "SELECT CAST(min(trade_date) AS VARCHAR) FROM dim_trading_calendar"
    expect: {op: "==", value: "2005-01-04"}
  - id: section9-dims-in-reference
    claim: "§9 reference 拆库: 2 dim (active/trading_calendar) 全在 reference.duckdb (2026-06-27 Stage E 迁移真相源; 缺=迁移丢失/回滚)。原 4 dim 含 all_ever_listed/listing_status 2026-07-07 整表退役物删 (0 存活 writer / 0 业务读者), 断言集从 4 缩至 2, 见 PROJECT_INDEX.md 决策收口"
    type: duckdb_sql
    database: data/reference.duckdb
    query: "SELECT count(*) FROM duckdb_tables() WHERE table_name IN ('dim_active_a_stock','dim_trading_calendar')"
    expect: {op: "==", value: 2}
  - id: reference-dims-have-pk
    claim: "不变量#1 主键: reference 2 dim (active/trading_calendar) 全有 DB 强制 PRIMARY KEY (2026-06-28 修 §9 迁移丢 PK 缺口; <2 = de-facto 唯一退化, 真主键不变量破; 2026-07-07 all_ever_listed/listing_status 退役后集合缩至 2)"
    type: duckdb_sql
    database: data/reference.duckdb
    query: "SELECT count(DISTINCT table_name) FROM duckdb_constraints() WHERE constraint_type='PRIMARY KEY' AND table_name IN ('dim_active_a_stock','dim_trading_calendar')"
    expect: {op: "==", value: 2}
  - id: section9-dims-absent-smartmoney
    claim: "§9 reference 拆库: 2 dim (active/trading_calendar) 已从 smartmoney 物删, 不得重建 (2026-06-27 Stage E; >0 = schema-init DDL 重建路径回潮 undo 物删, 不变量#2 读写边界破; 2026-07-07 all_ever_listed/listing_status 从此断言集移除因表本身已整体退役非仅迁库)"
    type: duckdb_sql
    database: data/smartmoney.duckdb
    query: "SELECT count(*) FROM duckdb_tables() WHERE table_name IN ('dim_active_a_stock','dim_trading_calendar')"
    expect: {op: "==", value: 0}
  # retired-db-retained 断言已移除 (2026-06-13 用户授权提前删 v1 旧库 34G — 新库稳定一日重负载验证通过,
  # 回滚窗提前关; 按断言自身契约"到期人工删除后移除本断言"执行)
  - id: dc-member-truncation-pin
    claim: "dc_member 近 30 日无整 5000 行截断签名 (2026-06-12 发现静默截断; chain9 分页重拉后应转绿)"
    type: duckdb_sql
    database: data/tushare_raw.duckdb
    query: "SELECT count(*) FROM (SELECT trade_date, count(*) AS n FROM raw_tushare_dc_member GROUP BY 1 ORDER BY 1 DESC LIMIT 30) WHERE n % 5000 = 0"
    expect: {op: "==", value: 0}
  - id: watermark-utc-contract
    claim: "source_watermarks.py 保留 UTC 口径警示头注 (两次 UTC 误读事故防线)"
    type: shell
    command: ["grep", "-ci", "utc", "backend/services/source_watermarks.py"]
    expect: {op: ">=", value: 1}
  - id: doc-governance
    claim: "活文档治理严格 PASS: fails=0 且 warns=0；不存在幽灵链接、退役 CLI 活引用或第二 owner (owner=docs/README.md)"
    type: shell
    command: ["python3", "backend/scripts/check_doc_governance.py"]
    expect: {op: regex, pattern: "verdict=PASS fails=0 warns=0"}
  - id: bestchoice-frozen-evidence
    claim: "BestChoice 仅是冻结 challenger 证据包；两个实现与两份机器证据的 hash、shape、唯一键、candidate/reject 和五公式分布必须与 manifest 精确一致"
    type: shell
    command: ["python3", "-B", "-m", "bestchoice.scripts.verify_frozen_evidence"]
    expect: {op: regex, pattern: "verify_frozen_evidence: ok"}
  - id: quota-circuit-breaker
    claim: "信道配额熔断在盘 (2026-06-13 代理 jiaoch.site 反刷量墙定层; 删除=逐日续戳烧配额复发)"
    type: shell
    command: ["grep", "-c", "_is_quota_wall\\|QuotaExhaustedError", "backend/services/data_sources/sync_runner.py"]
    expect: {op: ">=", value: 3}
  - id: tinyshare-runtime-payload
    claim: "TinyShare 不只存在 dist-info；版本化 pyc 运行载荷必须导出 pro_api 和权限/连接异常类型，防全仓 cache 清理误删 provider 本体后仍假装已安装"
    type: shell
    command: [".venv/bin/python", "-c", "import tinyshare; assert hasattr(tinyshare,'pro_api'); assert hasattr(tinyshare,'TinySharePermissionError'); assert hasattr(tinyshare,'TinyShareConnectionError'); print('TINYSHARE_RUNTIME_OK')"]
    expect: {op: regex, pattern: "TINYSHARE_RUNTIME_OK"}
  - id: doc-drift
    claim: "活文档、生成地图以及 source/config 中的文档 owner 均存在；不继续引用 legacy CLAUDE 章节"
    type: shell
    command: ["bash", "-c", "cd $(git rev-parse --show-toplevel) && PYTHONPATH=backend .venv/bin/python3 backend/scripts/check_doc_drift.py --check | python3 -c 'import json,sys; sys.exit(0 if json.load(sys.stdin)[\"overall\"]==\"PASS\" else 1)' && echo DOC_OK"]
    expect: {op: regex, pattern: "DOC_OK"}
  - id: dead-references-zero
    claim: "0 死引用 (2026-06-28 根因根治: 删模块/表/文件必同步清引用方; import-services + dead-services-ref + config-dead-path 三道。根因=之前每波清理删供给侧漏需求侧, 验收够不到孤儿脚本/懒import/guarded垫片/config死路径→静默累积)"
    type: shell
    command: ["bash", "-c", "cd $(git rev-parse --show-toplevel) && PYTHONPATH=backend .venv/bin/python3 backend/scripts/check_dead_references.py >/dev/null 2>&1 && echo DEADREF_OK"]
    expect: {op: regex, pattern: "DEADREF_OK"}
  - id: data-layer-integrity
    claim: "每张活表必在 data_layers.yaml 声明 layer + Type A 列纯度 (2026-06-14 层级声明化 + 2026-06-28 加工分层 A/B: asset_class=A 层[L1_foundation/L1k/display=确定性PIT重排]表禁含 forward/label/score/signal/ic/predicted 等 Type B 列, 防策略派生伪装混入平台; 未声明 or Type A 含泄漏列=FAIL)"
    type: shell
    command: ["bash", "-c", "cd $(git rev-parse --show-toplevel) && PYTHONPATH=backend .venv/bin/python3 backend/scripts/data_layer_audit.py --check | python3 -c 'import json,sys; sys.exit(0 if json.load(sys.stdin)[\"overall\"]==\"PASS\" else 1)' && echo LAYER_OK"]
    expect: {op: regex, pattern: "LAYER_OK"}
  - id: minimal-module-main-routers
    claim: "main.py 挂载 router 数有上界 (反例 2026-06-14: main import 全 router 致地基-reset 时闭包拉不开; 最小化模块纪律, 涨破阈值=耦合回潮须拆)"
    type: shell
    command: ["bash", "-c", "grep -c 'include_router' backend/main.py"]
    expect: {op: "<=", value: 45}
  - id: minimal-module-no-new-godfile
    claim: "god-file (>800行) 存量 ratchet <=3；observed count 由 live 命令给出，上界不冒充当前实测"
    type: shell
    command: ["bash", "-c", "find backend -name '*.py' -not -path '*/__pycache__/*' -not -path '*/tests/*' | xargs wc -l 2>/dev/null | awk '$1>800 && $2!=\"total\"{n++} END{print n+0}'"]
    expect: {op: "<=", value: 3}
  - id: watermark-refresher-wired
    claim: "kline 水位刷新器接在 daily_update 管线 store 阶段 (2026-06-13 修孤儿化; 2026-06-23 重设计后接线在 pipeline/store.py 而非 daily_update.sh; 检查器写器两器官缺一即水位卡死)"
    type: shell
    command: ["grep", "-c", "refresh_source_watermarks.py", "backend/services/pipeline/store.py"]
    expect: {op: ">=", value: 1}
  - id: safe-commit-rule10-blocking
    claim: "safe_commit 和 commit-msg 共用 backend/scripts/check_codex_review.py 的高风险 staged 文件判定；只接受 APPROVE/APPROVE_WITH_NOTES，任意 REQUEST_CHANGES 均阻断；策略 PIT/发布证书仍由 strategy validation contract 独立负责"
    type: shell
    command: ["bash", "-c", "grep -q 'check_codex_review.py' scripts/safe_commit.sh && grep -q 'has_rejected_codex_review' backend/scripts/check_codex_review.py && grep -q 'REQUEST_CHANGES_REVIEW_RE' backend/scripts/check_codex_review.py && grep -q 'exit 6' scripts/safe_commit.sh && echo RULE10_BLOCKING"]
    expect: {op: regex, pattern: "RULE10_BLOCKING"}
  - id: coupling-no-orphan-refs
    claim: "Moth 可枚举的表/脚本/config/assertion 耦合无孤儿；source/config→文档引用由独立 doc-drift assertion 覆盖，不把本 claim 夸大为全仓证明"
    type: shell
    command: ["bash", "-c", "cd $(git rev-parse --show-toplevel) && moth coupling --repo . 2>&1 | grep -o 'verdict=[A-Z]*' | head -1"]
    expect: {op: regex, pattern: "verdict=PASS"}
  - id: universe-population-contract-static
    claim: "universe 静态契约与对抗单测通过；live_readiness 经 observation loaders 评估；READY 仅当 eligible frontier 有 observation_date+accepted 源证明，否则 NOT_EVALUATED/BLOCKED"
    type: shell
    command: ["bash", "-c", "PYTHONPATH=backend .venv/bin/python3 -m pytest -q backend/tests/services/test_population_scope.py backend/tests/scripts/test_check_universe_filter.py backend/tests/services/test_observation_population.py >/dev/null && PYTHONPATH=backend .venv/bin/python3 backend/scripts/check_universe_filter.py --format json | .venv/bin/python3 -c 'import json,sys; r=json.load(sys.stdin); d=r.get(\"live_readiness_detail\") or {}; reasons=d.get(\"reasons\") or []; assert r[\"verdict\"]==\"PASS\" and r[\"live_readiness\"] in {\"NOT_EVALUATED\",\"BLOCKED\",\"READY\",\"DEGRADED\"} and reasons; status=r[\"live_readiness\"]; assert (status==\"READY\" and d.get(\"observation_date\") and any(\"accepted_calendar_kline_st\" in x for x in reasons)) or (status!=\"READY\" and any(\"nominal_ohlcv\" in x or \"stock_st\" in x or \"calendar\" in x for x in reasons)); print(\"STATIC_POPULATION_CONTRACT_PASS\")'"]
    expect: {op: regex, pattern: "STATIC_POPULATION_CONTRACT_PASS"}
  - id: exploration-isolated-in-sandbox
    claim: "探索隔离在 sandbox/ 不污染主代码 (2026-06-17 用户根治: 探索脚本/findings草稿/结果散进 backend/scripts+analysis+docs = 反复污染根因, 本对话清~100文件). sandbox/ gitignored 且默认整包清理; 探索 runner (experiment_*/analyze_*) 不许在 backend/scripts (该在 sandbox/<exp>/). 需要晋升的结果必须按现行 Tier3 契约重写、经 Rule 10 审核并由正式 owner 接管; 当前没有跨删存活的 verdict writer. 复活旧路径=污染根因复发. owner=sandbox/README.md"
    type: shell
    command: ["bash", "-c", "{ ls backend/scripts/experiment_*.py backend/scripts/analyze_*.py 2>/dev/null || true; } | wc -l | tr -d ' '"]
    expect: {op: "==", value: 0}
  - id: sandbox-boundary-guard-present
    claim: "沙盒边界硬门在岗 (2026-06-17 用户: 边界要水密非约定; 审计 wf_6185abb2 实测沙脚本能裸 duckdb.connect 主库 rw 真写了 market 库). services.sandbox_guard 提供 enable_sandbox_guard (monkeypatch 挡 rw 打开 database_manifest 登记的主存储并 raise SandboxBoundaryError) + read_only_main (只读正路) + sandbox_scratch (per-exp); sandbox.sh new 模板首行调 guard. 删=边界退回纯约定, 探索可写坏主库. owner=sandbox/README.md"
    type: shell
    command: ["bash", "-c", "grep -c 'def enable_sandbox_guard\\|class SandboxBoundaryError\\|def read_only_main' backend/services/sandbox_guard.py"]
    expect: {op: ">=", value: 3}
  - id: holder-report-date-single-format
    claim: "canonical_top10_float_holders_period report_date 全 YYYYMMDD 单格式 (holders fact DROPPED 2026-07-26; 守 formal SSOT 归一. >0 = ISO 复发=双真相源回潮)"
    type: duckdb_sql
    database: data/smartmoney.duckdb
    query: "SELECT count(*) FROM canonical_top10_float_holders_period WHERE CAST(report_date AS VARCHAR) LIKE '%-%'"
    expect: {op: "==", value: 0}
  - id: qfq-serving-tushare-only
    claim: "v_price_kline_qfq 当前 serving view 只含 tushare 派生行；qfq 非 nominal/execution truth；physical lineage=batch_id/ingested_at/factor_as_of on rebuild (latest-factor rebase method typed; pin batch_id for reproducibility)"
    type: duckdb_sql
    database: data/market.duckdb
    query: "SELECT count(*) FROM v_price_kline_qfq WHERE source_name <> 'tushare'"
    expect: {op: "==", value: 0}
  - id: serve-read-layer-doors
    claim: "过渡期 SERVE 读层门全绿：check_serve_read_layer.py 扫全量非成员 consumer bypass、resolver preflight、entity 声明链、backend 探索 runner，与 S6 D5 router 禁内联 raw_*（live 零 serve-exempt）；红例固化在 live tests。Phase1 后由 module contract/typed output 取代 roster。"
    type: shell
    command: ["bash", "-c", "PYTHONPATH=backend .venv/bin/python3 backend/scripts/check_serve_read_layer.py >/dev/null 2>&1 && echo 0 || echo 1"]
    expect: {op: "<=", value: 0}
  - id: legacy-raw-plane-inventory
    claim: "S7 legacy raw_tushare_* 平面清单门全绿：sync_registry + data_access L0 raw 全分类；formal daily/ST/calendar/margin 不得 role=ssot 且 write=forbidden；membership L0 = ssot 或 compatibility+publication_surface(DataAccess≠raw)；pulse_flow_builder=compatibility+mart_*；derive_input/identity_cache=compatibility+non-raw publication_surface；raw_tushare_daily=fill。owner=backend/scripts/check_legacy_raw_plane.py + legacy_raw_plane.yaml"
    type: shell
    command: ["bash", "-c", "PYTHONPATH=backend .venv/bin/python3 backend/scripts/check_legacy_raw_plane.py >/dev/null 2>&1 && echo 0 || echo 1"]
    expect: {op: "<=", value: 0}
  - id: brick-registry-l2-l3
    claim: "B5 brick registry 门全绿：L2 primitives vs L3 FeatureBlocks+Type-B edge 已登记；禁 silent raw bypass；L3 max_composite_hops≤2；FEATURE_BLOCK_ID 无 orphan；data_layers L2_feature 表均在 outputs；status=partial 须 typed partial_reasons。owner=backend/scripts/check_brick_registry.py + brick_registry.yaml；权威=analysis/data_brick_architecture_20260721.md"
    type: shell
    command: ["bash", "-c", "PYTHONPATH=backend .venv/bin/python3 backend/scripts/check_brick_registry.py >/dev/null 2>&1 && echo 0 || echo 1"]
    expect: {op: "<=", value: 0}
  - id: factor-family-inventory-gate
    claim: "因子族 inventory 结构门：families 必填字段+typed enums；defer/blocked 须 reason；bricks∈brick_registry；sync_domains∈sync_registry∪serve_derive source_domains∪miaoxiang acquire；gate_matrix 引用存在 family_id。owner=backend/scripts/check_factor_family_inventory.py + factor_family_inventory.yaml；权威=analysis/factor_family_governance_toplevel_20260724.md"
    type: shell
    command: ["bash", "-c", "PYTHONPATH=backend .venv/bin/python3 backend/scripts/check_factor_family_inventory.py >/dev/null 2>&1 && echo 0 || echo 1"]
    expect: {op: "<=", value: 0}
  - id: factor-family-continuity-gate-matrix
    claim: "因子族 frequency-typed continuity/readiness 矩阵：每族 continuity_gate.mode 与 frequency/axis 一致；trade_date 日频→calendar_gaps+wired；event/quarterly 禁 full trade calendar；defer/blocked 须 typed wired；gate_matrix check↔continuity kind。owner=backend/scripts/check_factor_family_gates.py + factor_family_inventory.yaml；权威=analysis/factor_family_governance_toplevel_20260724.md"
    type: shell
    command: ["bash", "-c", "PYTHONPATH=backend .venv/bin/python3 backend/scripts/check_factor_family_gates.py >/dev/null 2>&1 && echo 0 || echo 1"]
    expect: {op: "<=", value: 0}
  - id: foundation-done-f1-f10
    claim: "FND-GATE foundation-done F1–F10 聚合门：真实缺口 FAIL；S7 23 ssot typed hard-stop / org mass-by-date banned+daily incremental-by-period required / Type-B enrichment defer 为诚实墙 PASS；F8 §15 PASS 需 ≥3 连续 L3 刀 evidence（commits/knife≤1.5 + pre_knife；禁放宽阈值）；PARTIAL 仍 exit0。owner=backend/scripts/check_foundation_done.py + foundation_done.yaml；权威=analysis/foundation_phase_reeval_20260721.md §3 + analysis/section15_verify_20260721.md"
    type: shell
    command: ["bash", "-c", "PYTHONPATH=backend .venv/bin/python3 backend/scripts/check_foundation_done.py >/dev/null 2>&1 && echo 0 || echo 1"]
    expect: {op: "<=", value: 0}
  - id: calendar-usage-clean
    claim: "交易日历静态强制门全绿：导入 calendar 不再豁免整文件，空扫描失败关闭；B1 wall-clock 当最新交易日、B2/B3 SQL wall-clock cutoff 均阻断，显式 evidence 仅豁免具体合法行。owner=backend/scripts/check_calendar_usage.py"
    type: shell
    command: ["bash", "-c", "PYTHONPATH=backend .venv/bin/python3 backend/scripts/check_calendar_usage.py --strict >/dev/null 2>&1 && echo 0 || echo 1"]
    expect: {op: "<=", value: 0}
  - id: config-refs-clean
    claim: "config 跨文件引用完整性: data_access 的 layer 值全部在 data_layers 定义(长键或 alias 短码), 0 悬空 = 层词汇单一真相源未漂回两套 (2026-06-23 config最小手术 Step1 层词汇统一 + Step4 引用门, 对抗panel wry13dfr0 裁决最小手术)。check_config_refs.py red→green 实证(注入 L99 变红 exit1/还原回绿)。>0=新增 entity 写错层名/层词汇漂移回潮。owner=backend/scripts/check_config_refs.py"
    type: shell
    command: ["bash", "-c", "PYTHONPATH=backend .venv/bin/python3 backend/scripts/check_config_refs.py --check >/dev/null 2>&1 && echo 0 || echo 1"]
    expect: {op: "<=", value: 0}
