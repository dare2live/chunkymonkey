kind: assertion_pack
name: chunkymonkey-claims
# 声称-实况对账弹仓 (claims vs reality) — 2026-06-12 创立
# 规则: 文档/commit 里任何带数字的关键声称, 在这里挂一条可执行断言;
# 声称变化 (新决策) 时同 commit 更新断言 — 弹仓漂移 = 文档腐烂警报。
# 全部只读; duckdb 连接由 moth 引擎强制 read_only。
assertions:
  - id: smartmoney-constraint-tables
    claim: "PK/UNIQUE 约束表 >= 39 (2026-06-14 地基-reset: 删整个模型/特征/寻优层后只剩地基+展示+治理 85 表)"
    type: duckdb_sql
    database: data/smartmoney.duckdb
    query: "SELECT count(DISTINCT table_name) FROM duckdb_constraints() WHERE constraint_type IN ('PRIMARY KEY','UNIQUE')"
    expect: {op: ">=", value: 25}
  - id: smartmoney-indexes
    claim: "索引 >=33 (2026-06-28 重建后 94→37 纯数据平台)"
    type: duckdb_sql
    database: data/smartmoney.duckdb
    query: "SELECT count(*) FROM duckdb_indexes()"
    expect: {op: ">=", value: 33}
  - id: smartmoney-tables
    claim: "表 >=40 (2026-06-28 重建/加工层清空后 70→44 纯数据平台; 增表显式过决策)"
    type: duckdb_sql
    database: data/smartmoney.duckdb
    query: "SELECT count(*) FROM duckdb_tables()"
    expect: {op: ">=", value: 40}
  - id: smartmoney-size-band
    claim: "库体量 0.2-3GB 带内 (2026-06-28 重建/加工层清空+db_compact 后 3.0→0.34G 纯数据平台; 越界=异常膨胀或错库)"
    type: file_size
    path: data/smartmoney.duckdb
    expect: {op: between, low: 200000000, high: 3000000000}
  - id: calendar-floor
    claim: "交易日历起点 == 2005-01-04 (2026-06-12 扩展+七项验证 PASS; 回退 = 静默 clamp 复发)。2026-06-27 §9 拆库: dim_trading_calendar 迁 reference.duckdb, 断言库改 reference"
    type: duckdb_sql
    database: data/reference.duckdb
    query: "SELECT CAST(min(trade_date) AS VARCHAR) FROM dim_trading_calendar"
    expect: {op: "==", value: "2005-01-04"}
  - id: section9-dims-in-reference
    claim: "§9 reference 拆库: 4 dim (active/trading_calendar/all_ever_listed/listing_status) 全在 reference.duckdb (2026-06-27 Stage E 迁移真相源; 缺=迁移丢失/回滚)"
    type: duckdb_sql
    database: data/reference.duckdb
    query: "SELECT count(*) FROM duckdb_tables() WHERE table_name IN ('dim_active_a_stock','dim_trading_calendar','dim_all_ever_listed','dim_listing_status')"
    expect: {op: "==", value: 4}
  - id: section9-dims-absent-smartmoney
    claim: "§9 reference 拆库: 4 dim 已从 smartmoney 物删, 不得重建 (2026-06-27 Stage E; >0 = schema-init DDL 重建路径回潮 undo 物删, 不变量#2 读写边界破)"
    type: duckdb_sql
    database: data/smartmoney.duckdb
    query: "SELECT count(*) FROM duckdb_tables() WHERE table_name IN ('dim_active_a_stock','dim_trading_calendar','dim_all_ever_listed','dim_listing_status')"
    expect: {op: "==", value: 0}
  # retired-db-retained 断言已移除 (2026-06-13 用户授权提前删 v1 旧库 34G — 新库稳定一日重负载验证通过,
  # 回滚窗提前关; 按断言自身契约"到期人工删除后移除本断言"执行)
  - id: dc-member-truncation-pin
    claim: "dc_member 近 30 日无整 5000 行截断签名 (2026-06-12 发现静默截断; chain9 分页重拉后应转绿)"
    type: duckdb_sql
    database: data/tushare_raw.duckdb
    query: "SELECT count(*) FROM (SELECT trade_date, count(*) AS n FROM raw_tushare_dc_member GROUP BY 1 ORDER BY 1 DESC LIMIT 30) WHERE n % 5000 = 0"
    expect: {op: "==", value: 0}
  - id: watermark-utc-contract
    claim: "source_watermarks.py 保留 UTC 口径警示头注 (两次 UTC 误读事故防线)"
    type: shell
    command: ["grep", "-ci", "utc", "backend/services/source_watermarks.py"]
    expect: {op: ">=", value: 1}
  - id: doc-governance
    claim: "文档治理执法器 PASS (幽灵引用/superseded 断链/goal 行数/docs 文件数; 状态标头契约 owner=docs/README.md)"
    type: shell
    command: ["python3", "backend/scripts/check_doc_governance.py"]
    expect: {op: regex, pattern: "verdict=PASS"}
  - id: quota-circuit-breaker
    claim: "信道配额熔断在盘 (2026-06-13 代理 jiaoch.site 反刷量墙定层; 删除=逐日续戳烧配额复发)"
    type: shell
    command: ["grep", "-c", "_is_quota_wall\\|QuotaExhaustedError", "backend/services/data_sources/sync_runner.py"]
    expect: {op: ">=", value: 3}
  - id: doc-drift
    claim: "活索引文档 (PROJECT_INDEX/goal) 不引用已删代码文件路径 (2026-06-14 立: mythos §16 漂移默认态对账要机器做 + 用户'及时更新文档'; 历史叙事/模板豁免)"
    type: shell
    command: ["bash", "-c", "cd $(git rev-parse --show-toplevel) && PYTHONPATH=backend python backend/scripts/check_doc_drift.py --check | python3 -c 'import json,sys; sys.exit(0 if json.load(sys.stdin)[\"overall\"]==\"PASS\" else 1)' && echo DOC_OK"]
    expect: {op: regex, pattern: "DOC_OK"}
  - id: dead-references-zero
    claim: "0 死引用 (2026-06-28 根因根治: 删模块/表/文件必同步清引用方; import-services + dead-services-ref + config-dead-path 三道。根因=之前每波清理删供给侧漏需求侧, 验收够不到孤儿脚本/懒import/guarded垫片/config死路径→静默累积)"
    type: shell
    command: ["bash", "-c", "cd $(git rev-parse --show-toplevel) && PYTHONPATH=backend python backend/scripts/check_dead_references.py >/dev/null 2>&1 && echo DEADREF_OK"]
    expect: {op: regex, pattern: "DEADREF_OK"}
  - id: data-layer-integrity
    claim: "每张活表必在 data_layers.yaml 声明 layer (2026-06-14 地基-reset 立: 层级声明化根治'隐式分层→反复推导+耦合无法分离'; 未声明=违纪, 新表必须先声明)"
    type: shell
    command: ["bash", "-c", "cd $(git rev-parse --show-toplevel) && PYTHONPATH=backend python backend/scripts/data_layer_audit.py --check | python3 -c 'import json,sys; sys.exit(0 if json.load(sys.stdin)[\"overall\"]==\"PASS\" else 1)' && echo LAYER_OK"]
    expect: {op: regex, pattern: "LAYER_OK"}
  - id: minimal-module-main-routers
    claim: "main.py 挂载 router 数有上界 (反例 2026-06-14: main import 全 router 致地基-reset 时闭包拉不开; 最小化模块纪律, 涨破阈值=耦合回潮须拆)"
    type: shell
    command: ["bash", "-c", "grep -c 'include_router' backend/main.py"]
    expect: {op: "<=", value: 45}
  - id: minimal-module-no-new-godfile
    claim: "god-file (>800行) 数 ratchet <=0 (硬门, dossier 全迁完) (2026-06-14 立基线: data_quality 4286/scoring 2712/signals_v2 2156 等违最小化模块; 禁新增, 存量逐步拆; 涨破=耦合回潮)"
    type: shell
    command: ["bash", "-c", "find backend -name '*.py' -not -path '*/__pycache__/*' -not -path '*/tests/*' | xargs wc -l 2>/dev/null | awk '$1>800 && $2!=\"total\"{n++} END{print n+0}'"]
    expect: {op: "<=", value: 23}
  - id: watermark-refresher-wired
    claim: "kline 水位刷新器接在 daily_update 管线 store 阶段 (2026-06-13 修孤儿化; 2026-06-23 重设计后接线在 pipeline/store.py 而非 daily_update.sh; 检查器写器两器官缺一即水位卡死)"
    type: shell
    command: ["grep", "-c", "refresh_source_watermarks.py", "backend/services/pipeline/store.py"]
    expect: {op: ">=", value: 1}
  - id: optuna-require-walk-forward
    claim: "optuna_config 守 require_walk_forward=true (2026-06-14 L0 立: 防过拟合核心 — 业务表禁 in-sample fit 入库; 翻 false = 估计死红线破, stage_opt leakage 反例复发)"
    type: shell
    command: ["bash", "-c", "grep -c 'require_walk_forward: true' backend/config/optuna_config.yaml"]
    expect: {op: ">=", value: 1}
  - id: optuna-realistic-sharpe-cap
    claim: "optuna_config 守 max_realistic_sharpe 熔断 (2026-06-14 L0 立: 异常高数字=leakage警报非成就; 删=裸K线基准'太好'无人核查)"
    type: shell
    command: ["bash", "-c", "grep -c 'max_realistic_sharpe' backend/config/optuna_config.yaml"]
    expect: {op: ">=", value: 1}
  - id: legacy-flow-no-pollution
    claim: "老流程污染清除 ratchet (2026-06-14 工具化 reset 教训; 重构验收 gate). 进度: C1 daily_update 无缺失脚本调用 PASS (855->457行删19缺失脚本) + C3 append-only 必 retention PASS (3表声明) + C2 wiped 孤儿引用 238->29 (退役7死serving router/删schema_versions 23版本条目/7config @archived). 余 C2<=43 (2026-06-16 重启清理 drop fact_feature_panel/缓存/探索表 +14 代码 DDL/audit 引用, 待 rebuild 层重构降回; 原 29) = updater 死 builder (build_profiles/trends/industry_stat/screening/sector_momentum 建已删 L2/L3 表) 嵌在 live update-DAG (RUNNERS/STEPS/HARD_DEPS, data_sources/etf 依赖) = 显式 P2 增量解耦 (framework §6: 禁 big-bang 反复破CI). ratchet C2<=29 防回潮, P2 收口后降 0. owner=analysis/refactor_execution_plan_20260614.md"
    type: shell
    command: ["bash", "-c", "cd $(git rev-parse --show-toplevel) && PYTHONPATH=backend python -c \"import json,subprocess,os; e=dict(os.environ,PYTHONPATH='backend'); d=json.loads(subprocess.run(['python','backend/scripts/check_legacy_flow_integrity.py'],capture_output=True,text=True,env=e).stdout); c=d['checks']; ok=c['daily_update_scripts']['verdict']=='PASS' and c['append_only_retention']['verdict']=='PASS' and c['no_wiped_refs']['n_stale_refs']<=43; print('LEGACY_OK' if ok else 'LEGACY_PENDING')\""]
    expect: {op: regex, pattern: "LEGACY_OK"}
  - id: leakage-gate-no-self-bypass
    claim: "leakage commit 门无自批 SKIP 逃生 (2026-06-15 用户: 自批绕过=摆设). safe_commit Step3.5/3.6 HIGH=硬 exit 4, 不再认 SKIP_LEAKAGE_AUDIT 自批 (含义性 grep: 不应再有 'SKIP_LEAKAGE_AUDIT.*proceeding' 放行). 误报正解=修 verifier 精度/config (永久), 真紧急=--no-verify(核选项留疤). 复活自批=门退回摆设."
    type: shell
    command: ["bash", "-c", "grep -c 'SKIP_LEAKAGE_AUDIT.*bypass.*proceeding\\|SKIP_LEAKAGE_AUDIT=1 bypass' scripts/safe_commit.sh || true"]
    expect: {op: "==", value: 0}
  - id: coupling-no-orphan-refs
    claim: "无孤儿耦合引用 (2026-06-16 用户: 删除暴露 表↔代码↔配置↔DB↔文档↔测试 耦合; moth coupling (引擎全局) 防'删脚本→孤儿测试崩CI collection'/'drop表→moth断言悬空'复发. 删前用 --impact <name> 看爆炸半径)"
    type: shell
    command: ["bash", "-c", "cd $(git rev-parse --show-toplevel) && moth coupling --repo . 2>&1 | grep -o 'verdict=[A-Z]*' | head -1"]
    expect: {op: regex, pattern: "verdict=PASS"}
  - id: universe-hard-gate-present
    claim: "universe 硬门在岗 (2026-06-17 用户: 排除列表升交易日历级; assert_universe_clean 是任何GT/回测/选股最终股票集必过的硬门. 删=污染可复发)"
    type: shell
    command: ["bash", "-c", "grep -c 'def assert_universe_clean\\|class UniverseContaminationError' backend/services/universe.py"]
    expect: {op: ">=", value: 2}
  - id: exploration-isolated-in-sandbox
    claim: "探索隔离在 sandbox/ 不污染主代码 (2026-06-17 用户根治: 探索脚本/findings草稿/结果散进 backend/scripts+analysis+docs = 反复污染根因, 本对话清~100文件). sandbox/ gitignored 用完直接删 (scripts/sandbox.sh); 探索 runner (experiment_*/analyze_*) 不许在 backend/scripts (该在 sandbox/<exp>/); 唯一跨删存活=experiment_store verdict. 复活=污染根因复发. owner=sandbox/README.md"
    type: shell
    command: ["bash", "-c", "{ ls backend/scripts/experiment_*.py backend/scripts/analyze_*.py 2>/dev/null || true; } | wc -l | tr -d ' '"]
    expect: {op: "==", value: 0}
  - id: sandbox-boundary-guard-present
    claim: "沙盒边界硬门在岗 (2026-06-17 用户: 边界要水密非约定; 审计 wf_6185abb2 实测沙脚本能裸 duckdb.connect 主库 rw 真写了 market 库). services.sandbox_guard 提供 enable_sandbox_guard (monkeypatch 挡 rw 开主6库 raise SandboxBoundaryError) + read_only_main (只读正路) + sandbox_scratch (per-exp); sandbox.sh new 模板首行调 guard. 删=边界退回纯约定, 探索可写坏主库. owner=sandbox/README.md"
    type: shell
    command: ["bash", "-c", "grep -c 'def enable_sandbox_guard\\|class SandboxBoundaryError\\|def read_only_main' backend/services/sandbox_guard.py"]
    expect: {op: ">=", value: 3}
  - id: holder-report-date-single-format
    claim: "fact_top10_holder_period report_date 全 YYYYMMDD 单格式 (2026-06-22 双真相源消灭 mythos§4: 历史曾因 verbatim 搬运旧库 ISO → 同字段两套格式致 MERGE-on-grain 重复 + audit 误选丢最新; writer 加 _compact_date_sql 归一. >0 = ISO 复发=双真相源回潮. 注: 旧 migrate_holders_to_tdxhub 一次性迁移脚本 2026-06-27 通达信全删已物删, holder 现走 aif10/tushare; 本断言守归一后的 live 状态)"
    type: duckdb_sql
    database: data/smartmoney.duckdb
    query: "SELECT count(*) FROM fact_top10_holder_period WHERE report_date LIKE '%-%'"
    expect: {op: "==", value: 0}
  - id: kline-canonical-tushare-only
    claim: "v_price_kline_qfq 切 tushare-only (2026-06-22 切主源根因修复 真相源唯一): 旧 tier-1=price_kline_tdxhub 的 qfq 系统性算错 (把复权因子当后复权式乘数抬高分红股历史价, 实测茅台/比亚迪 raw*adj_factor/latest 重建证 tushare对/tdxhub错, 分叉随adj_factor放大最高89%). tushare(2019+/5431股) 严格超集 tdxhub(2022+/5210股). 用户'没有备用源只有tushare' → 去 akshare/tdxhub fallback. >0 非tushare行 = 残留回潮. owner=backend/services/market_schema.py"
    type: duckdb_sql
    database: data/market.duckdb
    query: "SELECT count(*) FROM v_price_kline_qfq WHERE source_name <> 'tushare'"
    expect: {op: "==", value: 0}
  - id: serve-read-layer-p1-doors
    claim: "SERVE 读层 P1 验收门 5 道全绿 (2026-06-22 落地计划 §10 P1 gate 原文 'read-no-inline-table/read-no-self-asof/feature-from-l2 + preflight'): 单一执法点 check_serve_read_layer.py, D1 dossier 0内联裸查 / D2 dossier 0直接.execute(自写asof / D3 generic.py调resolver.preflight / D4 data_access.yaml每entity声明链(db+table+layer+vendor+asof_col+code_col)齐全可追溯 / D5 backend/scripts 0 experiment_/analyze_ runner(L2-bypass向量关闭). 已 red→green 实证(注入FROM raw_变红/还原回绿)非print-not-fail. violations>0=P1未完成/回潮. owner=backend/scripts/check_serve_read_layer.py + analysis/data_module_toplevel_design_20260622.md §10"
    type: shell
    command: ["bash", "-c", "PYTHONPATH=backend python backend/scripts/check_serve_read_layer.py >/dev/null 2>&1 && echo 0 || echo 1"]
    expect: {op: "<=", value: 0}
  - id: calendar-usage-clean
    claim: "交易日历强制使用门全绿 (2026-06-22 P1 升硬门, 第零条规定与 universe 同档执法): check_calendar_usage.py 全量 0 内联绕过交易日历真相源 — B1 wall-clock(date.today/datetime.now)当最新交易日 / B2 SQL CURRENT_DATE-INTERVAL 日历天cutoff / B3 SQL <=CURRENT_DATE 上界锚, 豁免 import services.calendar / `rule-compliance: ok evidence=`合法日历天窗口。真 PIT 锚已修(signals_v2/dossier/events as_of 走 latest_closed_or_raise); 18 合法窗口(载史/recency/展示/SLA-age/provenance)已 evidence。wired safe_commit Step3.95 --strict。>0=新增绕过/回潮。owner=backend/scripts/check_calendar_usage.py"
    type: shell
    command: ["bash", "-c", "PYTHONPATH=backend python backend/scripts/check_calendar_usage.py --strict >/dev/null 2>&1 && echo 0 || echo 1"]
    expect: {op: "<=", value: 0}
  - id: config-refs-clean
    claim: "config 跨文件引用完整性: data_access 的 layer 值全部在 data_layers 定义(长键或 alias 短码), 0 悬空 = 层词汇单一真相源未漂回两套 (2026-06-23 config最小手术 Step1 层词汇统一 + Step4 引用门, 对抗panel wry13dfr0 裁决最小手术)。check_config_refs.py red→green 实证(注入 L99 变红 exit1/还原回绿)。>0=新增 entity 写错层名/层词汇漂移回潮。owner=backend/scripts/check_config_refs.py"
    type: shell
    command: ["bash", "-c", "PYTHONPATH=backend python backend/scripts/check_config_refs.py --check >/dev/null 2>&1 && echo 0 || echo 1"]
    expect: {op: "<=", value: 0}
  - id: serve-consumer-bypass-zero
    claim: "不变量4(单概念单真相源/SERVE单一读路)硬门: 全量扫非成员消费者内联raw读 ==0 (已清零, 棘轮锁死). 伪绿D1只扫dossier 1文件→check_serve_read_layer --bypass-scan 读 data_module_members.yaml roster(成员=数据模块子模块可读raw / 非成员消费者必走DataAccess.get/coverage_start)全量执法. 清零路径: data_loaders迁SERVE→feature/signal panel继承; signals_v2 MIN→DataAccess.coverage_start元数据原语(前后一致2025-10-22); stock_detail_read展示→serve-exempt(P4 read-model pending+源退役表). 源退役3 client(financial/institution_survey/tdx_affair)删源后退役不计. >0=新增bypass回潮即红(对标universe assert_universe_clean硬门). owner=check_serve_read_layer.py --bypass-scan + data_module_members.yaml"
    type: shell
    command: ["bash", "-c", "PYTHONPATH=backend python backend/scripts/check_serve_read_layer.py --bypass-scan 2>/dev/null | grep -oE 'consumer_bypass_violations=[0-9]+' | grep -oE '[0-9]+$'"]
    expect: {op: "<=", value: 0}
