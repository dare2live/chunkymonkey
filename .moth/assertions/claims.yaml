  - id: signal-panel-b-split-parallel
    claim: "b分表 (用户 2026-06-22 裁决): L2 连续因子 fact_feature_panel 与 事件信号 fact_signal_panel **分两张同键并列 panel** (键 code×date), signal_assembler 同键 JOIN 取(排名因子+公式条件门)。signal_panel 放公式事件(macd_golden_cross 首个, 加公式=加列 invariant#3), 区别于 segment_panel 的 form 态。行数>0=已物化。owner=backend/scripts/build_signal_panel.py + analysis/data_module_toplevel_design_20260622.md §8.0"
