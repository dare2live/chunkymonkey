name: CI

# paths-ignore mirrors the L1 (docs/board-only) surface of
# backend/config/commit_tiers.yaml. Policy owner = commit_tiers.yaml; this list
# is a projection and MUST stay a subset of L1 — enforced by
# backend/tests/scripts/test_ci_paths_policy.py (drift toward skipping a risky
# path turns CI red on the next code push). No CI job consumes these paths:
# pytest list, universe/calendar static gates, smoke import and dead-references
# all scan backend code/config only, never markdown/board artifacts.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'analysis/**'
      - 'sandbox/**'
      - 'data/board/**'
      - 'goal.md'
      - 'PROJECT_INDEX.md'
      - 'README.md'
      - 'BOARD.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'analysis/**'
      - 'sandbox/**'
      - 'data/board/**'
      - 'goal.md'
      - 'PROJECT_INDEX.md'
      - 'README.md'
      - 'BOARD.md'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 项目代码用 datetime.UTC (Python 3.11+ 标准 API), 30+ 文件依赖, 不向下兼容 3.10
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          # Offline control-plane only. Provider/continuity stays local (not CI).
          pip install -r requirements-ci.txt

      - name: Lint (ruff)
        continue-on-error: true  # 不阻塞 (项目历史代码 lint warnings 多)
        run: |
          ruff check backend/services backend/routers --output-format=concise || true

      - name: Run offline tests
        run: |
          cd backend
          # Offline-safe unit/contract surface: services fixtures + foundation tests.
          # Markers realdb/network/perf/gcp/slow stay excluded via pytest.ini.
          # Do not suddenly run live DuckDB or provider network.
          python -m pytest \
            tests/test_utils.py \
            tests/test_db.py tests/test_source_watermarks.py tests/scripts/test_db_compact.py \
            tests/test_primitives.py tests/test_universe.py tests/test_calendar_gate.py \
            tests/test_check_dead_references.py \
            tests/services/test_accepted_schema.py \
            tests/services/test_availability.py \
            tests/services/test_dataset_contracts.py \
            tests/services/test_disclosure_boundaries.py \
            tests/services/test_formal_boundaries.py \
            tests/services/test_formal_execution.py \
            tests/services/test_holders_top10_acceptance.py \
            tests/services/test_org_holding_acceptance.py \
            tests/services/test_stk_holdertrade_acceptance.py \
            tests/services/test_disclosure_dual_write.py \
            tests/services/test_disclosure_shadow_compare.py \
            tests/services/test_disclosure_research_read.py \
            tests/services/test_disclosure_enrichment_projection.py \
            tests/services/test_phase_e_smoke.py \
            tests/services/test_research_runtime.py \
            tests/services/test_institution_follow_b0.py \
            tests/services/test_institution_follow_b1.py \
            tests/services/test_institution_follow_b2.py \
            tests/services/test_institution_follow_b4.py \
            tests/services/test_margin_acceptance.py \
            tests/services/test_observation_population.py \
            tests/services/test_project_universe_breadth.py \
            tests/services/test_population_scope.py \
            tests/services/test_sync_execution_policy.py \
            tests/services/test_runtime_limits.py \
            tests/scripts/test_check_universe_filter.py \
            tests/scripts/test_check_calendar_usage.py \
            tests/scripts/test_ci_paths_policy.py \
            tests/scripts/test_classify_commit_tier.py \
            tests/scripts/test_check_codex_review.py \
            tests/scripts/test_build_agent_board.py \
            tests/scripts/test_agent_boot.py \
            tests/scripts/test_persist_phase_d_experiment_runs.py \
            -p no:cacheprovider --tb=short -q || exit 1

      - name: Population and calendar static gates
        run: |
          # Static contract only in CI — live readiness requires local DuckDB.
          PYTHONPATH=backend python backend/scripts/check_universe_filter.py \
            --skip-live-readiness --format json
          PYTHONPATH=backend python backend/scripts/check_calendar_usage.py --strict

      - name: Smoke import
        run: |
          cd backend
          python -c "
          import sys
          sys.path.insert(0, '.')
          # 数据平台地基模块 import 必须成功 (2026-06-28 重建/白名单裁剪后更新: 移除已删策略模块 dag_planner/experiment_jobs)
          from services.schema_versions import SCHEMA_VERSIONS, summary
          from services.data_audit import AUDIT_RULES
          from services.duck_adapter import connect
          from services.database_manifest import get_database_manifest
          from services.data_sources import sync_runner
          from services.schema_layer_filter import filter_schema_sql, keep_stmt
          from services.universe import get_active_universe
          from services.calendar import latest_completed_trade_date
          from services.security_master import active_codes
          from services.data_access import DataAccess
          print('数据平台地基模块 importable')
          print(f'  schema_versions: {summary()}')
          print(f'  audit_rules: {len(AUDIT_RULES)}')
          "

      - name: Dead-references gate (死引用根治硬门)
        run: |
          # 2026-06-28 根因根治: 删模块/表/文件后引用方必须同步清 (import-services + dead-services-ref + config-dead-path)。
          # server-side 强制 (本地 hook 够不到的最终防线, mio §7 enforcement 沉到提交者够不到处)。
          PYTHONPATH=backend python backend/scripts/check_dead_references.py
