name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 项目代码用 datetime.UTC (Python 3.11+ 标准 API), 30+ 文件依赖, 不向下兼容 3.10
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          # 离线控制面依赖。数据拉取使用本机受管 TinyShare payload，不在 CI 冒充 provider 验证。
          pip install fastapi uvicorn duckdb numpy httpx pydantic pytest pytest-asyncio anyio pyyaml

      - name: Lint (ruff)
        continue-on-error: true  # 不阻塞 (项目历史代码 lint warnings 多)
        run: |
          pip install ruff
          ruff check backend/services backend/routers --output-format=concise || true

      - name: Run offline tests
        run: |
          cd backend
          # 只跑不依赖网络/db 的地基测试；已退役策略/旧 provider 测试不冒充当前覆盖。
          python -m pytest tests/test_utils.py \
            tests/test_db.py tests/test_source_watermarks.py tests/scripts/test_db_compact.py \
            tests/test_primitives.py tests/test_universe.py tests/test_calendar_gate.py \
            tests/test_check_dead_references.py \
            tests/services/test_population_scope.py \
            tests/services/test_sync_execution_policy.py \
            tests/services/test_runtime_limits.py \
            tests/scripts/test_check_universe_filter.py \
            tests/scripts/test_check_calendar_usage.py \
            -p no:cacheprovider --tb=short -q || exit 1

      - name: Population and calendar static gates
        run: |
          PYTHONPATH=backend python backend/scripts/check_universe_filter.py --format json
          PYTHONPATH=backend python backend/scripts/check_calendar_usage.py --strict

      - name: Smoke import
        run: |
          cd backend
          python -c "
          import sys
          sys.path.insert(0, '.')
          # 数据平台地基模块 import 必须成功 (2026-06-28 重建/白名单裁剪后更新: 移除已删策略模块 dag_planner/experiment_jobs)
          from services.schema_versions import SCHEMA_VERSIONS, summary
          from services.data_audit import AUDIT_RULES
          from services.duck_adapter import connect
          from services.database_manifest import get_database_manifest
          from services.data_sources import sync_runner
          from services.schema_layer_filter import filter_schema_sql, keep_stmt
          from services.universe import get_active_universe
          from services.calendar import latest_completed_trade_date
          from services.security_master import active_codes
          from services.data_access import DataAccess
          print('数据平台地基模块 importable')
          print(f'  schema_versions: {summary()}')
          print(f'  audit_rules: {len(AUDIT_RULES)}')
          "

      - name: Dead-references gate (死引用根治硬门)
        run: |
          # 2026-06-28 根因根治: 删模块/表/文件后引用方必须同步清 (import-services + dead-services-ref + config-dead-path)。
          # server-side 强制 (本地 hook 够不到的最终防线, mio §7 enforcement 沉到提交者够不到处)。
          PYTHONPATH=backend python backend/scripts/check_dead_references.py
