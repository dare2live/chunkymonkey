name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 项目代码用 datetime.UTC (Python 3.11+ 标准 API), 30+ 文件依赖, 不向下兼容 3.10
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          # 核心依赖 (跳过 mootdx/tdxhub - 私有 repo, CI 不需要)
          # akshare 是公开依赖；离线测试不访问网络，但 fallback 路径需要 import。
          pip install fastapi uvicorn duckdb numpy httpx pydantic pytest pytest-asyncio anyio akshare pyyaml

      - name: Lint (ruff)
        continue-on-error: true  # 不阻塞 (项目历史代码 lint warnings 多)
        run: |
          pip install ruff
          ruff check backend/services backend/routers --output-format=concise || true

      - name: Run offline tests
        run: |
          cd backend
          # 只跑不依赖网络/db 的地基测试 (2026-06-14 地基-reset 后更新: 移除已删模型测试 test_tdx_source/test_audit_financial)
          python -m pytest tests/test_utils.py tests/test_kline_sources.py \
            tests/test_scoring_engine.py tests/test_scoring_composite.py \
            tests/test_db.py tests/test_source_watermarks.py tests/scripts/test_db_compact.py \
            -p no:cacheprovider --tb=short -q || exit 1

      - name: Smoke import
        run: |
          cd backend
          python -c "
          import sys
          sys.path.insert(0, '.')
          # 地基关键模块 import 必须成功 (2026-06-14 地基-reset 后更新为地基+框架模块, 移除已删模型模块)
          from services.schema_versions import SCHEMA_VERSIONS, summary
          from services.data_audit import AUDIT_RULES
          from services.api_cache import cached, get_cache_stats
          from services.dag_planner import topological_waves
          from services.duck_adapter import connect
          from services.database_manifest import get_database_manifest
          from services.data_sources import sync_runner
          from services.schema_layer_filter import filter_schema_sql, keep_stmt
          print('✓ 地基+框架模块 importable')
          print(f'  schema_versions: {summary()}')
          print(f'  audit_rules: {len(AUDIT_RULES)}')
          "
