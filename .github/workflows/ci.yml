name: CI

# paths-ignore mirrors the L1 surface of
# backend/config/commit_tiers.yaml. Policy owner = commit_tiers.yaml; this list
# is a projection and MUST stay a subset of L1 — enforced by
# backend/tests/scripts/test_ci_paths_policy.py (drift toward skipping a risky
# path turns CI red on the next code push). No CI job consumes these paths:
# pytest list, universe/calendar static gates, smoke import and dead-references
# all scan backend code/config only, never markdown/board artifacts.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'sandbox/**'
      - 'goal.md'
      - 'CLAUDE.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'sandbox/**'
      - 'goal.md'
      - 'CLAUDE.md'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 项目代码用 datetime.UTC (Python 3.11+ 标准 API), 30+ 文件依赖, 不向下兼容 3.10
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          # Offline control-plane only. Provider/continuity stays local (not CI).
          pip install -r requirements-ci.txt

      - name: Lint (ruff)
        continue-on-error: true  # 不阻塞 (项目历史代码 lint warnings 多)
        run: |
          ruff check backend/services backend/routers --output-format=concise || true

      - name: Run offline tests
        run: |
          # Single source of truth: backend/config/ci_pytest_surface.yaml
          # via backend/scripts/run_ci_pytest.py --tier blocking. Identical
          # blocking surface is also the L2/L3 safe_commit gate — do not
          # reintroduce a hand-copied path list. Nightly tier is async-only.
          # Markers realdb/network/perf/gcp/slow stay excluded via pytest.ini.
          # Do not suddenly run live DuckDB or provider network.
          PYTHONPATH=backend python backend/scripts/run_ci_pytest.py \
            --tier blocking -p no:cacheprovider --tb=short -q

      - name: Population and calendar static gates
        run: |
          # Static contract only in CI — live readiness requires local DuckDB.
          PYTHONPATH=backend python backend/scripts/check_universe_filter.py \
            --skip-live-readiness --format json
          PYTHONPATH=backend python backend/scripts/check_calendar_usage.py --strict
          # FND-GATE offline: skip live F4/F6 DuckDB probes; F8 PARTIAL exit 0.
          PYTHONPATH=backend python backend/scripts/check_foundation_done.py --skip-live

      - name: Smoke import
        run: |
          cd backend
          python -c "
          import sys
          sys.path.insert(0, '.')
          # 数据平台地基模块 import 必须成功 (2026-06-28 重建/白名单裁剪后更新: 移除已删策略模块 dag_planner/experiment_jobs)
          from services.schema_versions import SCHEMA_VERSIONS, summary
          from services.data_audit import AUDIT_RULES
          from services.duck_adapter import connect
          from services.database_manifest import get_database_manifest
          from services.data_sources import sync_runner
          from services.schema_layer_filter import filter_schema_sql, keep_stmt
          from services.universe import get_active_universe
          from services.calendar import latest_completed_trade_date
          from services.security_master import active_codes
          from services.data_access import DataAccess
          print('数据平台地基模块 importable')
          print(f'  schema_versions: {summary()}')
          print(f'  audit_rules: {len(AUDIT_RULES)}')
          "

      - name: Dead-references gate (死引用根治硬门)
        run: |
          # 2026-06-28 根因根治: 删模块/表/文件后引用方必须同步清 (import-services + dead-services-ref + config-dead-path)。
          # server-side 强制 (本地 hook 够不到的最终防线, mio §7 enforcement 沉到提交者够不到处)。
          PYTHONPATH=backend python backend/scripts/check_dead_references.py

  static-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Config and repo integrity gates
        run: |
          PYTHONPATH=backend python backend/scripts/check_serve_read_layer.py
          PYTHONPATH=backend python backend/scripts/check_config_refs.py
          PYTHONPATH=backend python backend/scripts/check_sandbox_isolation.py
          PYTHONPATH=backend python backend/scripts/check_tracked_allowlist.py
