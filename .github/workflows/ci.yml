name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          # 核心依赖 (跳过 mootdx/tdxhub - 私有 repo, CI 不需要)
          # akshare 是公开依赖；离线测试不访问网络，但 fallback 路径需要 import。
          pip install fastapi uvicorn duckdb numpy httpx pydantic pytest pytest-asyncio anyio akshare

      - name: Lint (ruff)
        continue-on-error: true  # 不阻塞 (项目历史代码 lint warnings 多)
        run: |
          pip install ruff
          ruff check backend/services backend/routers --output-format=concise || true

      - name: Run offline tests
        run: |
          cd backend
          # 只跑不依赖网络/db 的测试
          python -m pytest tests/test_utils.py tests/test_kline_sources.py \
            tests/test_tdx_source.py tests/test_audit_financial.py \
            tests/test_scoring_engine.py tests/test_scoring_composite.py \
            -p no:cacheprovider --tb=short -q || exit 1

      - name: Smoke import
        run: |
          cd backend
          python -c "
          import sys
          sys.path.insert(0, '.')
          # 关键模块 import 必须成功
          from services.schema_versions import SCHEMA_VERSIONS, summary
          from services.data_audit import AUDIT_RULES
          from services.api_cache import cached, get_cache_stats
          from services.dag_planner import topological_waves
          from services.risk_factors import _series_stats
          from services.neutralize import standardize
          from services.portfolio_backtest import SlippageModel, PositionConstraint
          from services.prediction_outcome import ensure_table
          from services.strategy_ensemble import DEFAULT_ALPHAS
          from services.aif10_capability_client import CAPABILITY_CONFIG
          print('✓ all P0/P1/P2/P3 modules importable')
          print(f'  schema_versions: {summary()}')
          print(f'  audit_rules: {len(AUDIT_RULES)}')
          print(f'  ensemble alphas: {len(DEFAULT_ALPHAS)}')
          print(f'  aif10 capabilities: {len(CAPABILITY_CONFIG)}')
          "
