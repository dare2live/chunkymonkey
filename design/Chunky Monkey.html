<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Chunky Monkey · 设计探索</title>
<link rel="stylesheet" href="tokens.css"/>
<style>
  html, body { margin: 0; height: 100%; background: #f3f1ec; font-family: var(--f-sans); }
  body { overflow: hidden; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="direction-a-admin.jsx"></script>
<script type="text/babel" src="direction-b-frontend.jsx"></script>
<script type="text/babel" src="direction-c-institution.jsx"></script>

<script type="text/babel">
const { useState } = React;

function App() {
  return (
    <DesignCanvas
      title="Chunky Monkey · 三个方向"
      subtitle="基于现有数仓 (fact_holders_event / champion_v3 / strategy_signal) 的应用层 · 三种产品姿态">
      <DCSection id="A" title="方向 A · 后台优先 (数据链路 + 数据健康)" subtitle={'把 ingest → mart → strategy 的数据链路和健康度变成首屏 — 让「数据是不是新鲜可信」成为最先回答的问题'}>
        <DCArtboard id="a1" label="后台首页 · 链路 + 健康" width={1440} height={1024}>
          <DirectionA/>
        </DCArtboard>
      </DCSection>

      <DCSection id="B" title="方向 B · 前台克制 (单股深度)" subtitle="股票为中心 · 价格 + 机构事件叠加 · champion_v3 评分拆解 — 适合给基金经理 / 散户的研究面">
        <DCArtboard id="b1" label="单股深度页 · 茅台" width={1440} height={1024}>
          <DirectionB/>
        </DCArtboard>
      </DCSection>

      <DCSection id="C" title="方向 C · 机构 track record" subtitle={'把机构的「过去 N 次买入后 60 日收益」摊开 — 让用户挑可跟随的机构, 而不是挑股票'}>
        <DCArtboard id="c1" label="机构排行 + 抽屉" width={1440} height={1024}>
          <DirectionC/>
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
