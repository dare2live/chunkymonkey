# pre-commit hooks (P3.12).
# 安装: pip install pre-commit && pre-commit install
# 跑: pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1024']  # 防止误提交 .duckdb
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff
        args: [--fix, --exit-zero]  # 自动修, 不阻塞
        files: ^backend/(services|routers)/.*\.py$

  # Phase ψ.β.perf+: PROJECT_INDEX.md 同步检查 (Rule 9.5/9.6 落地)
  # 修改 backend/services/, scripts/build_/optimize_/run_/backfill_, config/*.yaml, CLAUDE.md
  # 必须同时改 PROJECT_INDEX.md, 否则 reject commit. 防 Claude 遗漏文档同步.
  - repo: local
    hooks:
      - id: project-index-sync
        name: PROJECT_INDEX.md sync check
        entry: python backend/scripts/check_project_index_sync.py
        language: system
        pass_filenames: false
        stages: [pre-commit]
        always_run: true

  # Phase ψ.γ.discipline: Rule 6/5/7 反 pattern 检测 (Rule 9.5/9.6/9.7 落地)
  # 扫 staged diff 找 magic alpha weight / sigma / multiplier / threshold /
  # hardcoded date / stock_code / try-except pass — 必须有 evidence 注释或 yaml 外置.
  # 防 Claude 在 service 代码里拍脑袋写参数 (Rule 6 反例).
  - repo: local
    hooks:
      - id: rule-compliance
        name: Rule 6/5/7 反 pattern check
        entry: python backend/scripts/check_rule_compliance.py
        language: system
        pass_filenames: false
        stages: [pre-commit]
        always_run: true

  # Phase ψ.γ.discipline: commit message 5-question keyword 检测 (Rule 9.7 落地)
  # 涉 service/script/config 的 commit 必须含 PIT/OOS/数据/实测 关键词 (GROUP B);
  # 任何 commit 必须含 测试/防回退/修复 关键词 (GROUP A). 防空说明 commit.
  # 2026-05-15 加 GROUP D: 含 fix/leakage/drop/cleanup → 必须含 post-fix-audit 证据 (Rule 9.2 #7).
  - repo: local
    hooks:
      - id: commit-msg-self-check
        name: Commit message Rule 9.7 self-check
        entry: python backend/scripts/check_commit_message.py
        language: system
        stages: [commit-msg]

  # 2026-05-15: emoji ban — feedback_no_emoji 落地
  # ban U+1F300+ 高 codepoint 主块 + VS16 emoji 化变体 + ZWJ 序列 + 特定常用 check-mark-button / cross-mark.
  # NOT ban: red-circle-warn / triangle-warn / plain-check / plain-cross / arrow / Greek / CJK.
  - repo: local
    hooks:
      - id: no-emoji
        name: No emoji (feedback_no_emoji)
        entry: python backend/scripts/check_no_emoji.py
        language: system
        pass_filenames: false
        stages: [pre-commit]
        always_run: true

  # 2026-05-16: CLAUDE Rule 10 Codex review check — code-relevant commit 必须含 Codex review evidence
  # backend/services/scripts/config/tests/ 改 → 必须 body 含 'Codex <agent_id>' 或 'codex-review: skipped reason=...'
  # 防 dev 不走 Codex review 直接 commit (尤其策略 / 数据 / 模型类 critical 改)
  - repo: local
    hooks:
      - id: codex-review-check
        name: Codex review evidence check (CLAUDE Rule 10)
        entry: python backend/scripts/check_codex_review.py
        language: system
        stages: [commit-msg]
