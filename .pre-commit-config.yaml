# pre-commit hooks (P3.12).
# 安装: pip install pre-commit && pre-commit install
# 跑: pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1024']  # 防止误提交 .duckdb
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff
        args: [--fix, --exit-zero]  # 自动修, 不阻塞
        files: ^backend/(services|routers)/.*\.py$

  # Phase ψ.β.perf+: PROJECT_INDEX.md 同步检查 (Rule 9.5/9.6 落地)
  # 修改 backend/services/, scripts/build_/optimize_/run_/backfill_, config/*.yaml, CLAUDE.md
  # 必须同时改 PROJECT_INDEX.md, 否则 reject commit. 防 Claude 遗漏文档同步.
  - repo: local
    hooks:
      - id: project-index-sync
        name: PROJECT_INDEX.md sync check
        entry: python backend/scripts/check_project_index_sync.py
        language: system
        pass_filenames: false
        stages: [pre-commit]
        always_run: true
