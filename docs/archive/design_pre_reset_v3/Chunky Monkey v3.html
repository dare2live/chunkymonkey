<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Chunky Monkey v3 · 跟随机构选股</title>
<link rel="stylesheet" href="tokens.css"/>
<style>
  html, body { margin:0; height:100%; background: var(--bg-1); font-family: var(--f-sans); color: var(--ink-0); }
  * { box-sizing: border-box; }
  button { font-family: inherit; }
  table { font-variant-numeric: tabular-nums; }
  ::-webkit-scrollbar { width:8px; height:8px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius:4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--ink-3); }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="v3-data.jsx"></script>
<script type="text/babel" src="v3-ui.jsx"></script>
<script type="text/babel" src="v3-page-today.jsx"></script>
<script type="text/babel" src="v3-page-lab.jsx"></script>
<script type="text/babel" src="v3-page-portfolio.jsx"></script>
<!-- Phase η 新增 3 视图 -->
<script type="text/babel" src="v3-page-stock-view.jsx"></script>
<script type="text/babel" src="v3-page-formula-view.jsx"></script>
<script type="text/babel" src="v3-page-institution-view.jsx"></script>
<!-- Phase η++ 组合构建器 (Wilson + Kelly 3 risk profile) -->
<script type="text/babel" src="v3-page-portfolio-builder.jsx"></script>
<!-- 市场感知 (Market Perception) — Codex 扩展模块 stub -->
<script type="text/babel" src="v3-page-market-perception.jsx"></script>
<!-- BestChoice tab — Layer 4 read-only challenger data 2026-05-22 -->
<script type="text/babel" src="v3-page-bestchoice.jsx"></script>
<script type="text/babel" src="v3-drawer-stock.jsx"></script>
<script type="text/babel" src="v3-drawer-system.jsx"></script>
<!-- 真实数据替换 (mock fallback); 必须在所有 page/component 加载之后 -->
<script type="text/babel" src="v3-data-live.jsx"></script>

<script type="text/babel">
const { useState, useEffect } = React;

function App() {
  const [tab, setTab] = useState('today');
  const [stockCode, setStockCode] = useState(null);
  const [systemOpen, setSystemOpen] = useState(false);
  const [instId, setInstId] = useState(null);
  // dataTick: 每次 v3-data-live.jsx 完成 fetch 后递增,触发 App 整体 re-render
  const [dataTick, setDataTick] = useState(0);
  const { PageToday, PageLab, PagePortfolio,
          PageStockView, PageFormulaView, PageInstitutionView,
          PagePortfolioBuilder, PageMarketPerception, PageBestChoice,
          StockDrawer, SystemDrawer, InstDrawer, RUN_META, UI } = window.CMV3;

  useEffect(() => {
    const h = (e) => { if (e.key === 'Escape') { setStockCode(null); setSystemOpen(false); setInstId(null); } };
    window.addEventListener('keydown', h);
    const openInst = (e) => setInstId(e.detail);
    window.addEventListener('cmv3:openInst', openInst);
    const onDataReady = (e) => {
      console.info('[App] received cmv3:dataReady', e.detail);
      setDataTick(t => t + 1);
    };
    window.addEventListener('cmv3:dataReady', onDataReady);
    return () => {
      window.removeEventListener('keydown', h);
      window.removeEventListener('cmv3:openInst', openInst);
      window.removeEventListener('cmv3:dataReady', onDataReady);
    };
  }, []);

  const TABS = [
    { id:'today',     label:'今日',     sub:'Today' },
    { id:'market',    label:'市场感知', sub:'Market' },
    { id:'builder',   label:'组合构建', sub:'Builder' },
    { id:'stock',     label:'股票视图', sub:'Stock' },
    { id:'formula',   label:'公式视图', sub:'Formula' },
    { id:'inst',      label:'机构视图', sub:'Inst' },
    { id:'lab',       label:'选股台',   sub:'Lab' },
    { id:'portfolio', label:'持仓',     sub:'Portfolio' },
    { id:'bestchoice',label:'BestChoice', sub:'BC' },
  ];

  return (
    <div style={{minHeight:'100vh',display:'flex',flexDirection:'column'}}>
      {/* ============ TOPBAR ============ */}
      <header style={{position:'sticky',top:0,zIndex:50,background:'#fff',borderBottom:'1px solid var(--line)'}}>
        <div style={{maxWidth:1480,margin:'0 auto',padding:'10px 24px',display:'flex',alignItems:'center',gap:24}}>
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            <div style={{width:24,height:24,borderRadius:5,background:'var(--ink-0)',display:'flex',alignItems:'center',justifyContent:'center',color:'#fff',fontSize:13,fontWeight:700}}>C</div>
            <div>
              <div style={{fontSize:13,fontWeight:700,letterSpacing:'.02em'}}>Chunky Monkey</div>
              <div style={{fontSize:9,color:'var(--ink-3)',letterSpacing:'.08em',textTransform:'uppercase'}}>v3 · 跟踪机构选股</div>
            </div>
          </div>

          <nav style={{display:'flex',gap:2,marginLeft:24}}>
            {TABS.map(t => (
              <button key={t.id} onClick={()=>setTab(t.id)}
                style={{padding:'8px 16px',fontSize:13,fontWeight:600,border:'none',borderRadius:6,cursor:'pointer',
                  background: tab===t.id ? 'var(--bg-2)' : 'transparent',
                  color: tab===t.id ? 'var(--ink-0)' : 'var(--ink-3)'}}>
                {t.label}<span style={{fontSize:9,color:'var(--ink-3)',marginLeft:6,fontFamily:'var(--f-mono)',textTransform:'uppercase'}}>{t.sub}</span>
              </button>
            ))}
          </nav>

          <div style={{flex:1}}/>

          <div style={{display:'flex',alignItems:'center',gap:14,fontSize:11,color:'var(--ink-3)'}}>
            <span>跑批 <span style={{fontFamily:'var(--f-mono)',color:'var(--ink-1)'}}>{RUN_META.built_at}</span></span>
            <span style={{display:'inline-flex',alignItems:'center',gap:5}}>
              <span style={{width:6,height:6,borderRadius:6,background:'#2f8a55'}}/>系统正常
            </span>
            <button onClick={()=>setSystemOpen(true)} title="模型管理 / 机构详情 / 数据健康"
              style={{padding:'6px 12px',background:'transparent',border:'1px solid var(--line)',borderRadius:5,cursor:'pointer',color:'var(--ink-2)',fontSize:11,fontWeight:600,letterSpacing:'.04em'}}>
              系统
            </button>
          </div>
        </div>
      </header>

      {/* ============ MAIN ============ */}
      <main style={{flex:1,maxWidth:1480,width:'100%',margin:'0 auto',padding:'18px 24px 40px'}}>
        {tab==='today'     && <PageToday        onOpenStock={setStockCode}/>}
        {tab==='market'    && <PageMarketPerception/>}
        {tab==='builder'   && <PagePortfolioBuilder onOpenStock={setStockCode}/>}
        {tab==='stock'     && <PageStockView    initialCode={stockCode} onOpenInst={setInstId}/>}
        {tab==='formula'   && <PageFormulaView  onOpenStock={setStockCode}/>}
        {tab==='inst'      && <PageInstitutionView onOpenStock={setStockCode}/>}
        {tab==='lab'       && <PageLab          onOpenStock={setStockCode}/>}
        {tab==='portfolio' && <PagePortfolio    onOpenStock={setStockCode}/>}
        {tab==='bestchoice'&& <PageBestChoice   onOpenStock={setStockCode}/>}
      </main>

      {stockCode && <StockDrawer code={stockCode} onClose={()=>setStockCode(null)}/>}
      {systemOpen && <SystemDrawer onClose={()=>setSystemOpen(false)}/>}
      {instId && <InstDrawer instId={instId} onClose={()=>setInstId(null)} onOpenStock={setStockCode}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
