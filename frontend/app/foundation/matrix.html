<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据底座 · ChunkyMonkey</title>
<link rel="stylesheet" href="/app/css/site.css">
</head>
<body data-space="foundation" data-tab="matrix">
<header id="site-header"></header>
<div class="tabbar" id="tabbar"></div>
<main id="main">
<section class="panel on" data-space="foundation" data-tab="matrix">
<div class="hero compact">
    <div class="kicker">Foundation / Data Base</div>
    <h1 class="sm">数据底座</h1>
    <p class="sub">前沿、滞后与水位现查。这一屏回答：<b>今天的数据，哪些能用，哪些不能，为什么。</b></p>
  </div>

  <div class="anchor" id="matrix-anchor">
    <span class="cell">正在读取水位…</span>
    <span class="spacer"></span>
    <button class="btn" data-ops-start="daily_update">一键日更 →</button>
  </div>

  <div id="matrix-body">
    <div class="typed-empty" style="margin-top:40px">
      <span class="lamp unk"><i></i><b>LOADING</b></span>
      <p>正在读取 <span class="mono">/api/v3/ops/matrix</span>。后端不可达时不回落打样矩阵。</p>
    </div>
  </div>
</section>
</main>
<script src="/app/js/core.js"></script>
<script src="/app/js/live.js"></script>
</body>
</html>
