<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日更 · ChunkyMonkey</title>
<link rel="stylesheet" href="/app/css/site.css">
</head>
<body data-space="foundation" data-tab="ops">
<header id="site-header"></header>
<div class="tabbar" id="tabbar"></div>
<main id="main">
<section class="panel on" data-space="foundation" data-tab="ops">
<div class="hero compact">
    <div class="kicker">Ops / Daily update</div>
    <h1 class="sm">日更</h1>
    <p class="sub">数据底座链的手动驾驶舱：触发、进度、最近一次结果、运行时告警。</p>
  </div>

  <div class="ops-actions">
    <button class="btn" data-ops="run:daily_update">▶ 一键日更</button>
    <button class="btn ghost" data-ops="refresh">↻ 刷新状态</button>
    <span class="ops-note" id="ops-note">正在连接后端</span>
  </div>

  <div id="ops-body">
    <div class="typed-empty" style="margin-top:40px">
      <span class="lamp unk"><i></i><b>LOADING</b></span>
      <p>正在读取日更状态。后端不可达时不回落打样运行。</p>
    </div>
  </div>
</section>
</main>
<script src="/app/js/core.js"></script>
<script src="/app/js/live.js"></script>
</body>
</html>
