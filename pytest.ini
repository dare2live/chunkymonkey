[pytest]
addopts = --strict-markers -m "not realdb and not perf and not network"
testpaths = backend/tests
asyncio_mode = strict
markers =
    unit: pure function or single-module tests without production DB or network access
    contract: schema, source, API, and static invariant tests
    integration: multi-module tests using local temporary DuckDB fixtures
    pipeline: multi-step local pipeline tests
    realdb: read-only validation against local production DuckDB files; opt-in only
    perf: timing and query-budget tests; opt-in only
    network: tests that may touch external services; disabled by default
    slow: tests that are allowed to exceed the fast-suite budget
