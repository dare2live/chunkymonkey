kind: assertion_pack
name: lf_v0
# B组C3 "chain_leader_follower V0" 开跑 gate (X 轨 G1-G6, 2026-06-12)
# G2 概念覆盖阈值 400 为保守初标 (截断期单日仅 27-354), 首个干净日后按实测校准 — 校准=改本文件=git 可见。
assertions:
  - id: g1-pagination-registered
    claim: "registry dc_member 已声明 page_limit (截断根因修复)"
    type: shell
    # 2026-06-13 修: 旧 awk range 起始行 '  dc_member:' 自身命中结束模式 '^  [a-z_]+:' → range 只含一行恒 0 (gate 自身带病, chain9b 链尾 ERROR 实证)
    command: ["bash", "-c", "awk '/^  dc_member:/{f=1;next} f&&/^  [a-z_]+:/{f=0} f' backend/config/sync_registry.yaml | grep -c page_limit"]
    expect: {op: ">=", value: 1}
  - id: g2-no-truncation-pin
    claim: "dc_member 近 30 日零整 5000 行截断签名"
    type: duckdb_sql
    database: data/tushare_raw.duckdb
    query: "SELECT count(*) FROM (SELECT trade_date, count(*) AS n FROM raw_tushare_dc_member GROUP BY 1 ORDER BY 1 DESC LIMIT 30) WHERE n % 5000 = 0"
    expect: {op: "==", value: 0}
  - id: g2-concept-coverage
    claim: "最新日 distinct 概念数 >= 400 (重拉后全量口径; 保守初标待首个干净日校准)"
    type: duckdb_sql
    database: data/tushare_raw.duckdb
    query: "SELECT count(DISTINCT ts_code) FROM raw_tushare_dc_member WHERE trade_date = (SELECT max(trade_date) FROM raw_tushare_dc_member)"
    expect: {op: ">=", value: 400}
  - id: g3-event-history-depth
    claim: "fact_concept_event reconstructed 事件史 >= 340 个 event_date 且起点 <= 20250106"
    type: duckdb_sql
    database: data/smartmoney.duckdb
    # 2026-06-13 修订: 字面量 '2025-01-06' 带横杠 vs 数据 '20250103' 不带 — '2'>'-' 字典序恒假, g3 永 FAIL (gate 自身带病)
    query: "SELECT CASE WHEN count(DISTINCT event_date) >= 340 AND min(event_date) <= '20250106' THEN 1 ELSE 0 END FROM fact_concept_event WHERE as_of_mode='reconstructed'"
    expect: {op: "==", value: 1}
  - id: g4-artifact-residue
    claim: "伪影残留判据: BORN+DEAD 日均 < 5 (概念集跳变幻影杀线)"
    type: duckdb_sql
    database: data/smartmoney.duckdb
    query: "SELECT CASE WHEN count(*) = 0 THEN 999 ELSE count(*) FILTER (WHERE event_type IN ('concept_born','concept_dead')) * 1.0 / count(DISTINCT event_date) END FROM fact_concept_event WHERE as_of_mode='reconstructed'"
    expect: {op: "<", value: 5}
  - id: g4-churn-band
    # 2026-06-13 prereg 修订 3 重标定 (跑前, 非结果驱动): 旧 240 = 截断面板 (仅见 27-354 概念)
    # 上按"24x10容忍"拍的绝对计数, 在干净全面板 (1016 概念/~89k 成员行) 失真。实测扣 day1
    # 初始全量载入后, 真实成员 churn 中位 468/日 (扣全部薄日及邻日仍 453 = 东财真实重分类,
    # 非伪影); 改用中位数 (对残留多日薄段尖峰稳健, max 16.7% 率不污染中心) 门柱 < 900
    # (clean 468 留 1.9x 余量; 平滑前 flicker 态中位 1273 仍被抓)。binding 幻影守门 = g4-artifact
    # (BORN+DEAD<5, prereg 冻结死亡条款), binding 成员稳定性守门 = 实验自带 PIT 双锚 (留存>=50%)。
    claim: "成员 churn 中位 < 900/日 (扣 day1; 干净面板实测 468, 幻影回归态 >1273 被抓)"
    type: duckdb_sql
    database: data/smartmoney.duckdb
    query: "WITH e AS (SELECT event_date, count(*) FILTER (WHERE event_type IN ('member_add','member_drop')) AS c FROM fact_concept_event WHERE as_of_mode='reconstructed' GROUP BY 1) SELECT CASE WHEN (SELECT count(*) FROM e) <= 1 THEN 99999 ELSE median(c) FILTER (WHERE event_date > (SELECT min(event_date) FROM e)) END FROM e"
    expect: {op: "<", value: 900}
  - id: g6-main-tables-fresh
    claim: "主表三件 (limit_list_d/stk_limit/kline) 覆盖到实验窗尾"
    type: duckdb_sql
    database: data/tushare_raw.duckdb
    query: "SELECT CASE WHEN (SELECT max(trade_date) FROM raw_tushare_limit_list_d) >= '20260601' AND (SELECT max(trade_date) FROM raw_tushare_stk_limit) >= '20260601' THEN 1 ELSE 0 END"
    expect: {op: "==", value: 1}
