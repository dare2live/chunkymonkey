<!-- 股票档案视图 (Stock Dossier) — 自包含, 无 node。owner=docs/stock_dossier_master_design.md -->
<!-- 三层架构: L1价格形态 / L2每日盘面 / L3属性背景(含机构档案)。配色=claude_design 浅色系统(reset前v3设计方案) -->
<meta charset="utf-8">
<style>
  :root {
    /* claude_design 浅色系统 (reset前v3设计方案) */
    --brand:#3657D8; --brand-100:#dbe3fb;
    --bg:#FAFAFA; --surface:#fff;
    --ink:#111827; --ink-500:#6b7280; --ink-100:#e5e7eb; --ink-50:#f3f4f6;
    --ok:#0B9D6A; --ok-100:#dcf4e7; --warn:#d97706; --warn-100:#fef3c7;
    --bad:#dc2626; --bad-100:#fee2e2; --unknown:#9ca3af;
    --up:#0B9D6A; --down:#dc2626; --flat:#9ca3af;   /* 趋势线着色 */
  }
  * { box-sizing:border-box; font-family:-apple-system,"PingFang SC",sans-serif; }
  body { margin:0; background:var(--bg); color:var(--ink); font-size:13px; line-height:1.5; -webkit-font-smoothing:antialiased; }
  .wrap { display:grid; grid-template-columns:292px 1fr; height:100vh; }
  .left { background:var(--surface); border-right:1px solid var(--ink-100); padding:16px 14px; overflow-y:auto; }
  .right { padding:18px 20px; overflow-y:auto; background:var(--bg); }
  .brand { font-size:15px; font-weight:700; margin:0 0 2px; color:var(--ink); } .brand small { color:var(--ink-500); font-weight:400; font-size:11px; }
  h3 { font-size:11px; color:var(--ink-500); margin:18px 0 7px; font-weight:600; letter-spacing:.3px; }
  input,select { background:#fff; color:var(--ink); border:1px solid var(--ink-100); border-radius:8px; padding:7px 9px; font-size:13px; outline:none; transition:border-color .15s; }
  input:focus,select:focus { border-color:var(--brand); }
  button { background:var(--brand); color:#fff; border:0; border-radius:8px; padding:7px 13px; cursor:pointer; font-size:13px; transition:filter .15s; }
  button:hover { filter:brightness(1.05); } button.ghost { background:var(--ink-50); color:var(--ink-500); }
  .row { display:flex; align-items:center; gap:8px; margin:7px 0; }
  /* header bar */
  .hdr { display:flex; align-items:center; gap:11px; flex-wrap:wrap; padding:14px 18px; background:var(--surface); border:1px solid var(--ink-100); border-radius:12px; margin-bottom:14px; box-shadow:0 1px 3px rgba(0,0,0,.04); }
  .hdr .code { font-size:21px; font-weight:800; color:var(--ink); letter-spacing:.3px; }
  .hdr .asof { font-size:11px; color:var(--ink-500); }
  .fresh { margin-left:auto; display:flex; align-items:center; gap:6px; font-size:10px; color:var(--ink-500); }
  .dot { width:7px; height:7px; border-radius:50%; display:inline-block; background:var(--ok); }
  /* 三层卡 (L1=brand蓝 L2=ok绿 L3=warn橙) */
  .layer { background:var(--surface); border:1px solid var(--ink-100); border-radius:12px; margin-bottom:13px; overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.04); }
  .layer-hd { display:flex; align-items:baseline; gap:9px; padding:11px 16px; border-bottom:1px solid var(--ink-100); background:var(--ink-50); }
  .ln { font-size:10px; font-weight:800; color:#fff; padding:1px 7px; border-radius:5px; letter-spacing:.5px; }
  .l1 .ln{ background:var(--brand); } .l2 .ln{ background:var(--ok); } .l3 .ln{ background:var(--warn); }
  .l1{ border-left:3px solid var(--brand); } .l2{ border-left:3px solid var(--ok); } .l3{ border-left:3px solid var(--warn); }
  .lt { font-size:13px; font-weight:600; color:var(--ink); } .ld { font-size:10px; color:var(--ink-500); margin-left:auto; }
  .layer-bd { padding:14px 16px; }
  .dim { display:flex; align-items:baseline; gap:9px; margin:8px 0; }
  .dim-k { width:84px; flex-shrink:0; font-size:11px; color:var(--ink-500); }
  .dim-v { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .src { font-size:10px; color:var(--unknown); }
  .tf { display:flex; gap:10px; flex-wrap:wrap; }
  .tfbox { flex:1; min-width:146px; background:var(--bg); border:1px solid var(--ink-100); border-radius:10px; padding:11px; }
  .tflabel { color:var(--ink-500); font-size:10px; letter-spacing:.5px; } .tfstate { font-size:16px; font-weight:700; margin:4px 0; color:var(--ink); }
  .badge { display:inline-block; padding:2px 9px; border-radius:999px; font-size:11px; font-weight:600; background:var(--ink-50); color:var(--ink-500); white-space:nowrap; }
  .aligned { background:var(--ok-100); color:var(--ok); }
  .conflict { background:var(--bad-100); color:var(--bad); }
  .info { background:var(--brand-100); color:var(--brand); }
  .warnb { background:var(--warn-100); color:var(--warn); }
  .slider { display:flex; align-items:center; gap:6px; margin:5px 0; font-size:11px; }
  .slider input[type=range]{ flex:1; accent-color:var(--brand); } .slider .val{ width:56px; text-align:right; color:var(--brand); cursor:pointer; }
  .slider.changed span:first-child { color:var(--brand); font-weight:600; }
  .coupled { color:var(--warn); } .note { color:var(--warn); font-size:11px; margin:3px 0; } .val:hover { text-decoration:underline; }
  .cmp { width:100%; border-collapse:collapse; } .cmp td,.cmp th { padding:6px 9px; border-bottom:1px solid var(--ink-100); text-align:right; font-size:12px; }
  .cmp th { color:var(--ink-500); font-weight:600; font-size:10px; } .cmp th:first-child,.cmp td:first-child { text-align:left; } .pos { color:var(--ok); } .neg { color:var(--bad); }
  .stocklist { display:grid; grid-template-columns:repeat(auto-fill,minmax(158px,1fr)); gap:10px; }
  .stockcard { background:var(--surface); border:1px solid var(--ink-100); border-radius:10px; padding:9px; cursor:pointer; transition:border-color .15s; }
  .stockcard:hover { border-color:var(--brand); }
  .muted { color:var(--ink-500); } .faint { color:var(--unknown); } .small { font-size:11px; }
  .ph { color:var(--unknown); font-size:12px; }
  /* 机构表 */
  .htab { width:100%; border-collapse:collapse; font-size:12px; font-variant-numeric:tabular-nums; }
  .htab td,.htab th { padding:4px 8px; border-bottom:1px solid var(--ink-100); text-align:left; }
  .htab th { color:var(--ink-500); font-weight:600; font-size:10px; } .htab td.r { text-align:right; }
  svg text { fill:var(--ink-500); font-size:9px; }
</style>

<div class="wrap">
  <div class="left">
    <div class="brand">股票档案 <small>三层解读</small></div>
    <div class="row"><input id="code" placeholder="股票代码 如 600800" style="flex:1"><button onclick="loadStock()">查</button></div>

    <h3>形态筛选 (列出符合的股票)</h3>
    <select id="pattern" style="width:100%"></select>
    <div class="row"><button class="ghost" onclick="runScreen()" style="flex:1">列出符合此形态的股票</button></div>

    <h3>调参微调识别 <span class="small muted" id="defver"></span></h3>
    <div id="sliders"></div>
    <div class="row"><button onclick="runCompare()" style="flex:2">对比默认值 (全体分布)</button><button class="ghost" onclick="resetParams()" style="flex:1">恢复默认值</button></div>
    <div class="small muted" id="changed_hint"></div>
    <div id="notes"></div>

    <h3>三层架构</h3>
    <div class="small muted" style="line-height:1.9">
      <span class="ln" style="background:var(--brand)">L1</span> 价格形态 <span class="faint">几何</span><br>
      <span class="ln" style="background:var(--ok)">L2</span> 每日盘面 <span class="faint">量价资金筹码</span><br>
      <span class="ln" style="background:var(--warn)">L3</span> 属性背景 <span class="faint">机构/板块/基本面</span>
    </div>
  </div>

  <div class="right">
    <div id="content"><p class="muted">输入股票代码查看档案, 或选形态列出符合的股票。趋势线按形态着色(绿=升/红=跌/灰=横盘)。调参后叠加 before/after 对比。</p></div>
  </div>
</div>

<script>
const API = "/api/dossier";
let TUN = [], CUR_CODE = null, OVR = {}, DEFAULTS = {};

function ovStr(){ return Object.entries(OVR).map(([k,v])=>k+":"+v).join(","); }
function unitOf(t){ return t["单位"]==="百分比"?"%":(t["单位"]==="倍数"?"x":""); }

async function init(){
  const r = await fetch(`${API}/tunables`).then(x=>x.json());
  TUN = r.tunables;
  DEFAULTS = {}; TUN.forEach(t=>DEFAULTS[t.param]=t["当前值"]);
  document.getElementById("defver").textContent = `默认值 v${r.defaults_version} · 点数值复位单项`;
  const sel = document.getElementById("pattern");
  sel.innerHTML = Object.entries(r.states).map(([s,d])=>`<option value="${s}">${s} — ${d.split('(')[0]}</option>`).join("");
  renderSliders();
}
function renderSliders(){
  const box = document.getElementById("sliders");
  box.innerHTML = TUN.map((t,i)=>{
    const unit = unitOf(t);
    const def = DEFAULTS[t.param];
    const v = (t.param in OVR)?OVR[t.param]:def;
    const changed = (t.param in OVR) && (+OVR[t.param]!==+def);
    const min = (t["单位"]==="百分比")?-20:0, max=(t["单位"]==="百分比")?20:(t["单位"]==="倍数"?3:1);
    const step = (t["单位"]==="比例")?0.01:0.1;
    const cp = t["耦合"].length?` <span class="coupled" title="${t["耦合"].join(',')}">⇄</span>`:"";
    const dlt = changed?` <span class="small muted">(默认 ${(+def).toFixed(2)}${unit})</span>`:"";
    return `<div class="slider${changed?' changed':''}"><span style="width:120px" title="${t["状态"]} · 默认 ${(+def).toFixed(2)}${unit}">${t["状态"]}·${t["指标"]}${cp}</span>
      <input type="range" min="${min}" max="${max}" step="${step}" value="${v}" oninput="onSlide('${t.param}',this.value)">
      <span class="val" id="v_${i}" title="点击复位此项到默认值" onclick="resetOne('${t.param}')">${(+v).toFixed(2)}${unit}${dlt}</span></div>`;
  }).join("");
  const nc = Object.keys(OVR).filter(p=>+OVR[p]!==+DEFAULTS[p]).length;
  document.getElementById("changed_hint").textContent = nc?`已偏离默认 ${nc} 项`:"全部=探索默认值";
}
function onSlide(param,val){ OVR[param] = +val; renderSliders(); if(CUR_CODE) loadStock(CUR_CODE, true); }
function resetOne(param){ delete OVR[param]; renderSliders(); if(CUR_CODE) loadStock(CUR_CODE, Object.keys(OVR).length>0); }
function resetParams(){ OVR={}; renderSliders(); document.getElementById("notes").innerHTML=""; if(CUR_CODE) loadStock(CUR_CODE); }

function trendSVG(trend, w=820, h=180, opacity=1, dashed=false){
  if(!trend.length) return "";
  const ys=trend.map(p=>p.close);
  const minY=Math.min(...ys), maxY=Math.max(...ys);
  const X=i=>40+i/(trend.length-1)*(w-60), Y=v=>h-20-(v-minY)/((maxY-minY)||1)*(h-40);
  let segs="";
  for(let i=1;i<trend.length;i++){
    const c={up:"var(--up)",down:"var(--down)",flat:"var(--flat)"}[trend[i].color]||"var(--flat)";
    segs+=`<line x1="${X(i-1)}" y1="${Y(ys[i-1])}" x2="${X(i)}" y2="${Y(ys[i])}" stroke="${c}" stroke-width="2" opacity="${opacity}" ${dashed?'stroke-dasharray="3 3"':''}/>`;
  }
  const lbl=[0,Math.floor(trend.length/2),trend.length-1].map(i=>`<text x="${X(i)}" y="${h-6}">${trend[i].date}</text>`).join("");
  return segs+lbl;
}

// L2 每日盘面行为
function layer2Card(base){
  const cap = base.capital, ch = base.chips, mg = base.mingan, vol = base.vol;
  if(!cap && !ch && !mg && !vol) return "";
  const pvColor = s => /健康|企稳/.test(s||'')?'aligned':/背离|恐慌/.test(s||'')?'conflict':'';
  const volRow = vol ? `<div class="dim"><span class="dim-k">成交量/量能</span><span class="dim-v">
    <span class="badge ${vol['量能状态']==='放量'?'info':vol['量能状态']==='缩量'?'':'' }">${vol['量能状态']} ${vol['量比']}x</span>
    <span class="badge ${pvColor(vol['量价配合'])}">${vol['量价配合']}</span>
    <span class="src">量比=今量/前20日均量 · 量价配合(价涨量增=真突破/价涨量缩=顶部背离)</span></span></div>` : "";
  const capRow = cap ? `<div class="dim"><span class="dim-k">主力资金/换手</span><span class="dim-v">
    <span class="badge ${cap.capital_state==='主力净流入'?'aligned':cap.capital_state==='主力净流出'?'conflict':''}">${cap.capital_state}</span>
    <span class="badge">${cap.turnover_state}</span>
    <span class="src">20日净额 ${cap['主力净额20日累计']?Math.round(cap['主力净额20日累计']):'—'}万 · 换手 ${cap['换手率']!=null?cap['换手率'].toFixed(2)+'%':'—'}</span></span></div>` : "";
  const mgRow = mg ? `<div class="dim"><span class="dim-k">主力大单净</span><span class="dim-v">
    <span class="badge ${mg['主力净额']>0?'aligned':mg['主力净额']<0?'conflict':''}">${mg['主力净额']>0?'净流入':mg['主力净额']<0?'净流出':'中性'} ${mg['主力净额']}亿</span>
    <span class="badge">占比 ${mg['净额占比']}%</span>
    <span class="src">涨跌 ${mg['涨跌']>0?'+':''}${mg['涨跌']}%</span></span></div>` : "";
  const divColor = s => /承接/.test(s||'')?'aligned':/派发/.test(s||'')?'conflict':'';
  const intentColor = s => /吸筹|看多|低吸|推升/.test(s||'')?'aligned':/做空|派发|阴跌/.test(s||'')?'conflict':'';
  const intentRow = mg && mg['主力意图'] ? `<div class="dim"><span class="dim-k">主力意图</span><span class="dim-v">
    <span class="badge ${intentColor(mg['主力意图'])}">${mg['主力意图']}</span>
    <span class="badge ${divColor(mg['量价背离'])}">${mg['量价背离']||''}</span>
    <span class="src">${mg['意图解读']||''}</span></span></div>` : "";
  const chRow = ch ? `<div class="dim"><span class="dim-k">筹码</span><span class="dim-v">
    <span class="badge ${(ch.chip_state||'').includes('派发')?'conflict':(ch.chip_state||'').includes('惜售')?'aligned':''}">${ch.chip_state}</span>
    <span class="badge">${ch['集中状态']||''}</span>
    <span class="badge ${ch['价位状态']==='获利'?'aligned':'conflict'}">${ch['价位状态']||''}</span>
    ${ch['派发预警']?'<span class="badge conflict">派发预警(鱼尾出货)</span>':''}
    <span class="src">获利盘 ${ch['获利盘']!=null?ch['获利盘'].toFixed(0)+'%':'—'}${ch['获利盘20日变化']!=null?'('+(ch['获利盘20日变化']>0?'+':'')+ch['获利盘20日变化'].toFixed(0)+')':''} · 套牢盘 ${ch['套牢盘']!=null?ch['套牢盘'].toFixed(0)+'%':'—'}${ch['成本偏度']!=null?' · 成本偏度'+ch['成本偏度'].toFixed(2):''}</span></span></div>` : "";
  return `<div class="layer l2"><div class="layer-hd"><span class="ln">L2</span><span class="lt">每日盘面行为</span>
      <span class="ld">确认形态真伪 · 东财 moneyflow_dc / tushare cyq_perf · 盘后日更 t-1</span></div>
    <div class="layer-bd">${volRow}${capRow}${mgRow}${intentRow}${chRow}</div></div>`;
}

// L3 机构 / 十大流通股东 (机构跟随基础, 用户最初设想)
function holderCard(base){
  const h = base.holders;
  if(!h) return `<div class="layer l3"><div class="layer-hd"><span class="ln">L3</span><span class="lt">机构 / 十大流通股东</span>
      <span class="ld">smartmoney F10 · 季报披露 · 机构跟随基础</span></div>
    <div class="layer-bd"><span class="ph">该季无当前流通股东持仓数据</span></div></div>`;
  const dirColor = h['机构动向']==='加仓'?'aligned':h['机构动向']==='减仓'?'conflict':'';
  const chColor = c => (c==='新进'||c==='增持')?'aligned':(c==='退出'||c==='减持')?'conflict':'';
  const rows = h.holders.slice(0,10).map(x=>`<tr><td>${x.rank}</td><td>${x.name}</td>
    <td class="r">${x.ratio!=null?(+x.ratio).toFixed(2)+'%':'—'}</td>
    <td><span class="badge ${chColor(x.change)}">${x.change||'—'}</span></td></tr>`).join("");
  return `<div class="layer l3"><div class="layer-hd"><span class="ln">L3</span><span class="lt">机构 / 十大流通股东</span>
      <span class="ld">${h.report_date} 季报 · smartmoney F10 · 机构跟随基础</span></div>
    <div class="layer-bd">
      <div class="dim"><span class="dim-k">机构动向</span><span class="dim-v">
        <span class="badge ${dirColor}">${h['机构动向']}</span>
        <span class="src">新进 ${h['新进']} · 退出 ${h['退出']} · 增持 ${h['增持']} · 减持 ${h['减持']} (本季较上季)</span></span></div>
      <table class="htab"><tr><th>#</th><th>流通股东</th><th class="r">占流通</th><th>本季</th></tr>${rows}</table></div></div>`;
}

// L3 板块 / 概念 / 行业 (风口在不在 = 为什么涨; 行业=申万 / 概念=东财, 口径红线 J6)
function sectorCard(base){
  const s = base.sector;
  if(!s || (!s.sw_l1_name && !(s['概念']||[]).length)) return "";
  const regColor = r => /强势/.test(r||'')?'aligned':/走弱/.test(r||'')?'conflict':'';
  const reg = s.regime;
  const indRow = s.sw_l1_name ? `<div class="dim"><span class="dim-k">申万行业</span><span class="dim-v">
    <span class="badge info">${s.sw_l1_name}${s.sw_l2_name?' · '+s.sw_l2_name:''}</span>
    <span class="src">行业=申万 PIT 归属 (口径红线: 行业=申万/概念=东财)</span></span></div>` : "";
  const regRow = reg ? `<div class="dim"><span class="dim-k">板块regime</span><span class="dim-v">
    <span class="badge ${regColor(reg.regime)}">${reg.regime}</span>
    <span class="src">vs HS300 超额 ${reg['板块超额']!=null?(reg['板块超额']>0?'+':'')+reg['板块超额']+'%':'—'} · 趋势 ${reg['板块趋势']||'—'} (风口在不在)</span></span></div>` : "";
  const svs = s.stock_vs_sector;
  const svsRow = svs ? `<div class="dim"><span class="dim-k">个股vs板块</span><span class="dim-v">
    <span class="badge ${svs.rs_state==='强于板块'?'aligned':svs.rs_state==='弱于板块'?'conflict':''}">${svs.rs_state}</span>
    <span class="src">个股相对所属行业指数 (领涨/落后; 复用 Mansfield RS, 基准换行业指数)</span></span></div>` : "";
  const cons = s['概念']||[];
  const conRow = cons.length ? `<div class="dim"><span class="dim-k">东财概念</span><span class="dim-v">
    ${cons.map(c=>`<span class="badge ${c.is_hot?'info':''}">${c.名称}${c.热度!=null?' '+(c.热度>0?'+':'')+c.热度+'%':''}</span>`).join(" ")}
    <span class="src">概念=东财 · 热度=概念指数近期涨幅 · 热门(>8%) ${s['热门概念数']||0} 个 (纯描述非alpha)</span></span></div>` : "";
  return `<div class="layer l3"><div class="layer-hd"><span class="ln">L3</span><span class="lt">板块 / 概念 / 行业</span>
      <span class="ld">为什么涨 · 风口在不在 · 申万行业 + 东财概念</span></div>
    <div class="layer-bd">${indRow}${regRow}${svsRow}${conRow}</div></div>`;
}

// L3④ 基本面 / 估值 / 分析师预期 (可持续性 = 涨得有没有基本面支撑)
function fundamentalsCard(base){
  const f = base.fundamentals, v = base.valuation, a = base.analyst;
  if(!f && !v && !a) return "";
  const fColor = s => /优质/.test(s||'')?'aligned':/偏弱/.test(s||'')?'conflict':'';
  const vColor = s => s==='低估'?'aligned':s==='高估'?'conflict':'';
  const fundRow = f ? `<div class="dim"><span class="dim-k">基本面</span><span class="dim-v">
    <span class="badge ${fColor(f['基本面评'])}">${f['基本面评']}</span>
    <span class="badge ${f['盈利能力']==='优秀'||f['盈利能力']==='良好'?'aligned':f['盈利能力']==='偏弱'?'conflict':''}">ROE ${f.ROE!=null?f.ROE+'%':'—'}(${f['盈利能力']})</span>
    <span class="badge ${f['成长性']==='高成长'||f['成长性']==='成长'?'aligned':f['成长性']==='下滑'?'conflict':''}">${f['成长性']}</span>
    <span class="src">净利同比 ${f['净利增长']!=null?(f['净利增长']>0?'+':'')+f['净利增长']+'%':'—'} · 营收 ${f['营收增长']!=null?(f['营收增长']>0?'+':'')+f['营收增长']+'%':'—'} · 毛利 ${f['毛利率']!=null?f['毛利率']+'%':'—'} · 负债 ${f['负债率']!=null?f['负债率']+'%':'—'} · ${f['报告期']||''}(ann_date PIT)</span></span></div>` : "";
  const valRow = v ? `<div class="dim"><span class="dim-k">估值</span><span class="dim-v">
    <span class="badge ${vColor(v['估值状态'])}">${v['估值状态']}</span>
    <span class="badge">PE ${v.PE!=null?v.PE:'—'}${v['PE分位']!=null?'('+v['PE分位']+'分位)':''}</span>
    <span class="badge">PB ${v.PB!=null?v.PB:'—'}${v['PB分位']!=null?'('+v['PB分位']+'分位)':''}</span>
    <span class="src">股息 ${v['股息率']!=null?v['股息率']+'%':'—'} · 市值 ${v['市值亿']!=null?Math.round(v['市值亿'])+'亿':'—'} · 分位=自身历史(低估<30/高估>70)</span></span></div>` : "";
  const aRow = a ? `<div class="dim"><span class="dim-k">分析师预期</span><span class="dim-v">
    <span class="badge ${a['评级倾向']==='看好'?'aligned':''}">${a['评级倾向']}</span>
    <span class="badge">正向 ${a['正向占比']!=null?a['正向占比']+'%':'—'} (${a['研报数']}篇)</span>
    ${a['上行空间']!=null?`<span class="badge ${a['上行空间']>0?'aligned':'conflict'}">目标价上行 ${a['上行空间']>0?'+':''}${a['上行空间']}%</span>`:''}
    <span class="src">近6月研报 · A股研报正向偏(占比判别力弱, 看上行空间) · report_date PIT</span></span></div>` : "";
  return `<div class="layer l3"><div class="layer-hd"><span class="ln">L3</span><span class="lt">基本面 / 估值 / 预期</span>
      <span class="ld">涨得有没有支撑 · 财报ann_date PIT · 券商研报</span></div>
    <div class="layer-bd">${fundRow}${valRow}${aRow}</div></div>`;
}

// L3⑤ 事件催化 (为什么近期异动 = 龙虎榜资金 + 大宗折溢价 + 解禁前瞻)
function eventsCard(base){
  const e = base.events; if(!e) return "";
  const lhb = e.lhb, bk = e.block, ul = e.unlock;
  if(!lhb && !bk && !(ul && ul['临近解禁'])) return "";
  const lhbColor = s => /抢筹|净买/.test(s||'')?'aligned':/净卖/.test(s||'')?'conflict':'';
  const lhbRow = lhb ? `<div class="dim"><span class="dim-k">龙虎榜</span><span class="dim-v">
    <span class="badge ${lhbColor(lhb['龙虎榜状态'])}">${lhb['龙虎榜状态']}</span>
    <span class="badge">上榜 ${lhb['上榜次数']}次</span>
    ${lhb['机构净买万']?`<span class="badge ${lhb['机构净买万']>0?'aligned':'conflict'}">机构净买 ${Math.round(lhb['机构净买万'])}万</span>`:''}
    <span class="src">净买额 ${lhb['净买额万']!=null?Math.round(lhb['净买额万'])+'万':'—'} · ${lhb['最近原因']||''} (近60日, trade_date PIT)</span></span></div>` : "";
  const bkColor = s => /溢价/.test(s||'')?'aligned':/折价/.test(s||'')?'conflict':'';
  const bkRow = bk ? `<div class="dim"><span class="dim-k">大宗交易</span><span class="dim-v">
    <span class="badge ${bkColor(bk['大宗状态'])}">${bk['大宗状态']}</span>
    <span class="badge">${bk['大宗笔数']}笔</span>
    <span class="src">折溢价 ${bk['折溢价']!=null?(bk['折溢价']>0?'+':'')+bk['折溢价']+'%':'—'} · 总额 ${bk['大宗总额亿']!=null?bk['大宗总额亿']+'亿':'—'} (近60日)</span></span></div>` : "";
  const ulRow = (ul && ul['临近解禁']) ? `<div class="dim"><span class="dim-k">解禁(前瞻)</span><span class="dim-v">
    <span class="badge ${ul['解禁预警']?'conflict':''}">${ul['解禁预警']?'解禁压力预警':'临近解禁'}</span>
    <span class="src">${ul['临近解禁']} 解禁 ${ul['解禁占比']!=null?ul['解禁占比']+'%流通':''} (未来90日, ann_date已知0泄露)</span></span></div>` : "";
  return `<div class="layer l3"><div class="layer-hd"><span class="ln">L3</span><span class="lt">事件催化</span>
      <span class="ld">为什么近期异动 · 龙虎榜/大宗 trade_date PIT · 解禁前瞻</span></div>
    <div class="layer-bd">${lhbRow}${bkRow}${ulRow}</div></div>`;
}

// L3⑥ 市场 regime (横切非单股: 大盘环境决定进攻/防御; stage-conditional 最外层门)
function layer3Rest(base){
  const r = base.regime;
  if(!r) return "";
  const regColor = s => s==='牛市'?'aligned':s==='熊市'?'conflict':'';
  const sentiColor = s => /强/.test(s||'')?'aligned':/弱/.test(s||'')?'conflict':'';
  return `<div class="layer l3"><div class="layer-hd"><span class="ln">L3</span><span class="lt">市场 regime</span>
      <span class="ld">大盘环境 · 横切非单股 · stage-conditional 最外层门</span></div>
    <div class="layer-bd">
      <div class="dim"><span class="dim-k">大盘环境</span><span class="dim-v">
        <span class="badge ${regColor(r.regime)}">${r.regime}</span>
        <span class="badge">大盘趋势 ${r['大盘趋势']||'—'}</span>
        <span class="src">HS300 真MA斜率+价位 (牛=均线上行+价在线上/熊=下行+线下/震荡=背离)</span></span></div>
      <div class="dim"><span class="dim-k">涨停情绪</span><span class="dim-v">
        <span class="badge ${sentiColor(r['情绪'])}">${r['情绪']||'—'}</span>
        <span class="src">涨停 ${r['涨停家数']!=null?r['涨停家数']:'—'} · 跌停 ${r['跌停家数']!=null?r['跌停家数']:'—'} · 净涨停 ${r['净涨停']!=null?r['净涨停']:'—'}${r['炸板率']!=null?' · 炸板率 '+(r['炸板率']*100).toFixed(0)+'%':''}</span></span></div>
    </div></div>`;
}

async function loadStock(code, overlay){
  code = code || document.getElementById("code").value.trim();
  if(!code) return;
  CUR_CODE = code; document.getElementById("code").value=code;
  const base = await fetch(`${API}/stock/${code}`).then(x=>x.json());
  if(base.error){ document.getElementById("content").innerHTML=`<p class="conflict">${base.error}</p>`; return; }
  let afterTrend=null, notes=[];
  if(overlay && Object.keys(OVR).length){
    const aft = await fetch(`${API}/stock/${code}?ov=${encodeURIComponent(ovStr())}`).then(x=>x.json());
    afterTrend = aft.trend; notes = aft.coupling_notes||[];
  }
  document.getElementById("notes").innerHTML = notes.map(n=>`<div class="note">⇄ ${n}</div>`).join("");
  const tf = base.timeframes;
  const alignBadge = base.mtf_aligned ? `<span class="badge aligned">日周月一致 ✓</span>` : `<span class="badge conflict">多框矛盾 (诚实并列)</span>`;
  const overlaySVG = afterTrend ? `<svg viewBox="0 0 820 180" width="100%">${trendSVG(base.trend,820,180,0.35)}${trendSVG(afterTrend,820,180,1,true)}</svg>
     <div class="small muted">实线浅=默认值, 虚线亮=调整后 (此股趋势线着色随参数变化)</div>` : `<svg viewBox="0 0 820 180" width="100%">${trendSVG(base.trend)}</svg>`;
  const ptrend = base.prior_trend ? `<span class="badge ${base.prior_trend==='升'?'aligned':base.prior_trend==='跌'?'conflict':''}">前序趋势: ${base.prior_trend}</span>` : "";
  const candle = base.today_candle ? `<span class="badge info">当日K线: ${base.today_candle}</span>` : "";
  const rs = base.rs ? `<span class="badge ${base.rs.rs_state==='强于大盘'?'aligned':base.rs.rs_state==='弱于大盘'?'conflict':''}">RS: ${base.rs.rs_state}</span>` : "";
  const pats = (base.recent_patterns||[]);
  const seen = {}; const upats = pats.filter(p=>{ const k=p.名称; if(seen[k])return false; seen[k]=1; return true; });
  const patRows = upats.length ? `<div class="dim"><span class="dim-k">命名形态</span><span class="dim-v">${upats.map(p=>`<span class="badge aligned">${p.名称}</span><span class="src">${p.date}·${p.provenance}</span>`).join(" ")}</span></div>` : "";
  document.getElementById("content").innerHTML = `
    <div class="hdr">
      <span class="code">${code}</span>
      <span class="asof">as_of ${base.as_of} · 熵 ${(base.entropy||0).toFixed(2)}</span>
      ${alignBadge} ${ptrend} ${rs} ${candle}
      <span class="fresh"><span class="dot"></span>数据 ${base.as_of} · 形态+量价+资金全口径</span>
    </div>
    <div class="layer l1"><div class="layer-hd"><span class="ln">L1</span><span class="lt">价格形态</span>
        <span class="ld">骨架 · 价格走出什么几何 · K线 tushare 前复权(日/周/月)</span></div>
      <div class="layer-bd">
        <div class="tf">${["daily","weekly","monthly"].map(k=>`
          <div class="tfbox"><div class="tflabel">${({daily:"日线",weekly:"周线",monthly:"月线"})[k]}</div>
            <div class="tfstate">${tf[k].state||"过渡态"}</div>
            <div class="small muted">${tf[k].desc}</div>${tf[k].sub?`<div class="small">子态: ${tf[k].sub}</div>`:""}</div>`).join("")}</div>
        ${patRows}
      </div></div>
    ${layer2Card(base)}
    ${sectorCard(base)}
    ${fundamentalsCard(base)}
    ${holderCard(base)}
    ${eventsCard(base)}
    ${layer3Rest(base)}
    <div class="layer"><div class="layer-hd"><span class="lt">趋势线</span><span class="ld">按形态着色 · 非K线</span></div>
      <div class="layer-bd">${overlaySVG}</div></div>`;
}

async function runScreen(){
  const p = document.getElementById("pattern").value;
  document.getElementById("content").innerHTML = `<p class="muted">扫描中 (${p})...</p>`;
  const ov = Object.keys(OVR).length?`&ov=${encodeURIComponent(ovStr())}`:"";
  const r = await fetch(`${API}/screen?pattern=${encodeURIComponent(p)}&limit=40&scan=300${ov}`).then(x=>x.json());
  document.getElementById("content").innerHTML = `
    <div class="hdr"><span class="code" style="font-size:17px">${p}</span> <span class="asof">${r.desc}</span>
      <span class="fresh">扫 ${r.scanned} 股 · 命中 ${r.count}</span></div>
    ${r.coupling_notes&&r.coupling_notes.length?`<div class="small muted" style="margin:-6px 0 10px">调参: ${r.coupling_notes.join("; ")}</div>`:""}
    <div class="stocklist">${r.stocks.map(s=>`
      <div class="stockcard" onclick="loadStock('${s.code}')">
        <b>${s.code}</b> ${s.mtf_aligned?'<span class="badge aligned">一致</span>':''}
        <div class="small muted">${s.sub||''}</div>
        <svg viewBox="0 0 160 50" width="100%">${trendSVG(s.trend,160,50)}</svg></div>`).join("")}</div>`;
}
async function runCompare(){
  if(!Object.keys(OVR).length){ document.getElementById('content').innerHTML='<p class="muted">先调一个参数, 再看它对全体股票分布的影响 (默认 vs 调整后)。</p>'; return; }
  document.getElementById('content').innerHTML='<p class="muted">扫描全体股票, 对比默认 vs 调整后分布...</p>';
  const r = await fetch(`${API}/compare?ov=${encodeURIComponent(ovStr())}&scan=200`).then(x=>x.json());
  if(r.error){ document.getElementById('content').innerHTML=`<p class="conflict">${r.error}</p>`; return; }
  const rows = r.by_pattern.map(p=>{
    const d=p.delta, cls=d>0?'pos':(d<0?'neg':'muted'), sign=d>0?'+':'';
    return `<tr><td>${p.state}</td><td>${p.default}</td><td>${p.modified}</td><td class="${cls}">${sign}${d}</td></tr>`;
  }).join("");
  document.getElementById('content').innerHTML = `
    <div class="hdr"><span class="code" style="font-size:17px">默认值 vs 调整后</span><span class="asof">全体分布对比</span>
      <span class="fresh">扫 ${r.scanned} 股 · ${r.flip_count} 只翻转</span></div>
    <div class="layer"><div class="layer-bd">
      <div class="small muted">调参: ${(r.coupling_notes||[]).join('; ')||'—'}</div>
      <div class="small warnb" style="display:inline-block;padding:4px 8px;border-radius:6px;margin:8px 0">盲点提醒: 单股看不出调参的全体影响 — 若某形态 Δ 暴涨, 可能是阈值放太松涌入了不该归此类的股。</div>
      <table class="cmp"><tr><th>形态</th><th>默认</th><th>调整后</th><th>Δ</th></tr>${rows}</table></div></div>
    ${r.flip_count?`<div class="layer"><div class="layer-hd"><span class="lt">翻转的股票</span><span class="ld">前20 · 点击看档案</span></div>
      <div class="layer-bd">${r.flips.slice(0,20).map(f=>`<span class="stockcard" style="display:inline-block;margin:3px;padding:4px 8px" onclick="loadStock('${f.code}')">${f.code} <span class="small muted">${f.from||'过渡'}→${f.to||'过渡'}</span></span>`).join("")}</div></div>`:''}`;
}
init();
</script>
