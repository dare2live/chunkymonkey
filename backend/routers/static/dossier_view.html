<!-- 股票档案视图 (Stock Dossier) — 自包含, 无 node。owner=docs/stock_dossier_master_design.md -->
<!-- 三层架构: L1价格形态 / L2每日盘面行为 / L3属性背景。配色沿用深色主线(绿涨红跌蓝accent金warn) -->
<meta charset="utf-8">
<style>
  :root {
    /* 当前配色主线 (保留) */
    --up:#2e9e5b; --down:#d24b4b; --flat:#9aa0a6;
    --bg:#0f1115; --panel:#1a1d24; --line:#2a2e38;
    --txt:#e6e8eb; --dim:#9aa0a6; --accent:#4a9eff; --warn:#e0a030;
    /* 同色系明度梯度 (非新主色, 只补层次) */
    --card:#1e222b; --inner:#12151b; --line2:#343a48; --faint:#6b7280;
  }
  * { box-sizing:border-box; font-family:-apple-system,"PingFang SC",sans-serif; }
  body { margin:0; background:var(--bg); color:var(--txt); font-size:13px; line-height:1.5; -webkit-font-smoothing:antialiased; }
  .wrap { display:grid; grid-template-columns:292px 1fr; height:100vh; }
  .left { background:var(--panel); border-right:1px solid var(--line); padding:16px 14px; overflow-y:auto; }
  .right { padding:18px 20px; overflow-y:auto; }
  .brand { font-size:15px; font-weight:700; margin:0 0 2px; } .brand small{ color:var(--faint); font-weight:400; font-size:11px; }
  h3 { font-size:11px; color:var(--faint); margin:18px 0 7px; font-weight:600; letter-spacing:.5px; }
  input,select { background:var(--inner); color:var(--txt); border:1px solid var(--line2); border-radius:7px; padding:7px 9px; font-size:13px; outline:none; transition:border-color .15s; }
  input:focus,select:focus { border-color:var(--accent); }
  button { background:var(--accent); color:#fff; border:0; border-radius:7px; padding:7px 13px; cursor:pointer; font-size:13px; transition:filter .15s; }
  button:hover { filter:brightness(1.08); } button.ghost { background:var(--line2); }
  .row { display:flex; align-items:center; gap:8px; margin:7px 0; }
  /* header bar */
  .hdr { display:flex; align-items:center; gap:11px; flex-wrap:wrap; padding:13px 17px; background:var(--card); border:1px solid var(--line); border-radius:12px; margin-bottom:14px; }
  .hdr .code { font-size:21px; font-weight:800; letter-spacing:.5px; }
  .hdr .asof { font-size:11px; color:var(--faint); }
  .fresh { margin-left:auto; display:flex; align-items:center; gap:6px; font-size:10px; color:var(--faint); }
  .dot { width:7px; height:7px; border-radius:50%; display:inline-block; background:var(--up); }
  /* 三层卡 (L1=accent蓝 L2=up绿 L3=warn金, 全现有色) */
  .layer { background:var(--card); border:1px solid var(--line); border-radius:12px; margin-bottom:13px; overflow:hidden; }
  .layer-hd { display:flex; align-items:baseline; gap:9px; padding:10px 15px; border-bottom:1px solid var(--line); }
  .ln { font-size:10px; font-weight:800; color:#0f1115; padding:1px 6px; border-radius:4px; letter-spacing:.5px; }
  .l1 .ln{ background:var(--accent); } .l2 .ln{ background:var(--up); } .l3 .ln{ background:var(--warn); }
  .l1{ border-left:2px solid var(--accent); } .l2{ border-left:2px solid var(--up); } .l3{ border-left:2px solid var(--warn); }
  .lt { font-size:13px; font-weight:600; } .ld { font-size:10px; color:var(--faint); margin-left:auto; }
  .layer-bd { padding:13px 15px; }
  .dim { display:flex; align-items:baseline; gap:9px; margin:7px 0; }
  .dim-k { width:82px; flex-shrink:0; font-size:11px; color:var(--dim); }
  .dim-v { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .src { font-size:10px; color:var(--faint); }
  .tf { display:flex; gap:10px; flex-wrap:wrap; }
  .tfbox { flex:1; min-width:146px; background:var(--inner); border:1px solid var(--line); border-radius:9px; padding:11px; }
  .tflabel { color:var(--faint); font-size:10px; letter-spacing:.5px; } .tfstate { font-size:16px; font-weight:700; margin:4px 0; }
  .badge { display:inline-block; padding:2px 9px; border-radius:11px; font-size:11px; background:var(--line2); color:var(--dim); white-space:nowrap; }
  .aligned { background:rgba(46,158,91,.16); color:var(--up); }
  .conflict { background:rgba(210,75,75,.15); color:var(--down); }
  .info { background:rgba(74,158,255,.14); color:var(--accent); }
  .warnb { background:rgba(224,160,48,.15); color:var(--warn); }
  .slider { display:flex; align-items:center; gap:6px; margin:5px 0; font-size:11px; }
  .slider input[type=range]{ flex:1; accent-color:var(--accent); } .slider .val{ width:56px; text-align:right; color:var(--accent); cursor:pointer; }
  .slider.changed span:first-child { color:var(--accent); font-weight:600; }
  .coupled { color:var(--warn); } .note { color:var(--warn); font-size:11px; margin:3px 0; } .val:hover { text-decoration:underline; }
  .cmp { width:100%; border-collapse:collapse; } .cmp td,.cmp th { padding:6px 9px; border-bottom:1px solid var(--line); text-align:right; font-size:12px; }
  .cmp th { color:var(--faint); font-weight:600; font-size:10px; } .cmp th:first-child,.cmp td:first-child { text-align:left; } .pos { color:var(--up); } .neg { color:var(--down); }
  .stocklist { display:grid; grid-template-columns:repeat(auto-fill,minmax(158px,1fr)); gap:10px; }
  .stockcard { background:var(--inner); border:1px solid var(--line); border-radius:9px; padding:9px; cursor:pointer; transition:border-color .15s; }
  .stockcard:hover { border-color:var(--accent); }
  .muted { color:var(--dim); } .faint { color:var(--faint); } .small { font-size:11px; }
  .ph { color:var(--faint); font-size:12px; font-style:italic; }
  svg text { fill:var(--faint); font-size:9px; }
</style>

<div class="wrap">
  <div class="left">
    <div class="brand">股票档案 <small>三层解读</small></div>
    <div class="row"><input id="code" placeholder="股票代码 如 600800" style="flex:1"><button onclick="loadStock()">查</button></div>

    <h3>形态筛选 (列出符合的股票)</h3>
    <select id="pattern" style="width:100%"></select>
    <div class="row"><button class="ghost" onclick="runScreen()" style="flex:1">列出符合此形态的股票</button></div>

    <h3>调参微调识别 <span class="small muted" id="defver"></span></h3>
    <div id="sliders"></div>
    <div class="row"><button onclick="runCompare()" style="flex:2">对比默认值 (全体分布)</button><button class="ghost" onclick="resetParams()" style="flex:1">恢复默认值</button></div>
    <div class="small muted" id="changed_hint"></div>
    <div id="notes"></div>

    <h3>三层架构</h3>
    <div class="small muted" style="line-height:1.7">
      <span class="ln" style="background:var(--accent)">L1</span> 价格形态 <span class="faint">几何</span><br>
      <span class="ln" style="background:var(--up)">L2</span> 每日盘面 <span class="faint">量价资金筹码</span><br>
      <span class="ln" style="background:var(--warn)">L3</span> 属性背景 <span class="faint">板块/基本面/事件</span>
    </div>
  </div>

  <div class="right">
    <div id="content"><p class="muted">输入股票代码查看档案, 或选形态列出符合的股票。趋势线按形态着色(绿=升/红=跌/灰=横盘)。调参后叠加 before/after 对比。</p></div>
  </div>
</div>

<script>
const API = "/api/dossier";
let TUN = [], CUR_CODE = null, OVR = {}, DEFAULTS = {};

function ovStr(){ return Object.entries(OVR).map(([k,v])=>k+":"+v).join(","); }
function unitOf(t){ return t["单位"]==="百分比"?"%":(t["单位"]==="倍数"?"x":""); }

async function init(){
  const r = await fetch(`${API}/tunables`).then(x=>x.json());
  TUN = r.tunables;
  DEFAULTS = {}; TUN.forEach(t=>DEFAULTS[t.param]=t["当前值"]);   // 探索默认值 (config 当前值)
  document.getElementById("defver").textContent = `默认值 v${r.defaults_version} · 点数值复位单项`;
  const sel = document.getElementById("pattern");
  sel.innerHTML = Object.entries(r.states).map(([s,d])=>`<option value="${s}">${s} — ${d.split('(')[0]}</option>`).join("");
  renderSliders();
}
function renderSliders(){
  const box = document.getElementById("sliders");
  box.innerHTML = TUN.map((t,i)=>{
    const unit = unitOf(t);
    const def = DEFAULTS[t.param];
    const v = (t.param in OVR)?OVR[t.param]:def;
    const changed = (t.param in OVR) && (+OVR[t.param]!==+def);
    const min = (t["单位"]==="百分比")?-20:0, max=(t["单位"]==="百分比")?20:(t["单位"]==="倍数"?3:1);
    const step = (t["单位"]==="比例")?0.01:0.1;
    const cp = t["耦合"].length?` <span class="coupled" title="${t["耦合"].join(',')}">⇄</span>`:"";
    const dlt = changed?` <span class="small muted">(默认 ${(+def).toFixed(2)}${unit})</span>`:"";
    return `<div class="slider${changed?' changed':''}"><span style="width:120px" title="${t["状态"]} · 默认 ${(+def).toFixed(2)}${unit}">${t["状态"]}·${t["指标"]}${cp}</span>
      <input type="range" min="${min}" max="${max}" step="${step}" value="${v}" oninput="onSlide('${t.param}',this.value)">
      <span class="val" id="v_${i}" title="点击复位此项到默认值" onclick="resetOne('${t.param}')">${(+v).toFixed(2)}${unit}${dlt}</span></div>`;
  }).join("");
  const nc = Object.keys(OVR).filter(p=>+OVR[p]!==+DEFAULTS[p]).length;
  document.getElementById("changed_hint").textContent = nc?`已偏离默认 ${nc} 项`:"全部=探索默认值";
}
function onSlide(param,val){
  OVR[param] = +val;
  renderSliders();
  if(CUR_CODE) loadStock(CUR_CODE, true);
}
function resetOne(param){ delete OVR[param]; renderSliders(); if(CUR_CODE) loadStock(CUR_CODE, Object.keys(OVR).length>0); }
function resetParams(){ OVR={}; renderSliders(); document.getElementById("notes").innerHTML=""; if(CUR_CODE) loadStock(CUR_CODE); }

function trendSVG(trend, w=820, h=180, opacity=1, dashed=false){
  if(!trend.length) return "";
  const xs=trend.map((_,i)=>i), ys=trend.map(p=>p.close);
  const minY=Math.min(...ys), maxY=Math.max(...ys);
  const X=i=>40+i/(trend.length-1)*(w-60), Y=v=>h-20-(v-minY)/((maxY-minY)||1)*(h-40);
  let segs="";
  for(let i=1;i<trend.length;i++){
    const c={up:"var(--up)",down:"var(--down)",flat:"var(--flat)"}[trend[i].color]||"var(--flat)";
    segs+=`<line x1="${X(i-1)}" y1="${Y(ys[i-1])}" x2="${X(i)}" y2="${Y(ys[i])}" stroke="${c}" stroke-width="2" opacity="${opacity}" ${dashed?'stroke-dasharray="3 3"':''}/>`;
  }
  const lbl=[0,Math.floor(trend.length/2),trend.length-1].map(i=>`<text x="${X(i)}" y="${h-6}">${trend[i].date}</text>`).join("");
  return segs+lbl;
}

// L2 每日盘面行为 (资金/筹码/明暗盘 + 数据源标注)
function layer2Card(base){
  const cap = base.capital, ch = base.chips, mg = base.mingan;
  if(!cap && !ch && !mg) return "";
  const capRow = cap ? `<div class="dim"><span class="dim-k">主力资金/换手</span><span class="dim-v">
    <span class="badge ${cap.capital_state==='主力净流入'?'aligned':cap.capital_state==='主力净流出'?'conflict':''}">${cap.capital_state}</span>
    <span class="badge">${cap.turnover_state}</span>
    <span class="src">20日净额 ${cap['主力净额20日累计']?Math.round(cap['主力净额20日累计']):'—'}万 · 换手 ${cap['换手率']!=null?cap['换手率'].toFixed(2)+'%':'—'}</span></span></div>` : "";
  const mgRow = mg ? `<div class="dim"><span class="dim-k">主力大单净</span><span class="dim-v">
    <span class="badge ${mg['主力净额']>0?'aligned':mg['主力净额']<0?'conflict':''}">${mg['主力净额']>0?'净流入':mg['主力净额']<0?'净流出':'中性'} ${mg['主力净额']}亿</span>
    <span class="badge">占比 ${mg['净额占比']}%</span>
    <span class="src">涨跌 ${mg['涨跌']>0?'+':''}${mg['涨跌']}%</span></span></div>` : "";
  const divColor = s => /承接/.test(s||'')?'aligned':/派发/.test(s||'')?'conflict':'';
  const intentColor = s => /吸筹|看多|低吸|推升/.test(s||'')?'aligned':/做空|派发|阴跌/.test(s||'')?'conflict':'';
  const intentRow = mg && mg['主力意图'] ? `<div class="dim"><span class="dim-k">主力意图</span><span class="dim-v">
    <span class="badge ${intentColor(mg['主力意图'])}">${mg['主力意图']}</span>
    <span class="badge ${divColor(mg['量价背离'])}">${mg['量价背离']||''}</span>
    <span class="src">${mg['意图解读']||''}</span></span></div>` : "";
  const chRow = ch ? `<div class="dim"><span class="dim-k">筹码</span><span class="dim-v">
    <span class="badge ${(ch.chip_state||'').includes('派发')?'conflict':(ch.chip_state||'').includes('惜售')?'aligned':''}">${ch.chip_state}</span>
    <span class="badge">${ch['集中状态']||''}</span>
    <span class="badge ${ch['价位状态']==='获利'?'aligned':'conflict'}">${ch['价位状态']||''}</span>
    <span class="src">获利盘 ${ch['获利盘']!=null?ch['获利盘'].toFixed(0)+'%':'—'}${ch['获利盘20日变化']!=null?'('+(ch['获利盘20日变化']>0?'+':'')+ch['获利盘20日变化'].toFixed(0)+')':''}</span></span></div>` : "";
  return `<div class="layer l2"><div class="layer-hd"><span class="ln">L2</span><span class="lt">每日盘面行为</span>
      <span class="ld">确认形态真伪 · 东财 moneyflow_dc / tushare cyq_perf · 盘后日更 t-1</span></div>
    <div class="layer-bd">${capRow}${mgRow}${intentRow}${chRow}</div></div>`;
}

// L3 属性背景 (待 sector_context 接入, 先占位列出已定稿维度)
function layer3Card(base){
  const sec = base.sector;   // 待接入
  if(sec){
    // 真实数据 (sector_context 接入后)
    return `<div class="layer l3"><div class="layer-hd"><span class="ln">L3</span><span class="lt">属性背景</span>
        <span class="ld">为什么涨+可持续 · 申万 sw_daily / 东财 dc_member</span></div>
      <div class="layer-bd"><div class="dim"><span class="dim-k">板块/概念</span><span class="dim-v">${sec.summary||''}</span></div></div></div>`;
  }
  return `<div class="layer l3"><div class="layer-hd"><span class="ln">L3</span><span class="lt">属性背景</span>
      <span class="ld">为什么涨+可持续 · 慢变会调整属性 · 锚 ann_date</span></div>
    <div class="layer-bd"><div class="ph">板块/概念/行业 · 基本面 · 估值 · 分析师预期 · 事件催化(龙虎榜/解禁/十大流通股东) · 市场regime门 — sector_context 模块蓝图已就绪, 数据已补齐(sw_daily/dc_member), 待落地接入</div></div></div>`;
}

async function loadStock(code, overlay){
  code = code || document.getElementById("code").value.trim();
  if(!code) return;
  CUR_CODE = code; document.getElementById("code").value=code;
  const base = await fetch(`${API}/stock/${code}`).then(x=>x.json());
  if(base.error){ document.getElementById("content").innerHTML=`<p class="conflict">${base.error}</p>`; return; }
  let afterTrend=null, notes=[];
  if(overlay && Object.keys(OVR).length){
    const aft = await fetch(`${API}/stock/${code}?ov=${encodeURIComponent(ovStr())}`).then(x=>x.json());
    afterTrend = aft.trend; notes = aft.coupling_notes||[];
  }
  document.getElementById("notes").innerHTML = notes.map(n=>`<div class="note">⇄ ${n}</div>`).join("");
  const tf = base.timeframes;
  const alignBadge = base.mtf_aligned ? `<span class="badge aligned">日周月一致 ✓</span>` : `<span class="badge conflict">多框矛盾 (诚实并列)</span>`;
  const overlaySVG = afterTrend ? `<svg viewBox="0 0 820 180" width="100%">${trendSVG(base.trend,820,180,0.35)}${trendSVG(afterTrend,820,180,1,true)}</svg>
     <div class="small muted">实线浅=默认值, 虚线亮=调整后 (此股趋势线着色随参数变化)</div>` : `<svg viewBox="0 0 820 180" width="100%">${trendSVG(base.trend)}</svg>`;
  const ptrend = base.prior_trend ? `<span class="badge ${base.prior_trend==='升'?'aligned':base.prior_trend==='跌'?'conflict':''}">前序趋势: ${base.prior_trend}</span>` : "";
  const candle = base.today_candle ? `<span class="badge info">当日K线: ${base.today_candle}</span>` : "";
  const rs = base.rs ? `<span class="badge ${base.rs.rs_state==='强于大盘'?'aligned':base.rs.rs_state==='弱于大盘'?'conflict':''}">RS: ${base.rs.rs_state}</span>` : "";
  const pats = (base.recent_patterns||[]);
  const seen = {}; const upats = pats.filter(p=>{ const k=p.名称; if(seen[k])return false; seen[k]=1; return true; });
  const patRows = upats.length ? `<div class="dim"><span class="dim-k">命名形态</span><span class="dim-v">${upats.map(p=>`<span class="badge aligned">${p.名称}</span><span class="src">${p.date}·${p.provenance}</span>`).join(" ")}</span></div>` : "";
  document.getElementById("content").innerHTML = `
    <div class="hdr">
      <span class="code">${code}</span>
      <span class="asof">as_of ${base.as_of} · 熵 ${(base.entropy||0).toFixed(2)}</span>
      ${alignBadge} ${ptrend} ${rs} ${candle}
      <span class="fresh"><span class="dot"></span>数据 ${base.as_of} · 形态+量价+资金全口径</span>
    </div>
    <div class="layer l1"><div class="layer-hd"><span class="ln">L1</span><span class="lt">价格形态</span>
        <span class="ld">骨架 · 价格走出什么几何 · K线 tushare 前复权(日/周/月)</span></div>
      <div class="layer-bd">
        <div class="tf">${["daily","weekly","monthly"].map(k=>`
          <div class="tfbox"><div class="tflabel">${({daily:"日线",weekly:"周线",monthly:"月线"})[k]}</div>
            <div class="tfstate">${tf[k].state||"过渡态"}</div>
            <div class="small muted">${tf[k].desc}</div>${tf[k].sub?`<div class="small">子态: ${tf[k].sub}</div>`:""}</div>`).join("")}</div>
        ${patRows}
      </div></div>
    ${layer2Card(base)}
    ${layer3Card(base)}
    <div class="layer"><div class="layer-hd"><span class="lt">趋势线</span><span class="ld">按形态着色 · 非K线</span></div>
      <div class="layer-bd">${overlaySVG}</div></div>`;
}

async function runScreen(){
  const p = document.getElementById("pattern").value;
  document.getElementById("content").innerHTML = `<p class="muted">扫描中 (${p})...</p>`;
  const ov = Object.keys(OVR).length?`&ov=${encodeURIComponent(ovStr())}`:"";
  const r = await fetch(`${API}/screen?pattern=${encodeURIComponent(p)}&limit=40&scan=300${ov}`).then(x=>x.json());
  document.getElementById("content").innerHTML = `
    <div class="hdr"><span class="code" style="font-size:17px">${p}</span> <span class="asof">${r.desc}</span>
      <span class="fresh">扫 ${r.scanned} 股 · 命中 ${r.count}</span></div>
    ${r.coupling_notes&&r.coupling_notes.length?`<div class="small muted" style="margin:-6px 0 10px">调参: ${r.coupling_notes.join("; ")}</div>`:""}
    <div class="stocklist">${r.stocks.map(s=>`
      <div class="stockcard" onclick="loadStock('${s.code}')">
        <b>${s.code}</b> ${s.mtf_aligned?'<span class="badge aligned">一致</span>':''}
        <div class="small muted">${s.sub||''}</div>
        <svg viewBox="0 0 160 50" width="100%">${trendSVG(s.trend,160,50)}</svg></div>`).join("")}</div>`;
}
async function runCompare(){
  if(!Object.keys(OVR).length){ document.getElementById('content').innerHTML='<p class="muted">先调一个参数, 再看它对全体股票分布的影响 (默认 vs 调整后)。</p>'; return; }
  document.getElementById('content').innerHTML='<p class="muted">扫描全体股票, 对比默认 vs 调整后分布...</p>';
  const r = await fetch(`${API}/compare?ov=${encodeURIComponent(ovStr())}&scan=200`).then(x=>x.json());
  if(r.error){ document.getElementById('content').innerHTML=`<p class="conflict">${r.error}</p>`; return; }
  const rows = r.by_pattern.map(p=>{
    const d=p.delta, cls=d>0?'pos':(d<0?'neg':'muted'), sign=d>0?'+':'';
    return `<tr><td>${p.state}</td><td>${p.default}</td><td>${p.modified}</td><td class="${cls}">${sign}${d}</td></tr>`;
  }).join("");
  document.getElementById('content').innerHTML = `
    <div class="hdr"><span class="code" style="font-size:17px">默认值 vs 调整后</span><span class="asof">全体分布对比</span>
      <span class="fresh">扫 ${r.scanned} 股 · ${r.flip_count} 只翻转</span></div>
    <div class="layer"><div class="layer-bd">
      <div class="small muted">调参: ${(r.coupling_notes||[]).join('; ')||'—'}</div>
      <div class="small warnb" style="display:inline-block;padding:4px 8px;border-radius:6px;margin:8px 0">盲点提醒: 单股看不出调参的全体影响 — 若某形态 Δ 暴涨, 可能是阈值放太松涌入了不该归此类的股。</div>
      <table class="cmp"><tr><th>形态</th><th>默认</th><th>调整后</th><th>Δ</th></tr>${rows}</table></div></div>
    ${r.flip_count?`<div class="layer"><div class="layer-hd"><span class="lt">翻转的股票</span><span class="ld">前20 · 点击看档案</span></div>
      <div class="layer-bd">${r.flips.slice(0,20).map(f=>`<span class="stockcard" style="display:inline-block;margin:3px;padding:4px 8px" onclick="loadStock('${f.code}')">${f.code} <span class="small muted">${f.from||'过渡'}→${f.to||'过渡'}</span></span>`).join("")}</div></div>`:''}`;
}
init();
</script>
