version: 1

defaults:
  python: python
  backend_dir: backend
  num_threads: 4
  cost_bps: 10
  train_days: 60
  valid_days: 20
  test_days: 20
  step_days: 20
  max_folds: 6
  topk_size_choices: 50,100,150
  max_topk_drawdown: 0.20
  max_feature_drift_psi: 0.25

ranker_policy:
  enabled: true
  large_trial_threshold: 0
  require_prior_profile: true
  max_runtime_ratio_vs_regression: 2.0
  passing_status: pass
  gate_failure_tokens:
    - drift
    - drawdown
    - walkforward
    - stability
    - psi

research_schedule:
  - task_id: feature_assoc_2025_registry_fold
    task_type: feature_association
    priority: 10
    enabled: true
    evidence:
      table: mart_feature_association_stat
      key_column: run_id
      run_id: feature_assoc_2025_registry_fold_20260505
    command:
      script: build_feature_association_duck.py
      args:
        --run-id: feature_assoc_2025_registry_fold_20260505
        --start-date: "2025-01-01"
        --end-date: "2025-12-31"
        --min-daily-count: 100
        --corr-threshold: 0.95
        --folds: 4
    resources:
      feature_table: fact_feature_panel
      label_name: forward_ret_20d

  - task_id: feature_space_2025_registry
    task_type: feature_search_space
    priority: 20
    enabled: true
    depends_on:
      - feature_assoc_2025_registry_fold
    evidence:
      table: mart_feature_search_space_summary
      key_column: run_id
      run_id: feature_space_2025_registry_20260505
    command:
      script: build_feature_search_space.py
      args:
        --association-run-id: feature_assoc_2025_registry_cluster_20260505
        --run-id: feature_space_2025_registry_20260505
        --min-abs-rank-ic: 0.02
        --min-coverage-pct: 60
        --min-fold-count: 20
        --min-sign-stability: 0.55
        --max-features: 30
    resources:
      output_table: mart_feature_search_space_summary

  - task_id: optuna_feature_space_covgate_stable
    task_type: feature_space_optuna
    priority: 30
    enabled: true
    depends_on:
      - feature_space_2025_registry
    evidence:
      table: mart_model_selection_run
      key_column: run_id
      run_id: optuna_feature_space_covgate_stable_20260506
    command:
      script: run_optuna_feature_space.py
      args:
        --run-id: optuna_feature_space_covgate_stable_20260506
        --study-name: optuna_feature_space_covgate_stable_20260506
        --search-space-run-id: feature_space_2025_registry_20260505
        --trials: 80
        --min-coverage-pct: 80
        --max-features: 30
    resources:
      feature_table: fact_feature_panel
      label_name: forward_ret_20d

  - task_id: model_stability_covgate_lgbm_ranker_baseline
    task_type: model_stability
    priority: 40
    enabled: true
    depends_on:
      - optuna_feature_space_covgate_stable
    evidence:
      table: mart_model_stability_search_summary
      key_column: run_id
      run_id: model_stability_covgate_stable_lgbm_ranker_20260506
    command:
      script: run_optuna_model_stability_search.py
      args:
        --model-selection-run-id: optuna_feature_space_covgate_stable_20260506
        --run-id: model_stability_covgate_stable_lgbm_ranker_20260506
        --study-name: model_stability_covgate_stable_lgbm_ranker_20260506
        --model-family: lightgbm_ranker
        --trials: 0
        --no-resume: true
        --start: "2025-01-01"
        --end: "2025-12-31"
        --feature-table: fact_feature_panel
        --num-round: 80
        --num-threads: 4
        --train-days: 60
