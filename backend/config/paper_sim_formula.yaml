# BestChoice 公式策略 Paper Sim 配置
# 与主项目 paper_sim_config.yaml 一致的设计思路, 独立参数

portfolio:
  max_positions: 5
  score_threshold: 0.30
  replace_ratio: 1.3
  equal_weight: true

exit:
  stop_loss_pct: 0.05
  trailing_stop_pct: 0.10
  ma_exit_period: 20

ranker:
  resonance_window: 1
  w_resonance: 0.40
  w_quality: 0.30
  w_vol_price: 0.30
  min_resonance: 1

profiler:
  ma_short: 20
  ma_long: 60
  ma_trend: 120
  vol_lookback: 20

backtest:
  start_date: "2023-01-01"  # from yaml: backtest.start_date
  tx_cost_bps: null          # null = auto from paper_sim_config.yaml
  walk_forward_mode: "expanding_monthly"
