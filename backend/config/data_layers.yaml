  cleaned_stale_declarations_2026_06_23: 50 张 2026-06-14 reset wiped 表声明从 tables 段清除 (P2 单一真相源=只列活表; conformance审计抓 stale_tag drift)。
    含 perception层(mart_market_perception_*)/公式工厂(mart_tdx_gpcw_auto_*/feature_candidate)/模型层(mart_model_*/strategy_result)/缓存(_cache_*)等。
    重建时各自重新声明 layer (declare-on-build)。同步修 data_layer_audit STALE_SCAN_DBS 扩 market/etf 消除 price_kline_qfq_tushare/mart_etf_snapshot 假阳 stale。
