version: 1
_doc: '数据层级注册表 (2026-06-14 地基-reset 后立). 单一真相源: 每表声明 layer, 替代 ad-hoc 反复推导. 新表必须在此声明 layer (data_layer_audit + moth 断言强制).
  层级语义见 docs/data_management_framework.md。'
layers:
  L0_source:
    desc: 原始 vendor 镜像, 不可重建真相源, 永不删 (re-sync 重建)
    retention: permanent
    rebuild: sync_runner re-sync
  L1_foundation:
    desc: 从 L0 直接派生的 PIT 事实+维度 (日历/十大股东/财报PIT/机构/龙虎榜)
    retention: keep
    rebuild: from L0
  L1k_kline_intermediate:
    desc: 仅 OHLCV K线派生 (technical_stage/macd), 无多因子
    retention: keep
    rebuild: from v_price_kline_qfq
  display:
    desc: '档案展示 (serving L0/L1 给UI: picture/holders/profile)'
    retention: keep
    rebuild: from L1
  infra:
    desc: 治理运行时 (watermark/schema/audit/deletion_record/data_health)
    retention: keep
    rebuild: runtime
  L2_feature:
    desc: 多因子特征工程 (panels/risk_factors/triggers)
    retention: wipeable
    rebuild: from L1, 参数寻优重做
    status: wiped_20260614
  L3_model:
    desc: 模型产出 (scores/predictions/champion/ensemble)
    retention: wipeable
    rebuild: from L2+params
    status: wiped_20260614
  L4_experiment:
    desc: 寻优/消融/探索 (optuna/ablation), 只留摘要不留全表
    retention: summary_only
    rebuild: rerun; 知识在 config/experiments/retired_experiments.yaml
    status: wiped_20260614
