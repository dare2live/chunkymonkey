version: 1
_doc: 'Legacy physical-layer registry (NONCONFORMING target architecture). 现有审计、健康度和血缘仍消费它，故 Phase0 保留；L2/L3/L4 等 wiped 词汇仅为兼容旧门，不代表目标业务 Tier。Phase1 迁入模块 contract/data contract 后删除兼容项。目标业务 Tier/传输轴语义只见 docs/MASTER_TOPLEVEL_DESIGN.md。'
# asset_class (2026-06-28 加工分两种, 用户决议): A/B 映射到 layer (不另起 per-table 字段, 奥卡姆)。
#   客观划线 = "确定性 PIT 重排 vs 含前瞻/策略假设" (非主观"展示vs策略"):
#   - raw : L0 vendor 镜像 (不加工)
#   - A   : 确定性 PIT 重排 (只用<=t信息/无前瞻label/无策略阈值/给定raw结果唯一) → 数据平台常驻, SERVE 直吐
#   - B   : 策略派生 (含 forward/label/score/signal/IC/predicted) → edge 层隔离+验证门, 读平台经 SERVE
#   - infra: 治理运行时
#   执法: data_layer_audit type-A 列纯度门 — Type A 层(L1_foundation/L1k/display)表禁现
#         forward/label/score/signal/ic/predicted 等列 (防 Type B 伪装成 Type A 混入平台)。
layers:
  # 2026-06-23 config最小手术 Step1 (对抗panel wry13dfr0): 层词汇单一真相源。
  # 消 data_access(短码 L0/L1/L1k) vs 本文件(长码 L0_source/...) 两套词汇无对账 (已核证重复#1)。
  # 本文件=层词汇唯一定义处; alias=短码引用名; data_access 引 alias 或长键=合法 (check_config_refs Step4 守)。
  L0_source:
    alias: L0
    asset_class: raw
    desc: 原始 vendor 镜像, 不可重建真相源, 永不删 (re-sync 重建)
    retention: permanent
    rebuild: sync_runner re-sync
  L1_foundation:
    alias: L1
    asset_class: A
    desc: 从 L0 直接派生的 PIT 事实+维度 (日历/十大股东/财报PIT/机构/龙虎榜)
    retention: keep
    rebuild: from L0
  L1k_kline_intermediate:
    alias: L1k
    asset_class: A
    desc: 仅 OHLCV K线派生 (technical_stage/macd), 无多因子
    retention: keep
    rebuild: from v_price_kline_qfq
  display:
    asset_class: A
    desc: '档案展示聚合 (Type A 确定性 PIT 重排给 UI/serving; 禁含前瞻/打分/信号)'
    retention: keep
    rebuild: from L1
  infra:
    asset_class: infra
    desc: 治理运行时 (watermark/schema/audit/deletion_record/data_health)
    retention: keep
    rebuild: runtime
  L2_feature:
    alias: L2
    asset_class: B
    desc: 多因子特征工程 (panels/risk_factors/triggers)
    retention: wipeable
    rebuild: from L1, 参数寻优重做
    status: wiped_20260628  # 2026-06-28 纯数据平台重建: L2 特征层清空 (U1 物删 panel); edge 层从零重建时复活
  L3_model:
    alias: L3
    asset_class: B
    desc: 模型产出 (scores/predictions/champion/ensemble)
    retention: wipeable
    rebuild: from L2+params
    status: wiped_20260614
  L4_experiment:
    alias: L4
    asset_class: B
    desc: 寻优/消融/探索 (optuna/ablation), 只留摘要不留全表
    retention: summary_only
    rebuild: rerun; 知识在 config/experiments/retired_experiments.yaml
    status: wiped_20260614

# 每层健康默认 (2026-06-28 F4 dim_data_asset 退役: data_health 的 per-table freshness/sla 来源搬来此层级。
#   raw 表更精确的 per-domain freshness 走 sync_registry.freshness_sla_trading_days 覆盖本默认; 退役态走
#   mart_data_deprecation_record。dim_data_asset 烂登记表退役, 职责归并: layer/asset_class→本文件,
#   freshness→本默认+sync_registry, producer/consumer→lineage, 退役态→mart_data_deprecation_record。)
layer_health_defaults:
  L0_source:              {expected_freshness: 't+1',       sla_hours: 48}
  # L1_foundation 在纯平台 = 缓变 dim + 季频 holder/inst fact (非日更; 日更在 L1k price_kline + L0 raw),
  #   故默认 on-demand 宽松; 季频 fact 用 table_health_overrides 给 quarterly 监控。
  L1_foundation:          {expected_freshness: 'on-demand', sla_hours: 720}
  L1k_kline_intermediate: {expected_freshness: 't+1',       sla_hours: 48}
  display:                {expected_freshness: 'on-demand', sla_hours: 720}
  infra:                  {expected_freshness: 'on-demand', sla_hours: 720}
  L2_feature:             {expected_freshness: 'on-demand', sla_hours: 720}
  L3_model:               {expected_freshness: 'on-demand', sla_hours: 720}
  L4_experiment:          {expected_freshness: 'on-demand', sla_hours: 720}

# per-table 健康覆盖 (2026-06-28 F4: 从退役的 dim_data_asset 搬来; 仅 layer 默认不对的少数表 —
#   aif10 季频/周频 raw 不在 sync_registry 无法 derive freshness, 故显式覆盖。无日期列的静态 dim 由
#   data_health "无日期列=静态" 通用判定处理, 不需在此列。)
# 2026-07-07 冒烟测试实测更正 (第一轮): 原 sla_hours=2280(95天) 对季报数据结构性过紧 —
#   org_holding_aif10.disclosure_deadline() 已声明的法定披露截止 (Q1→04-30/Q2→08-31/Q3→10-31/
#   年报→次年04-30) 换算最长跨季间隔 = Q3(09-30)→年报截止(次年04-30) = 212 天, 意味着 SLA=95天
#   在一年中大部分时间必然黄(数学上不可能满足, 非真滞后)。改 sla_hours=5280(220天) 消除结构性
#   误报, 当时对 4 张表一刀切统一改, 未逐表核实真实节奏(见下第二轮更正)。
# 2026-07-07 第二轮更正 (用户追问"同行估值排名是什么, 查一下tushare字段" 引出的连锁核查):
#   ①raw_aif10_peer_valuation(同行估值排名)逐季显式 REPORT_DATE 过滤探测 2024/2025 全部 3/6/9
#   月季末均返回 0 行, 仅 12-31 年末有数据(2024-12-31=16行/2025-12-31=5611行) —— 该报告实为
#   **年度**快照非季度, 第一轮"quarterly"标注是错的; 且唯一消费方 v3_picture 已随 2026-06-28
#   纯数据平台重建整体退役, 该表已成孤儿 —— 用户拍板 2026-07-07 整表物删 (见
#   analysis/project_state_ledger.md 的数据源退役索引), 本行随之移除。
#   ②fact_top10_holder_period 实测 notice_date 近乎逐日更新(20260701/02/03连续), 是"含季中
#   ad-hoc"的高频披露流(2026-07-07 live DB 审计, 历史索引见 analysis/project_state_ledger.md), 第一轮误把它和另外 2 张真季度表一起套用220天——
#   这会让"停更100天"这种真事故被220天SLA掩盖住, 是本轮修复本身引入的新缺口, 改回 168h(7天,
#   覆盖节假日缓冲) 匹配其真实近日频节奏。③raw_org_holding_aif10/raw_qfii_holding_quarterly
#   经历史 report_date 分布核实(2025-12-31→2026-03-31 整季度跳变且行数量级一致)确认真季度,
#   维持 5280h(220天) 不变。
table_health_overrides:
  raw_qfii_holding_quarterly: {expected_freshness: quarterly, sla_hours: 5280}
  raw_org_holding_aif10:      {expected_freshness: quarterly, sla_hours: 5280}  # F10 机构持仓明细=季报驱动
  # holder/inst 高频 ad-hoc 披露流 (近乎逐日, 非季度; L1_foundation 默认 on-demand 太松故显式覆盖)
  fact_top10_holder_period:        {expected_freshness: daily, sla_hours: 168}
tables:
  # raw_aif10_valuation_quantile 2026-07-07 随 aif10_capability_client 模块整体退役物删
  # (唯一消费方 v3_picture 已随 2026-06-28 重建退役, 且早在其存活期就因 latest-snapshot
  # leakage 从未被特征管线接入), 历史索引见 analysis/project_state_ledger.md
  raw_org_holding_aif10: L0_source  # 2026-06-24 补tag (aif10机构持仓明细raw镜像, 前会话漏登致data-layer-integrity FAIL)
  raw_qfii_holding_quarterly: L0_source
  dim_active_a_stock: L1_foundation
  # dim_all_ever_listed / dim_listing_status 2026-07-07 整表退役:
  # 前者无存活 writer 冻结 10+ 周, 后者 0 业务读者且唯一 builder 无生产调用方;
  # 历史裁决索引见 analysis/project_state_ledger.md。
  dim_fee_schedule: L1_foundation
  dim_liquidity_threshold: L1_foundation
  dim_market_segment: L1_foundation
  dim_stock_dc_industry: L1_foundation     # DC namespace legacy 当前快照；不得用 SW PIT 补成同一 taxonomy
  dim_stock_dc_concept: L1_foundation      # 2026-06-23 东财概念成员当前快照 (serving)
  dim_style_factor: L1_foundation          # 2026-07-06 primitives 第9项风格因子dim补建时漏登记 (6姊妹表已登记), doctor 复查补齐; writer=services/primitives/ddl.py
  dim_trading_calendar: L1_foundation
  dim_trading_rule: L1_foundation
  dim_trading_session: L1_foundation
  fact_top10_holder_period: L1_foundation
  # E0 holders_top10 formal land→accept (smartmoney; 2026-07-19 canary notice_date=20260717)
  landing_miaoxiang_holders_top10: L0_source
  canonical_top10_float_holders_period: L1_foundation
  # E0 org_holding formal land→accept (smartmoney; canary available_date=20190430)
  landing_miaoxiang_org_holding: L0_source
  canonical_org_holding_detail_period: L1_foundation
  accepted_partition: infra                 # formal accept pointer (shared control table)
  ingest_batch: infra                       # landing batch evidence
  dim_stock_segment_daily: L1_foundation   # 2026-07-02 B1 股票分层 (市值/换手当日分位段+PIT行业, services/segments.py, 策略cell单一计算点)
  mart_sector_pulse_daily: display          # 2026-07-02 B4 市场感知 板块×日 两链并列 (services/market_pulse.py, Type A; dc资金流/quiet streak + sw RS/广度/涨跌停)
  mart_market_pulse_daily: display          # 2026-07-02 B4 市场感知 全市场×日 (大盘水位/涨跌停总量/炸板率/top板块快照)
  fact_stock_form_daily: L1k_kline_intermediate     # 2026-07-02 B2 形态识别 (services/technical_states, 5正交轴+cell标签+突破事件+可成交flags; Type A 描述层无方向claim)
  fact_stock_limit_daily: L1_foundation  # 2026-07-21 brick B2: stock-day limit publication (U/D/Z); writer=stock_limit_publish; serve/pulse leaf; raw_tushare_limit_list_d=rebuild input
  fact_stock_moneyflow_daily: L1_foundation  # 2026-07-21 brick B2: stock-day tushare moneyflow; writer=stock_moneyflow_publish; serve/pulse leaf; raw_tushare_moneyflow=rebuild input
  fact_stock_moneyflow_dc_daily: L1_foundation  # 2026-07-21 brick B2: stock-day eastmoney moneyflow; writer=stock_moneyflow_publish; serve/pulse leaf; raw_tushare_moneyflow_dc=rebuild input; not DC membership PIT
  price_kline_qfq_tushare: L1k_kline_intermediate   # 2026-06-15 tushare 前复权 K线 (回测主源, §4.3; build_price_kline_qfq_tushare.py 从 raw_tushare_daily×adj_factor 建 2019+)
  # ── edge 层第一批 (2026-07-02 机构画像引擎 promote, 探索弧 inst_follow E1/E2; feature_store 库) ──
  period_windows: L2_feature               # 披露窗口三方案价 (institution_profile.build_period_windows)
  fact_inst_episode: L2_feature            # 机构×股票 episode (成本/收益/alpha/PIT行业/被动标记)
  mart_inst_profile: L2_feature            # 机构总画像 (median_alpha/win_rate/low_sample 护栏)
  mart_inst_profile_dim: L2_feature        # 机构×维度画像 (industry_pit/year/holder_type)
  # ── D1 主升浪 GT v2 (2026-07-02 services/rally_gt.py; Type B 含前瞻 label/outcome, edge 隔离 feature_store 库;
  #    设计 P3: smartmoney 只放 Type A, GT 研究半永不 serving; 列契约 rally_gt_columns.yaml + gt_label_contract 执法) ──
  fact_rally_ground_truth: L2_feature      # 正样本 episode；train data_end 必须严格早于 holdout_start
  fact_rally_negative: L2_feature          # hard-negative (同 pivot/长底 setup + fwd 完整 + 未涨; purge ±maxfwd)
  fact_rally_strata: L2_feature            # episode PIT 分层 (申万 as-of + 长底桶; B1/B2 列待锁释放回填)
  stock_watchlist: display
  paper_position: display        # Legacy NONCONFORMING 手工观察条目；非订单/成交/StrategyRelease
  paper_nav_daily: display       # Legacy qfq-close 观察估值；非 Tier4 paper execution NAV
  app_settings: infra
  dim_price_limit_rules: infra
  dim_schema_version: infra
  excluded_stocks: infra
  exclusion_categories: infra
  mart_data_deletion_record: infra
  mart_data_deprecation_record: infra
  mart_data_health: infra
  mart_data_source_failure_queue: infra
  mart_data_source_watermark: infra
  mart_lineage: infra  # 2026-06-27 补声明: schema_marts 定义但未声明致 filter_schema_sql 丢弃CREATE→表不建→mart_data_lineage视图invalid+db_compact卡 (原消费方 check_panel_lineage/check_registry_promote 已随孤儿 data_quality.py 系统 2026-07-06 整体退役)
  mart_pipeline_lock: infra
  mart_pipeline_run_manifest: infra
  mart_step_fingerprint: infra
  step_status: infra
  sys_schema_version: infra
_notes:
  policy: 只列活表 (declare-on-build, 重建时重新声明); 退役历史查 mart_data_deprecation_record + ledger + git史。
    2026-06-14 reset / 06-23 清 stale 声明 / 06-28~07-02 数据纯化批0-7 的逐表记录均在上述三处, 本文件不留墓碑。
