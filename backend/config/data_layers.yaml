  recreated_empty_2026_06_14: 58 张 L2/L3/L4 表被 app 启动 schema-init(schema_core/schema_marts) 空重建; 数据已删, schema 定义待从 kept schema
    文件移除否则反复重建 (代码清理遗留)。
