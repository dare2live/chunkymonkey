# tier12_publish.yaml — Phase C Tier1/2 publish writer typed policy
#
# Owner: docs/MASTER_TOPLEVEL_DESIGN.md §7–8 + docs/strategy_validation_contract.md §4
# Scope: lineage-bearing StockStateDaily / MarketContextPublishEnvelope emission
#        with PIT truncation (available_at <= decision_date).
# Hard gates:
#   - writer allow_published stays false (writer never publishes)
#   - accept path sets published=true only after WRITTEN_UNPUBLISHED +
#     PUBLISHABLE_SCAFFOLD gates; smoke summaries cannot be upgraded
#   - consumer_cutover.cutover_allowed is owner-opt-in (never flipped by
#     persist); research/UI must not silent-read accepted_*.json
#   - form enrich = exact-day fact_stock_form_daily join (frontier fail-closed;
#     no as-of pad; never overlays form axis_trend onto writer axis_trend)
#   - missing lineage / missing available_at / PIT poison fail closed
#   - not StrategyRelease; not B-pit mart cutover; not Optuna

meta:
  version: 1
  phase: C
  notes: "writer=WRITTEN_UNPUBLISHED+form_enrich_v1; accept=ACCEPTED published=true; consumer_cutover=owner_opt_in"

stock_state:
  definition_version: stock_state_stage_pattern_v1
  eligible_universe_id: traded_on_observation_date:v1
  axes: [trend, pos]
  # Writer axis_trend from PIT-truncated nominal closes; form_name/axis_pos/
  # is_breakout_event from exact-day fact_stock_form_daily join (no as-of pad;
  # form axis_trend is never overlaid onto writer axis_trend).
  trend_lookback_bars: 5
  form_source: fact_stock_form_daily
  availability_policy:
    axis: available_at
    rule: calendar_date_le_decision_date
    at: eod

market_context:
  definition_version: market_sensing_project_breadth_v0
  eligible_universe_id: project_board_prefixes:v1
  method: board_filtered_nominal_breadth
  min_adv_dec_ratio: 1.0
  board_prefixes: ["60", "00", "30", "68"]
  availability_policy:
    axis: available_at
    rule: calendar_date_le_decision_date
    at: eod

publish:
  # Scaffold/writer hard gate — flipping this must NOT publish.
  allow_published: false
  # Accept path hard gate — flipping this must NOT cut over consumers.
  allow_consumer_cutover: false
  artifact_dir: data/lineage/tier12_publish_batches

# Explicit consumer cutover gate (tier12_consumer_cutover.resolve_*).
# OWNER OPT-IN 2026-07-20: cutover_allowed=true. Consumers read the accepted
# full-universe partition (project_universe scope, 4989 rows, non-canary) as
# Tier1/2 production truth for days with a matching accepted partition; days
# without one still fail closed to legacy/scaffold via the resolver.
# Enabling requires accepted publish for the day, matching
# definition_version+config_hash, and (non-canary accept OR
# acknowledge_canary_scope which forbids project-universe).
consumer_cutover:
  cutover_allowed: true
  expected_definition_version: stock_state_stage_pattern_v1
  # Live full-universe accept stock config_hash after form enrich v1
  # (form_source=fact_stock_form_daily). Must match publish typed policy hash.
  expected_config_hash: "184d82ed71a15d61768ce001250b8de86efa1aa0e5ae742bfdf5619d5c24fdd4"
  acknowledge_canary_scope: false
  # Live accept is genuine full project-universe (universe_membership_size ==
  # stock_row_count == 4989); consumers may claim project-universe scope.
  claim_project_universe: true
  artifact_dir: data/lineage/tier12_publish_batches
