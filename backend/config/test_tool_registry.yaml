      - backend/scripts/audit_test_tool_health.py
      - backend/tests/scripts/test_audit_test_tool_health.py
      - backend/config/test_tool_registry.yaml
      - docs/engineering_governance.md
    owner_module: test_governance
    scope: contract
    runner: PYTHONPATH=backend python -m pytest -q backend/tests/scripts/test_audit_test_tool_health.py
    status: active
    evidence_level: trusted_current
    truth_source: pytest.ini, test_tool_registry.yaml, filesystem inventory, audit-fixture tokens
    risk_reason: bootstraps the pre-test validity gate and controller feedback loop; may contain retired-token audit-fixture strings
    replacement: unknown
    last_verified: "2026-05-27"

  - id: moth_snapshot_service_tests
    paths:
      - backend/services/moth_snapshot.py
      - backend/services/worktree_status.py
      - backend/tests/services/test_moth_snapshot.py
      - backend/tests/services/test_worktree_status.py
