    evidence_level: trusted_with_scope
    truth_source: filesystem, launchd plist ProgramArguments, cron/static automation files, active test registry paths, and Moth evidence paths
    risk_reason: deleted or retired scripts must not remain reachable through launchd, cron, installers, dashboards, registry paths, or Moth evidence references
    replacement: keep as a generic execution-surface gate; extend to provider adapters when Modal integration lands
    last_verified: "2026-06-05"

  - id: chunkyctl_contract_tests
    paths:
      - backend/scripts/chunkyctl.py
      - backend/tests/scripts/test_chunkyctl.py
