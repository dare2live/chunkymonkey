    paths:
      - scripts/safe_commit.sh
      - backend/tests/scripts/test_safe_commit.py
    owner_module: governance
    scope: contract
    runner: PYTHONPATH=backend python -m pytest -q backend/tests/scripts/test_safe_commit.py
    status: active
    evidence_level: trusted_with_scope
    truth_source: temporary git repository fixtures, staged Python files, Rule 10 commit-message contract
    risk_reason: safe_commit is the final local commit gate; weak review trailers or empty skip reasons can bypass Codex review for Python changes
    replacement: keep until commit policy is enforced by a stronger shared hook or CI gate
    last_verified: "2026-05-28"

