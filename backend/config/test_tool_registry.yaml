version: 1
updated_at: "2026-06-05"
policy:
  default_testpaths:
    - backend/tests
  default_excluded_markers:
    - realdb
    - perf
    - network
    - gcp
    - slow
  coverage_required_prefixes:
    - backend/tests/scripts
    - backend/tests/contract
    - backend/tests/realdb
    - backend/tests/perf
    - tests
  selected_registry_owner: "warn"
  unregistered_selected_sample_limit: 25

tools:
  - id: test_tool_health_audit
