    status: active
    evidence_level: trusted_with_scope
    truth_source: chunkyctl JSON contract, quickstart startup contract, worktree bucket contract, storage-payload summary contract, existing local audit scripts, CodeGraph status text fixtures
    risk_reason: project assistant is an orchestration convenience layer; drift could hide required gates, storage-payload recursion risk, or make sessions over-trust a narrow snapshot
    replacement: dedicated package/CLI if chunkyctl grows beyond thin wrappers
    last_verified: "2026-06-01"

