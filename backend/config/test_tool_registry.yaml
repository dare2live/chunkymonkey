    evidence_level: trusted_with_scope
    truth_source: docs/README.md ownership map, markdown reference graph, cleanup ledger exceptions, current-authority SCC allowlist
    risk_reason: stale docs and circular authority chains can mislead new sessions into old plans or deleted paths
    replacement: integrate into chunkyctl audit/doctor once docs graph gate becomes a default startup check
    last_verified: "2026-05-31"

  - id: execution_surface_audit_tests
