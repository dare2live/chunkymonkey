    scope: contract
    runner: PYTHONPATH=backend python -m pytest -q backend/tests/services/test_moth_snapshot.py backend/tests/services/test_worktree_status.py
    status: active
    evidence_level: trusted_with_scope
    truth_source: Moth snapshot JSON contract, git status short fixtures
    risk_reason: Moth adapter drift could hide worktree dirtiness or complexity snapshot mismatches
    replacement: upstream Moth JSON contract if the chunkymonkey adapter layer is deleted later
    last_verified: "2026-06-02"

  - id: docs_graph_audit_tests
