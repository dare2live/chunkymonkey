# 龙虎榜榜单分类 (发布 fact_top_inst_seat_daily 时判定; 红线 11: 未知理由/未知值 fail-closed)
# 证据: 妙想 RPT_OPERATEDEPT_TRADE 全史重落 (2019-01-02..2026-09-10, 1,378,855 行, 582 个理由串),
# 见 scratchpad/lhb_reason_class_r1.md (方法论) 与 scratchpad/lhb_reason_class_r1.json (标签表)。
# 键是规范串: 供货商串里每个 [+-]?[0-9]+\.[0-9]+ (仅半角 ASCII 数字) 在查表前被替换成 {v}
# (services/top_inst_seat_publish.canonical_reason); 键本身必须已是规范形 (含半角小数即拒载),
# {v} 是唯一合法占位符, 重复键拒载 (自定义 loader, 不是 PyYAML 默认的静默取最后一个)。
# 整数阈值/标点/全半角括号不归一 —— 新措辞就是未知理由, fail-closed, 需要人裁决登记。
# 残余风险: 未来交易所规则若把阈值写成小数, 会被模板误吸收; 窗口/类别只由措辞决定, 与数字无关,
# 所以判定本身不受影响 (见 lhb_reason_class_r1.md §3.1)。
# 不要手抄键: 用 scratchpad/build/gen_lhb_board_class_v2.py 从
# scratchpad/lhb_reason_class_r1.json 的 rule_id (去掉 exact:/tmpl: 前缀) 生成, 按 basis 首段的
# 家族号 (F01..F19) 分组。119 键 = 108 精确 + 11 模板; 62 个 version 1 旧键全部仍在 (规范形不变)。
version: 2
windows: [single_day, multi_day]
seat_kinds:
  investor_category:            # 类别汇总伪席位, 只许出现在 investor_category_board 的榜上
    # 深市严重异常榜 (SZSE 5.4.4): 自然人/中小投资者/其他自然人/机构投资者/深股通投资者
    # 沪市严重异常榜 (SSE 5.4.3/6.1.11): 自然人/中小投资者/其他自然人/机构/沪股通 (可转债榜偶见 机构投资者)
    # 北交所严重异常榜 (BSE 2026 5.4.3): 自然人/中小投资者/其他自然人/机构
    # 投资者分类: 供货商丢失类别名的占位 (seat_code 恒 10000128629, 34 行, 2020-10-26 与 2023-02..03),
    # 是类别行但类别未知 (lhb_reason_class_r1.md §1.4)
    names: [自然人, 中小投资者, 其他自然人, 机构投资者, 深股通投资者, 机构, 沪股通, 投资者分类]
  anonymous_inst:
    names: [机构专用]
checks:
  single_day_statistics_days_must_be_null: true     # 全史 0/1,005,898
  investor_category_names_only_on_category_boards: true   # 全史 0
  category_boards_only_investor_category_names: true      # 全史 0 (8 名单; 5 名单时 1,378 违例)
