# scratchpad/r2b_topinst_days.json (原始行) 与 fable_grain_contract_r2b.md §0/§2 (方法论)。
# reasons 键集合逐字节取自该 JSON 的 EXPLANATION 去重集合 (62 个), 窗口/类别归类按 §2.1 与 §0.2-0.3
# 的机制 (含 "连续/严重异常期间/最近3个有成交的交易日" 判多日榜; OPERATEDEPT_NAME 属投资者类别名单判类别榜),
# 已用同一份原始数据程序化交叉核对 (窗口规则 0 例外, 类别名单 0 例外, 单日榜 stat_days 100% NULL)。
# 不要从本文件外的任何 markdown 手抄键 —— 标点(全/半角)可能已被人工改写而与真实数据不再逐字节一致。
