kline_checks:
  # 审当前 qfq analysis/serving 读面 (tushare-only, 2019+, freq/adjust 合成)。
  # 本门只证明派生分析面完整性，不把它认证为 nominal execution truth 或 AcceptedPartition。
  source_table: market.v_price_kline_qfq
  freq: daily
  adjust: qfq
  date_column: date
  stock_code_column: code
  active_table: dim_active_a_stock
  active_code_column: stock_code
  # 2026-06-24 cry-wolf 修复 (kline_completeness 口径): 旧口径 clean 比"全交易日历"(假设每股每天交易)
  # → 停牌/退市股被当缺口, 实测 1711股/31.5% 误报 (感知死: 门长期红被无视, 真缺口溜过)。
  # 正解 = clean-vs-source: M2(clean)的职责是无损变换 raw→qfq, 该验"clean 丢了 source 有的行吗",
  # 与停牌/退市/日历无关 (源本就没停牌日=合法)。实测新口径 0 丢失行。M1(acquire)的"拉全tushare"由
  # sync watermark/drain 守 (另一阶段门), 不在此 calendar 比对。历史口径证据=git log --grep kline_completeness_crywolf_fix
  # 2026-09-08 改判 raw_tushare_daily → canonical_nominal_ohlcv_daily: 实测 raw_tushare_daily 已
  # 冻结在 20260716 (tushare 授权到期前最后一次同步), 07-16 之后 clean 侧任何丢行本门都看不见
  # (EXCEPT 集合比对本身没问题——src 里压根没有那天的行可比, 不是"比 COUNT 被糊弄"的那种病, 是
  # 比错了 source)。实测生产 qfq 表整缺 2026-08-12/08-13 两天 (10,257 行/5,128 只股), 本门全程绿。
  # canonical_nominal_ohlcv_daily 是当前唯一持续更新的名义 OHLCV 真相面 (build_price_kline_qfq_tushare
  # --from-accepted 默认输入), 才是"clean 有没有丢 source 行"该问的那个 source。
  source_raw_table: canonical_nominal_ohlcv_daily   # clean 的上游源; 在 tushare_raw 库
  source_raw_code_column: ts_code          # 带后缀 .SZ/.SH, 比对去后缀对齐 clean.code
  source_raw_date_column: trade_date
  # date_kind: canonical_nominal_ohlcv_daily.trade_date 是原生 DATE 类型 → date_type (显式 strftime
  # 到 YYYYMMDD, 不靠隐式转换); raw_tushare_daily.trade_date 是 YYYYMMDD 字符串 → yyyymmdd_string
  # (该表已冻结弃用为本门 source, 取值保留只为向后兼容旧 fixture/测试)。
  source_raw_date_kind: date_type
  completeness_threshold: 0.0              # 保留: 新口径下 = 任何 clean 丢失 source 行即 FAIL (无损要求, 此时 0.0 正确)
  gap_max_days: 5
  board_prefixes:
    - "00"
    - "30"
    - "60"
    - "68"
  min_start_date: "2019-01-01"   # 当前 qfq 分析序列起点；非 Tier0 名义价格覆盖承诺
  date_range_tolerance_days: 1
  sample_limit: 5
  gap_sample_limit: 8

# smartmoney_freshness check 已整除 2026-06-28: 唯二配置表 fact_risk_factors(U4)/
#   mart_stock_survey_activity(U5) 已物删, 且纯数据平台无 daily-fresh smartmoney 派生表;
#   各域新鲜度由 update_watermark_sla SLA gate 按正确 per-domain 窗 (含季报 100d override) 全覆盖。
#   edge 层重建若引入 daily 派生表再加回本 check。

cross_table_consistency:
  sample_limit: 5
  rules:
    - name: kline_universe_coverage
      enabled: true
      kline_source_table: market.v_price_kline_qfq   # 当前 qfq 活跃性/分析读面；不用于成交价真实性证明
      kline_stock_code_column: code
      # 2026-06-24 cry-wolf 修复: 合法性判定改用 services.universe.classify_exclusion (板块前缀身份真相源),
      # 不再 universe_tables 枚举 (dim_all_ever_listed 不含退市 → 退市A股误报209)。退市由 K线近90天无交易 PIT 排除。
      # 2026-07-07 inactive_still_trading 规则整段退役 (决策见 git log --grep inactive_still_trading): 该子检查依赖
      # dim_all_ever_listed 判"标记 inactive 但仍在交易"——但项目已改用 K 线本身当活跃真相源
      # (universe.py "K 线有交易=活跃"), 一旦外部 is_active 声明源(该表)被物删, 检查即失去比对对象、
      # 沦为无意义的自证; 且该表本身无存活 writer (冻结 10+ 周), 继续依赖只会读到过期快照。
      # kline_universe_coverage(北交所/非A股板块 leak 检测)不依赖此表, 独立保留。

# 2026-09-12 (asof_identity_r1.md §3.2/§3.4, 施工片 S5) 两条常驻审计共用的配置轴。
# price_tolerance 只服务 kline_code_succession 的候选侦测 (旧末日收盘价 vs 新首日前收盘价
# 邻接, 抓"日常按日同步下正常发生的换码"); kline_entity_duplicate 判的是"全同值"的实体
# 重复 (抓"按码重拉又把历史回写进 K 线"), 无容差, 阈值锚在
# backend/services/security_identity.py 的 _DUPLICATE_DAY_THRESHOLD, 不在此重复定义。
# 两条审计共用同一份登记表 backend/config/security_code_changes.yaml。
kline_identity:
  kline_table: canonical_nominal_ohlcv_daily
  price_tolerance: 0.01

audit_rules:
  - kline_completeness
  - kline_consistency
  - board_coverage
  - date_range
  - volume_sanity
  - cross_table_consistency
  - kline_entity_duplicate
  - kline_code_succession
