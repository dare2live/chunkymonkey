kline_checks:
  # 2026-06-22 M3 repoint: 审 canonical serving 源 v_price_kline_qfq (tushare-only, 2019+, freq/adjust 合成)
  # 非 stale 退役源 price_kline_tdxhub (2022+) — audit 必须审实际 serving 的表; 同时解阻 tdxhub drop。
  source_table: market.v_price_kline_qfq
  freq: daily
  adjust: qfq
  date_column: date
  stock_code_column: code
  active_table: dim_active_a_stock
  active_code_column: stock_code
  # 2026-06-24 cry-wolf 修复 (kline_completeness 口径): 旧口径 clean 比"全交易日历"(假设每股每天交易)
  # → 停牌/退市股被当缺口, 实测 1711股/31.5% 误报 (感知死: 门长期红被无视, 真缺口溜过)。
  # 正解 = clean-vs-source: M2(clean)的职责是无损变换 raw→qfq, 该验"clean 丢了 source 有的行吗",
  # 与停牌/退市/日历无关 (源本就没停牌日=合法)。实测新口径 0 丢失行。M1(acquire)的"拉全tushare"由
  # sync watermark/drain 守 (另一阶段门), 不在此 calendar 比对。owner=analysis/kline_completeness_crywolf_fix_20260624.md
  source_raw_table: raw_tushare_daily      # clean 的上游源 (build_price_kline_qfq_tushare 从它×adj_factor 建); 在 tushare_raw 库
  source_raw_code_column: ts_code          # 带后缀 .SZ/.SH, 比对去后缀对齐 clean.code
  source_raw_date_column: trade_date       # YYYYMMDD
  completeness_threshold: 0.0              # 保留: 新口径下 = 任何 clean 丢失 source 行即 FAIL (无损要求, 此时 0.0 正确)
  gap_max_days: 5
  board_prefixes:
    - "00"
    - "30"
    - "60"
    - "68"
  min_start_date: "2019-01-01"   # 2026-06-22 M3: canonical tushare 起点 2019 (旧 2022 是 tdxhub 范围)
  date_range_tolerance_days: 1
  sample_limit: 5
  gap_sample_limit: 8

# smartmoney_freshness check 已整除 2026-06-28: 唯二配置表 fact_risk_factors(U4)/
#   mart_stock_survey_activity(U5) 已物删, 且纯数据平台无 daily-fresh smartmoney 派生表;
#   各域新鲜度由 update_watermark_sla SLA gate 按正确 per-domain 窗 (含季报 100d override) 全覆盖。
#   edge 层重建若引入 daily 派生表再加回本 check。

cross_table_consistency:
  sample_limit: 5
  rules:
    - name: kline_universe_coverage
      enabled: true
      kline_source_table: market.v_price_kline_qfq   # 2026-06-23 M3: price_kline_tdxhub 物删, 审 canonical serving 源
      kline_stock_code_column: code
      # 2026-06-24 cry-wolf 修复: 合法性判定改用 services.universe.classify_exclusion (板块前缀身份真相源),
      # 不再 universe_tables 枚举 (dim_all_ever_listed 不含退市 → 退市A股误报209)。退市由 K线近90天无交易 PIT 排除。
    - name: inactive_still_trading
      enabled: true
      kline_source_table: market.v_price_kline_qfq   # 2026-06-22 M3 repoint canonical (同上)
      kline_date_column: date
      kline_stock_code_column: code
      recent_days: 10
      inactive_table: dim_all_ever_listed
      inactive_code_column: stock_code
      is_active_column: is_active
      inactive_value: 0

audit_rules:
  - kline_completeness
  - kline_consistency
  - board_coverage
  - date_range
  - volume_sanity
  - cross_table_consistency
