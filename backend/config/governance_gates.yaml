# governance_gates.yaml — 门的分布策略 (L1 契约层; goal.md「治理体系重构」P1)
#
# Owner: 本文件。
# 消费方 (代码读, 不是文档抄):
#   - scripts/safe_commit.sh          经 backend/scripts/gate_policy.py 取分组 → 阻断/warn/不跑
#   - backend/services/pipeline/store.py  取 runtime_checks → daily_update 运行时自检
#   - backend/scripts/gate_policy.py  CLI: --names / --table / --check / --run-system-health
#
# 分布判据 (goal.md 三条原则之三「门装在受害发生的时刻，不装在最方便检查的时刻」)：
#   问「谁受害、何时受害」，不问「这条规则属于哪个主题」。
#     这次 diff 本身错   → commit 阻断      → group=diff_correctness
#     数据 / 策略 / 钱   → 运行时自检       → group=system_health
#     下一个开发者/agent → 提示不阻断       → group=scaffold
#
# 实证起点 (2026-08-10 治理审计, ledger 同日条目)：门里大部分是脚手架门，
# 脚手架门本轮 3 次阻断系统修复提交 (project_index_sync ×2 / agent_board ×1)；
# 而真正的系统约束 (b_pit cutover 是否仍生效) 装在 commit 路径上，于是「有没有人
# 恰好提交相关代码」决定了它何时被查 —— 系统跑了 13 次没人查。
#
# fail-closed 铁律: 本文件缺失 / 不可解析 / 门名与 classify_commit_tier 不一致时，
# gate_policy 返回空分组 → safe_commit 退回「全部阻断」，绝不因配置坏掉而放行。
# tier 剪枝 (L1/L2/L3) 是正交的另一维, owner 仍是 backend/config/commit_tiers.yaml。
#
# 死亡条件字段 (R1/R6, 2026-09-03; mio #7 实证边界: 40 道门 8 事故 32 计划催生,
# 门维护占提交比 5 月 2% → 9 月 43%)：每个 commit_gates.<id> 除 group/checks/why
# 外还须有 —
#   object    : 逗号分隔, 每项 table:<db>.<name> / rule:<id> (不查文件系统) 或
#               repo 相对 glob (loader 在 --check 时验证命中 ≥1 路径, 命中 0 =
#               DEAD_GATE —— 门自己红要求删门, 不拦提交, 见 gate_policy.py --check)
#   invariant : 一句可判的话, 说清"什么必须成立"
#   kill_when : delete | move_to:<group> | keep_forever:<理由> 之一开头
#   paradigm  : engineering | strategy_validation | casebook (今天全是 engineering)
# 四字段任一缺失/格式不对 → GatePolicyError (与 group/checks/why 同一处 fail-closed)。
# 门不再「永不删除」——DEAD_GATE 就是"该删了"的机器信号; 门只按分组改变**后果**
# 这条对活门仍成立, 但对象消失的死门要删, 不是继续挂着改分组。

version: 1

groups:
  diff_correctness:
    victim: this_diff
    harm_at: commit
    commit_behavior: block
    runtime_behavior: none
    why: "这次改动本身就是错的；不拦住它，错误立刻进主干。"
  system_health:
    victim: data_strategy_money
    harm_at: runtime
    commit_behavior: not_run
    runtime_behavior: report
    why: >-
      受害时刻是系统跑起来的时候，不是有人提交代码的时候。装在 commit 路径 =
      检查时机取决于有没有人恰好提交相关代码。
  scaffold:
    victim: next_developer
    harm_at: next_session
    commit_behavior: warn
    runtime_behavior: none
    why: >-
      坏掉只让下一个接手的人多花时间，不让系统出错、不让数据变脏。阻断它 =
      用文档没同步挡住代码 bug 修复。批量修入口 scripts/chunkyctl scaffold-fix。

# 全部门 (数量以本文件 commit_gates 键为准, 不在注释里重复维护；名字与 scripts/safe_commit.sh 的 gate 标签、
# backend/scripts/classify_commit_tier.py 的 ALL_GATES_ORDERED 一一对应；
# 三者一致性由 backend/tests/scripts/test_governance_gates.py 锁死)。
commit_gates:
  project_index_sync:
    group: scaffold
    checks: "改了 service/script/yaml 就必须同批改 PROJECT_INDEX.md"
    why: "索引陈旧只让下次 session 的地图不准；它挡不住任何一个真实缺陷。"
    object: "PROJECT_INDEX.md, backend/services/**, backend/scripts/*.py, backend/config/*.yaml, AGENTS.md"
    invariant: "改了 TRIGGERS 命中的路径 (services/**, scripts/build_*|optimize_*|run_*|backfill_*|rebuild_*|audit_*, config/**, AGENTS.md) 必须同批 stage PROJECT_INDEX.md"
    kill_when: "keep_forever: 只要 PROJECT_INDEX.md 还是人工维护的活索引, 漂移检测就要在"
    paradigm: engineering

  feature_map:
    group: scaffold
    checks: "FEATURE_MAP.md 派生地图与 staged 源快照一致"
    why: "机器可重生的投影；陈旧 = 重新跑一次生成器，不是系统故障。"
    object: "FEATURE_MAP.md, backend/**/*.py, backend/routers/*.py"
    invariant: "FEATURE_MAP.md 与从 backend/**/*.py + routers/*.py rglob 重生的结果逐字一致"
    kill_when: "keep_forever: 只要 FEATURE_MAP.md 是机器生成产物, 就要防手改/漂移"
    paradigm: engineering

  moth_invariants:
    group: diff_correctness
    checks: "moth 里标了 severity: blocking 的数据不变量 (读同一次 moth assert 的 JSON)"
    why: >
      moth 是**一道门**而它背后有 38 条断言。P1 把 moth 整体归进 scaffold(warn-only)后,
      38 条按整体继承了「不阻断」—— 其中混着 calendar-floor(「回退=静默 clamp 复发」)、
      dc-member-truncation-pin(「2026-06-12 发现静默截断」)这类数据不变量, 而它们在 pytest 里
      覆盖为 0、CI 又完全不跑 moth, 即当时**在任何地方都没有阻断力**。
      这与 warn-only 短路吞掉 coupling 同形态: 粗粒度分组悄悄改了不该改的东西的强制级别。
      判据只有一条: 违反它意味着**数据/平台此刻就是错的**, 而不是「登记没跟上」——
      阈值棘轮(表数/索引数/体量带)刻意不在此列, 拿它挡提交正是 P1 要消灭的张力。
    object: ".moth/**"
    invariant: "moth assert JSON 里标 severity: blocking 的数据不变量全部通过"
    kill_when: "keep_forever: 只要 .moth profile 还在版本控制里"
    paradigm: engineering
  moth:
    group: scaffold
    checks: "moth assert (仓库自述断言) + moth coupling"
    why: "断言过期误导的是下一个读它的人；数据与 PIT 不依赖它。"
    object: ".moth/**"
    invariant: "moth assert(仓库自述断言全集) + moth coupling 全部闭合"
    kill_when: "keep_forever: 只要 .moth profile 还在版本控制里"
    paradigm: engineering

  staged_worktree_parity:
    group: diff_correctness
    checks: "每个 staged 的 .py, 其索引内容 == 工作树内容"
    why: >
      ci_pytest 刻意拿 live worktree 跑(测试需要 repo 的 pytest.ini 与 fixture), 因此它对
      「工作树 != 索引」结构性失明 —— 跑的是手上的版本, 提交的是索引里的版本。两次事故同一动作:
      `git add` 之后又编辑。范围只限 .py: 其余门都读 staged 快照对漂移免疫, 只有 ci_pytest 会被骗, 而骗它的介质就是 pytest 导入执行的 .py。开到所有文件会误伤 `git add -p` 分批提交。
    object: "**/*.py"
    invariant: "每个 staged 的 .py 文件, git 索引内容必须与工作树内容一致"
    kill_when: "keep_forever: 只要 ci_pytest 门还拿 live worktree 跑测试, 就需要这层校验"
    paradigm: engineering
  rule_compliance:
    group: diff_correctness
    checks: "staged diff 里的魔数 / 估算参数缺 evidence|measured|from yaml 注释"
    why: "扫的就是这次 diff 的内容；拍脑袋常数一旦进主干就成了别人的既定事实。"
    object: "rule:magic_number"
    invariant: "staged diff 新增的魔数/估算参数/DB 边界反 pattern 必须带 evidence|measured|from yaml 注释"
    kill_when: "keep_forever: 拍脑袋常数一旦进主干就是既定事实, 工程卫生"
    paradigm: engineering

  ci_pytest:
    group: diff_correctness
    checks: "与 public CI 同面的 blocking pytest"
    why: "这次改动是否打破现有契约 —— 典型的 diff 正确性。"
    object: "backend/tests/**/test_*.py, backend/config/ci_pytest_surface.yaml"
    invariant: "ci_pytest_surface.yaml 的 blocking_paths 与 public CI 同面全绿"
    kill_when: "keep_forever: 只要还用 pytest 就要防契约破坏未经检测合入主干"
    paradigm: engineering

  sandbox_isolation:
    group: diff_correctness
    checks: "backend/ 引用 sandbox/ (C1) / 探索 runner 漏进 backend/scripts (C3)"
    why: "实验残留是被这次 diff 带进来的；下一刀再查就已经污染了主代码。"
    object: "backend/**/*.py, sandbox/**"
    invariant: "backend/ 不 import sandbox/; 探索 runner 不漏进 backend/scripts"
    kill_when: "delete: sandbox/ 目录清空且 backend 半年内 0 次误引用命中 (即 C1/C3 长期零命中), 隔离已达成"
    paradigm: engineering

  serve_read_layer:
    group: diff_correctness
    checks: "非成员消费者绕过 DataAccess 裸查 / entity 声明链断 / L2 bypass"
    why: "旁路读是这次 diff 写下的代码形状，静态可判。"
    object: "backend/services/**/*.py, backend/scripts/**/*.py, backend/routers/*.py, backend/config/data_module_members.yaml"
    invariant: "非成员消费者不得内联裸查; preflight 已接线; entity 声明链齐全; L2 bypass 关闭"
    kill_when: "keep_forever: 读层边界"
    paradigm: engineering

  calendar_usage:
    group: diff_correctness
    checks: "wall-clock 当最新交易日 / SQL CURRENT_DATE 当上界"
    why: "第零条规定的静态执法面；绕过日历是这行代码本身的缺陷。"
    object: "backend/**/*.py"
    invariant: "交易日只从 services.calendar 取; 不内联 wall-clock(date.today/datetime.now) 当最新交易日, 不裸写 SQL <=CURRENT_DATE 上界锚"
    kill_when: "keep_forever: 日历单一计算点"
    paradigm: engineering

  population_contract:
    group: diff_correctness
    checks: "staged registry/policy/binder 静态契约绑定 (verdict=PASS)"
    why: >-
      静态契约面属于这次 diff。同一脚本报的 live_readiness 从来只是投影、
      不阻断，真的 live 数据裁决在 continuity 运行时自检里。
    object: "backend/config/universe_rules.yaml, backend/config/sync_registry.yaml"
    invariant: "静态 population 契约 verdict=PASS 且 formal_dataset_count>0"
    kill_when: "keep_forever: universe 单一入口"
    paradigm: engineering

  lineage_drift:
    group: diff_correctness
    checks: "提交版 data/lineage/graph.json 与仅从暂存树登记表重生的结果逐字一致 (不读活库)"
    why: >-
      漂移的成因是这次 diff 改了 registry/schema/消费方却没重生血缘 —— 纯 diff 正确性。
      2026-08-11 曾把它的 live-catalog 面也挂进运行时自检，独立审查实测推翻：它在运行时
      报的是「有人改了代码没重生血缘」这种**开发者状态**，与数据健康无关（审查那次命中
      正是因为本会话在改代码），且写锁期的降级路径从未验证。已撤出 runtime_checks ——
      放一个信号含义不明的检查进日更，只会训练人无视 degraded。
      2026-09-04 (#4 #12(i)) 补一刀：build_lineage_graph() 本身在提交路径上也读活库
      information_schema (builder.py:62-84)，与上面这次撤销是同一类问题的另一半——日更
      建新表/写者持锁 (形态面重建 64 min) 都会让这道 diff_correctness 门红/炸，而 diff
      一字未改。改法：门用 build_lineage_graph(catalog=False)（纯暂存树/登记表函数，不
      连任何 .duckdb），活库 vs 登记表的差单独用新 runtime check lineage_catalog_drift
      承接——它比的是「活库真实表 vs 登记表声明表」两个当下事实，不是「有没有人跑过
      build」，与 2026-08-11 撤销的那个检查不是同一件事，不重蹈同一个覆辙。
    object: "data/lineage/graph.json"
    invariant: "提交版 data/lineage/graph.json 与仅从暂存树的登记表/代码重生的结果逐字一致 (不读活库; 活库 vs 登记表差由 runtime lineage_catalog_drift 报)"
    kill_when: "keep_forever: 血缘图是 registry/schema/消费方的投影, 只要投影存在就要防漂移"
    paradigm: engineering

  dead_references:
    group: diff_correctness
    checks: "删模块/表/文件后引用方未清 (死 import / config 死路径 / 孤儿脚本)"
    why: "删除动作就在这次 diff 里；漏清引用方是这一刀没做完。"
    object: "backend/**/*.py, backend/config/*.yaml, docs/*.md, .moth/**"
    invariant: "删除的模块/表/文件, 其引用方(import / config 死路径 / 文档链接)必须同批清除"
    kill_when: "keep_forever: 与范式无关的工程卫生"
    paradigm: engineering

  repo_blob_size:
    group: diff_correctness
    checks: "staged 新增/修改文件的 blob 大小超阈值 (backend/config/repo_blob_policy.yaml) 且不在白名单"
    why: >-
      大文件就在这次 diff 里；不拦住它，可重算的分析/实验产物立刻进主干膨胀 .git
      (2026-08-31 事故: 3.9G，根因正是这类文件被逐次提交)。与 dead_references 同型，
      不是「登记没跟上」的脚手架问题。
    object: "backend/config/repo_blob_policy.yaml"
    invariant: "staged 新增/修改文件的 blob 大小不超阈值且不在白名单外"
    kill_when: "keep_forever: 2026-08-31 3.9G 事故根治门, 防可重算产物再次入库"
    paradigm: engineering

  grain_uniqueness:
    group: system_health
    checks: "全域按声明 grain GROUP BY 有无重复组 (live DuckDB)"
    why: >-
      查的是库里现有数据，与本次 diff 无关。grain 声明错会被批内去重升级成
      静默销毁 —— 受害时刻是每次跑批写表，不是提交代码。
    object: "table:*"
    invariant: "全域按声明 grain (sync_registry.yaml 域 + MART_GRAINS) GROUP BY 无重复组"
    kill_when: "keep_forever: 数据正确性"
    paradigm: engineering

  continuity:
    group: system_health
    checks: "应有交易日缺日 / 中间空洞 / 子榜断流 / 声明-实测漂移 (live DuckDB)"
    why: >-
      纯 live 数据 readiness。safe_commit 里它早已只打印不阻断 (2026-07-17
      分离 code fitness 与 data readiness)，现在连跑都不跑 —— 归位到日更。
    object: "table:*"
    invariant: "应有交易日无缺日/中间空洞/子榜断流, 声明覆盖与实测不漂移"
    kill_when: "keep_forever: 数据可用性验证器自身的自洽性, 门策略坏掉时最需要它可信"
    paradigm: engineering

  no_emoji:
    group: diff_correctness
    checks: "staged diff 里的 emoji (代码 / yaml / markdown / commit body)"
    why: >-
      扫的就是这次 diff 的内容, 静态可判。owner 的硬偏好(全项目不用 emoji);
      2026-08-11 之前它只活在 git hook 里 —— **登记表之外的执法点**, 意味着
      `safe_commit` 路径根本不查它, 而两条路径给出不同结果正是 P1 要消灭的。
    object: "rule:no_emoji"
    invariant: "staged diff (代码/yaml/markdown/commit body) 不含 emoji"
    kill_when: "keep_forever: owner 全项目硬偏好"
    paradigm: engineering

  config_refs:
    group: diff_correctness
    checks: "data_access.yaml 引的 layer 值在 data_layers.yaml 有定义"
    why: "跨 config 悬空引用是这次 diff 写下的，纯静态。"
    object: "backend/config/data_access.yaml, backend/config/data_layers.yaml"
    invariant: "data_access.yaml 引用的 layer 值必须在 data_layers.yaml 有定义"
    kill_when: "keep_forever: 层词汇单一真相源"
    paradigm: engineering

  doc_drift:
    group: scaffold
    checks: "活文档引用的代码路径 / 本地链接实际存在"
    why: "悬空引用害的是按图索骥的下一个人；系统照常跑。"
    object: "AGENTS.md, docs/*.md, PROJECT_INDEX.md"
    invariant: "活文档 (活索引 + 规则 + docs/ 契约) 引用的代码路径/本地链接必须实际存在"
    kill_when: "keep_forever: 只要文档引用代码路径, 悬空引用就会误导下一个人"
    paradigm: engineering

  doc_governance:
    group: scaffold
    checks: "活文档 owner 唯一 / 无 retired CLI / fails=0 warns=0"
    why: "文档生命周期纪律；坏掉不改变任何运行时行为。"
    object: "AGENTS.md, goal.md, PROJECT_INDEX.md, docs/*.md, FEATURE_MAP.md"
    invariant: "活文档 owner 唯一; docs/ authority allowlist 精确匹配; fails=0 warns=0"
    kill_when: "keep_forever: 文档生命周期纪律"
    paradigm: engineering

  doc_runtime_state:
    group: scaffold
    checks: "人工活文档里未声明的紧凑日期 / 写死的旧前沿 / 已失效的豁免"
    why: >-
      写死的运行时状态坏掉时，系统照常跑，受害的是下一个照着文档做判断的人
      (2026-08-10 实证: 两份手写文档互相矛盾且同时落后两周，误导了整整两周)。
      故 warn-only；但它是**唯一**查语义时效的门 —— 其余文档门只查悬空链接与代码路径。
    object: "docs/*.md, backend/config/doc_runtime_state.yaml"
    invariant: "人工活文档里没有未声明的紧凑日期/写死的旧前沿/已失效的豁免"
    kill_when: "keep_forever: 唯一查语义时效的门, 其余文档门只查悬空链接"
    paradigm: engineering

  commit_msg:
    group: scaffold
    checks: "commit message 关键词提示 (GROUP A/B)"
    why: "自述型；本来就只打印 WARNING 不阻断，登记在此保持一致。"
    object: "rule:commit_message_structure"
    invariant: "commit message 含 Q/Fix/Evidence/Residual 结构关键词提示"
    kill_when: "keep_forever: 自述型提示, 保持与 commit-msg hook 一致"
    paradigm: engineering

  rule10:
    group: diff_correctness
    checks: "显式 Codex-Reviewed: REQUEST_CHANGES 阻断 + staged 范围不可判定 fail-closed"
    why: >-
      2026-08-10 已拆掉无法验证的那一半 (缺 APPROVE 不再阻断)。剩下两条都是
      客观且只关于这次 diff 的事实：有人对**这一刀**写下了未消除的否定裁决，
      或者门根本无法确定 staged 范围。AGENTS.md §9 保留其阻断力。
    object: "rule:codex_review_verdict"
    invariant: "commit message 里没有未消除的 Codex REQUEST_CHANGES 裁决, 且 staged 范围可判定"
    kill_when: "keep_forever: AGENTS.md §9 保留其阻断力"
    paradigm: engineering

  tushare_sunset:
    group: scaffold
    checks: "tushare_sunset.yaml 与 sync_registry.yaml 对账 (授权到期风险门)"
    why: >-
      TuShare 授权 2026-09-10 到期，不续期；硬停不是降级。primitives/seed.py 涨跌停规则
      过时三月无人发现正因为零消费零执法。清单漂移（新增 tushare 域未记决策、或改了域名
      未同步）会导致到期后静默断流。检查三项：(1) registry 的每个 tushare 源域必须在
      sunset.yaml 出现；(2) sunset 的域若已非 tushare 源且未 status:done 报 WARN；
      (3) 未裁决域倒计时（过期才 FAIL，距到期前只 WARN）。WARN 必须列出全部未裁决域名
      防 warn-only 退化成 warn-nothing。
    object: "backend/config/tushare_sunset.yaml, backend/config/sync_registry.yaml"
    invariant: "sunset 清单与 registry 的 tushare 源域一一对账, 无未裁决的过期域"
    kill_when: "delete: 2026-09-10 TuShare 授权到期且全部域已切换后"
    paradigm: engineering

# ── 运行时自检 (daily_update) ────────────────────────────────────────────
# system_health 组的门在这里落地，外加两类本来就只该活在运行时的检查。
# store.py 逐条跑，失败 = degraded (记录 + 续跑 + 写 flag)，绝不静默。
# degraded_msg 必须能被 services/pipeline/run_outcome.py 的 _INTEGRITY_RE 命中，
# 否则会落进 "other" 而不是 typed integrity_observe。
runtime_checks:
  - id: continuity
    from_gate: continuity
    script: backend/scripts/check_continuity_integrity.py
    args:
      - "--alert-flag"
      - "/tmp/chunkymonkey_ALERT_continuity.flag"
      - "--json-out"
      - "data/audit/continuity_{date}.json"
    degraded_msg: >-
      system_health continuity/integrity 审查 FAIL — 库存数据缺日/断流/横截面异常
      (详 data/audit/continuity_{date}.json + ALERT_continuity.flag)
    skip_when_dry: true

  - id: residual_hygiene
    from_gate: null
    script: backend/scripts/check_residual_hygiene.py
    args:
      - "--alert-flag"
      - "/tmp/chunkymonkey_ALERT_residual_hygiene.flag"
      - "--json-out"
      - "data/audit/residual_hygiene_{date}.json"
    degraded_msg: >-
      system_health residual_hygiene FAIL — Type-B publish / ann tip lag over SLA
      (详 data/audit/residual_hygiene_{date}.json + ALERT_residual_hygiene.flag)
    skip_when_dry: true

  - id: grain_uniqueness
    from_gate: grain_uniqueness
    script: backend/scripts/check_grain_uniqueness.py
    args: []
    degraded_msg: >-
      system_health grain_uniqueness FAIL — 某表按声明 grain 有重复组
      (grain 声明不足或 MERGE 幂等破坏; 批内去重会把它升级成静默销毁)
    skip_when_dry: true

  - id: foundation_live
    from_gate: null
    script: backend/scripts/check_foundation_done.py
    args: []
    degraded_msg: >
      system_health foundation_live 非 PASS — FND-GATE 的 live 侧(F4 Type-B enrichment /
      F6 accept breadth)报出真实数据缺口。2026-08-14 从 commit 路径移来: 实测该脚本全量
      39.2s 而 --skip-live 仅 0.37s, 即 83% 的 moth 开销花在这两个 DuckDB 探测上, 而它们
      查的是「数据地基够不够」不是「这次 diff 对不对」—— 受害时刻是跑日更, 门就该装在日更里。
      commit 路径仍跑静态契约面(moth 的 foundation-done-f1-f10 带 --skip-live)。
    skip_when_dry: true

  - id: cutover_effective
    # runtime-native: 它此前挂在 agent_board 门下, 而 agent_board 已随 BOARD.md 退役
    # (P2.3)。检查本身与任何 commit 门无关 —— 它查的是 config 声明是否仍生效。
    from_gate: null
    script: backend/scripts/check_cutover_effective.py
    args:
      - "--json-out"
      - "data/audit/cutover_effective_{date}.json"
    # 文案必须涵盖全部触发条件, 不能写死其中一种。2026-08-11 独立审查 finding #4:
    # 首版写死「attested 窗口已过期」, 但本检查的退出码把 FAIL(1)/WARN(2)/UNVERIFIED(2)
    # 都收敛成非零, 于是日历不可达 (与窗口毫无关系) 也会读到一条讲窗口过期的告警。
    # 精确原因在 JSON 里, 告警头条不许误导。
    degraded_msg: >-
      system_health cutover_effective 非 PASS — config 声明的 cutover 与 resolver
      实际裁决背离, 或生效性无法验证 (结构性背离/逐日回落/日历不可达三选一,
      精确原因见 data/audit/cutover_effective_{date}.json)
    skip_when_dry: false

  - id: lineage_catalog_drift
    # #12(i) (2026-09-04) 雏形: lineage_drift 提交门改成纯登记表函数(不读活库)后, 活库
    # 真实表 vs 登记表声明表的差没人报了 —— 这里补上, 只报不拦。K4 check_datasets_registry
    # 落地时改名并升 blocking, 用同一个 builder (services/lineage/builder.catalog_drift) 算,
    # 不是第二套实现。与 2026-08-11 撤出 runtime_checks 的旧检查不是同一件事 (见
    # commit_gates.lineage_drift.why 的说明): 旧检查比「提交版 graph.json vs 重生」, 报的是
    # 开发者状态; 这个比「活库 vs 登记表」, 报的是数据/配置当下事实。
    from_gate: null
    script: backend/scripts/check_lineage_catalog_drift.py
    args:
      - "--json-out"
      - "data/audit/lineage_catalog_drift_{date}.json"
    degraded_msg: >-
      system_health lineage_catalog_drift 非 PASS — 活库真实表集合与登记表
      (sync_registry/data_layers/data_access/database_manifest) 声明表集合不一致
      (幽灵表: 活库有登记表未声明; 孤儿表: 登记表声明但活库没有),
      精确清单见 data/audit/lineage_catalog_drift_{date}.json
    skip_when_dry: true

# ── 脚手架批量修 ────────────────────────────────────────────────────────
# scaffold 组不再阻断提交，代价是必须有一个「一条命令修完」的入口，
# 否则 warn 会被无限忽略。scripts/chunkyctl scaffold-fix 消费本节。
scaffold_fix:
  - id: feature_map
    from_gate: feature_map
    kind: regenerate
    command: ["backend/scripts/build_feature_map.py"]
    note: "重生 FEATURE_MAP.md + data/feature_map.json (BOARD 已于 P2.3 改现查, 无产物可重生)"
  - id: doc_drift
    from_gate: doc_drift
    kind: report
    command: ["backend/scripts/check_doc_drift.py"]
    note: "悬空引用需人改文档指向，机器只能报清单"
  - id: doc_governance
    from_gate: doc_governance
    kind: report
    command: ["backend/scripts/check_doc_governance.py"]
    note: "owner/生命周期违规需人裁决，机器只能报清单"
  - id: project_index_sync
    from_gate: project_index_sync
    kind: report
    command: ["backend/scripts/check_project_index_sync.py"]
    note: "活索引节要写什么是人的判断，机器只报缺口"
  - id: doc_runtime_state
    from_gate: doc_runtime_state
    kind: report
    command: ["backend/scripts/check_doc_runtime_state.py"]
    note: "写死的状态该改成指针还是该声明为常量，是人的判断；机器给出真相源当前值"
