# Multidim walk-forward defaults (shared training/safety policy)
# The model fallback params belong here, not as Python literals.
objective: regression
metric: rmse
learning_rate: 0.04
num_leaves: 31
min_data_in_leaf: 200
feature_fraction: 0.8
bagging_fraction: 0.8
bagging_freq: 1
lambda_l1: 0.01
lambda_l2: 0.1
max_depth: 6
verbose: -1
seed: 42
feature_fraction_seed: 42
bagging_seed: 42
data_random_seed: 42
feature_pre_filter: false
degenerate_daily_distinct_threshold: 100
