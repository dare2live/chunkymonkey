      注: 2026-07-06 起沪深主板 ST 涨跌幅已由 5% 改为 10%,
      故 ST 状态不再决定主板涨跌停档 —— 这 1% 误差不再传导到价格。"
    impact_if_lost: "断流后 ST 状态冻结, GT 正负样本标注**渐进失准**(非立即崩)。
      ST 变化频率约每年数十次摘帽/戴帽, 故影响随时间线性累积。
      历史 166,840 行保留, 回测不受影响。"

    status: done
    done_at: "2026-09-01"
    done_evidence: "四处联动: registry source -> stock_st_derive; formal_boundaries
