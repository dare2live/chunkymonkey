  # ── derive: 可推导，退役取数域 (根因立法 §5.9) ───────────
  stk_limit:
    decision: derive
    evidence: "up/down_limit = round(pre_close × (1±band), 2)，band 由板块定
      (30/68→20%, 92/43/83/87→30%, 其余→10%; 北交所向下取整到分)。
      实测复现率 涨停价 99.82% / 跌停价 99.51%。8,654,737 行本质是几十行规则的逐票逐日展开。"
    caveat: "① 残余 0.2~0.5% 是新股/特殊标的，需一张小例外表。
      ② **推导依赖 stock_st 定 ST 档**，故其可用性 = min(K线, ST) —— 见根因立法『推导链传染』。
      ③ 该表 pre_close 列是 INTEGER，8,654,737 行仅 1.7% 非空且值域[0,2586]，
      价格已被截断成垃圾，而 limits.py 从未读它 —— 推导版严格优于现状。"

  suspend_d:
    decision: derive
    evidence: "项目地基原则即『K 线有交易 = 在交易，没有 = 不在』。
      实测正向 97.86% (S 型行当日无 K 线)、反向沪深 99.9%。"
    caveat: "盘中临停 (suspend_timing 非空) 占 2.14%，推导拿不到，需单独留源或接受缺失。"

