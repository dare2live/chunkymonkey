      少的 2 只 (000711.SZ ST京蓝 / 002586.SZ ST围海) 经 ifind 事件史确认恰在 08-31 当天
      摘帽 —— 是基准滞后 3 天, 派生反而更新鲜。adapter 有 StockSTStaleSnapshotError
      fail-closed 防陈旧快照 (默认要求快照 built_at 日期 == 请求 trade_date)。"
