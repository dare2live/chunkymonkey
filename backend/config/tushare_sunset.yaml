# TuShare 授权日落决策 — 每个仍在 tushare 的域，到期后怎么办
#
# 硬事实: 授权 2026-09-10 到期，业主已决定**不续期**。tushare.py 在 expires_at <= now 时
# 直接 raise TuShareAuthorizationError，是硬停不是降级。
#
# 本文件是**决策记录 + 执法输入**，不是叙述: 每个域必须有 decision，
# 缺决策 = 到期后静默断流且无人知道它断了 —— 项目教训 [[feedback-defer-requires-detectability]]
# 「说『先不做』前必答: 它出现时哪行代码告诉我」。
#
# decision 取值:
#   replace   — 已有已验证替代，必须在到期前切换 (must_by 给期限)
#   derive    — 可由「已注册域 + 公开规则」推导，退役取数域 (根因立法 §5.9)
#   accept    — 明确接受断流: 四源均无等价，且断流后果已知并可接受
#   undecided — 尚未裁决 (**这个值只应短暂存在**；门应把它当 FAIL 而非 WARN)
#
# evidence 必须是本项目实测出的数字或 commit，不接受"据说/应该"。

version: 1
authorization_expires: "2026-09-10"
renew: false

domains:

  # ── 已完成 ──────────────────────────────────────────────
  trade_cal:
    decision: derive
    status: done
    replacement: calendar_rule
    evidence: "交易日 = 周一~周五 − 法定节假日; 1990-2026 共 13,162 天与在库日历
      is_open/pretrade_date 逐字段零差异; 22 年『周末开市』例外合计 0 天。
      零供应商依赖，未来交易日不再受任何源限制。"

  # ── replace: 有已验证替代，到期前必须切 ──────────────────
  daily:
    decision: replace
    replacement: tdxhub
    must_by: "2026-09-10"
    evidence: "通达信全市场 5,208 只 × 9 字段与 canonical 逐项零差异 (46,872 项);
      除权日 pre_close 15/15 正确; 全历史 0.6s/票; 停牌语义与项目地基一致(不给行);
      TdxhubSource 已实现并通过真实端到端验收，adapter 就绪待启用。"
    status: done
    done_at: "2026-09-01"
    done_evidence: "四处联动全改: registry source -> tdxhub; formal_boundaries daily.adapter
      由 LIVE_ADAPTER 改字面 'tdxhub'; nominal_ohlcv_schema DOMAIN.source -> tdxhub
      (config_hash 随之 7d122f28->ff6528d5, 新写入行带新 hash 旧行保留旧值 = 预期溯源语义,
      读侧无 hash 相等校验); test_formal_boundaries 两处样例改用 stock_st。
      北交所: adapter 的 bj_codes_provider 从 raw_tushare_stock_basic 读 338 只 BJ 补进
      universe (5,220 沪深 + 338 BJ = 5,558), 拿不到时降级仅沪深 + warning 不阻断。
      顺带根治: SecurityDayLandingBatch.source 的硬编码默认值 'tushare' 已删 —— 该
      dataclass 被 daily 与 stock_st 共用而两域已不同源, 默认值等于假设'所有 SecurityDay
      域同源', 且失败方式是静默的(漏传就默默拿 tushare)。两个生产调用点本就显式传,
      只有测试在吃它; 删后测试改为从契约读 source, 下次换源自动跟随。"
    blocked_by: "BJ 代码列表 — 通达信 stocks(market=2) 报『只支持沪深市场』，
      需 stock_basic 换源后从代码表读 (见 stock_basic)。"

  stock_basic:
    decision: replace
    replacement: fuyao
    must_by: "2026-09-10"
    evidence: "扶摇 /api/meta/tickers/list 筛 asset_type=a-share 得 5,563 只，
      TuShare 的 5,550 只 100% 被覆盖 (严格超集，多出 13 只为待上市新股)，且含 BJ 343 只。
      消费方 security_master 实际只读 symbol/name/ts_code 三列 + market 用于排北交所。"
    status: done
    done_at: "2026-09-01"
    done_evidence: "registry source: tushare -> fuyao (同时删 page_limit —— 它会让 sync_runner
      走 offset 分页而扶摇 adapter 拒收 limit/offset; 删 fixed_params.list_status —— 扶摇不认)。
      端到端实跑 5,563 行 0 失败; dim_active_a_stock 5,212 -> 5,220 只, **消失 0 只**
      (严格超集), 新增 8 只全是待上市新股。security_master 的 source 标签由硬编码
      'tushare_stock_basic' 改为域名 'stock_basic' —— 标签记域不记供应商, 供应商会换域不会。"
    residual_risk: "扶摇 asset_type=a-share 含待上市新股, 而 tushare list_status=L 不含;
      这 13 只会进 dim_active_a_stock, 但观察日无 K 线故被 universe 的
