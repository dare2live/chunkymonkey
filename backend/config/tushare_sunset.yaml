# TuShare 授权日落决策 — 每个仍在 tushare 的域，到期后怎么办
#
# 硬事实: 授权 2026-09-10 到期，业主已决定**不续期**。tushare.py 在 expires_at <= now 时
# 直接 raise TuShareAuthorizationError，是硬停不是降级。
#
# 本文件是**决策记录 + 执法输入**，不是叙述: 每个域必须有 decision，
# 缺决策 = 到期后静默断流且无人知道它断了 —— 项目教训 [[feedback-defer-requires-detectability]]
# 「说『先不做』前必答: 它出现时哪行代码告诉我」。
#
# decision 取值:
#   replace        — 已有已验证替代，必须在到期前切换 (must_by 给期限)
#   derive         — 可由「已注册域 + 公开规则」推导，退役取数域 (根因立法 §5.9)
#   freeze         — 明确接受断流: 到期后台账不再更新，消费方读到的是最后一次同步的
#                    冻结快照。原 accept/accept_outage 两个值在此合并 (2026-09-04
#                    收口) —— 那两者的区分点「有没有活跃消费方」本应由
#                    `chunkyctl lineage impact` 机器判定，手写在这份台账里已经判错
#                    三次 (moneyflow/index_dailybasic/cyq_perf 手写 accept 但实测
#                    均有活跃消费方)。谁在读、断流后果是什么，写在 evidence 里；
#                    "有没有人用"不再是 decision 取值的一部分。
#   retire         — 域本身退役: 不再需要这份数据 (连"接受旧值冻结"都不需要，
#                    因为没有活跃消费方)
#   undecided      — 尚未裁决 (**这个值只应短暂存在**；门应把它当 FAIL 而非 WARN)
#
# evidence 必须是本项目实测出的数字或 commit，不接受"据说/应该"。evidence 是本文件
# 唯一保留的自由文本槽——2026-09-04 收口前台账里还有 verdict_deviation/note/impact/
# risk/caveat/fallback/residual_risk/impact_if_lost/done_evidence/blocked_by/
# blocked_by_resolved/frozen_at 十二个键，全部没有任何 loader 读过 (只有 checker
# 读 decision/status/replacement + 顶层 authorization_expires/undecided_domains)。
# 叙事(为什么偏离、当时怎么想)进 commit message，不进这张表；可从别处推导的事实
# (frozen_at = 顶层 authorization_expires) 不重复登记。字段必须满足二者之一才能
# 留在这张表: (a) 至少一个 loader 读它且写错/缺失时有门/测试会红 (b) 是这张表
# 唯一的自由文本槽 evidence。KNOWN_KEYS 之外的键 = FAIL, 见 check_tushare_sunset.py。
#
# 字段-决策矩阵 (谁能带哪些额外字段):
#   replace  → must_by, replacement, status, done_at 均可
#   derive   → replacement, status, done_at 可 (无 must_by: 推导链不是"换源"，无期限可催)
#   retire / freeze / undecided → 只有 decision + evidence，不带其他字段
#
# 同一个 target_table (sync_registry.yaml 里的物理表) 若被多个域共用，
# 这些域的 decision 必须相等——一张表不可能一半冻结一半换源。

version: 1
authorization_expires: "2026-09-10"
renew: false

# 未裁决域 (到期前必须做出裁决，否则静默断流)。曾经嵌在 domains 字典里和一个
# dict-of-dicts 混装 (checker 要三处特判才能把它摘出来)，2026-09-04 收口上移到
# 顶层——它本来就不是一个域条目，是一份名单。
undecided_domains: []

domains:

  # ── 已完成 ──────────────────────────────────────────────
  trade_cal:
    decision: derive
    status: done
    replacement: calendar_rule
    evidence: "交易日 = 周一~周五 − 法定节假日; 1990-2026 共 13,162 天与在库日历
      is_open/pretrade_date 逐字段零差异; 22 年『周末开市』例外合计 0 天。
      零供应商依赖，未来交易日不再受任何源限制。"

  # ── replace: 有已验证替代，到期前必须切 ──────────────────
  daily:
    decision: replace
    replacement: fuyao
    must_by: "2026-09-10"
    evidence: "2026-09-16 二次换源 (第一任 replacement tdxhub 已停供: 两台主机任何参数
      恒返 2 字节协议错误帧, 与 pytdx 包逐字节核对确认非解析 bug, 非瞬时故障)。fuyao
      dump (daily-k-10d/daily-k) 价量与 canonical OHLC 实测 100% 相等 (vol/100、
      amount/1000), 含 BJ、不含 B 股 (vendor_scope population_disjoint)。dump 本身无
      pre_close 列 (供应商响应字段表里没有这一列, 不是漏抓), 唯一交易所口径来源是
      baostock query_history_k_data_plus——两条腿合并见 sources/fuyao_daily_k.py。
      北交所结构上不支持 baostock, pre_close 稳态 unknown (~340 行/天, 对 hfq/
      market_pulse 两个下游不可见, 两者都已按项目股票池过滤 BJ)。FuyaoSource 已实现
      daily_k_dump 分派并通过离线单元测试, adapter 就绪待启用。"
    status: done
    done_at: "2026-09-16"

  stock_basic:
    decision: replace
    replacement: fuyao
    must_by: "2026-09-10"
    evidence: "扶摇 /api/meta/tickers/list 筛 asset_type=a-share 得 5,563 只，
      TuShare 的 5,550 只 100% 被覆盖 (严格超集，多出 13 只为待上市新股)，且含 BJ 343 只。
      消费方 security_master 实际只读 symbol/name/ts_code 三列 + market 用于排北交所。"
    status: done
    done_at: "2026-09-01"

  adj_factor:
    decision: derive
    replacement: adjust_factor_pre_close_rule
    status: done
    done_at: "2026-09-08"
    evidence: "2026-09-08 改判 replace→derive: 实际做法不是换供应商, 是自算——不再依赖任何供应商
      因子表。复权因子由 services/adjust_factor.py 从 canonical_nominal_ohlcv_daily.pre_close
      按公开规则推导 (ratio[t] = close[t-1] / pre_close[t]), 不依赖 raw_tushare_adj_factor
      (已冻结在 20260828)。该规则的输入 pre_close 本身已带除权调整——tdxhub 供货的 pre_close
      经交易所口径调整 (sources/tdxhub.py:964 _adjusted_pre_close, 公式在 :695), 2026-08-31
      实测 4 只股 pre_close ≠ 前收 (含 000423.SZ −2.728%), 调整确认生效。"

  limit_list_d:
    decision: replace
    replacement: fuyao
    must_by: "2026-09-10"
    evidence: "扶摇三池端点已注册为域 (fuyao_limit_up/down/break_pool)，
      涨停池 20200623 起 (早于 TuShare limit_list_d 的 2023-01 两年半)。"

  moneyflow_dc:
    decision: freeze
    evidence: "2026-09-04 改判 freeze (原拟替代源 eastmoney_push2, 建成 adapter 后可改回 replace): eastmoney_push2 全仓 0 处实现, 同上不现实。原 replace 证据: push2his.eastmoney.com/api/qt/stock/fflow/daykline/get 与
      raw_tushare_moneyflow_dc 同日同票**12 字段位对位匹配** (600000.SH 2026-08-28，
      金额类差 <50 元 = tushare 万元两位小数取整边界，五个 rate 字段完全相同)。
      即同一份东财数据的两个出口，非两个体系。免 key。"

  # ── derive: 可推导，退役取数域 (根因立法 §5.9) ───────────
  stk_limit:
    decision: derive
    evidence: "up/down_limit = round(pre_close × (1±band), 2)，band 由板块定
      (30/68→20%, 92/43/83/87→30%, 其余→10%; 北交所向下取整到分)。
      实测复现率 涨停价 99.82% / 跌停价 99.51%。8,654,737 行本质是几十行规则的逐票逐日展开。"

  suspend_d:
    decision: derive
    evidence: "项目地基原则即『K 线有交易 = 在交易，没有 = 不在』。
      实测正向 97.86% (S 型行当日无 K 线)、反向沪深 99.9%。"

  # ── 有替代但源当前不可用 ────────────────────────────────
  stock_st:
    decision: replace
    replacement: baostock
    must_by: "2026-09-10"
    evidence: "baostock 日K接口的 isST 是**四源中唯一的独立 ST 标志位**(非名称前缀猜测)。
      实测 402 只样本 (202 ST + 200 非 ST) 与 canonical_stock_st_daily **准确率 100.00%**
      (假阳 0 / 假阴 0)。且同一接口一次调用还同时给 OHLCV/preclose/turn/pe/pb/ps/tradestatus,
      即 daily + daily_basic + stock_st + suspend_d 四域的核心需求。"
    status: done
    done_at: "2026-09-01"

  # ── freeze (原 accept，2026-09-04 与 accept_outage 合并): 四源均无等价，明确接受断流 ────────────────────
  cyq_perf:
    decision: freeze
    evidence: "筹码分布(成本分位/胜率)，扶摇/通达信/妙想/baostock 四源枚举均无等价物。"

  forecast:
    decision: freeze
    evidence: "公司自身业绩预告。妙想 forecast 模块 5 个报表全是**卖方分析师预测**，概念不同不可冒充。"

  index_dailybasic:
    decision: freeze
    evidence: "指数 pe/pb/换手。扶摇 valuations 端点文档明确排除指数；其余三源无。"

  limit_cpt_list:
    decision: freeze
    evidence: "最强板块排行。四源均无『最强板块』这一产品概念。"

  moneyflow:
    decision: freeze
    evidence: "个股买卖双向 5 档量额 (10 列)。东财两条线公开吐出的都是**单向净额型**
      (net + 5 档净额/占比)，结构不匹配；扶摇/通达信/baostock 均无。
      通达信 MAC 0x1218 是**另一口径**的失衡代理 (项目已标 accepted=False,
      unit=vendor_imbalance_unspecified, 注释 Not conserved money)，按项目法条
      『资金流单别=vendor算法=观点类，跨体系不可冒充等价』不得当替代。"

  # ── replace: 已测试替代，到期前必须切 ────────────────────
  margin_detail:
    decision: retire
    evidence: "零业务消费方: 唯一触点 fina_margin_recon.py 把它列入 BANNED_EXCHANGE_BASELINE (不可当交易所口径基准); legacy_raw_plane 标 blocked_no_publication。在库 4,820,384 行 20190102-20260826 按年连续无缺口。妙想 RPT_MARGIN_STATISTICS_STOCKS 同 grain 但从未对账, 零消费不值得投入验证。断流不影响任何在产功能; 历史留库 (删源≠删数据)。"

  moneyflow_hsgt:
    decision: retire
    evidence: "本域是全市场每日一行的聚合流量 (north_money/south_money/hgt/sgt), **与已停更的个股北向持股 hk_hold 是两码事**, 未受其影响。零消费: 唯一读取者 northbound_market_flow.py::latest_northbound_market_flow() 全仓库**零调用方**, 是死代码; legacy_raw_plane 标 sync_orphan 且在 publication_watchlist (承认'以后可能有用但现在没人用')。在库 2,776 行 20141117-20260828 连续。**「四源均无市场级聚合流量等价物」这句 2026-09-06 实测推翻**: 原结论只试了妙想/ifind/其余两源, 没试 akshare。实测 `akshare.stock_hsgt_hist_em(symbol='北向资金')` 返 2,776 行(与本域在库行数一致) × 13 列, 起点同为 20141117, 含 当日成交净买额/买入成交额/卖出成交额/历史累计净买额/当日资金流入/持股市值/领涨股 —— 覆盖本域全部四个字段且更宽; `stock_hsgt_fund_flow_summary_em` 另给当日沪股通/深股通/港股通分板块净额(实测最新 20260904)。走的是东财出口, 与妙想同厂商, 不构成跨体系冒充。故本域**有替代源, 只是当时没试到**; decision 维持 retire 的理由改为「零消费」一条, 不再是「无替代」。若日后北向研究页要用日频面, 从 akshare→东财接入即可。附: 个股级每日北向持股确已消失(实测 `stock_hsgt_hold_stock_em` 直接抛错; 妙想 RPT_MUTUAL_STOCK_HOLDRANKN_NEW 虽在 registry 标 frequency=daily, 实测只返 4 个季度末 20250930/20251231/20260331/20260630, DATE_TYPE 写「2026二季度」), 这与港交所 2024-08 改季度披露一致, **不是换源能解决的**。"

  moneyflow_ind_dc:
    decision: freeze
    evidence: "2026-09-04 改判 freeze (原拟替代源 eastmoney_push2, 建成 adapter 后可改回 replace): eastmoney_push2 全仓 0 处实现。**这是四个改判里代价最大的一个** —— market_pulse 板块/概念资金龙头会停更, 属产品三问「市场在哪」。原 replace 证据: **活跃消费**: market_pulse.py 五处引用驱动 mart_sector_pulse_daily 板块/概念资金龙头, 经 /api/v3/pulse 到前端 flow_board?chain=dc_industry / dc_concept / heatmap / flow_stripe, 端到端确认。在库 335,161 行 20240102-20260828 无缺口。候选 eastmoney_push2 继承姊妹域 moneyflow_dc 的证据链 (12 字段位对位匹配), 项目笔记已写明'板块/市场/北向字段体系同构', **但本域 grain 从未逐日对账**——被 push2his 限流挡住。注: 资金流供应商算法属观点类, 但 push2 是**同厂商东财同算法**换出口, 不构成跨体系冒充。fallback: 9 天内测不完则降 freeze, 后果=板块资金龙头/热力图 dc chain 冻结。"

  moneyflow_mkt_dc:
    decision: freeze
    evidence: "2026-09-04 改判 freeze (原拟替代源 eastmoney_push2, 建成 adapter 后可改回 replace): eastmoney_push2 全仓 0 处实现。原 replace 证据: **活跃但更薄**: market_pulse.py:802 取 mkt_net_amount 进 mart_market_pulse_daily 大盘情绪面板一列, 前端 /api/v3/pulse/sentiment 确认。属展示型消费, 无证据它 gate 任何策略信号。在库 818 行 20230417-20260828 逐年满勤。候选同 moneyflow_ind_dc (eastmoney_push2, 未测), **建议合并测试省一次限流冷却**。fallback freeze: 断流后仅该列冻结, 面板其余 9 列来自其他域不受影响。"

  report_rc:
    decision: retire
    evidence: "零业务消费方: assignment_gap_recon 只把它列为 product_mismatch 不对账; foundation_obs_serve 只是对全 43 域一视同仁的同步新鲜度监控; legacy_raw_plane 标 'historical load_analyst_reports retired; no formal plane'。**更正一条过时说法**: 所谓'中间 12 年整段挖空'指的是 2010-2019 段, 而 data_start 早已收窄到 20190102 (对齐 K 线真相源起点), 实测在库 1,684,839 行 2019-2026 **按年连续无挖空**。唯一测过的候选妙想 RPT_HSF10_RES_ORGRATING 已判 product_mismatch (研报目标价明细 ≠ 评级统计包, grain 不同)。"

  share_float:
    decision: retire
    evidence: "零业务消费方: 仅 assignment_gap_recon 对账、audit_date_bounds 的未来日期豁免样例、通用健康面板。在库 16,580,813 行 (grain 含 holder_name 故行数远大于事件数) 20190102-20260827, 2021 年 495 万是解禁潮非异常, 无挖空。候选妙想 RPTA_APP_LIFTFUTURE 已实测判定不等价: TuShare 是 holder 级明细, 妙想是 stock-day 解禁聚合, jaccard=0.3, same_product=false。"

  stk_holdernumber:
    decision: replace
    replacement: 妙想 RPT_F10_EH_HOLDERNUM
    must_by: "2026-09-10"
    evidence: "**活跃**: holdernumber_assist.py 经 DataAccess 读 v_holder_number_period, 上游 stock_dossier.py:873 进个股档案 holder_number 集中度辅助, 经 /api/v3/stock 到前端档案页, 端到端确认; 2026-07-24 owner 刚 RESTORE 过接线。在库 336,864 行 20190101-20260827 无缺口。候选已实测 (样本 600519.SH): 户数 296,404 **完全一致**、end_date 一致、ann_date=NOTICE_DATE 一致, same_product=true; 仅因**只测了 1 样本 1 截面**未切 primary。工程路径现成 (holders_aif10.py 已按同模式接 canonical)。**9 天内必做**: 扩样本覆盖 ST/北交所/密集披露日边界。fallback freeze: 档案页该字段冻结, 前端已有 fail-closed 标 holder_number_empty 不会崩。"

  stk_holdertrade:
    decision: freeze
    evidence: "**有活跃消费方但无可用替代**: institution_profile.py:72 经 compare_disclosure_research_shadow 进 Tier3 披露研究 disclosure_shadow 侧栏, 经 /api/v3/inst 到前端确认; 另有完整 E0 land→accept→canonical 管线 (canonical_stk_holdertrade_announcement 已 73,304 行)。在库 72,340 行 20190102-20260715。**两个妙想候选均已实测判定 product_mismatch**: RPT_F10_SHAREHOLDER_CHANGE (TuShare 是公告事件轴 ann_date×holder_name, 妙想是十大股东季度差分 end_date×holder_rank, 轴不同) 与 RPT_EXECUTIVE_HOLD_DETAILS (高管持股变动≠股东增减持)。断流后果: 该维度停更, 已落库 raw 72,340 + canonical 73,304 行历史保留, 回测不受影响。真要替代需重新调研产品级差异, 非简单换源。"

  stk_surv:
    decision: retire
    evidence: "零消费: 下游 mart_stock_survey_activity **已于 2026-06-28 物理删除** (data_audit_rules/data_audit 双处确认), 之后是纯 landing 表; legacy_raw_plane 标 serve_l0_declared 'no formal plane'。在库 839,098 行 20210805-20260818 无缺口。候选妙想 RPT_ORG_SURVEYNEW 已实测对账两次: surv_date 与 RECEIVE_START_DATE / NOTICE_DATE 两个候选日期字段均对不齐 (jaccard 0.34 / 0.42, same_product=false)。注: 妙想覆盖面明显更宽 (1568/751 vs 本地同期 17 条), 未来若重建该功能它是更优起点, 但轴对齐需重新设计。"

  sw_daily:
    decision: freeze
    evidence: "2026-09-04 改判 freeze (原拟替代源 ifind_shenwan_index, 建成 adapter 后可改回 replace): ifind 无 adapter (全仓 grep sources/ 无实现), 6 天内从零建生产级 sync adapter 与另 9 域切换并行不现实。断流后果: 申万 RS 三条链路冻结, dc_industry/dc_concept 不受影响。要恢复 replace 需先交付 adapter。原 replace 证据: **活跃且用量重**: market_pulse.py 五处 + routers/market_pulse.py:569 驱动申万 RS 双窗/rs_rank_4w/turnover_amt_share (588 码含全级指数), 前端 pulse/heatmap|rotation|drill?chain=sw_industry 三条链路端到端确认。在库 921,483 行 20190102-20260828 无缺口。候选实测: mcp__ifind-index__sector_data 查'申万一级行业银行指数 2026-08-28'返回收盘价 8.6948 + 成交额 250.1994 亿, **确认覆盖申万 L1**。**但两点未验证**: (1) L2/L3 覆盖比例未知 (588 码里大部分是 L2/L3); (2) 该 MCP 是自然语言查询接口, **不在项目已知三 adapter 之列**, 能否变成生产级 sync adapter (授权/批量/稳定接口) 未定。注: ifind=同花顺, **与代码里的'妙想'(东财 aif10 scraper) 是不同供应商**。fallback freeze: sw_industry 三条链路冻结, 但 dc_industry/dc_concept chain 不受影响, 前端仍有一条链路可看。"

  top_inst:
    decision: replace
