# vendor_gaps.yaml — 已核实"妙想缺、交易所有"的登记缺口 (grain 契约重落验收,
# backend/scripts/reland_event_domain.py load_vendor_gaps)。
#
# 这是 verify() 接受这类缺口的唯一通道: 每条必须带交易所证据 (evidence) 与实际
# 核对日期 (checked_at), 不给任何命令行放行旗子 (没有 --allow-gap/--skip-residual
# 之类的参数) —— 免得成为绕过验收的后门。登记的缺口若后来又出现在表里 (供应商
# 回补/重落重跑), verify 应该失败, 此时应该删掉对应条目, 而不是留着一个已经不再
# 缺的登记 (那样反而会掩盖回归)。
#
# V1 (2026-09-12 验收判据切片一) 只建通道 + loader 校验 + 记账时存证它的 sha256;
# 分类逻辑当时还不读这份登记, 所有 residual 恒落 unverified。
#
# V2 (同日, 交易所证据层) 起, verify() 传了 --exchange-dir 时
# `_apply_exchange_evidence` 实际在三处读这份登记 (reland_event_domain.py
# 头注 N), 不再是摆设: (1) `exchange_verdicts` 判成 miaoxiang_gap (交易所有、
# 新表缺) 的旧行, 其 `gap_key` 是否在这份登记里 -> 已登记记
# miaoxiang_gap_registered, 没登记记 miaoxiang_gap_unregistered (硬失败);
# (2) `ceiling_compare` 算出的 ceiling gap (交易所有、覆盖范围内新表没有) 同样按
# `gap_key` 查这份登记 -> ceiling.gap_registered/gap_unregistered (未登记硬失败);
# (3) 已登记的缺口 key 如果按 `exchange_key` 多重集在该 trade_date 的新表行里
# 重新出现 (供应商回补/重落已经把这个缺口填上了) -> registered_gap_present (硬
# 失败, 提示该条登记已经过期该删了, 但删除是人工动作, 这里只报警不自动摘)。
# 没传 --exchange-dir 时 (V1 语义) 分类逻辑仍不读这份登记, residual 照旧全部落
# unverified。
#
# 每条 gaps[] 元素的键恰为: domain / trade_date (YYYYMMDD) / ts_code / key (该域
# key_cols 对应的值列表, 字符串) / evidence (交易所页面核对说明) / checked_at
# (YYYY-MM-DD, 核对当天, 不是登记当天)。
version: 1
gaps: []
