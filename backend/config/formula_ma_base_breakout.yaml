# 均线筑底突破公式参数
# 模式: MA5 长期低于 MA90 → 突破并站稳 MA145
# Usage: PYTHONPATH=backend python backend/services/bc_absorbed/scripts/formula_parameter_search.py --only ma_base_breakout

# --- 均线窗口 ---
ma:
  short: 5               # 短期均线
  mid: 90                 # 中期均线
  long: 145               # 长期均线 (站稳线)

# --- 筑底条件 ---
base:
  below_days_min: 45      # MA5 低于 MA_mid 最少天数
  ma5_rising_min: 7       # 近 10 天 MA5 上升天数 >= N
  ma5_rising_count_window: 10  # MA5 上升计数窗口

# --- 突破条件 ---
breakout:
  breakout_lookback: 11   # 近 N 天内有突破 MA_long
  breakout_recent_days: 10  # 突破后回看天数

# --- 价格约束 ---
price:
  price_top_buffer: 1.06  # close <= top × N (防追高)
  price_long_ma_buffer: 1.10  # close <= MA_long × N

# --- 回测 ---
backtest:
  hold_days: [5, 10, 15, 20, 30, 60]
  tx_cost_bps: 15
  start_date: "2023-01-01"
