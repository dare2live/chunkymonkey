# 活跃度大牛突破公式参数
# 模式: K 线活跃度 X15 向上突破大牛线
# Usage: PYTHONPATH=backend python backend/services/bc_absorbed/scripts/formula_parameter_search.py --only activity_breakout

# --- 大牛线 ---
bull_line:
  big_bull_line: 6.0      # X15 突破阈值 (大牛线)
  x15_multiplier: 1.2     # X15 放大系数
  strong_line: 3.0        # 退出阈值 (X15 < strong_line 平仓)

# --- 涨跌幅过滤 ---
return_filter:
  min_close_ret: -100.0   # 当日涨跌幅下限 (%)
  max_close_ret: 100.0    # 当日涨跌幅上限 (%)

# --- 信号控制 ---
signal:
  signal_cooldown_days: 0  # 信号冷却天数

# --- 板块涨停适配 ---
# 涨停幅度按板块自动适配 (services/universe.py::get_limit_up_pct):
#   沪深主板(60/00): 10%, 创业板(30): 20%, 科创板(68): 20%
# big_bull_line 可按 limit_pct 比例缩放 (需传 limit_up_pct 参数)
limit_adapt:
  enabled: false          # 是否按板块自动缩放 big_bull_line
  base_limit_pct: 0.10    # 基准涨停幅度 (主板 10%)

# --- 回测 ---
backtest:
  hold_days: [5, 10, 15, 20, 30, 60]
  tx_cost_bps: 15
  start_date: "2023-01-01"
