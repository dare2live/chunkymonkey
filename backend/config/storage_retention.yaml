version: 1

defaults:
  mode: dry_run
  require_explicit_execute_flag: true
  large_delete_row_threshold: 1000000

payload_audit:
  max_value_warn_bytes: 1048576
  max_value_fail_bytes: 10485760
  total_value_warn_bytes: 10485760
  total_value_fail_bytes: 104857600
  top_sample_rows: 20
  duplicate_sample_warn_count: 2
  fail_on_recursive_keyword: true
  warn_on_path_marker: true
  payload_column_name_tokens:
    - json
    - payload
    - audit
    - evidence
    - summary
    - signals
    - blob
    - bytes
    - raw_text
    - raw_json
    - raw_bytes
    - command
    - path
    - url
    - artifact
    - details
    - preview
    - warning
    - blocker
    - reason
    - lineage
  recursive_keywords:
    - latest_dispatch
    - queue_items
    - audit_json
    - signals_json
    - preview
  path_markers:
    - data/reports/
    - analysis/
    - /logs/
    - .log
    - file://
  reviewed_columns:
    - table: fact_technical_trigger
      column: reason_codes_json
      classification: compact_per_signal_reason_codes
      owner: formula_engine
      reason: Compact per-row formula trigger reason codes; row count can grow with signal history, but each value must stay tiny and non-recursive.
      max_value_bytes: 512
      max_total_value_bytes: 268435456
    - table: mart_macd_state_history
      column: reason_codes_json
      classification: diagnostic_state_history_evidence
      owner: formula_engine
      reason: MACD state history is evidence-only; per-row reason codes are bounded and intentionally retained for candidate-supply audits, so aggregate volume can grow with history without becoming recursive.
      max_value_bytes: 512
      max_total_value_bytes: 67108864
    - table: mart_today_signal_cache_signal
      column: signal_json
      classification: bounded_cache_detail_row
      owner: signals_v2
      reason: Replacement for the former single-row signals_json blob; one bounded JSON row per signal keeps API cache replayable without recursive nesting.
      max_value_bytes: 8192
      max_total_value_bytes: 67108864
    - table: raw_aif10_financial_history
      column: raw_json
      classification: bounded_raw_source_record
      owner: financial_source_ingestion
      reason: AIF10 source snapshots are replayable raw inputs; large total volume is expected only when each source record remains bounded.
      max_value_bytes: 16384
      max_total_value_bytes: 67108864
    - table: raw_tdx_f10_holder_research
      column: raw_text
      classification: bounded_raw_source_record
      owner: tdx_f10_source_ingestion
      reason: TDX F10 holder raw text is a protected replay source; total volume is acceptable only with bounded individual records and zero recursive keys.
      max_value_bytes: 65536
      max_total_value_bytes: 1073741824
    - table: raw_tdx_gpcw_wide
      column: field_values_json
      classification: bounded_raw_source_record
      owner: tdx_gpcw_source_ingestion
      reason: TDX GPCW wide field JSON is a protected replay source; total volume is acceptable only with bounded individual records and zero recursive keys.
      max_value_bytes: 8192
      max_total_value_bytes: 536870912
    - table: mart_architecture_inventory_asset
      column: api_routes_json
      classification: governed_architecture_inventory_paths
      owner: architecture_inventory
      reason: Architecture inventory intentionally records route/path references; path markers are lineage evidence, not embedded artifacts.
      allow_path_marker: true
      max_value_bytes: 4096
      max_total_value_bytes: 1048576
    - table: mart_architecture_inventory_asset
      column: frontend_api_calls_json
      classification: governed_architecture_inventory_paths
      owner: architecture_inventory
      reason: Architecture inventory intentionally records frontend API path references; path markers are lineage evidence, not embedded artifacts.
      allow_path_marker: true
      max_value_bytes: 4096
      max_total_value_bytes: 1048576
    - table: mart_paper_sim_kpi
      column: lineage_url
      classification: governed_lineage_pointer
      owner: paper_sim_lineage
      reason: Lineage URL is an intentional pointer to a report artifact, not a copied artifact payload.
      allow_path_marker: true
      max_value_bytes: 512
      max_total_value_bytes: 1048576
    - table: mart_strategy_result_registry
      column: evidence_json
      classification: governed_strategy_evidence_pointer
      owner: strategy_result_registry
      reason: Strategy evidence can include artifact path references; recursive audit payloads remain blocked by recursive-key detection.
      allow_path_marker: true
      max_value_bytes: 4096
      max_total_value_bytes: 1048576
    - table: mart_strategy_result_registry
      column: lineage_url
      classification: governed_lineage_pointer
      owner: strategy_result_registry
      reason: Lineage URL is an intentional pointer to a report artifact, not a copied artifact payload.
      allow_path_marker: true
      max_value_bytes: 512
      max_total_value_bytes: 1048576
    - table: mart_stock_formula_optuna_bestchoice_v1
      column: source_artifact
      classification: governed_source_artifact_pointer
      owner: bestchoice_phase1_import
      reason: BestChoice candidate rows store source artifact pointers for reproducibility; they must remain short pointers, not embedded artifacts.
      allow_path_marker: true
      max_value_bytes: 512
      max_total_value_bytes: 1048576

protected_model_statuses:
  - champion
  - challenger
  - shadow

candidate_feature_panels:
  - table: fact_feature_panel_candidate
    key_column: feature_set_id
    built_at_column: built_at
    retain_latest_keys: 3
    protect_if_referenced_by_lifecycle_training_config: true
    protect_if_referenced_by_model_selection_run: true

model_prediction_tables:
  - table: mart_multidim_prediction
    model_id_column: model_id
  - table: mart_daily_recommendation
    model_id_column: model_id
  - table: mart_daily_topk_view_cache
    model_id_column: model_id
  - table: mart_daily_recommendation_risk
    model_id_column: model_id
  - table: mart_model_explanation
    model_id_column: model_id
  - table: mart_daily_recommendation_explanation
    model_id_column: model_id
  - table: mart_model_walkforward_prediction
    run_id_column: run_id
    model_id_source_table: mart_model_walkforward_fold
    model_id_source_run_id_column: run_id
    model_id_source_model_id_column: model_id

protected_artifact_tables:
  - table: raw_tdx_f10_holder_research
    reason: TDX F10 raw holder snapshots are replayable source records
  - table: raw_tdx_f10_holder_count_history
    reason: TDX F10 parsed raw holder-count snapshots support source-date replay
  - table: raw_tdx_f10_extra_parse_status
    reason: TDX F10 parse ledger prevents repeated failed or terminal parses
  - table: mart_tdx_f10_capability_matrix
    reason: TDX F10 capability and PIT-date matrix is source governance evidence
  - table: mart_feature_pit_audit
    reason: PIT audit rows gate feature and model promotion
  - table: mart_feature_pit_coverage_summary
    reason: high/critical PIT coverage summary is model governance evidence
  - table: mart_stock_horizon_selection
    reason: per-stock holding horizon selection is recommendation evidence

model_file_roots:
  - data/multidim_models

optuna_study_roots:
  - data/optuna
