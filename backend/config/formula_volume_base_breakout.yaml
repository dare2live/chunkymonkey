# 巨量蓄势启动公式参数
# 模式: 巨量后缩量横盘 → 温和放量突破平台
# Usage: PYTHONPATH=backend python backend/services/bc_absorbed/scripts/formula_parameter_search.py --only volume_base_breakout

# --- Step 1: 巨量 spike 识别 ---
spike:
  spike_lookback: 30       # 往回找 spike 的天数
  spike_ratio: 2.0         # 量 >= MA20 × N (volume)
  amount_spike_ratio: 2.0  # 额 >= MA20 × N (amount)

# --- Step 2: 横盘筑底 ---
base:
  base_min_days: 8         # 筑底最短天数
  base_max_days: 90        # 筑底最长天数
  base_range_max: 0.35     # 横盘振幅上限 (H-L)/L
  base_floor: 0.75         # close / spike_close >= N
  base_ceiling: 1.60       # close / spike_high <= N

# --- Step 3: 缩量确认 ---
dry:
  dry_ratio: 0.30          # 后半段均量 / 前段均量 <= N
  dry_spike_ratio: 0.55    # 后半段均量 / spike 日量 <= N

# --- Step 4: 温和放量突破 ---
warm:
  warm_vol_ratio: 0.60     # 近 5 日均量 / MA20 >= N
  warm_ret_min: 0.0        # 近 5 日涨幅下限
  warm_ret_max: 0.60       # 近 5 日涨幅上限

# --- Step 5: 突破条件 ---
breakout:
  breakout_window: 20      # 参考高点回看窗口
  breakout_near_high: 0.0  # close >= 平台高点 × N (0=不限)
  breakout_max_extension: 9.99  # close <= 平台高点 × N (防过度追高)

# --- 信号控制 ---
signal:
  signal_cooldown_days: 0  # 信号冷却天数

# --- 回测 ---
backtest:
  hold_days: [5, 10, 15, 20, 30, 60]
  tx_cost_bps: 15
  start_date: "2023-01-01"
