version: 1
updated_at: "2026-06-04"

allowed_stage_bins:
  - "1"
  - "1.5"
  - "2"
  - "3"
  - "4"

sources:
  - source_id: fact_technical_trigger
    table: sm.fact_technical_trigger
    semantic_role: trade_trigger
    eligibility: stage_opt_candidate_supply
    pit_status: signal_date_pit
    grain:
      - stock_code
      - date
      - formula_id
    required_joins:
      - sm.fact_signal_context on stock_code,date
      - v_price_kline_qfq daily qfq bars on stock_code,date range
    allowed_consumers:
      - audit_stage_opt_candidate_supply
      - optimize_per_stock_stage_strategy
  - source_id: mart_macd_state_history
    table: sm.mart_macd_state_history
    semantic_role: diagnostic_state_history
    eligibility: diagnostic_candidate_supply_only
    pit_status: diagnostic_mart_with_warmup
    grain:
      - stock_code
      - date
      - formula_id
      - formula_variant
      - state
    include_formula_ids:
      - macd_golden_cross
    required_joins:
      - sm.fact_signal_context on stock_code,date
      - v_price_kline_qfq daily qfq bars on stock_code,date range
    allowed_consumers:
      - audit_stage_opt_candidate_supply

formula_scope_overrides:
  research_challenger:
    - gs_raw_buy
    - gs_pullback_confirm
    - ma_base_breakout
    - activity_breakout
    - volume_base_breakout
