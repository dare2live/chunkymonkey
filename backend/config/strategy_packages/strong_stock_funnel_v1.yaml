# 强势股三步漏斗 v1 —— 业主 2026-09-02 口述, 逐字转录为可执行规格
#
# 状态: **备用规格, 未接线**。刻意**不加入** services/strategy_spec.py 的 ALLOWED_PACKAGES ——
#   load_all_strategy_packages() 是按白名单遍历而非扫目录 (实测 strategy_spec.py:435),
#   故本文件与既有三包同处一目录但不被旧 StrategySpec/claimable 机制加载。
#   理由: 2026-09-02 业主定新方向 = 判例查询 (给公式看历史表现), 不再有"策略够不够格"的发布门;
#   把本规格塞进旧机器等于给一个正在被替换的东西续命。
#
# 与既有三包的形状差异 (为什么不套它们的 schema):
#   既有包是 "单一入场信号 + 出场事件" 的形状 (candidate_generation/entry_kind/exit_event...)。
#   本策略是 **三级漏斗** (5000 → 50 → 5 → 1~2), 每级判据不同、且带完整操作纪律。
#   硬套会把漏斗压平成一个信号, 丢掉"每一级各筛掉多少"这个最有价值的中间量。
#
# ── 两条必须先知道的现实约束 (实测, 非推测) ─────────────────────────────────
#
# [C1] 第三步的筹码数据 **2026-09-10 起冻结**。
#   来源 raw_tushare_cyq_perf (8,394,360 行) 是 tushare 的**专有算法输出**,
#   而 tushare 授权 2026-09-10 到期不续期 (实测探针 expires_at=2026-09-10T08:49:00+08:00)。
#   到期后该表不再更新 —— 第三步会拿冻结值判断"今天"的筹码集中度, 即冻结值参与当期结论。
#   替代候选: turnover_overlay_v1 (见 backend/scripts/recon_cyq.py), 但它是**换手率叠加**
#   不是筹码分布, 口径不同, 未验证可替代。**这是本规格最大的开放项。**
#
# [C2] 操作段的"分时图/15 分钟/60 分钟"**本项目没有数据**。
#   goal.md 明写 "不做高频/日内"。系统只有日频 OHLCV。
#   故操作段 (entry_execution / exit_execution) 记录为**人工纪律**, 系统只能:
#     - 算出"今天哪些票满足回踩条件" (日频可判)
#     - 事后回看"若按该纪律执行, 历史上表现如何" (需要日内数据才能精确, 目前只能日频近似)
#
# ── 未定阈值 (业主口述里没给数, 我不替你编) ────────────────────────────────
# 下面凡标 TODO_OWNER 的, 都是实现前必须定死的值。留空比填一个猜的数诚实 ——
# 猜的数会一路传到"历史胜率"里, 而没人记得它是猜的。

version: 1
package_id: strong_stock_funnel_v1
spec_id: strong_stock_funnel_v1
origin: owner_dictated_2026_09_02
wired: false          # 未接线; 接线前需 (a) 定死全部 TODO_OWNER (b) 解决 C1 筹码冻结
one_liner: "在资金聚集的地方找机会, 在趋势确认的位置动手, 在均线破位的时候离场"

# ══ 第一步: 成交量 —— 5000 只 → 约 50 只 ════════════════════════════════════
# 业主原话: "强势股启动前, 成交量一定有异常"; "这个区间最干净, 涨停的太扎眼, 没涨的没动静"
stage_1_volume:
  intent: 用成交量把范围缩到 50 只以内
  universe: 沪深A股全体
  filters:
    - id: pct_chg_band
      rule: "当日涨幅 ∈ [3%, 5%]"
      field: pct_chg
      min: 3.0
      max: 5.0
      rationale: "涨停太扎眼 (已被市场发现), 没涨的没动静 (资金未进场)"
    - id: volume_surge
      rule: "成交量 > 前 5 日均量 × 2"
      field: vol
      baseline: "MEAN(vol) OVER (前 5 个交易日, 不含当日)"
      multiple: 2.0
      todo_owner:
        - "前 5 日均量是否含当日? 口述为『前五天』, 本规格取**不含当日**, 需确认"
        - "停牌日如何处理: 跳过 (取最近 5 个有成交日) 还是计入 0? 影响均量分母"
    - id: turnover_band
      rule: "换手率 ∈ [3%, 10%]"
      field: turnover_rate
      min: 3.0
      max: 10.0
      rationale: "低于 3% 没资金关注, 高于 10% 太热容易高位震荡"
      data_note: "turnover_rate 来自 daily_basic; 该域 09-10 后需换源 (台账 decision=replace→妙想)"
  expected_survivors: "约 50 只 (业主经验值; 前两条约到 100 只, 加换手率后不到 50)"

# ══ 第二步: 走势结构 —— 50 只 → 5 只以内 ════════════════════════════════════
# 业主原话: "强势股有一个共同特征"
stage_2_structure:
  intent: 用走势结构筛到 5 只以内, 这 5 只就是候选强势股
  filters:
    - id: ma_bullish_alignment
      rule: "均线多头排列"
      todo_owner:
        - "**哪几条均线?** 口述只说『多头排列』。常见口径 MA5>MA10>MA20>MA60, 但未指定"
        - "是否要求严格递减, 还是允许相邻两条相等/交叉容差?"
    - id: above_ma5
      rule: "股价在 5 日均线上方运行"
      field: close
      condition: "close > MA5"
      todo_owner:
        - "『运行』是仅看当日, 还是要求连续 N 日在 MA5 上方? 口述未指定"
    - id: had_volume_thrust
      rule: "最近一个月内出现过至少一次放量拉升"
      todo_owner:
        - "**『一个月』= 20 个交易日还是 30 个自然日?** 本项目日历可精确到交易日, 需选定"
        - "**『放量』阈值?** 与第一步的 2 倍同口径, 还是另设?"
        - "**『拉升』阈值?** 单日涨幅门槛未给"
    - id: shrink_pullback_holds_ma10
      rule: "随后缩量回调不破 10 日均线"
      condition: "回调期间 low >= MA10"
      todo_owner:
        - "**『缩量』阈值?** 相对放量拉升日的成交量比例未给"
        - "『不破』= 收盘不破 还是 最低价不破? 二者差异很大 (影响假突破处理)"
        - "『随后』的时间窗: 放量拉升之后多少个交易日内算数?"
  expected_survivors: "5 只以内"

# ══ 第三步: 筹码集中度 —— 5 只 → 1~2 只 ═════════════════════════════════════
# 业主原话: "两个条件同时满足, 说明主力高度控盘, 筹码锁定良好"
# ⚠ 见文件头 [C1]: 该步数据 2026-09-10 起冻结
stage_3_chips:
  intent: 用筹码确认 1 到 2 只
  data_source: raw_tushare_cyq_perf
  data_freeze_date: "2026-09-10"
  filters:
    - id: cost_range_90_width
      rule: "90% 成本区间宽度 < 20%"
      threshold: 20.0
      todo_owner:
        - "**宽度相对什么?** (high_90 - low_90) / close? / mid? / low_90? 三种口径结果差很多"
        - "确认 cyq_perf 的哪两列对应 90% 区间上下沿"
    - id: cost_concentration_70
      rule: "70% 成本集中比例 < 15%"
      threshold: 15.0
      todo_owner:
        - "**『集中比例』的确切定义?** 这是通达信侧的专有指标, 需确认 cyq_perf 里对应哪一列,"
        - "以及它与『宽度』是不是同一个东西的两种表述 (若是, 两条件会高度相关而非独立确认)"
  conjunction: AND    # 两个条件同时满足
  expected_survivors: "1 到 2 只"

# ══ 操作 ════════════════════════════════════════════════════════════════════
# ⚠ 见文件头 [C2]: 日内部分本项目无数据, 记录为人工纪律
operation:
  principle: "顺大势, 逆小势"
  entry:
    trend_gate: "日线级别向上"
    timing_frame: "15 分钟或 60 分钟级别找回调买点"
    trigger: "股价回踩 5 日或 10 日均线 + 分时图出现缩量止跌"
    execution_time: 尾盘
    data_gap: "分时/15min/60min 本项目无数据 (goal.md: 不做高频/日内); 系统只能给出日频回踩候选"
    todo_owner:
      - "『回踩』= 触及均线 还是 收盘在均线附近某个带内? 带宽未给"
      - "『缩量止跌』的分时判据未给 (且无数据可算)"
  position_sizing:
    first_tranche: 0.6      # 六成
    add_on_tranche: 0.4     # 创新高加四成
    add_on_trigger: "股价创新高"
    todo_owner:
      - "『创新高』= 创本轮新高 还是 创 N 日新高? N 未给"
  stop_loss:
    rule: "跌破 10 日均线, 无条件走人, 不管亏多少"
    field: MA10
    unconditional: true
    todo_owner: ["『跌破』= 收盘破 还是 盘中破?"]
  take_profit:
    principle: "不猜顶, 不逃顶, 让均线帮你做决定"
    rules:
      - "沿 5 日均线往上走就拿着"
      - "收盘跌破 5 日均线 → 减一半"
      - "跌破 10 日均线 → 清仓走人"
    todo_owner: ["跌破 10 日均线这条与 stop_loss 是同一条; 二者是否需要区分入场后阶段?"]
  holding_discipline:
    quote: "强势股最怕的不是卖飞, 是中途被洗下车。进场之后, 少看盘, 多看均线"
    rule: "五日不破, 持仓不动; 十日一破, 果断离场"

# ══ 接入判例查询引擎时的用法 ════════════════════════════════════════════════
#
# ⚠ 2026-09-03 修正: 本节原先写着「三级漏斗天然就是三个单因子的叠加」(stage_1=量能因子 /
#   stage_2=形态因子 / stage_3=筹码因子)。**那是错的**, 业主两次纠正过同一点:
#     「三级组合不也是同一个策略里的么, 裸 K 线只是基础, 不是选股策略,
#      选股策略必然是多条件多因子的」
#   把漏斗的三级当成三个可分离的因子, 是把**策略自己的构成条件**和**分析用的分桶轴**
#   混成了一件事。这两件事在本项目里是正交的两层, 混掉会让整个档案的语义塌掉。
#
# 正确的两层结构:
#
#   第一层 —— 策略 (人给的输入, 整体不可拆)
#     本文件从 stage_1 到 operation 的**全部内容合起来 = 一个策略**。
#     它天然是多条件的; "多条件" 是选股公式的常态, 不是"多个因子叠加"。
#     系统对它不做判定、不拟合、不打分, 只问: 它历史上每次触发之后发生了什么。
#
#   第二层 —— 因子 (系统给的分桶轴, 与策略正交)
#     形态 / 筹码分布 / 监管关注度 等**信号日可见**的观测量。
#     它们不参与选股, 只用来把策略的触发点**分堆**, 看哪一堆表现更好。
#     同一个策略, 在"放量上涨"形态下触发 vs 在"缩量上涨"下触发, 胜率差多少 —— 这才是因子。
#
# 于是本规格接进判例查询引擎时的正确用法:
#
#   基线   = 本策略(整体)在全历史全宇宙的触发点, 不做任何分桶 → 一个胜率/收益率
#   单因子 = 同一批触发点, 按**一个**因子分桶 → 每桶一组胜率/收益率
#   多因子 = 同一批触发点, 按因子**组合**分桶 → 每格一组
#   档案   = (本策略 × 每只股票|全市场 × 每个因子格) 的胜率/收益率全表
#   今日   = 今天的信号落在哪一格 → 报该格的历史表现; **格内先例不足报「先例不足」**;
#            **不落在任何历史格里就明说不匹配**, 不外推
#
# ── 另一件事: 分级消融 (与因子分桶无关, 别混) ──────────────────────────────
#   "只用 stage_1 / 加 stage_2 / 加 stage_3 胜率各差多少" 仍然是个**有价值**的问题,
#   但它是**对策略本身做消融**(把一个策略改成三个更宽松的策略分别验证),
#   不是"三个因子叠加"。二者产出形状都是"一串递进的胜率", 极易看混, 故在此点名区分:
#     - 因子叠加: 触发点集合**不变**, 变的是怎么给它们分堆
#     - 分级消融: 触发点集合**每级都不同**(越往后越少), 比的是不同策略
#   要做消融就明写"这是三个策略", 不要让它顶着"因子"的名字混进档案。
consumption_note: |
  本文件整体 = 一个策略, 不是三个因子。因子是另一层(形态/筹码/监管关注度等信号日可见量),
  与策略正交, 只用于把策略的触发点分桶。
  接入判例查询引擎: 基线(不分桶) → 单因子分桶 → 因子组合分桶 → 建成
  (本策略 × 每只股票|全市场 × 每个因子格) 的胜率/收益率档案。
  两条诚实底线是判据的一部分: 格内先例不足报"先例不足"不给数字; 今日信号不落在
  任何历史格里就明说不匹配, 不外推。
  「只用 stage_1 / 加 stage_2 / 加 stage_3」是**对策略做消融**(三个不同策略), 不是因子叠加 ——
  产出形状像但语义不同, 要做就明写是消融。
