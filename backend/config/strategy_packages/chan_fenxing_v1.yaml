# ══ 11. 开放项汇总 (每条上文都有出处与实测计数) ══════════════════════════════════
todo_owner_index:
  group_A_blocks_article_rule:      # 不定就跑不了 article_rule
    - grades.top.1.1 big/small 阈值与量纲 (或采相对读法)
    - grades.top.1.3 长上影阈值与量纲 / 大阴线阈值 / 『守住』口径
    - grades.top.1.4 『包含』与『完全包含』口径 / 大阴线阈值
    - grades.bottom.2.1 far / 参照 (K1.h vs 实体上沿)
    - grades.bottom.2.3 上边沿四读法
    - grades.precedence (强者优先 vs 弱者优先)
  group_B_does_not_block_all_fenxing:   # all_fenxing 与 number-free 维度今天就能跑; 这些定了只改一处
    - inclusion_merge.seed_direction
    - inclusion_merge.strictness (等号)
    - k_anchoring (原始 bar vs 合并 bar 读法)
    - grades.top.1.2 区间口径 (实体 vs 全幅)
    - definitions.doji
    - triggers.re_entry_after_false_top (『几天』与判据)
    - 本文件的最终存放位置 (strategy_packages/ 在退役清单)
