# sync_registry.yaml — 数据域接入唯一注册表 (架构稿 §3 范式, 2026-06-11)
#
# 原则: 一个条目 = 一个数据域接入, 零域专属代码 (sync_runner 读本表驱动一切)。
# 宪法 v2 第 7 条: 新数据域必走本表; 第 9 条 gate(6): services/ 新增 *_sync.py 直写表 = FAIL。
# 宪法 v2 第 6 条: zero_row_policy=fail — 0 行当失败重试, 决不静默落空。
#
# 字段语义:
#   source         数据源 adapter 名 (services/data_sources registry)
#   api            源 API 名 (tushare pro 接口名)
#   target_db      database_manifest.yaml 里的库 alias (新域一律 tushare_raw, 与主库写锁解耦)
#   target_table   legacy compatibility / landing 表；universe_filter 只声明 serve
#                  过滤意图，写前不再删行（A4 landing purity）。正式 project-universe
#                  过滤在 canonical/serve 经 universe_serve_filter + policy hash 留证
#   grain          MERGE 主键 (幂等重跑)
#   batch_mode     by_trade_date (一次调用全市场一天) / by_ts_code / by_month / full_refresh
#   pit_anchor     PIT 锚点列 + 可用时刻语义 (特征 JOIN 纪律的机器可读声明)
#   available_after legacy PIT/调度提示；裸 t+1 尚未声明日期轴，不得扩写其语义
#   availability_policy formal dataset 的 typed 发布时间契约 (axis/rule/at)，是 eligibility 唯一 owner
#   execution_policy typed 执行许可 (mode/reason)；disabled 域仍可只读加载契约与状态，但任何 sync 入口必须在副作用前阻断
#   data_start     回填起点 (E8 探底/文档实测)
#   freshness_sla_trading_days  落后超过 N 交易日 = audit FAIL
#   min_rows_per_batch  单批最低行数 sanity (低于即可疑, 0 行必重试)
#
# 连续性/完整性常驻审查键 (backend/scripts/check_continuity_integrity.py 消费, 2026-07-03 R1 根因2/4/6):
#   known_empty_days   墓碑: 实测源端真空的交易日列表 (探测返 0 非 throttle), 日历缺日审查不计缺
#   gap_tolerance      日历缺日容忍: none(默认, 键不存在=none)=中间空洞 FAIL /
#                      annotate=只标注 WARN (legacy; 优先换成下方 typed 值) /
#                      hk_holidays=港股北向关闭日按 backend/config/hk_northbound_closed_days.yaml
#                      类型化 pass, 非假期残留空洞仍 FAIL /
#                      event_sparse=事件稀疏域(如 dividend)中间空日 typed pass, 尾部 SLA 仍约束
#   freshness_group_col 多榜/多组共表域的分组列 (如 ths_hot data_type): 按组查 MAX(date), 任何组
#                      落后 > SLA x 3 交易日 = FAIL — 根治"表级新鲜度探不到子榜断流" (热基停 4 个月反例)
#   dead_groups        分组墓碑: 已裁决死亡的子榜/组列表, 分组新鲜度不再对其告警
#   (cross_check_domain 同族交叉参照键已在用, 见 top_inst/block_trade 条目)

version: 1

defaults:
  execution_policy:
    mode: enabled
    reason: active
  retry:
    max_attempts: 3
    backoff_seconds: [5, 30, 120]
  zero_row_policy: fail
  watermark_table: mart_data_source_watermark      # 复用 services/source_watermarks
  failure_queue_table: mart_data_source_failure_queue
  target_db: tushare_raw
  # tinyshare 代理限流 (用户 2026-06-17/19): sync_runner._RateLimiter 读此 config **主动节流**
  #   (撞墙前先睡, 优于反应式退避 transient_backoff)。措辞类瞬态限流 _is_transient_ratelimit 退避作兜底。
  #   单接口/全接口滑窗 60s; 并发上限 2 (当前链串行=1, 配置守界, 未来并行需 semaphore)。
  rate_limit:
    per_interface_per_min: 120     # 单接口 120 次/分钟
    total_per_min: 200             # 多接口合计 200 次/分钟
    max_concurrency: 2             # 并发上限 2
  # socket read timeout (防 hung: tinyshare 网关无响应时单次读死等 → 全局 socket 超时令其限时失败 →
  #   退避重试, 不卡死全链。2026-06-19 反例: stk_factor_pro 重试 hung 在无超时 socket 上 71min)。
  fetch_timeout_seconds: 120
  auth_probe_timeout_seconds: 20 # user() 探针网络边界；持 writer lock 时不得无限挂起
  auth_expiry_warn_days: 14       # TuShare user() 授权到期预警唯一 owner；preflight 读取，禁止代码散落阈值

domains:
  # ── P0-a: 资金流 (套一 L2 + 套二 F1 + 退出组件, 一次回填三用) ──
  moneyflow:
    # 同日行数对账: 该域每个交易日应覆盖当日 K 线的全部标的。
    # 这是比 min_rows_per_batch 强得多的完整性判据 —— 底线只能检出"明显残缺"(实测该域底线
    # 3000 而真值 5197, 丢 42% 才报), 对账则丢 1 行就报。
    # verified_since 不是拍脑袋: 判据自身经全历史分层核证, 只在**已证明恒成立**的时期强制,
    # 早于该日期的差额是 vendor 历史覆盖不全, 不是我们的缺口(强制会制造幻影缺口)。
    completeness_ref:
      kind: same_day_row_count
      ref_domain: daily          # K线 = 项目地基真相源 (owner: AGENTS.md §4 Tier 0 truth)
      tolerance: 0
      verified_since: "20260101"
      evidence: "2026-08-18 全历史分层核证: 2026 年 128/128 恒 0; 2025 恒 0 率 89%%, 2020-2024 恒 0 率 0%% 且差额达 -23 (vendor 侧覆盖不全), 故起点取 2026"
    source: tushare
    api: moneyflow
    target_table: raw_tushare_moneyflow
    universe_filter: true            # 2026-06-17 排除列表硬真相源: 写前丢非白名单前缀(北交所/三板)
    grain: [ts_code, trade_date]
    batch_mode: by_trade_date
    pit_anchor: "trade_date; 盘后更新 (文档未写时点, 按 18:00 保守) -> t 收盘截面特征 JOIN t-1"
    available_after: "18:00"
    data_start: "20200101"        # 2026-06-15 用户"回测数据拉齐2020全量": 扩 2020+ 对齐 K线 tushare-qfq (原 20220104)
    freshness_sla_trading_days: 1
    min_rows_per_batch: 3000      # 2026-06-15 扩2020回补降4000->3000: 2020 universe ~3740股 (实测) < 4000 误报; 与 daily 一致, 仍防真截断

  moneyflow_dc:   # 2026-06-16 用户"全拉初评有用数据": 东财个股资金流 (net_amount/net_amount_rate, 补 order-size moneyflow 的东财口径)
    source: tushare
    api: moneyflow_dc
    target_table: raw_tushare_moneyflow_dc
    universe_filter: true            # 2026-06-17 排除列表硬真相源: 写前丢非白名单前缀(北交所/三板)
    grain: [ts_code, trade_date]
    batch_mode: by_trade_date
    pit_anchor: "trade_date; 盘后更新 -> JOIN t-1 (与 moneyflow 同)"
    available_after: "18:00"
    data_start: "20230911"        # 2026-06-28 修: 实测源端真起点=20230911 (旧 20230901 早10天致 20230901-08 假缺口每天重探); 东财个股资金流 ~2023-09 起
    known_empty_days: ["20231122"]   # 2026-07-10 撤销之撤销 (owner=git log --grep gap_root_cause
      # 第四轮节): 2026-07-09 那次"实测vendor现返5075行"的撤销测错域 — 5075 行是姊妹表
      # raw_tushare_moneyflow(个股资金流, 无_dc后缀)的值, 本域 raw_tushare_moneyflow_dc(东财板块
      # 资金流)当日实测仍 0 行 (邻日 20231120/21/23/24 均 5320+行, 交易日历确认该日 is_trading=1
      # 非节假日)。表名仅一个后缀之差 + pit_anchor 注释写"与 moneyflow 同"引导误查, 是根因。
      # 本次墓碑恢复已用正确表名现场 sync_runner 实弹复测 (zero_rows 确认)。
    freshness_sla_trading_days: 1
    min_rows_per_batch: 4000      # 实弹 5419-5965 行 (2023Q4+全宇宙)
    allow_empty_batch: false

  # ── P0-b: 可执行性真相源 + 情绪温度计 ──
  limit_list_d:
    source: tushare
    api: limit_list_d
    target_table: raw_tushare_limit_list_d
    universe_filter: true            # 2026-06-17 排除列表硬真相源: 写前丢非白名单前缀(北交所/三板)
    grain: [ts_code, trade_date, limit]
    batch_mode: by_trade_date
    pit_anchor: "trade_date; 盘后榜单 (文档未写时点) -> JOIN t-1"
    available_after: "18:00"
    data_start: "20230103"        # 2026-06-12: 对齐实际落库防 drain 开闸 (文档支持 2020 起, B 书 W6 需要时回填再改回 20200102)
    freshness_sla_trading_days: 1
    min_rows_per_batch: 10        # 跌停冰点日可能极少, 仅防 0 行
    page_limit: 1000   # 2026-07-09 根因深查第二轮收尾发现(owner=git log --grep gap_root_cause):
                        # 20250407(全球暴跌日, 真实2836只跌停)本地恰好卡整数2500 = 同步当时网关
                        # 截断残留(vendor现裸调已返全量, 全历史仅此1天中招, 已重拉补齐2834行)。
                        # 防御性分页防未来极端行情日复发——与 stk_limit(同为涨跌停榜, 2026-07-06
                        # 因总量增长跨过隐式上限加page_limit:5000)完全同型场景。
    row_dip_tolerance: true   # 2026-07-08 实测 20260707(本地86 vs 中位161)逐行 grain-aware 核对
                              # vendor, 完全一致 0 缺失 — 涨跌停家数本随市场情绪日日波动, 非缺陷
                              # (字段从 gap_tolerance 拆分, 见 check_continuity_integrity.py 说明:
                              # 此域从无 calendar_gaps 问题, row_dip_tolerance 才是准确语义)

  stk_limit:
    source: tushare
    api: stk_limit
    target_table: raw_tushare_stk_limit
    universe_filter: true            # 2026-06-17 排除列表硬真相源: 写前丢非白名单前缀(北交所/三板)
    grain: [ts_code, trade_date]
    batch_mode: by_trade_date
    page_limit: 5000   # 2026-07-06 宪法第6条实锤第N例 (全面数据审计抓获): 该域全市场返回含
                        # 股票+ETF/LOF+B股+北交所混合总量已增长超服务端隐式单页上限 (实测 limit=6000
                        # 仍只回 5800, offset=5800 page2 再回 1877 行, 合计 7677); 声明缺失
                        # page_limit 时 _fetch_paged 直接单次调用不分页 → 6/12→6/15 总量跨过该
                        # 隐式上限首次触发截断, 603/605/688/689/601 前缀(沪主板新代码段+科创板)
                        # 静默丢 ~1500 行/天连续 3 周 (20260615-20260703 实测), 下游
                        # fact_stock_form_daily.buyable 同期出现等量 NULL。5000 留出安全边际
                        # (server 隐式上限观测约 5800, 5000 确保稳定触发分页)。回填见
                        # git log --grep comprehensive_data_module_audit P0#1。
    pit_anchor: "trade_date; 8:40 盘前更新 -> t 日盘前即可用 (罕见的当日可用源)"
    available_after: "08:40"
    data_start: "20190102"   # 2026-07-04 buyable NULL 根因修复: 原 20220104 声明过窄, 实弹探测
                              # pro.stk_limit(trade_date=X) 在 20100104/20200601/20210601 均返回真实数据
                              # (源端覆盖远早于声明) — 改与 daily(消费该表的唯一实际需求上界)对齐 20190102,
                              # 而非盲目回填到源端最早点 (daily 本身未回填更早, 更早的 stk_limit 当前无消费方)。
    freshness_sla_trading_days: 1
    min_rows_per_batch: 3000   # 2026-07-04 下调 (原4000对2019-2021历史段假阳性): 回填时实测2019年
                               # 日行数 3566-3600 (全市场上市数当年仅3742只, daily 表交叉验证), 全部被
                               # 4000 门槛错判 below_min_rows — 数据实为完整 (真截断类反例是数十/数百行
                               # 量级如 top_inst 1000整, 非"比当前全市场略少"这种随上市数自然增长的正常
                               # 历史波动)。3000 留有余量 (远高于任何交易日停牌/临时缺口幅度), 同时不再
                               # 对 2019 年这类真实但较小的历史批次误报。

  stock_st:
    execution_policy:
      mode: enabled
      # Authorized manual single-day only:
      #   chunkyctl sync --domain stock_st --start YYYYMMDD --end YYYYMMDD
      # publishes one accepted ST partition via stock_st_runtime (never legacy raw).
      reason: authorized_manual_generation
    # One partition is manual; never enter --all-due / --drain mass replay.
    sync_policy: on_demand
    population_scope:
      kind: raw_evidence
      population_label: provider_response
      usage: evidence_only
    security_day_partition:
      contract_version: "1"
      coverage_start: "20220104"
      schema_hash: 5b1c04ad582ebc79265ec077ae35aded40b24cc937372e9dd05d2a0f994273e4
    source: tushare
    api: stock_st
    target_db: tushare_raw
    # legacy compatibility only — not accepted publication identity
    target_table: raw_tushare_stock_st
    universe_filter: true            # serve/canonical filter evidence only; landing preserves provider
    grain: [ts_code, trade_date]
    batch_mode: by_trade_date
    partition_by: [trade_date]
    pit_anchor: "trade_date; 9:20 盘前更新 -> t 日盘前可用; 历史每日 ST 名单 = PIT universe 过滤真相源"
    available_after: "09:20"
    availability_policy:
      axis: trading_day
      rule: same_day_at
      at: "09:20"
    data_start: "20220104"        # 接口支持 2016+, 项目 K 线窗口 2022+ 对齐
    freshness_sla_trading_days: 1
    min_rows_per_batch: 100       # 2026-07-09 全审计校准: 全历史 histmin=111(20240329), 近60日
                                   # 中位 208; 本表是 PIT universe 过滤真相源, ST 批腰斩=禁入股
                                   # 漏进 universe(红线相邻); 100≤histmin 零幻影缺口

  suspend_d:
    source: tushare
    api: suspend_d
    target_table: raw_tushare_suspend_d
    universe_filter: true            # 2026-06-17 排除列表硬真相源: 写前丢非白名单前缀(北交所/三板)
    grain: [ts_code, trade_date, suspend_type]
    batch_mode: by_trade_date
    pit_anchor: "trade_date; 更新'不定期' -> 保守 JOIN t-1"
    available_after: "t+1"
    data_start: "20220104"
    freshness_sla_trading_days: 3  # 停牌公告不是每日必有
    min_rows_per_batch: 0          # 无停牌日合法 0 行 (zero_row_policy 例外: allow_empty)
    allow_empty_batch: true
    row_dip_tolerance: true   # 2026-07-08 实测 5 个骤降日(0609/0610/0706/0707/0708) grain-aware
                              # 核对 vendor, 逐日行数一致(0610 仅1行差, 忽略) — 停牌家数天然高方差
                              # (字段从 gap_tolerance 拆分, 此域从无 calendar_gaps 问题)

  # ── 两融族 (B3 2026-07-02 用户点名日更参数, 主升浪 D2 L1 叠加层; 实弹核证见 commit) ──
  margin_detail:
    source: tushare
    api: margin_detail
    target_table: raw_tushare_margin_detail
    universe_filter: true            # 实测单日 4372 行含 ETF (510050 等) → 白名单 60/00/30/68 滤成纯个股
    grain: [ts_code, trade_date]
    batch_mode: by_trade_date
    write_mode: replace_partition    # 完整性门通过后整日替换，清除上游已撤销/旧 partial grain
    partition_by: [trade_date]
    pit_anchor: "trade_date; 交易所 t+1 上午9点前披露 t 日余额 -> t+1 日盘前可用, 特征 JOIN t-1"
    available_after: "t+1"
    # 未决缺口 (2026-08-16 实测, **尚未打墓碑** —— 见下方为什么不能直接打):
    #   drain 对 20260724 / 20260731 / 20260807 / 20260814 一律 err=zero_rows,
    #   跨 8/12 与 8/16 两轮日更、每轮重试 3 次, 全部空。
    #   **四天全是周五, 且都是交易日**; 而 2026-07-24 之前的周五 (0605/0612/0626/0703/
    #   0710/0717 共 6 个) 全部正常入库 —— 所以不是「周五结构性规则」,
    #   是**自 2026-07-24 那周起的持续性回归**。同轮非周五 (0810/0811/0813) 均正常
    #   (4427/4428/4429 行), 排除整体采集故障。
    #   `zero_rows` 语义 = adapter 真的返回空列表 (sync_runner.py:995), 非异常非限流
    #   (限流走 rate_limiter 主动节流 + 异常分支)。
    #   **源端探测已做 (2026-08-16), 结论: 不是我方问题, 但也不该打墓碑**:
    #     直接问 tushare —— margin_detail 对这四天返 0 行, 而同为周五的 20260717 返 4413 行、
    #     相邻周四 20260813 返 4429 行 ⇒ 排除我方请求姿势/参数问题。
    #     (20260619 也返 0, 但它不在交易日历里, 非交易日, 不构成反例。)
    #   **但姊妹接口 margin(汇总) 在 20260724 有 3 行、20260814 有 1 行** ——
    #     交易所那几天**确实有两融业务**, 只是个股明细端点吐不出来。
    #   所以这是 **vendor 侧 margin_detail 端点的数据缺口**, 不是「当天真的没有两融」。
    #   `known_empty_days` 的语义是「该交易日源端**真空**」(第 25 行), 用它标这几天等于
    #   告诉连续性门「这些天本来就该没有数据」—— 而汇总数据证明数据本该存在。
    #   那会把一个**真实缺口**伪装成设计预期, 正是本仓反复在消灭的东西。
    #   故: 保持缺口可见 (continuity 继续报 fail_interior_gaps), 待 vendor 补数据或
    #   owner 裁决是否改用 margin 汇总补齐个股面。
    data_start: "20190102"        # 对齐 K线窗口 (源头 20100331 有, 消费方=D2 特征只需 K线窗内; 实测首日 949 个股)
    freshness_sla_trading_days: 2  # t+1 披露节奏, 给 1 天缓冲
    min_rows_per_batch: 2000      # 2026-07-08 从 800 提高(owner=git log --grep gap_root_cause):
                                   # 800 是历史地板值(2019首日949行), 测不出 20260703 真实52%截断
                                   # (3472→1652)。2000 锚定当前(2026)真实基线 0.6x, 让下次复发直接
                                   # 进 failure_queue。
    min_rows_since: "20220104"    # 2026-07-09 全审计HIGH#4修复: 原注释断言"历史低行数不受影响"只对
                                   # run_domain 成立, 对 drain 不成立(drain 全历史扫"完整日", 2000
                                   # 阈值会把 594 个 2019-2021 真实完整日[941-1999行, 两融标的池
                                   # 2021年才扩过2000]永久判成幻影缺口反复重拉不收敛)。时代分段:
                                   # 本日期起用 2000, 之前用 min_rows_before。
    min_rows_before: 800          # 2019-2021 时代地板(历史最低 941, 800 全历史零幻影缺口)
    allow_empty_batch: false
    batch_completeness:            # 必须在 dedup + universe_filter 后验证，失败批零写入/零 watermark
      group_from: {column: ts_code, transform: exchange_suffix}
      required_groups: [SH, SZ]    # provider API 不支持 exchange 参数；禁止伪 split_by，缺任一市场即 fail closed

  margin:                          # 交易所汇总: B4 市场感知大盘水位原料 (accepted=SSE+SZSE)
    execution_policy:
      mode: enabled
      reason: bounded_calendar_catchup
    # Knife 1b (2026-07-23): contract_version=3 transport = SSE+SZSE only.
    # v2 (BSE-in-canonical) partitions remain read-only wrong-scope evidence;
    # accepted-state reads filter to the current contract generation.
    # Land/accept unfrozen ONLY for on_demand bounded calendar-eligible
    # incremental catchup — NOT --all-due, NOT full-history replay, NOT mass
    # backfill. Product hard-gate / rzrqye stay UNTRUSTED until shadow knife.
    # sync_policy=on_demand = 不进自动 drain ("不强拉"); calendar still drives
    # eligible_end for explicit/manual + acquire latest-eligible catchup.
    sync_policy: on_demand
    # Accepted business claim = 沪深交易所两融汇总 (external_aggregate).
    # Not project_universe_pit; BSE must not enter the accepted claim set.
    population_scope:
      kind: external_aggregate
      venue_field: exchange_id
      venue_ids: [SSE, SZSE]
      population_label: sse_szse_venue_reported_margin
      method: tushare_margin_exchange_summary_sse_szse
      unit: provider_declared_fields
    source: tushare
    api: margin
    target_table: raw_tushare_margin
    grain: [trade_date, exchange_id]
    batch_mode: by_trade_date
    write_mode: replace_partition    # 多市场逻辑批完整后整日原子替换，禁止旧分片残留
    partition_by: [trade_date]
    split_by:
      param: exchange_id
      # v3 transport matches accepted external_aggregate claim (no BSE).
      # Explicit per-venue fetch avoids vendor bare-query omissions (2026-07-08).
      values: [SSE, SZSE]
