    data_start: "20190102"        # 实测首日 2 行 (SSE/SZSE)
    freshness_sla_trading_days: 2
    min_rows_per_batch: 2         # SSE+SZSE only under v3
    allow_empty_batch: false
    batch_completeness:
      group_from: {column: exchange_id, transform: identity}
      required_groups: [SSE, SZSE]
      # v3: no BSE obligation (v2 required_groups_since remains in frozen evidence).
      required_groups_since: {}
    dataset_contract:
      dataset_id: tier0.market_data.margin_exchange_daily
      contract_version: "3"
      schema_id: tier0.market_data.margin_exchange_daily.canonical
      schema_hash: 8935c9be0741707330b7db9fc775a5ec2e71ab24dbf1095124d3d36dcd48f6ff
      # v3 obligations begin after last v2 canonical day (local_max=20260716).
      coverage_start: "20260717"
      canonical_table: canonical_margin_exchange_daily
      owner: tier0.market_data
      writer: services.data_sources.margin_acceptance
      criticality: blocking
      failure_policy: fail_closed
      allowed_fallbacks: []
      consumers:
        - services.data_sources.margin_reconcile
        - services.data_sources.margin_state
      retention: permanent
      rebuild_policy: replay_landing_then_refetch
      retirement_condition: replacement_contract_and_consumer_cutover

