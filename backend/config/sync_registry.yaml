                       # offset=0/6000 均整页满 6000 行, 真实总量 >=12000 (原分析>=30916, 本次复核
                       # 保守下界), 本地缺失 50%+。补 page_limit 激活既有 _fetch_paged 分页防线;
                       # 390 个受影响交易日需要单独回填 (见 git log --grep r4_completion)。
    pit_anchor: "ann_date 公告日 (float_date 未来解禁=前瞻已知, 0 泄露)"
    available_after: "t+1"
    data_start: "20190102"
    freshness_sla_trading_days: 3
