      # by_trade_date 只在交易日历上枚举, 但 ann_date 是解禁公告的真实披露日历日, 实测周末确有
      # 不小数量的公告(20260321周六12条/20240622周六102条), by_trade_date 结构性排除这些
      # 日期。改用 by_ann_date(全日历日枚举), date_param 沿用 ann_date。
    date_param: ann_date          # 接口按公告日切片 (实弹 ann_date 单日 53-3814 行)
    page_limit: 6000   # 2026-07-05 P0 静默截断实锤 (R4 workflow 对抗复核抓获, 宪法第6条同型反例):
                       # 该域此前无 page_limit 声明, 全库 390 个交易日卡在 5900-6021 行(疑似同一硬
