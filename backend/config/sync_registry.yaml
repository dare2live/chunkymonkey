# sync_registry.yaml — 数据域接入唯一注册表 (架构稿 §3 范式, 2026-06-11)
#
# 原则: 一个条目 = 一个数据域接入, 零域专属代码 (sync_runner 读本表驱动一切)。
# 宪法 v2 第 7 条: 新数据域必走本表; 第 9 条 gate(6): services/ 新增 *_sync.py 直写表 = FAIL。
# 宪法 v2 第 6 条: zero_row_policy=fail — 0 行当失败重试, 决不静默落空。
#
# 字段语义:
#   source         数据源 adapter 名 (services/data_sources registry)
#   api            源 API 名 (tushare pro 接口名)
#   target_db      database_manifest.yaml 里的库 alias (新域一律 tushare_raw, 与主库写锁解耦)
#   target_table   raw 表名 (api 字段镜像 + built_at, 不加工 — 加工归特征层)
#   grain          MERGE 主键 (幂等重跑)
#   batch_mode     by_trade_date (一次调用全市场一天) / by_ts_code / by_month / full_refresh
#   pit_anchor     PIT 锚点列 + 可用时刻语义 (特征 JOIN 纪律的机器可读声明)
#   available_after 盘后可用时刻 (HH:MM, 't+1' = 次日盘前; 决定特征 JOIN t 还是 t-1)
#   data_start     回填起点 (E8 探底/文档实测)
#   freshness_sla_trading_days  落后超过 N 交易日 = audit FAIL
#   min_rows_per_batch  单批最低行数 sanity (低于即可疑, 0 行必重试)
#
# 连续性/完整性常驻审查键 (backend/scripts/check_continuity_integrity.py 消费, 2026-07-03 R1 根因2/4/6):
#   known_empty_days   墓碑: 实测源端真空的交易日列表 (探测返 0 非 throttle), 日历缺日审查不计缺
#   gap_tolerance      日历缺日容忍: none(默认, 键不存在=none)=中间空洞 FAIL / annotate=只标注 WARN
#                      (事件稀疏域: 多数交易日天然无数据, 如 dividend 非分红季) / hk_holidays=预留值
#                      (源端假期域如 moneyflow_hsgt 港股假日; 假期日历校验未实现前按 annotate 处理)
#   freshness_group_col 多榜/多组共表域的分组列 (如 ths_hot data_type): 按组查 MAX(date), 任何组
#                      落后 > SLA x 3 交易日 = FAIL — 根治"表级新鲜度探不到子榜断流" (热基停 4 个月反例)
#   dead_groups        分组墓碑: 已裁决死亡的子榜/组列表, 分组新鲜度不再对其告警
#   (cross_check_domain 同族交叉参照键已在用, 见 top_inst/block_trade 条目)

version: 1

defaults:
  retry:
    max_attempts: 3
    backoff_seconds: [5, 30, 120]
  zero_row_policy: fail
  watermark_table: mart_data_source_watermark      # 复用 services/source_watermarks
  failure_queue_table: mart_data_source_failure_queue
  target_db: tushare_raw
  # tinyshare 代理限流 (用户 2026-06-17/19): sync_runner._RateLimiter 读此 config **主动节流**
  #   (撞墙前先睡, 优于反应式退避 transient_backoff)。措辞类瞬态限流 _is_transient_ratelimit 退避作兜底。
  #   单接口/全接口滑窗 60s; 并发上限 2 (当前链串行=1, 配置守界, 未来并行需 semaphore)。
  rate_limit:
    per_interface_per_min: 120     # 单接口 120 次/分钟
    total_per_min: 200             # 多接口合计 200 次/分钟
    max_concurrency: 2             # 并发上限 2
  # socket read timeout (防 hung: tinyshare 网关无响应时单次读死等 → 全局 socket 超时令其限时失败 →
  #   退避重试, 不卡死全链。2026-06-19 反例: stk_factor_pro 重试 hung 在无超时 socket 上 71min)。
  fetch_timeout_seconds: 120

domains:
  # ── P0-a: 资金流 (套一 L2 + 套二 F1 + 退出组件, 一次回填三用) ──
  moneyflow:
    source: tushare
    api: moneyflow
    target_table: raw_tushare_moneyflow
    universe_filter: true            # 2026-06-17 排除列表硬真相源: 写前丢非白名单前缀(北交所/三板)
    grain: [ts_code, trade_date]
    batch_mode: by_trade_date
    pit_anchor: "trade_date; 盘后更新 (文档未写时点, 按 18:00 保守) -> t 收盘截面特征 JOIN t-1"
    available_after: "18:00"
    data_start: "20200101"        # 2026-06-15 用户"回测数据拉齐2020全量": 扩 2020+ 对齐 K线 tushare-qfq (原 20220104)
    freshness_sla_trading_days: 1
    min_rows_per_batch: 3000      # 2026-06-15 扩2020回补降4000->3000: 2020 universe ~3740股 (实测) < 4000 误报; 与 daily 一致, 仍防真截断

  moneyflow_dc:   # 2026-06-16 用户"全拉初评有用数据": 东财个股资金流 (net_amount/net_amount_rate, 补 order-size moneyflow 的东财口径)
    source: tushare
    api: moneyflow_dc
    target_table: raw_tushare_moneyflow_dc
    universe_filter: true            # 2026-06-17 排除列表硬真相源: 写前丢非白名单前缀(北交所/三板)
    grain: [ts_code, trade_date]
    batch_mode: by_trade_date
    pit_anchor: "trade_date; 盘后更新 -> JOIN t-1 (与 moneyflow 同)"
    available_after: "18:00"
    data_start: "20230911"        # 2026-06-28 修: 实测源端真起点=20230911 (旧 20230901 早10天致 20230901-08 假缺口每天重探); 东财个股资金流 ~2023-09 起
    known_empty_days: ["20231122"]   # 实测源端单日空洞 (探测返0非throttle); 墓碑不再每天重探+告警疲劳
    freshness_sla_trading_days: 1
    min_rows_per_batch: 4000      # 实弹 5419-5965 行 (2023Q4+全宇宙)
    allow_empty_batch: false

  # ── P0-b: 可执行性真相源 + 情绪温度计 ──
  limit_list_d:
    source: tushare
    api: limit_list_d
    target_table: raw_tushare_limit_list_d
    universe_filter: true            # 2026-06-17 排除列表硬真相源: 写前丢非白名单前缀(北交所/三板)
    grain: [ts_code, trade_date, limit]
    batch_mode: by_trade_date
    pit_anchor: "trade_date; 盘后榜单 (文档未写时点) -> JOIN t-1"
    available_after: "18:00"
    data_start: "20230103"        # 2026-06-12: 对齐实际落库防 drain 开闸 (文档支持 2020 起, B 书 W6 需要时回填再改回 20200102)
    freshness_sla_trading_days: 1
    min_rows_per_batch: 10        # 跌停冰点日可能极少, 仅防 0 行

  stk_limit:
    source: tushare
    api: stk_limit
    target_table: raw_tushare_stk_limit
    universe_filter: true            # 2026-06-17 排除列表硬真相源: 写前丢非白名单前缀(北交所/三板)
    grain: [ts_code, trade_date]
    batch_mode: by_trade_date
    page_limit: 5000   # 2026-07-06 宪法第6条实锤第N例 (全面数据审计抓获): 该域全市场返回含
                        # 股票+ETF/LOF+B股+北交所混合总量已增长超服务端隐式单页上限 (实测 limit=6000
                        # 仍只回 5800, offset=5800 page2 再回 1877 行, 合计 7677); 声明缺失
                        # page_limit 时 _fetch_paged 直接单次调用不分页 → 6/12→6/15 总量跨过该
                        # 隐式上限首次触发截断, 603/605/688/689/601 前缀(沪主板新代码段+科创板)
                        # 静默丢 ~1500 行/天连续 3 周 (20260615-20260703 实测), 下游
                        # fact_stock_form_daily.buyable 同期出现等量 NULL。5000 留出安全边际
                        # (server 隐式上限观测约 5800, 5000 确保稳定触发分页)。回填见
                        # analysis/comprehensive_data_module_audit_20260706.md P0#1。
    pit_anchor: "trade_date; 8:40 盘前更新 -> t 日盘前即可用 (罕见的当日可用源)"
    available_after: "08:40"
    data_start: "20190102"   # 2026-07-04 buyable NULL 根因修复: 原 20220104 声明过窄, 实弹探测
                              # pro.stk_limit(trade_date=X) 在 20100104/20200601/20210601 均返回真实数据
                              # (源端覆盖远早于声明) — 改与 daily(消费该表的唯一实际需求上界)对齐 20190102,
                              # 而非盲目回填到源端最早点 (daily 本身未回填更早, 更早的 stk_limit 当前无消费方)。
    freshness_sla_trading_days: 1
    min_rows_per_batch: 3000   # 2026-07-04 下调 (原4000对2019-2021历史段假阳性): 回填时实测2019年
                               # 日行数 3566-3600 (全市场上市数当年仅3742只, daily 表交叉验证), 全部被
                               # 4000 门槛错判 below_min_rows — 数据实为完整 (真截断类反例是数十/数百行
                               # 量级如 top_inst 1000整, 非"比当前全市场略少"这种随上市数自然增长的正常
                               # 历史波动)。3000 留有余量 (远高于任何交易日停牌/临时缺口幅度), 同时不再
                               # 对 2019 年这类真实但较小的历史批次误报。

  stock_st:
    source: tushare
    api: stock_st
    target_table: raw_tushare_stock_st
    universe_filter: true            # 2026-06-17 排除列表硬真相源: 写前丢非白名单前缀(北交所/三板)
    grain: [ts_code, trade_date]
    batch_mode: by_trade_date
    pit_anchor: "trade_date; 9:20 盘前更新 -> t 日盘前可用; 历史每日 ST 名单 = PIT universe 过滤真相源"
    available_after: "09:20"
    data_start: "20220104"        # 接口支持 2016+, 项目 K 线窗口 2022+ 对齐
    freshness_sla_trading_days: 1
    min_rows_per_batch: 50        # ST 股票数量级 100-200

  suspend_d:
    source: tushare
    api: suspend_d
    target_table: raw_tushare_suspend_d
    universe_filter: true            # 2026-06-17 排除列表硬真相源: 写前丢非白名单前缀(北交所/三板)
    grain: [ts_code, trade_date, suspend_type]
    batch_mode: by_trade_date
    pit_anchor: "trade_date; 更新'不定期' -> 保守 JOIN t-1"
    available_after: "t+1"
    data_start: "20220104"
    freshness_sla_trading_days: 3  # 停牌公告不是每日必有
    min_rows_per_batch: 0          # 无停牌日合法 0 行 (zero_row_policy 例外: allow_empty)
    allow_empty_batch: true

  # ── 两融族 (B3 2026-07-02 用户点名日更参数, 主升浪 D2 L1 叠加层; 实弹核证见 commit) ──
  margin_detail:
    source: tushare
    api: margin_detail
    target_table: raw_tushare_margin_detail
    universe_filter: true            # 实测单日 4372 行含 ETF (510050 等) → 白名单 60/00/30/68 滤成纯个股
    grain: [ts_code, trade_date]
    batch_mode: by_trade_date
    pit_anchor: "trade_date; 交易所 t+1 上午9点前披露 t 日余额 -> t+1 日盘前可用, 特征 JOIN t-1"
    available_after: "t+1"
    data_start: "20190102"        # 对齐 K线窗口 (源头 20100331 有, 消费方=D2 特征只需 K线窗内; 实测首日 949 个股)
    freshness_sla_trading_days: 2  # t+1 披露节奏, 给 1 天缓冲
    min_rows_per_batch: 800       # 实测 20190102 滤 ETF 后 949 行 (两融标的最少期), 防截断/throttle
    allow_empty_batch: false

  margin:                          # 交易所汇总 (SSE/SZSE/BSE 2-3 行/日): B4 市场感知大盘水位原料
    source: tushare
    api: margin
    target_table: raw_tushare_margin
    grain: [trade_date, exchange_id]
    batch_mode: by_trade_date
    pit_anchor: "trade_date; 同 margin_detail t+1 盘前披露 -> JOIN t-1"
    available_after: "t+1"
    data_start: "20190102"        # 实测首日 2 行 (SSE/SZSE)
    freshness_sla_trading_days: 2
    min_rows_per_batch: 1         # 2026-07-02 回填实测: 20260403/0430/0618/0626 源端仅 SSE 1 行 (重拉确认非 throttle), 1 行=合法最小
    allow_empty_batch: false
    known_group_gaps:             # 2026-07-05 R4 workflow 二次 tinyshare 实测确认(非采集侧漏拉,
                                   #   源端当日就只回 SSE): cross_section fail_missing_groups 精确墓碑
                                   #   (按日期, 非 dead_groups 整组永久豁免 — BSE/SZSE 未来真断流仍应告警)
      "20260403": [BSE, SZSE]
      "20260430": [BSE, SZSE]
      "20260618": [BSE, SZSE]
      "20260626": [BSE, SZSE]
      "20260703": [BSE, SZSE]

  # ── 市场感知 v2 族 (2026-07-02 调研+实弹; owner=analysis/market_pulse_design_20260702.md v2 第二批) ──
  dc_daily:                          # 东财板块指数 OHLC (行业/概念/地域全类型): dc 链 RS 双窗 + 广度/龙头史深 2025->2020
    source: tushare
    api: dc_daily
    target_table: raw_tushare_dc_daily
    # 不设 universe_filter: ts_code 全为 BKxxxx.DC 板块码 (实弹 20260630 前缀 100% 'BK'), 非个股
    grain: [ts_code, trade_date]     # 实弹 20200102(712行)/20260630(1021行) 均 0 dup
    batch_mode: by_trade_date
    page_limit: 5000                 # 实弹 limit/offset 被网关尊重 (limit800: 800+221=1021 拼齐); 当前 1021 行/日单页收齐, 防未来板块扩容截断
    pit_anchor: "trade_date; 东财板块指数盘后 -> JOIN t-1"
    available_after: "18:00"
    data_start: "20200102"           # 实弹边界: 20200102=712行 / 20191231=0行
    freshness_sla_trading_days: 2
    min_rows_per_batch: 500          # 实弹最少期 20200102=712 (行业474+概念207+地域31; 现今 496+494+31=1021); <500=截断/半空
    allow_empty_batch: false

  kpl_list:                          # 开盘啦涨停榜单: lu_desc 涨停原因/theme 题材/status 连板状态/net_change/limit_order (24列)
    source: tushare
    api: kpl_list
    target_table: raw_tushare_kpl_list
    universe_filter: true            # ts_code 个股 (含北交所) -> 白名单 60/00/30/68 过滤
    universe_filter_col: ts_code
    grain: [ts_code, trade_date, tag]  # 实弹 20190102(31)/20240930(642 大涨日)/20260630(168) 均 0 dup; tag 入键防未来炸板/跌停域同表共存撞键
    batch_mode: by_trade_date
    # tag 语义 (实弹 20260630): 无参默认 = 涨停单榜 168 行 == 显式 tag=涨停 168 行; 炸板 34/跌停 20 是独立 tag 拉取 0 重叠,
    #   需要时另开域显式传 tag。注意: 不写 fixed_params — sync_runner by_trade_date 分支不合并 fixed_params
    #   (ths_hot 反例: 声明 data_type=热股 实际全 8 榜入库, fixed_params 是死配置; 本域靠 API 默认+grain 含 tag 防漂移)。
    pit_anchor: "trade_date; 开盘啦涨停榜单盘后 -> JOIN t-1"
    # 2026-07-06 改 18:00→t+1 (两次独立实测复发, 触发 analysis/data_foundation_audit_20260703.json
    # 自己订的判据"若复发应把 available_after 后移"): 20260702 22:15 (审计记录) + 20260706 22:40
    # (本次直接 tushare 探针) 均返回 0 行, 但事后再查均已有数据 (0702=154行/0703=156行, 20260706
    # 本身此刻仍 0 行待次日验证) — 非源
    # 故障, 是发布节奏本来就晚于同日晚间, 与 margin/margin_detail 同款 t+1 语义, 不是"18:00 声明
    # 偏早"能靠挪时间点解决的量级 (挪到几点都可能被下一次更晚发布打脸)。
    available_after: "t+1"
    data_start: "20190102"           # 设计稿写 20200106; 实弹 20190102=31行 已有数据 (lu_desc/status/lu_time 0% null) -> 对齐 K线窗口 2019+
    freshness_sla_trading_days: 2
    min_rows_per_batch: 10           # 冰点日涨停可能极少; 实弹最少见 20190102=31
    allow_empty_batch: false

  hm_detail:                         # 游资每日明细 (游资名 x 营业部席位 x 个股买卖): 打板资金温度, v1 全无此维度
    source: tushare
    api: hm_detail
    target_table: raw_tushare_hm_detail
    universe_filter: true
    universe_filter_col: ts_code     # 铁律: grain[0]=trade_date, 缺此列名 = top_list 谄媚死反例 (前缀'20'整批全丢仍假报成功)
    grain: [trade_date, ts_code, hm_name, hm_orgs]  # 实弹: (td,code,hm_name) 不唯一 — 同游资多席位 (20260630 dup82/20240930 dup120); +hm_orgs 营业部后 304/304 + 362/362 全唯一
    batch_mode: by_trade_date
    pit_anchor: "trade_date; 游资席位明细盘后归集 (龙虎榜口径, 同 top_list) -> JOIN t-1"
    available_after: "18:00"
    data_start: "20220816"           # 实弹二分边界: 20220815=0 / 20220816=161行 (设计稿建议 20220901 偏保守, 20220810=0 复核一致)
    freshness_sla_trading_days: 2
    min_rows_per_batch: 20           # 实弹 2022 起步期 117-161 行/日, 近期 304-362; <20=半空嫌疑
    allow_empty_batch: false

  hm_list:                           # 游资名录 (静态: name/desc/orgs), hm_detail 的 hm_name 维表
    source: tushare
    api: hm_list
    target_table: raw_tushare_hm_list
    # 不设 universe_filter: 静态名录无股票代码列
    grain: [name]                    # 实弹 110 行 0 dup
    batch_mode: full_refresh
    pit_anchor: "静态名录快照, 无日期语义; 消费按 hm_name JOIN hm_detail"
    available_after: "00:00"
    data_start: "20260702"           # full_refresh 无回填语义, 占位 (注册日)
    freshness_sla_trading_days: 30   # 名录低频变动 (同 stock_basic 口径)
    min_rows_per_batch: 80           # 实弹 110 行; <80=截断嫌疑
    allow_empty_batch: false

  daily_info:                        # 官方市场交易统计 (ts_code=市场代码 SH_A/SZ_MAIN/...): 沪深成交/换手/平均PE 官方口径
    source: tushare
    api: daily_info
    target_table: raw_tushare_daily_info
    # 不设 universe_filter: ts_code 是市场代码非个股
    grain: [trade_date, ts_code]     # 实弹 20190102(25行)/20260630(11行) 均 0 dup
    batch_mode: by_trade_date
    pit_anchor: "trade_date; 交易所每日统计盘后 -> JOIN t-1"
    available_after: "18:00"
    data_start: "20190102"           # 对齐项目 K线窗口 (源头更早); 实弹 20190102=25行 在录
    freshness_sla_trading_days: 2
    min_rows_per_batch: 8            # 市场码集合随年代变 (2019=25 含 SZ_SME/债券码, 2026=11); <8=半空嫌疑
    allow_empty_batch: false

  # ── P0-c: regime gate 原料 (1 行/日, ROI 最高) ──
  moneyflow_mkt_dc:
    source: tushare
    api: moneyflow_mkt_dc
    target_table: raw_tushare_moneyflow_mkt_dc
    grain: [trade_date]
    batch_mode: by_date_range   # 单日 trade_date 参数实测返回空; 范围查询正常 (单次上限 3000 行 > 全史 762)
    pit_anchor: "trade_date; 盘后更新 -> regime 判定 t 盘后算, 作用于 t+1 (严禁 gate t 日信号)"
    available_after: "18:00"
    data_start: "20230417"   # 深样本范围查询实测真实起点 (单日查 20230103 为 0 行)
    freshness_sla_trading_days: 1
