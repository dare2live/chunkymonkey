# sync_registry.yaml — 数据域接入唯一注册表 (架构稿 §3 范式, 2026-06-11)
#
# 原则: 一个条目 = 一个数据域接入, 零域专属代码 (sync_runner 读本表驱动一切)。
# 宪法 v2 第 7 条: 新数据域必走本表; 第 9 条 gate(6): services/ 新增 *_sync.py 直写表 = FAIL。
# 宪法 v2 第 6 条: zero_row_policy=fail — 0 行当失败重试, 决不静默落空。
#
# 字段语义:
#   source         数据源 adapter 名 (services/data_sources registry)
#   api            源 API 名 (tushare pro 接口名)
#   target_db      database_manifest.yaml 里的库 alias (新域一律 tushare_raw, 与主库写锁解耦)
#   target_table   raw 表名 (api 字段镜像 + built_at, 不加工 — 加工归特征层)
#   grain          MERGE 主键 (幂等重跑)
#   batch_mode     by_trade_date (一次调用全市场一天) / by_ts_code / by_month / full_refresh
#   pit_anchor     PIT 锚点列 + 可用时刻语义 (特征 JOIN 纪律的机器可读声明)
#   available_after 盘后可用时刻 (HH:MM, 't+1' = 次日盘前; 决定特征 JOIN t 还是 t-1)
#   data_start     回填起点 (E8 探底/文档实测)
#   freshness_sla_trading_days  落后超过 N 交易日 = audit FAIL
#   min_rows_per_batch  单批最低行数 sanity (低于即可疑, 0 行必重试)

version: 1

defaults:
  retry:
    max_attempts: 3
    backoff_seconds: [5, 30, 120]
  zero_row_policy: fail
  watermark_table: mart_data_source_watermark      # 复用 services/source_watermarks
  failure_queue_table: mart_data_source_failure_queue
  target_db: tushare_raw
  # tinyshare 代理限流 (用户 2026-06-17/19): sync_runner._RateLimiter 读此 config **主动节流**
  #   (撞墙前先睡, 优于反应式退避 transient_backoff)。措辞类瞬态限流 _is_transient_ratelimit 退避作兜底。
  #   单接口/全接口滑窗 60s; 并发上限 2 (当前链串行=1, 配置守界, 未来并行需 semaphore)。
  rate_limit:
    per_interface_per_min: 120     # 单接口 120 次/分钟
    total_per_min: 200             # 多接口合计 200 次/分钟
    max_concurrency: 2             # 并发上限 2
  # socket read timeout (防 hung: tinyshare 网关无响应时单次读死等 → 全局 socket 超时令其限时失败 →
  #   退避重试, 不卡死全链。2026-06-19 反例: stk_factor_pro 重试 hung 在无超时 socket 上 71min)。
  fetch_timeout_seconds: 120

domains:
  # ── P0-a: 资金流 (套一 L2 + 套二 F1 + 退出组件, 一次回填三用) ──
  moneyflow:
    source: tushare
    api: moneyflow
    target_table: raw_tushare_moneyflow
    universe_filter: true            # 2026-06-17 排除列表硬真相源: 写前丢非白名单前缀(北交所/三板)
    grain: [ts_code, trade_date]
    batch_mode: by_trade_date
    pit_anchor: "trade_date; 盘后更新 (文档未写时点, 按 18:00 保守) -> t 收盘截面特征 JOIN t-1"
    available_after: "18:00"
    data_start: "20200101"        # 2026-06-15 用户"回测数据拉齐2020全量": 扩 2020+ 对齐 K线 tushare-qfq (原 20220104)
    freshness_sla_trading_days: 1
    min_rows_per_batch: 3000      # 2026-06-15 扩2020回补降4000->3000: 2020 universe ~3740股 (实测) < 4000 误报; 与 daily 一致, 仍防真截断

  moneyflow_dc:   # 2026-06-16 用户"全拉初评有用数据": 东财个股资金流 (net_amount/net_amount_rate, 补 order-size moneyflow 的东财口径)
    source: tushare
    api: moneyflow_dc
    target_table: raw_tushare_moneyflow_dc
    universe_filter: true            # 2026-06-17 排除列表硬真相源: 写前丢非白名单前缀(北交所/三板)
    grain: [ts_code, trade_date]
    batch_mode: by_trade_date
    pit_anchor: "trade_date; 盘后更新 -> JOIN t-1 (与 moneyflow 同)"
    available_after: "18:00"
    data_start: "20230911"        # 2026-06-28 修: 实测源端真起点=20230911 (旧 20230901 早10天致 20230901-08 假缺口每天重探); 东财个股资金流 ~2023-09 起
    known_empty_days: ["20231122"]   # 实测源端单日空洞 (探测返0非throttle); 墓碑不再每天重探+告警疲劳
    freshness_sla_trading_days: 1
    min_rows_per_batch: 4000      # 实弹 5419-5965 行 (2023Q4+全宇宙)
    allow_empty_batch: false

  # ── P0-b: 可执行性真相源 + 情绪温度计 ──
  limit_list_d:
    source: tushare
    api: limit_list_d
    target_table: raw_tushare_limit_list_d
    universe_filter: true            # 2026-06-17 排除列表硬真相源: 写前丢非白名单前缀(北交所/三板)
    grain: [ts_code, trade_date, limit]
    batch_mode: by_trade_date
    pit_anchor: "trade_date; 盘后榜单 (文档未写时点) -> JOIN t-1"
    available_after: "18:00"
    data_start: "20230103"        # 2026-06-12: 对齐实际落库防 drain 开闸 (文档支持 2020 起, B 书 W6 需要时回填再改回 20200102)
    freshness_sla_trading_days: 1
    min_rows_per_batch: 10        # 跌停冰点日可能极少, 仅防 0 行

  stk_limit:
    source: tushare
    api: stk_limit
    target_table: raw_tushare_stk_limit
    universe_filter: true            # 2026-06-17 排除列表硬真相源: 写前丢非白名单前缀(北交所/三板)
    grain: [ts_code, trade_date]
    batch_mode: by_trade_date
    pit_anchor: "trade_date; 8:40 盘前更新 -> t 日盘前即可用 (罕见的当日可用源)"
    available_after: "08:40"
    data_start: "20220104"
    freshness_sla_trading_days: 1
    min_rows_per_batch: 4000

  stock_st:
    source: tushare
    api: stock_st
    target_table: raw_tushare_stock_st
    universe_filter: true            # 2026-06-17 排除列表硬真相源: 写前丢非白名单前缀(北交所/三板)
    grain: [ts_code, trade_date]
    batch_mode: by_trade_date
    pit_anchor: "trade_date; 9:20 盘前更新 -> t 日盘前可用; 历史每日 ST 名单 = PIT universe 过滤真相源"
    available_after: "09:20"
    data_start: "20220104"        # 接口支持 2016+, 项目 K 线窗口 2022+ 对齐
    freshness_sla_trading_days: 1
    min_rows_per_batch: 50        # ST 股票数量级 100-200

  suspend_d:
    source: tushare
    api: suspend_d
    target_table: raw_tushare_suspend_d
    universe_filter: true            # 2026-06-17 排除列表硬真相源: 写前丢非白名单前缀(北交所/三板)
    grain: [ts_code, trade_date, suspend_type]
    batch_mode: by_trade_date
    pit_anchor: "trade_date; 更新'不定期' -> 保守 JOIN t-1"
    available_after: "t+1"
    data_start: "20220104"
    freshness_sla_trading_days: 3  # 停牌公告不是每日必有
    min_rows_per_batch: 0          # 无停牌日合法 0 行 (zero_row_policy 例外: allow_empty)
    allow_empty_batch: true

  # ── P0-c: regime gate 原料 (1 行/日, ROI 最高) ──
  moneyflow_mkt_dc:
    source: tushare
    api: moneyflow_mkt_dc
    target_table: raw_tushare_moneyflow_mkt_dc
    grain: [trade_date]
    batch_mode: by_date_range   # 单日 trade_date 参数实测返回空; 范围查询正常 (单次上限 3000 行 > 全史 762)
    pit_anchor: "trade_date; 盘后更新 -> regime 判定 t 盘后算, 作用于 t+1 (严禁 gate t 日信号)"
    available_after: "18:00"
    data_start: "20230417"   # 深样本范围查询实测真实起点 (单日查 20230103 为 0 行)
    freshness_sla_trading_days: 1
    min_rows_per_batch: 1

  # ── 基础: 交易日历去 akshare 单点 (用户决策: 能 tushare 就 tushare) ──
  trade_cal:
    source: tushare
    api: trade_cal
    target_table: raw_tushare_trade_cal
    grain: [exchange, cal_date]
    batch_mode: full_refresh       # 小表全量刷
    pit_anchor: "cal_date; 静态日历, 年度扩展"
    available_after: "00:00"
    data_start: "20200101"
    freshness_sla_trading_days: 30 # 日历覆盖到未来, 滞后语义不同: 检查 max(cal_date) > today+30
    min_rows_per_batch: 100

  # ── 基础: 真股身份真相源 (universe 身份层, 2026-06-19 替 akshare dim_active 前缀猜市场) ──
  stock_basic:
    source: tushare
    api: stock_basic
    target_table: raw_tushare_stock_basic
    # 不设 universe_filter: 本表=universe 身份真相源本身, 保全市场(含北交所/退市)于 raw,
    #   排除(BSE/ST)下沉到消费侧 (dim_active 重建 + get_active_universe), 防真相源被前缀门误删。
    grain: [ts_code]
    batch_mode: full_refresh       # 单接口 ≤6000 行一次拉完全市场 (50次/分, 2000积分)
    fixed_params:
      list_status: L               # 在市股 (current active master, like-for-like 替 ak.stock_info_a_code_name); 退市生存者偏差走 PIT 历史宇宙另案
    pit_anchor: "list_date; 静态身份快照 (含 list_date/delist_date)"
    available_after: "00:00"
    data_start: "20200101"         # full_refresh 无回填语义, 占位
    freshness_sla_trading_days: 30 # 身份快照变动慢
    min_rows_per_batch: 5000       # 2026-06-19 实测 5529 在市股; <5000 = 截断/throttle
    allow_empty_batch: false

  # ── P0-d: 概念/板块域历史回填 (E8 探底实测起点; 未来增量由 concept-snapshot launchd 续) ──
  dc_member:
    source: tushare
    api: dc_member
    target_table: raw_tushare_dc_member
    universe_filter: true            # 2026-06-17 排除列表硬真相源: 写前丢非白名单前缀(北交所/三板)
    universe_filter_col: con_code
    grain: [trade_date, ts_code, con_code]
    batch_mode: by_trade_date
    pit_anchor: "trade_date; 概念成分按日快照, 成员漂移敏感 — 特征 JOIN as-of t-1"
    available_after: "18:00"
    data_start: "20250102"   # E8 探底实测 (更早单日无数据, 2026-06-12 复核一致)
    page_limit: 5000         # 2026-06-12: catalog 单次上限 5000 实锤; 无分页曾静默截断 (整 8000/5000 pin, 754 概念单日仅见 27-354)
    freshness_sla_trading_days: 2
    min_rows_per_batch: 1000

  dc_index:
    source: tushare
    api: dc_index
    target_table: raw_tushare_dc_index
    grain: [trade_date, ts_code]
    batch_mode: by_trade_date
    pit_anchor: "trade_date; 板块指数行情, 盘后 -> JOIN t-1"
    available_after: "18:00"
    data_start: "20250102"   # E8 探底实测
    page_limit: 5000         # 2026-06-12: catalog 单次上限 5000, 与 dc_member 同防截断
    freshness_sla_trading_days: 2
    min_rows_per_batch: 100

  moneyflow_ind_dc:
    source: tushare
    api: moneyflow_ind_dc
    target_table: raw_tushare_moneyflow_ind_dc
    grain: [trade_date, ts_code]
    batch_mode: by_trade_date
    pit_anchor: "trade_date; 板块资金流盘后 -> JOIN t-1; rank 字段是分页伪 rank 禁用 (INDEX §8 陷阱)"
    available_after: "18:00"
    data_start: "20240102"   # E8 探底实测
    freshness_sla_trading_days: 2
    min_rows_per_batch: 50   # 2026-06-12 修正: 2024-2025 年初实测 86 行/日 (仅行业板块) 为合法全量, 原 200 误配致 drain 永不收敛

  limit_cpt_list:
    source: tushare
    api: limit_cpt_list
    target_table: raw_tushare_limit_cpt_list
    grain: [trade_date, ts_code]
    batch_mode: by_trade_date
    pit_anchor: "trade_date; 最强板块盘后榜单 -> JOIN t-1"
    available_after: "18:00"
    data_start: "20240102"   # E8 探底实测
    freshness_sla_trading_days: 2
    min_rows_per_batch: 1
    allow_empty_batch: true   # 冰点日可能无涨停板块

  # ── 产业链层 L1: 主营业务构成 (Serenity A股化数据底座, 2026-06-11 实测可用) ──
  fina_mainbz:
    source: tushare
    api: fina_mainbz
    target_table: raw_tushare_fina_mainbz
    universe_filter: true            # 2026-06-17 排除列表硬真相源: 写前丢非白名单前缀(北交所/三板)
    grain: [ts_code, end_date, bz_code, bz_item]
    batch_mode: by_ts_code
    fixed_params:
      period: "20251231"     # 首期 = 最近完整年报 (2026-04 底披露完毕, 立讯 002475 实测有数据)
      type: P                # P=按产品构成 (产业链节点归属用); D=按地区另期评估
    pit_anchor: "end_date 是报告期非披露日! PIT 可用时点 = 年报 ann_date, 特征 JOIN 必须经 disclosure_date/income.ann_date 对齐, 严禁用 end_date 当可用日 (教科书级 PIT 陷阱)"
    available_after: "t+1"
    data_start: "20251231"
    freshness_sla_trading_days: 130   # 年报数据, 按披露季节奏; 下一期 20260630 在 2026-08 后增量
    min_rows_per_batch: 0
    allow_empty_batch: true           # 部分股票该期无构成数据 (新股/披露豁免) 合法

  # ── 旧源退役批 (2026-06-11 用户决策: 能在 tushare 获取的就从 tushare 获取) ──
  # 替代对象: lhb_daily(aif10, 实测滞后13天) / profit_forecast / external_attention /
  # northbound(映射盲区) / 复权链(adj_factor+dividend 转正主源, tdxhub xdxr 滞后17天降备援
  # 交叉验证 — 主源序: tushare 主/tdxhub 备)。旧路径双轨核对一致后物理退役。
  top_list:
    source: tushare
    api: top_list
    target_table: raw_tushare_top_list
    universe_filter: true            # 2026-06-17 排除列表硬真相源: 写前丢非白名单前缀(北交所/三板)
    universe_filter_col: ts_code     # 2026-06-28 谄媚死修: 缺此→用 grain[0]=trade_date 过滤前缀'20'整日全丢仍假报成功
    grain: [trade_date, ts_code, reason]   # 同股同日可因多个上榜理由多行
    batch_mode: by_trade_date
    pit_anchor: "trade_date; 龙虎榜盘后公布 -> JOIN t-1"
    available_after: "18:00"
    data_start: "20180102"   # 2026-06-12 范围决策: chain9 回填 2018-2022; 2005-2017 归 chain10 (LHB 判正条件触发, 原值 20050104)
    freshness_sla_trading_days: 2
    min_rows_per_batch: 20   # 实测 20260610 = 95 行; 龙虎榜常态 60-150
    allow_empty_batch: false

  top_inst:
    source: tushare
    api: top_inst
    target_table: raw_tushare_top_inst
    universe_filter: true            # 2026-06-17 排除列表硬真相源: 写前丢非白名单前缀(北交所/三板)
    universe_filter_col: ts_code     # 2026-06-28 谄媚死修: 缺此→用 grain[0]=trade_date 过滤前缀'20'整日全丢仍假报成功
    grain: [trade_date, ts_code, exalter, side]   # 同席位同股按买卖方向分行 (字段实测在录)
    batch_mode: by_trade_date
    page_limit: 1000          # 实测单页 1000 整上限; runner offset 分页拉全 (中间页败=整批重试)
    pit_anchor: "trade_date; 龙虎榜席位明细盘后公布 -> JOIN t-1"
    available_after: "18:00"
    data_start: "20180102"    # 与 top_list 同窗 (2026-06-12 范围决策, 原值 20050104)
    freshness_sla_trading_days: 2
    min_rows_per_batch: 1
    allow_empty_batch: true   # 个别日仅游资席位无机构明细, 合法空 (走增量 fallback 非 drain)

  # stk_surv 暂缓注册 (2026-06-11 实测): trade_date=20260610 返回 0 行 — 参数语义未核证
  # (疑似用 surv_date/ann_date), 0 行不下结论不连发 (并发风控纪律), 与 dc_hot 同列待核批。

  report_rc:
    source: tushare
    api: report_rc
    target_table: raw_tushare_report_rc
    universe_filter: true            # 2026-06-17 排除列表硬真相源: 写前丢非白名单前缀(北交所/三板)
    grain: [ts_code, report_date, org_name, report_title]
    batch_mode: by_trade_date
    date_param: report_date   # 接口日期参数 = 研报日期, 非 trade_date
    pit_anchor: "report_date; 卖方研报发布日 -> JOIN t-1 (研报盘后/隔日入库, 保守 t+1)"
    available_after: "t+1"
    data_start: "20100101"   # 文档未标明; 回填首跑探底校准
    freshness_sla_trading_days: 3
    freshness_date_column: report_date   # 2026-06-22 P0-6: 研报无trade_date列, SLA探测改report_date(频繁发布日频SLA合理)
    min_rows_per_batch: 1
    allow_empty_batch: true   # 长假后首日可能无新研报

  stk_surv:
    source: tushare
    api: stk_surv
    target_table: raw_tushare_stk_surv
    universe_filter: true            # 2026-06-17 排除列表硬真相源: 写前丢非白名单前缀(北交所/三板)
    grain: [ts_code, surv_date, rece_org]
    batch_mode: by_trade_date
    date_param: trade_date    # tushare stk_surv 接口日期参数=trade_date(调研日); 返回列=surv_date
    pit_anchor: "surv_date 机构调研日 -> JOIN t+1 (调研纪要盘后/隔日披露, 保守可见)"
    available_after: "t+1"
    data_start: "20180102"   # 探底校准 (机构调研 tushare 覆盖较新)
    freshness_sla_trading_days: 5
    freshness_date_column: surv_date   # 2026-06-22 P0-6: 调研无trade_date列, SLA探测改surv_date
    min_rows_per_batch: 1
    allow_empty_batch: true   # 部分交易日无机构调研披露

  ths_hot:
    source: tushare
    api: ths_hot
    target_table: raw_tushare_ths_hot
    grain: [trade_date, data_type, ts_code, rank_time]   # 实测同股同日多时点榜单快照, rank_time 必须入键
    batch_mode: by_trade_date
    fixed_params:
      data_type: "热股"   # 锁单榜: 全量取 2000 行整 = 多榜合计截断 (实测); 单榜 444 行完整。
                          # 概念/行业板块榜价值另案: 一榜一域条目, registry 范式天然支持
    pit_anchor: "trade_date; 热榜 22:30 更新 -> 当日热度只能 JOIN t+1 决策"
    known_empty_days: ["20240312"]   # 2026-06-28 实测源端单日空洞 (ths_hot 20240312 返0, 邻日560); 墓碑不再每天重探
    available_after: "22:30"
    data_start: "20240101"   # 热榜历史窗较短; 回填首跑探底校准
    freshness_sla_trading_days: 2
    min_rows_per_batch: 50   # 实测单榜 444 行
    allow_empty_batch: false

  # dc_hot 暂缓注册 (2026-06-11): 同为多榜单接口, 参数语义 (market/hot_type 取值) 未实测核证,
  # 盲注册有截断/grain 撞键风险。ths_hot 跑通后按同模式核证补注册。

  moneyflow_hsgt:
    source: tushare
