    formal_domain: daily
    write: forbidden
    note: "S7 derive+pipeline clean default=from-accepted; accepted daily 20190102→frontier; --allow-legacy-fill escape only"

  raw_tushare_daily_basic:
    role: ssot

  raw_tushare_daily_info:
    role: ssot

  raw_tushare_dc_daily:
    role: ssot

  raw_tushare_dc_index:
    role: ssot

  raw_tushare_dc_member:
    role: ssot
    kind: membership_l0
    note: "data_access entity dc_member; S6 serve leaf; no formal membership plane"

  raw_tushare_dividend:
    role: ssot

  raw_tushare_express:
    role: ssot

