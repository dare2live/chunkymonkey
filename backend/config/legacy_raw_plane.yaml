#                   accepted plane owns the fact for consumers named here.
#   fill          — authorized UNION/COALESCE fill behind accepted/canonical
#                   for derive only; never publication SSOT; write may be forbidden.
#   compatibility — table may exist for historical / local-raw materialize /
#                   serve-leaf lag; formal (or dual-write) plane owns publication.
#   retired       — purged or must not be written/read as truth.
#
# Gate: backend/scripts/check_legacy_raw_plane.py
#   - every sync_registry raw_tushare_* target_table classified
#   - every data_access entity table raw_* classified
#   - formal_domain tables must not be role=ssot; write must be forbidden
#   - serve_l0_leaf / multi_consumer: compatibility only after DataAccess
#     redirects to a non-raw publication_surface (no pulse-aggregate theater)
#
# Ban: mass delete of years of raw; mass backfill; second DB; Optuna/Release flip.
# Ban: blanket pre-accept of sync_orphan as "standby" (owner 2026-07-21 Q2).
# Watchlist below = future publication candidates when strategy needs them —
# not a fetch/accept queue and not readiness.

version: 1

