# S7 legacy raw_tushare_* parallel-plane inventory (strangler, not greenfield).
#
# Roles (honest; do not upgrade without evidence):
#   ssot          — production still treats this raw table as truth; no formal
#                   accepted plane owns the fact for consumers named here.
#   fill          — authorized UNION/COALESCE fill behind accepted/canonical
#                   for derive only; never publication SSOT; write may be forbidden.
#   compatibility — table may exist for historical / local-raw materialize /
#                   serve-leaf lag; formal (or dual-write) plane owns publication.
#   retired       — purged or must not be written/read as truth.
#
# Gate: backend/scripts/check_legacy_raw_plane.py
#   - every sync_registry raw_tushare_* target_table classified
#   - every data_access entity table raw_* classified
#   - formal_domain tables must not be role=ssot; write must be forbidden
#
# Ban: mass delete of years of raw; mass backfill; second DB; Optuna/Release flip.

version: 1

roles:
  ssot: "Production truth surface until a formal accepted plane replaces it."
  fill: "Derive-only fill behind accepted/canonical; not publication SSOT."
  compatibility: "Lag/compat surface; formal or dual-write plane owns publication."
  retired: "Must not be written or treated as truth."

# Membership L0 entities (S6 serve leaf still registry→raw; no mart-mirror yet).
membership_l0_entities:
  - dc_member
  - index_member_all

tables:
  raw_tushare_adj_factor:
    role: ssot
    note: "qfq corporate-action input; no formal adj plane yet"

  raw_tushare_balancesheet:
    role: ssot

  raw_tushare_block_trade:
    role: ssot

  raw_tushare_cyq_perf:
    role: ssot

  raw_tushare_daily:
