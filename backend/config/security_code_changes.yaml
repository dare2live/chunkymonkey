# 证券换码事件登记 (asof_identity_r1.md §2 裁决 (b) / §3.1; 红线 14: 缺 lineage = UNTRUSTED)。
#
# 这张表登记的是「哪个代码在哪天换成哪个代码」这一条历史事实, 不是「这些行豁免」——
# 一条事件能解释发布层里多少行, 由 backend/services/security_identity.py 的解析器按自然键
# 逐行现比现算 (同日同自然键在旧码与新码下全同才算同一笔), 不由这里的人工圈定行数或日期范围。
# raw 继续忠实存供应商代码 (取数那一刻的代码, 不是「那天」的代码); 只有发布层读这张表 + K 线
# 成员资格判「那天它叫什么」, 适配器和 raw 都不改代码 (红线 1/4)。
#
# loader (load_security_code_changes) 纯配置校验, 不开库、不读环境变量, fail-closed:
# 顶层键不恰为 {version, events} / 单条事件键不恰为下方 8 个 / old_code 或 new_code 不匹配
# ^\d{6}\.(SH|SZ|BJ)$ / old_code == new_code / effective_date 不是合法 YYYYMMDD 日历日 /
# kind 或 source_kind 不在各自枚举 / source_ref 为空 / old_code 或 new_code 在表内重复 /
# 换码链 (A→B→C) 的 effective_date 不严格递增 / 出现环, 一律 ValueError 拒绝加载, 不静默跳过。
#
