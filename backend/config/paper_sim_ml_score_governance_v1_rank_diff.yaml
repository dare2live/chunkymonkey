# Phase v3.2 P0c paper_sim — variant with score_rank_diff_v1 sizer (Codex round 19 #1, 用户 "差异化到底").
# Forked from paper_sim_ml_score_governance_v1.yaml (only position_sizing changes).
#
# 用法:
#   PYTHONPATH=backend python backend/scripts/run_paper_sim_v2.py \
#       --config-path backend/config/paper_sim_ml_score_governance_v1_rank_diff.yaml \
#       --start 2024-07-01 --end 2026-04-13
#
# 跟 governance_v1.yaml diff:
#   - position_sizing: "equal" → "score_rank_diff_v1"
#   - sizing_params 加入 (p / vol_exp / cash_buffer / max_single / min_single)
#
# 期望: 跟 equal baseline 比较 (用户 "差异化到底" 验证):
#   - score_rank_diff_v1 给排名高的更大权重 (rank 1 ≈ 30%, rank 5 ≈ 5%)
#   - 集中度更高, 但 max_dd 可能更深 / 月胜率更不稳
#   - Codex round 19 预期: alpha 是根因, sizing alone +2-8pp 年化

# ─── 投资组合 ───
portfolio:
  initial_cash: 1_000_000
  max_positions: 5
  position_sizing: "score_rank_diff_v1"   # Codex round 19 #1 — 用户 "差异化到底"
  cash_when_strong_buy_lt: 5
  min_cash_pct: 0.30
  # score_rank_diff_v1 specific params (Codex round 19 推荐):
  sizing_params:
    p: 1.2                  # rank tilt exponent (rank^p × base)
    vol_exp: 0.5            # volatility haircut exponent (1/vol^vol_exp)
    cash_buffer: 0.15       # 15% extra cash buffer beyond min_cash_pct
    max_single_pct: 0.25    # 单股 cap 25%
    min_single_pct: 0.05    # 单股 floor 5%

# ─── 候选选股 (ML score 模式 - Option A) ───
selection:
  mode: "ml_score"
  candidate_source: "mart_p0b_oos_predictions"
  rank_by: "score"
  min_tier_to_buy: "BUY"
  min_tier_to_swap_in: "STRONG_BUY"
  liquidity_min_amount_20d: 50_000_000
  liquidity_max_price: 500
  exclude_stage: []
  backtest_tier_thresholds:
    strong_buy:
      sharpe_min: 0.8
      win_rate_min: 0.65
      calmar_min: 1.0
    buy:
      sharpe_min: 0.3
      win_rate_min: 0.55
  ml_score_model_id: "lgbm_20260517_governance_v1_20d"
  ml_score_max_candidates: 30
  ml_score_min_score: null
  min_forced_hp: 0

# ─── 退出 (Optuna 9-dim) ───
exit:
  use_optuna_stop: true
  use_optuna_target: true
  use_optuna_trailing: true
  use_optuna_hp: true
  stage_deterioration_sell: true

# ─── 换股 (swap_v1) ───
swap:
  enabled: true
  severe_threshold: 0.50
  candidate_must_close_gap: true
  gap_buffer_pct: 0.0035
  min_holding_days_before_swap: 1
  max_swaps_per_day: 1

# ─── 真实交易成本 ───
tx_cost:
  commission_pct: 0.00025
  commission_min_cny: 5
  stamp_duty_sell_pct: 0.0005
  transfer_fee_pct: 0.00001
  exchange_fee_pct: 0.0000341
  regulatory_fee_pct: 0.00002
  slippage_pct: 0.0008
  large_order_surcharge_pct: 0.0015
  large_order_adv_threshold_pct: 0.03

# ─── 风控 ───
risk:
  daily_dd_warning_pct: -0.05
  max_dd_hard_stop_pct: -0.20
  hard_stop_freeze_days: 14

# ─── 数据源 ───
data:
  optimal_table_primary: "mart_per_stock_stage_strategy_optimal_pit"
  optimal_table_fallback: "mart_per_stock_strategy_optimal"
  benchmark: "000300"
  start_date: "2024-07-01"

# ─── 验证 ───
validation:
  user_criteria:
    annual_return_min: 0.30
    max_dd_min: -0.20
    excess_vs_hs300_min: 0.0
    monthly_win_rate_min: 0.55
  anti_churn:
    avg_holding_days_min: 5
    annual_turnover_max: 8.0
    tx_cost_pct_of_gross_pnl_max: 0.10
    swap_uplift_total_min: 0.0
  robustness:
    rolling_ir_60d_median_min: 0.5
    rolling_ir_60d_p25_min: 0.0
    rolling_annual_90d_median_min: 0.25
    regime_min_return_per_segment: -0.02
  ablation:
    swap_vs_baseline_annual_uplift_min: 0.03
    swap_vs_baseline_max_dd_degradation_max: 0.02
    swap_vs_baseline_sharpe_ratio_min: 1.05
  sensitivity:
    severe_threshold_sweep: [0.4, 0.5, 0.6]
  reality_check:
    slippage_stress_pct: 0.003
    annual_degradation_max: 0.05
