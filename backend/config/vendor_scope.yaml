# 供应商范围登记表 v2 — 只描述「哪些证券类别不在项目范围、各取数路径对它怎么处置」。
# 不决定跑什么、按什么顺序跑 (那是 sync_registry.yaml + sync_runner 的事)。
#
# 业主裁定 (2026-09-12) 原话: 「不用管B股，以后也不做，获取完的数据删除清理干净」。
# 已落的 138 行 B 股 (妙想 SECURITY_TYPE='EQB') 主会话已删除, 以后不再落库。
#
# v1 -> v2 (2026-09-12): v1 只能表达单一 (供应商, api) —— 其 loader 把 api 键集合
# 写死成 {'block_trade'}, 加任何第二个域都要改代码。v2 把形状换成能覆盖全部取数域,
# 键统一写成 "<source>.<api>"。
#
# 五种 mode (按「供应商给了什么轴」分派, 不按域分组, 红线10):
#   request_exclude    — 请求侧能表达"不要这个类别" (参数过滤 / 供应商端点本身按类别命名空间)
#   response_exclude   — 请求侧不行, 响应带供应商类别字段, 清洗前按该字段丢行
#   code_exclude        — 响应连类别轴都没有 (2026-09-19 刀 B2 替换 no_vendor_axis):
#                          落地前按 out_of_scope_classes 的 code_patterns 正则匹配一个
#                          代码身份列 (code_field, 必须∈ SECUCODE/SECURITY_CODE/SYMBOL/CODE)
#                          丢行——项目词汇进 landing 的唯一合法入口, 适配器只经
#                          services.data_sources.vendor_scope.vendor_exclusions() 取
#                          (从不 import out_of_scope_codes 或自己拼正则), 规则公式定义
#                          在 backend/services/data_sources/out_of_scope_codes.py 一处。
#   request_enumeration — 请求侧本来就按项目枚举跑 (板块前缀/活跃股票池), 登记枚举来源不改行为
#   population_disjoint  — 供应商总体按定义不含该类别 (指数/融资融券/派生自已排除总体的域), 0 行无豁免
#
# 加载与全部校验见 backend/services/data_sources/vendor_scope.py::load_vendor_scope
# —— 未知键 / 未知 mode / 缺处置 / 违反 C2 互斥一律 fail-closed (ValueError, 消息前缀
# "vendor_scope: L#" 标出违反的具体规则), 不部分生效、不静默忽略。
#
# 设计出处: scratchpad/b_share_exclusion_r1.md §3 (2026-09-12 r1) —— 本文件是该规格的
# 字面落地, 不是重新设计。
#
# 覆盖范围 (L11, 静态测试强制, 不在本文件校验): sync_registry.yaml 里
# execution_policy.mode == enabled 且 (grain ∪ {universe_filter_col}) 与
# security_code_columns 有交集的 (source, api) 必须每个都在 dispositions 里有条目
# (2026-09-16 刀2 核对: 共 23 个 —— fuyao×6 / miaoxiang×3 / stock_st_derive.stock_st /
# tushare×13; tdxhub.daily 已随 daily 域 tdxhub->fuyao 换源删除——L11 是双向检查,
# 留着会变成"指向 registry 里已不存在的 (source,api)"的死条目, 删东西不留墓碑);
# disabled 的域 (14 个) 不在本文件强制范围内, 重新 enabled 那天 L11 会红, 逼出裁决。

version: 2

# L12 (静态测试) 与本文件 L10 共用: sync_registry.yaml 的每个 universe_filter_col
# 取值都必须在这个集合里 —— 堵"新域用了新列名, 两个枚举器都看不见"的洞。
security_code_columns: [ts_code, con_code, stock_code, code]

out_of_scope_classes:
  b_share:
    ruling: "业主 2026-09-12: 不用管B股, 以后也不做, 获取完的数据删除清理干净"
    code_patterns:
      - {prefix: "900", suffix: SH}   # 上交所 B 股代码段 (900000-900999 独占)
      - {prefix: "200", suffix: SZ}   # 深交所 B 股代码段 (200000-200999 独占)

dispositions:
  # ── miaoxiang (东财 aif10 datacenter) ──────────────────────────────────
  miaoxiang.block_trade:
    b_share:
      mode: response_exclude
      field: SECURITY_TYPE
      values: [EQB]
      # 现状 (逐字节保留, S1 不改): RPT_DATA_BLOCKTRADE 响应带 SECURITY_TYPE 字段,
      # 清洗前按此字段丢 EQB 行 (sources/miaoxiang.py::MiaoxiangSource.fetch_raw)。
      # [T4] (东财 datacenter 过滤语法 <>/not like 是否被接受) 未测——本片禁止触网,
      # 若未来证实请求侧可排除, 改判 request_exclude 是后续 S2 切片的事, 非本片。

  miaoxiang.top_inst:
    b_share:
      mode: code_exclude
      code_field: SECUCODE
      checked_at: "2026-09-19"
      evidence: "[T5] 补测 (spec_bshare_b2.md §1.1 P2, 2026-09-19 GET, TRADE_DATE>=2026-08-01
        SECURITY_CODE∈[900000,900999] → count=70, 34 列逐列核对仍无 SECURITY_TYPE /
        SECURITY_TYPE_CODE / TRADE_MARKET_CODE / MARKET 等任何类别或市场字段, 与 09-12
        核对一致——response_exclude 走不通; 供应商确有 B 股席位行, 不能再落 no_vendor_axis
        (业主 2026-09-12 已裁定 B 股不做, 无轴不等于可以不排除)。改按 code_exclude: 落地前用
        SECUCODE 匹配 out_of_scope_classes.b_share 的 code_patterns 丢行。"

  miaoxiang.top_list:
    b_share:
      mode: response_exclude
      field: SECURITY_TYPE_CODE
      values: ["058001002"]
      # [T5] 补测 (spec_bshare_b2.md §1.1 P5, 2026-09-19 GET, TRADE_DATE=2026-09-03
      # SECURITY_CODE=200017 → count=1, SECURITY_TYPE_CODE=058001002, 另有 MARKET=SZ /
      # TRADE_MARKET_CODE=069001002001): RPT_DAILYBILLBOARD_DETAILSNEW 响应确实带
      # SECURITY_TYPE_CODE 类别字段, 改判 response_exclude (此前 09-12 无轴登记是证据不足
      # 时的保守落点, 现已补测推翻)。A 股侧取值见下方三条 aif10 disposition 的共同证据段。

  # ── fuyao (同花顺官方 REST) ────────────────────────────────────────────
  fuyao.meta-tickers-list:
    b_share:
      mode: request_exclude
      filters: ["asset_type=a-share"]
      # 既有事实 (fuyao.py TICKER_LIST_ASSET_TYPE="a-share" 常量 + 服务端/客户端双重过滤,
      # tushare_sunset.yaml stock_basic 条目实测: 5,563 只 100% 覆盖 tushare 5,550 只)。

  fuyao.limit-up-pool:
    b_share:
      mode: request_exclude
      filters: ["vendor endpoint path /api/a-share/special-data/limit-up-pool is a-share-scoped by path"]
      # fuyao.py POOL_API_PATHS: 三个涨跌停池端点本身命名空间在 /api/a-share/ 下 (代码实读,
      # 非猜测), 与 meta-tickers-list 靠查询参数排除不同, 这里排除机制是端点路径本身。

  fuyao.limit-down-pool:
    b_share:
      mode: request_exclude
      filters: ["vendor endpoint path /api/a-share/special-data/limit-down-pool is a-share-scoped by path"]

  fuyao.limit-break-pool:
    b_share:
      mode: request_exclude
      filters: ["vendor endpoint path /api/a-share/special-data/limit-break-pool is a-share-scoped by path"]

  fuyao.auction-short-term-benchmark:
    b_share:
      mode: request_exclude
      filters: ["vendor endpoint path /api/a-share/auction/short-term-benchmark is a-share-scoped by path"]

  # 2026-09-16 刀2: daily 域 tdxhub -> fuyao 换源, tdxhub.daily 这条已随之删除
  # (registry 里不再有 source: tdxhub 的域; L11 是双向检查, 留着会变成指向 registry
  # 里已不存在的 (source,api) 的死条目)。tdxhub.py 本身不动——它只是不再是任何域的
  # 活跃 adapter, 不是被删除。

  fuyao.daily_k_dump:
    b_share:
      mode: population_disjoint
      why: "刀2 换源实测: fuyao daily-k / daily-k-10d dump 与 canonical OHLC 逐日抽样
        比对 (recon_fuyao_kline.py), 出现的证券代码前缀只有 00/30/60/68/92 (沪深A+
        北交所), 无 900(SH)/200(SZ) B 股前缀——与 tdxhub.daily 当年下线前的观测口径
        一致, 总体本就不含 B 股, 无需请求侧/响应侧二次过滤。"

  # ── population_disjoint: 供应商总体按定义不含 B 股 ─────────────────────
  stock_st_derive.stock_st:
    b_share:
      mode: population_disjoint
      why: "2026-09-18 双水库改写 (ST 契约 v2 刀3), mode 不变: 两条派生路径各自
        不含 B 股。①名称快照路径读 raw_tushare_stock_basic (本表结构上含 B 股
        代码), 但对 canonical_stock_st_daily 173,413 行历史逐行核实 0 只曾 ST
        (stock_st_derive.py 模块 docstring 历史正则实测段) —— 这是经验事实
        (B 股从未被戴帽), 不是结构保证, 若未来出现 B 股 ST 需要重新评估这条
        why。②baostock 水库路径只覆盖请求侧显式过滤过的沪深 A 股: 回填命令
        (ingest_baostock_daily_k_reservoir.py) 与 daily 适配器的请求池均排除
        900/200(B 股)与北交所, 见 services.universe.is_active_a_share, 水库里
        结构上不存在 B 股行。不新增 (source, api) 条目: 水库不是按 (source, api)
        调度的注册域 (spec §3.5), L11 死引用检查按 (source, api) 计数, 水库表名
        走 database_manifest/data_layers 登记, 不走这份配置。"

  # ── aif10 (东财妙想 datacenter, 非 sync_registry 登记路径 —— L11 死引用检查靠
  #    non_registry_sources 认领这三个键, 见文件尾) ─────────────────────────
  # 2026-09-19 刀 B2 [T5] 补测证据 (spec_bshare_b2.md §1.1): P1/P3/P4 三次 GET 一致
  # 实测 SECURITY_TYPE_CODE=058001002 是 B 股 (沪 900/深 200 两段), A 股为 058001001
  # (科创板另见 058001008); 本地 staging 全量按 (SECURITY_TYPE_CODE, 交易所, 前缀)
  # 分组只有 5 组 (058001001×4 + 058001008×1), 故排除必须按"等于 058001002"而不是
  # "不等于 058001001"(否则会连科创板那组也丢)。
  aif10.holders_top10:
    b_share:
      mode: response_exclude
      field: SECURITY_TYPE_CODE
      values: ["058001002"]
      # P1: RPT_F10_EH_FREEHOLDERS UPDATE_DATE='2026-09-17' SECURITY_CODE="900910"
      # → 10 行, 47 列, SECURITY_TYPE_CODE=058001002, SECUCODE=900910.SH。

  aif10.org_holding:
    b_share:
      mode: response_exclude
      field: SECURITY_TYPE_CODE
      values: ["058001002"]
      # P3: RPT_MAIN_ORGHOLDDETAIL REPORT_DATE='2026-06-30' SECURITY_CODE="200012"
      # → 5 行, 41 列, SECURITY_TYPE_CODE=058001002, SECUCODE=200012.SZ。

  aif10.qfii_holders:
    b_share:
      mode: response_exclude
      field: SECURITY_TYPE_CODE
      values: ["058001002"]
      # P4: RPT_DMSK_HOLDERS HOLDER_NEWTYPE="QFII" SECURITY_CODE="900937"
      # END_DATE='2026-06-30' → 4 行, 41 列, SECURITY_TYPE_CODE=058001002,
      # SECUCODE=900937.SH。键从 aif10.RPT_DMSK_HOLDERS 改名 (原名不满足 dispositions
      # 键正则 ^[a-z_]+\.[a-z0-9_-]+$, 大写字母不合法); 全仓 grep 无其它引用该旧字符串
      # (services/clients_registry.py:71 的 upstream_source="aif10:RPT_DMSK_HOLDERS"
      # 是另一个独立字符串常量, 不受影响, 不动)。

# 不在 sync_registry.yaml 里的取数路径 (键同样是 "<source>.<api>"), 登记仅为 L11 死引用
# 检查提供合法目标 (三条均已在上方 dispositions 里有 b_share response_exclude 处置——
# 2026-09-19 刀 B2 之前这里曾写「不要求每条都带处置, 已知均已是代码枚举 (get_active_universe)」,
# 该断言对这三个 aif10 写者不成立: holders 的 `fetch_holders_top10_by_notice_date` 按公告日
# 整批取, org_holding 的 `sync_period` 按报告期整市场取, qfii 的 `_fetch_qfii_aif10` 按持股
# 变动类型×报告期整市场取, 三者都不经 get_active_universe 逐码枚举, 此前的 B 股行是取数无
# 过滤所致, 不是"旧枚举遗留"——spec_bshare_b2.md §1.4/§1.3 已更正)。
non_registry_sources:
  aif10.qfii_holders:
    writer: "services.qfii_client"
  aif10.holders_top10:
    writer: "scripts.ingest_holders_raw"
  aif10.org_holding:
    writer: "scripts.ingest_org_holding_aif10"
