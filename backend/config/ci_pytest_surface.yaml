# Single source of truth for the offline CI pytest surface.
#
# Owner: this file + backend/scripts/run_ci_pytest.py. Consumed IDENTICALLY by:
#   - .github/workflows/ci.yml ("Run offline tests" step)
#   - scripts/safe_commit.sh (L2/L3 gate "ci_pytest")
# so the local pre-commit test surface and the public-CI test surface can never
# silently drift apart again.
#
# Binding finding fixed (2026-07-20 Fable5 CI-tax audit):
#   1. Local safe_commit ran zero pytest -> stale/broken assertions only exploded
#      on public CI, long after the local "reviewed" commit.
#   2. ci.yml's hand-maintained test list had drifted from the actual committed
#      test surface (e.g. tests/services/test_main_rally_b1.py was never listed,
#      so a real regression there would have gone green on every push).
#
# `paths`: pytest args (relative to backend/) that run in CI AND in safe_commit's
#   L2/L3 gate. Keep this list to genuinely offline-collectible, marker-clean
#   (not realdb/network/perf/gcp/slow) test files only -- markers alone do not
#   protect against live-DB import/collection errors in a fresh CI checkout.
#
# `ci_test_optional`: exact test file paths (relative to backend/), each with a
#   `reason`, that are intentionally NOT run by CI/safe_commit. Enforced by
#   backend/tests/scripts/test_ci_pytest_surface_drift.py: every tracked
#   backend/tests/**/test_*.py file must appear in `paths` OR here. A new test
#   file that appears in neither turns that drift test red on the very next
#   commit that touches it -- the failure mode this file exists to close.

