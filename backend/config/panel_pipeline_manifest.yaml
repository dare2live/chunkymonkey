# Panel pipeline manifest — explicit DAG for mart_p0a_*_panel rebuild
#
# Codex review 2026-05-19 a7ffbdb2 HIGH 2: v4 panel implicit DAG → manifest 显式契约.
# 替代之前 implicit "v4 build 依赖 v3 + alpha158 + capital_flow + sector_momentum + ..." 隐式 docs.
#
# 用途:
# 1. 任何 build 启动前, 由 validator (backend/scripts/preflight_panel_build.py 拓展) 读 manifest
#    校验 inputs 存在 + max_date OK + row count > min_threshold.
# 2. CI / cron 用作依赖图: 修上游表后, 反查 downstream pipelines 需 rebuild.
# 3. 新人 onboarding 1-page 看懂数据流.
#
# rule-compliance: ok evidence=Codex-a7ffbdb2-HIGH-2-DAG-manifest

version: "p0a_panel_pipeline_v1_20260519"

# 数据源 (raw / fact tables)
sources:
  v_price_kline_qfq:
    db: market.duckdb
    schema: mkt
    pit_field: date
    description: "K-line raw (PIT, 已 calendar gate filter)"
    sync_script: backend/scripts/build_price_kline_tdxhub.py
    write_lint: services/market_db.filter_kline_rows_by_calendar
  # fact_alpha158_panel: 移除 (2026-06-14 地基-reset 收口) — alpha158 不再是日更管线 (特征层,
  # 旧 panel PIT 不可信已删, daily_update Step 2c 重建循环已切)。重算路径=manual build_alpha158_duck.py
  # + pit_guard 核证, 见 database_manifest alpha158 (planned) + model_validation_reliability_design。
  fact_capital_flow_pit_daily:
    db: smartmoney.duckdb
    pit_field: trade_date
    upstream: [fact_lhb_event, fact_executive_trade_event, fact_holder_count_period]
    sync_script: backend/scripts/backfill_capital_flow_pit.py
    calendar_gate: true
  fact_lhb_event:
    db: smartmoney.duckdb
    pit_field: trade_date
    sync_script: routers/updater._step_sync_lhb (via sync_lhb_range)
  fact_risk_factors:
    db: smartmoney.duckdb
    pit_field: calc_date
    upstream: [v_price_kline_qfq]
    sync_script: services/risk_factors.calc_risk_factors
  fact_sector_momentum_daily:
    db: smartmoney.duckdb
    pit_field: date
    upstream: [v_price_kline_qfq, mart_stock_industry_pit]
    sync_script: backend/scripts/backfill_sector_momentum_history.py
    calendar_gate: true
  fact_industry_beta_daily:
    db: smartmoney.duckdb
    pit_field: trade_date
    upstream: [v_price_kline_qfq]
  fact_market_cap_decile_daily:
    db: smartmoney.duckdb
    pit_field: trade_date
  mart_stock_survey_features:
    db: smartmoney.duckdb
    pit_field: as_of_date
    coverage_start: "2025-04-23"
  mart_stock_industry_pit:
    db: smartmoney.duckdb
    pit_field: effective_from
    filter: "confidence_level='observed_snapshot'"

# Build pipelines (depth-ordered: 0 = root, N = depends on N-1)
pipelines:
  - name: alpha158
    depth: 1
    build_script: backend/scripts/build_alpha158_duck.py
    output_table: fact_alpha158_panel
    inputs: [v_price_kline_qfq]
    rebuild_mode: DROP_CREATE  # full rebuild
    eta_min: 0.5
    pit_gate: "WHERE date <= cal_max (close_hour=15 minute=5)"

  - name: label_panel
    depth: 2
    build_script: backend/scripts/rebuild_p0a_label_panel.py
    output_table: mart_p0a_label_panel
    inputs:
      - v_price_kline_qfq (entry/exit kline 6 LEFT JOIN via tmp_kline materialize)
      - dim_trading_calendar (trading_day_rank)
      - dim_all_ever_listed (universe.py pit_universe_by_signal_date)
    rebuild_mode: DELETE_INSERT_idempotent
    eta_min: 30  # 805 dates batch redesign (Step 1+2)
    pit_gate: "tmp_pit_stock_signal listed_date <= signal_date"

  - name: v3_panel
    depth: 3
    build_script: backend/scripts/build_p0a_feature_panel_v3.py
    output_table: mart_p0a_feature_label_panel_v3
    inputs:
      - mart_p0a_label_panel
      - fact_alpha158_panel
      - fact_capital_flow_pit_daily
      - fact_lhb_event
      - fact_risk_factors
      - fact_sector_momentum_daily (optional)
      - mart_stock_industry_pit (observed_snapshot only)
    rebuild_mode: DELETE_INSERT_by_date_range
    eta_min: 5  # OOM at 7+ year range, recommend year chunks
    notes: "OOM 6.4GB risk on Mac 8GB. Chunk by year for full rebuild."

  - name: v4_panel
    depth: 4
    build_script: backend/scripts/build_p0a_feature_panel_v4.py
    output_table: mart_p0a_feature_label_panel_v4
    inputs:
      - mart_p0a_feature_label_panel_v3
      - fact_market_cap_decile_daily
      - fact_industry_beta_daily
      - fact_sector_momentum_daily
      - mart_stock_survey_features
      - mart_stock_industry_pit
    rebuild_mode: DELETE_INSERT_by_date_range
    eta_min: 5

  - name: lambdamart_v6_retrain
    depth: 5
    build_script: backend/scripts/retrain_lambdamart_v6.py
    output_table: mart_p0b_oos_predictions
    inputs: [mart_p0a_feature_label_panel_v4]
    rebuild_mode: APPEND_by_model_id
    eta_min: 240  # 实测口径源自历史 50-trials 全 panel 跑批 (GCP 已退役, 现执行面 = local/modal)
    eta_min_mac: 1800  # Mac 8C, 35-50h serial

  - name: sniper_score
    depth: 5
    build_script: backend/scripts/build_sniper_score_daily.py
    output_table: mart_sniper_score_daily
    inputs:
      - mart_p0a_feature_label_panel_v4 (universe + lhb_inst_buy_30d + sector_ret_20d)
      - fact_alpha158_panel (a158_roc60)
      - v_price_kline_qfq (60d return + 涨停)
      - fact_capital_flow_daily (optional; no raw_fund_flow_daily production fallback)
    rebuild_mode: INSERT_OR_REPLACE_by_date_range
    eta_min: 5

  - name: institution_score
    depth: 5
    build_script: backend/scripts/build_institution_score_daily.py
    output_table: mart_institution_score_daily
    inputs:
      - mart_p0a_feature_label_panel_v4 (universe)
      - fact_lhb_event (LHBAlpha)
      - fact_capital_flow_pit_daily (CapitalFlowAlpha PIT-only; raw_fund_flow_daily research/deprecated only)
      - raw_institution_surveys (SurveyAlpha)
      - fact_hsgt_daily (NorthboundAlpha)
    rebuild_mode: INSERT_OR_REPLACE_by_date_range
    eta_min: 15

# Calendar policy (集中, services/calendar.py)
calendar:
  kline_write_close_hour: 15
  kline_write_close_minute: 5
  default_close_hour: 16  # conservative for non-write callers
  default_close_minute: 0
  helper_module: services/calendar.py

# Preflight check spec (validator should enforce)
preflight_gates:
  - for: label_panel
    require:
      - v_price_kline_qfq.max(date) >= signal_date_max  # K-line ready
      - fact_alpha158_panel.max(date) >= signal_date_max
      - dim_trading_calendar.max(trade_date) >= signal_date_max + 130 days  # forward horizon
  - for: v3_panel
    require:
      - mart_p0a_label_panel.signal_date_range covers [start_date, end_date]
      - fact_alpha158_panel.date_range covers [start_date - 60, end_date]  # rolling window
  - for: v4_panel
    require:
      - mart_p0a_feature_label_panel_v3.signal_date_range covers [start_date, end_date]
      - fact_market_cap_decile_daily.trade_date covers [start_date, end_date]
      - fact_industry_beta_daily.trade_date covers [start_date, end_date]
  - for: lambdamart_v6_retrain
    require:
      - mart_p0a_feature_label_panel_v4.signal_date_range covers [start_date, end_date]
      - mart_p0a_feature_label_panel_v4.rows > 1000000  # min sample

# 已知 deviation / TODO (debt)
known_gaps:
  - "forecast_upside not in v4: 无 PIT 历史快照, daily snapshot 累积数月后接"
  - "mart_stock_survey_features 2025-04-23 起覆盖 (9.7% coverage rate), 早期 NULL"
  - "mart_stock_industry_pit 仅 7 个 snapshot (PIT 不全), fallback to latest"
  - "fact_industry_beta_daily / fact_market_cap_decile_daily 仅最近~2 年 (95% coverage)"
