# TDX-first data need coverage catalog.
# Owner: backend/scripts/audit_tdx_data_need_coverage.py materializes this config.
# Policy: source priorities and reassignment proposals are governed data, not Python literals.

input_paths:
  - "chunkymonkey/backend/services/data_sources/clients_registry.py"
  - "chunkymonkey/backend/services/data_sources/data_routes.py"
  - "chunkymonkey/backend/services/data_lineage/registry.py"
  - "chunkymonkey/backend/services/model_feature_schema.py"
  - "chunkymonkey/backend/scripts/build_candidate_feature_panel.py"
  - "tdxhub/tdxhub/capabilities.py"
  - "miaoxiang/aif10_scraper/registry.py"

contract_templates:
  security_master_route: &security_master_route
    grain: "stock_code"
    pit_key: "listed_date"
    freshness_sla: "daily_after_kline_close"
    evidence_status: "production"
    production_eligibility: "eligible"
  daily_stock_price: &daily_stock_price
    grain: "stock_code x trade_date"
    pit_key: "trade_date"
    freshness_sla: "T+0_after_kline_close"
    evidence_status: "production"
    production_eligibility: "eligible"
  daily_index_price: &daily_index_price
    grain: "index_code x trade_date"
    pit_key: "trade_date"
    freshness_sla: "T+0_after_kline_close"
    evidence_status: "production"
    production_eligibility: "eligible"
  price_adjustment: &price_adjustment
    grain: "stock_code x ex_date"
    pit_key: "ex_date"
    freshness_sla: "daily_after_exchange_disclosure"
    evidence_status: "production"
    production_eligibility: "eligible"
  classification_research: &classification_research
    grain: "stock_code x effective_date"
    pit_key: "effective_date"
    freshness_sla: "daily_snapshot_or_source_disclosure"
    evidence_status: "research"
    production_eligibility: "research_only"
  financial_statement_research: &financial_statement_research
    grain: "stock_code x report_date"
    pit_key: "available_date"
    freshness_sla: "quarterly_after_report_disclosure"
    evidence_status: "research"
    production_eligibility: "research_only"
  holder_period_research: &holder_period_research
    grain: "stock_code x report_period"
    pit_key: "source_available_date"
    freshness_sla: "quarterly_after_report_disclosure"
    evidence_status: "research"
    production_eligibility: "research_only"
  event_research: &event_research
    grain: "stock_code x event_date"
    pit_key: "source_available_date"
    freshness_sla: "daily_after_source_disclosure"
    evidence_status: "research"
    production_eligibility: "research_only"
  external_research: &external_research
    grain: "stock_code x source_date"
    pit_key: "source_available_date"
    freshness_sla: "source_probe_required"
    evidence_status: "research"
    production_eligibility: "research_only"
  order_flow_blocked: &order_flow_blocked
    grain: "stock_code x trade_date"
    pit_key: "unknown"
    freshness_sla: "source_probe_required"
    evidence_status: "unknown"
    production_eligibility: "blocked"

needs:
  - need_id: "need_001"
    <<: *security_master_route
    need_name: "A 股代码、市场列表"
    consumer: "security_master"
    current_source: "akshare/tdx mixed"
    tdxhub_capability: "tdxhub.stocks"
    tdx_coverage_level: "full"
    preferred_source: "tdxhub_quote"
    fallback_source: "akshare"
    action: "keep_tdx_primary"
    notes: "TDX code universe is sufficient for A-share routing."
  - need_id: "need_002"
    <<: *daily_stock_price
    need_name: "日 K 与收益率标签"
    consumer: "feature_panel"
    current_source: "akshare:stock_zh_a_hist"
    tdxhub_capability: "tdxhub.bars/k"
    tdx_coverage_level: "full"
    preferred_source: "tdxhub_quote"
    fallback_source: "akshare"
    action: "downgrade_akshare_to_fallback"
    notes: "Price labels should prefer TDX bars."
  - need_id: "need_003"
    <<: *daily_index_price
    need_name: "指数 K 与市场基准"
    consumer: "feature_panel"
    current_source: "akshare/index"
    tdxhub_capability: "tdxhub.index_bars"
    tdx_coverage_level: "full"
    preferred_source: "tdxhub_quote"
    fallback_source: "akshare"
    action: "prefer_tdx"
    notes: "Index bars are a TDX stable source."
  - need_id: "need_004"
    <<: *price_adjustment
    need_name: "除权除息复权"
    consumer: "price_adjustment"
    current_source: "akshare xdxr/fhps"
    tdxhub_capability: "tdxhub.xdxr"
    tdx_coverage_level: "full"
    preferred_source: "tdxhub_quote"
    fallback_source: "miaoxiang"
    action: "prefer_tdx"
    notes: "TDX xdxr is the primary adjustment feed."
  - need_id: "need_005"
    <<: *classification_research
    need_name: "行业与板块映射"
    consumer: "dimension"
    current_source: "tdxhub/akshare mixed"
    tdxhub_capability: "tdxhub.block"
    tdx_coverage_level: "partial"
    preferred_source: "tdxhub_quote"
    fallback_source: "miaoxiang"
    action: "keep_tdx_primary"
    notes: "TDX block covers mapping; miaoxiang can add descriptive taxonomy."
  - need_id: "need_006"
    <<: *financial_statement_research
    need_name: "财务三表原始字段"
    consumer: "fundamental"
    current_source: "raw_gpcw_detail"
    tdxhub_capability: "tdxhub.gpcw"
    tdx_coverage_level: "full"
    preferred_source: "tdxhub_gpcw"
    fallback_source: "akshare"
    action: "keep_tdx_primary"
    notes: "gpcw wide/detail rows cover quarterly statements."
  - need_id: "need_007"
    <<: *financial_statement_research
    need_name: "财务质量因子"
    consumer: "model_feature"
    current_source: "raw_gpcw_detail"
    tdxhub_capability: "tdxhub.gpcw"
    tdx_coverage_level: "full"
    preferred_source: "tdxhub_gpcw"
    fallback_source: "akshare"
    action: "auto_feature_validate"
    notes: "OCF/profit, receivables, inventory and debt ratios are derivable."
  - need_id: "need_008"
    <<: *financial_statement_research
    need_name: "盈利成长因子"
    consumer: "model_feature"
    current_source: "raw_gpcw_detail"
    tdxhub_capability: "tdxhub.gpcw"
    tdx_coverage_level: "full"
    preferred_source: "tdxhub_gpcw"
    fallback_source: "akshare"
    action: "auto_feature_validate"
    notes: "Revenue/profit/EPS/ROE trends should be auto-derived."
  - need_id: "need_009"
    <<: *holder_period_research
    need_name: "股东人数与筹码集中"
    consumer: "model_feature"
    current_source: "TDX F10 + gpcw"
    tdxhub_capability: "tdxhub.gpcw + TDX F10"
    tdx_coverage_level: "full"
    preferred_source: "tdxhub_gpcw"
    fallback_source: "tdxhub_f10"
    action: "cross_validate"
    notes: "gpcw aggregate and F10 history should cross-check."
  - need_id: "need_010"
    <<: *holder_period_research
    need_name: "十大股东聚合"
    consumer: "holder_fact"
    current_source: "gpcw/F10"
    tdxhub_capability: "tdxhub.gpcw"
    tdx_coverage_level: "partial"
    preferred_source: "tdxhub_gpcw"
    fallback_source: "tdxhub_f10"
    action: "prefer_aggregate_tdx"
    notes: "Aggregate shares are available; names still need F10/miaoxiang."
  - need_id: "need_011"
    <<: *event_research
    need_name: "十大股东进入退出事件"
    consumer: "holder_event"
    current_source: "TDX F10/miaoxiang"
    tdxhub_capability: "TDX F10 raw/extra"
    tdx_coverage_level: "partial"
    preferred_source: "tdxhub_f10"
    fallback_source: "miaoxiang"
    action: "keep_f10_primary_with_fallback"
    notes: "TDX parser should remain first for event extraction."
  - need_id: "need_012"
    <<: *holder_period_research
    need_name: "机构持仓聚合"
    consumer: "institution_feature"
    current_source: "raw_gpcw_detail"
    tdxhub_capability: "tdxhub.gpcw"
    tdx_coverage_level: "full"
    preferred_source: "tdxhub_gpcw"
    fallback_source: "miaoxiang"
    action: "keep_tdx_primary"
    notes: "Fund/QFII/social-security/broker/insurance aggregates exist."
  - need_id: "need_013"
    <<: *holder_period_research
    need_name: "机构持仓明细到机构名"
    consumer: "institution_detail"
    current_source: "miaoxiang"
    tdxhub_capability: "tdxhub.gpcw aggregate only"
    tdx_coverage_level: "none"
    preferred_source: "miaoxiang"
    fallback_source: "tdxhub_gpcw"
    action: "keep_miaoxiang_detail"
    notes: "gpcw cannot replace institution-name detail."
  - need_id: "need_014"
    <<: *holder_period_research
    need_name: "基金持股明细"
    consumer: "fund_holding"
    current_source: "TDX F10 + miaoxiang"
    tdxhub_capability: "TDX F10 section 7"
    tdx_coverage_level: "partial"
    preferred_source: "tdxhub_f10"
    fallback_source: "miaoxiang"
    action: "keep_f10_with_fallback"
    notes: "F10 section 7 provides details; miaoxiang remains fallback."
  - need_id: "need_015"
    <<: *event_research
    need_name: "业绩预告"
    consumer: "forecast_feature"
    current_source: "raw_gpcw_detail"
    tdxhub_capability: "tdxhub.gpcw"
    tdx_coverage_level: "full"
    preferred_source: "tdxhub_gpcw"
    fallback_source: "miaoxiang"
    action: "deep_dive_priority"
    notes: "Forecast fields are the strongest current family."
  - need_id: "need_016"
    <<: *event_research
    need_name: "业绩快报"
    consumer: "express_feature"
    current_source: "raw_gpcw_detail"
    tdxhub_capability: "tdxhub.gpcw"
    tdx_coverage_level: "full"
    preferred_source: "tdxhub_gpcw"
    fallback_source: "miaoxiang"
    action: "deep_dive_priority"
    notes: "Express fields and announce dates are in gpcw."
  - need_id: "need_017"
    <<: *external_research
    need_name: "主营构成"
    consumer: "business_segment"
    current_source: "miaoxiang"
    tdxhub_capability: "not in gpcw"
    tdx_coverage_level: "none"
    preferred_source: "miaoxiang"
    fallback_source: "akshare"
    action: "keep_miaoxiang"
    notes: "Product/region/industry revenue split is not supplied by TDX gpcw."
  - need_id: "need_018"
    <<: *external_research
    need_name: "估值分位"
    consumer: "valuation"
    current_source: "miaoxiang/aif10"
    tdxhub_capability: "tdx quote can compute raw valuation only"
    tdx_coverage_level: "none"
    preferred_source: "miaoxiang"
    fallback_source: "akshare"
    action: "keep_miaoxiang"
    notes: "Historical percentile definitions remain miaoxiang-owned."
  - need_id: "need_019"
    <<: *event_research
    need_name: "龙虎榜"
    consumer: "event_detail"
    current_source: "eastmoney/miaoxiang"
    tdxhub_capability: "not in current TDX path"
    tdx_coverage_level: "none"
    preferred_source: "miaoxiang"
    fallback_source: "akshare"
    action: "keep_external"
    notes: "TDX path is not the primary LHB detail source."
  - need_id: "need_020"
    <<: *external_research
    need_name: "融资融券"
    consumer: "margin"
    current_source: "akshare"
    tdxhub_capability: "not in current TDX path"
    tdx_coverage_level: "none"
    preferred_source: "miaoxiang"
    fallback_source: "akshare"
    action: "evaluate_miaoxiang_or_keep_akshare"
    notes: "No stable TDX feed in this project."
  - need_id: "need_021"
    <<: *event_research
    need_name: "机构调研"
    consumer: "survey"
    current_source: "miaoxiang"
    tdxhub_capability: "not in gpcw"
    tdx_coverage_level: "none"
    preferred_source: "miaoxiang"
    fallback_source: "akshare"
    action: "keep_miaoxiang"
    notes: "Research survey details remain miaoxiang-owned."
  - need_id: "need_022"
    <<: *external_research
    need_name: "机构预测/评级"
    consumer: "analyst"
    current_source: "miaoxiang/aif10"
    tdxhub_capability: "company forecast only"
    tdx_coverage_level: "none"
    preferred_source: "miaoxiang"
    fallback_source: "akshare"
    action: "keep_miaoxiang"
    notes: "Company forecast is not sell-side consensus."
  - need_id: "need_023"
    <<: *event_research
    need_name: "分红"
    consumer: "capital_event"
    current_source: "akshare/miaoxiang"
    tdxhub_capability: "tdxhub.xdxr"
    tdx_coverage_level: "partial"
    preferred_source: "tdxhub_quote"
    fallback_source: "miaoxiang"
    action: "split_primary_and_detail"
    notes: "Adjustment facts from TDX; detailed plans from miaoxiang."
  - need_id: "need_024"
    <<: *event_research
    need_name: "增发/解禁/回购"
    consumer: "capital_event"
    current_source: "akshare/miaoxiang"
    tdxhub_capability: "limited TDX"
    tdx_coverage_level: "partial"
    preferred_source: "miaoxiang"
    fallback_source: "akshare"
    action: "keep_detail_source"
    notes: "Complex event details are not fully covered by TDX."
  - need_id: "need_025"
    <<: *external_research
    need_name: "高管、实控人、公司概况"
    consumer: "company_profile"
    current_source: "miaoxiang/F10 raw"
    tdxhub_capability: "TDX F10 raw"
    tdx_coverage_level: "partial"
    preferred_source: "miaoxiang"
    fallback_source: "tdxhub_f10"
    action: "parse_f10_or_keep_miaoxiang"
    notes: "Use F10 if stable, otherwise keep miaoxiang."
  - need_id: "need_026"
    <<: *external_research
    need_name: "ETF 行情与成分验证"
    consumer: "etf"
    current_source: "akshare/tdx mixed"
    tdxhub_capability: "tdxhub.quotes"
    tdx_coverage_level: "partial"
    preferred_source: "tdxhub_quote"
    fallback_source: "akshare"
    action: "prefer_tdx_price_fallback_components"
    notes: "TDX can price; constituent detail may need fallback."
  - need_id: "need_027"
    <<: *order_flow_blocked
    need_name: "主力/超大/大/中/小单资金流向"
    consumer: "cyq_position_monitor, institution_score, sniper_score"
    current_source: "raw_fund_flow_daily deprecated/stale"
    tdxhub_capability: "not in current TDX path"
    tdx_coverage_level: "none"
    preferred_source: "akshare"
    fallback_source: "miaoxiang"
    action: "probe_restore_or_keep_unknown"
    source_probe_cases:
      - case_id: "sh_600519_exact_flow"
        capability: "individual_fund_flow"
        kwargs:
          stock: "600519"
          market: "sh"
        stock_code: "600519"
      - case_id: "sz_000001_exact_flow"
        capability: "individual_fund_flow"
        kwargs:
          stock: "000001"
          market: "sz"
        stock_code: "000001"
      - case_id: "cy_300750_exact_flow"
        capability: "individual_fund_flow"
        kwargs:
          stock: "300750"
          market: "sz"
        stock_code: "300750"
      - case_id: "tushare_600519_moneyflow"
        capability: "moneyflow"
        prefer_source: "tushare"
        data_domain: "order_flow_fund_flow"
        source_name: "tushare"
        source_tier: 2
        kwargs:
          ts_code: "600519.SH"
        stock_code: "600519"
      - case_id: "tushare_000001_moneyflow"
        capability: "moneyflow"
        prefer_source: "tushare"
        data_domain: "order_flow_fund_flow"
        source_name: "tushare"
        source_tier: 2
        kwargs:
          ts_code: "000001.SZ"
        stock_code: "000001"
      - case_id: "tushare_300750_moneyflow"
        capability: "moneyflow"
        prefer_source: "tushare"
        data_domain: "order_flow_fund_flow"
        source_name: "tushare"
        source_tier: 2
        kwargs:
          ts_code: "300750.SZ"
        stock_code: "300750"
    candidate_sources:
      - source_id: "tushare_moneyflow_2000"
        provider: "tushare"
        capability: "moneyflow"
        role: "low_cost_exact_flow_probe"
        minimum_points: 2000
        evidence_status: "unknown"
        production_eligibility: "blocked"
        gate: "token_backed_no_persist_probe_then_field_date_pit_freshness_watermark"
        required_validation:
          - "no_persist_probe"
          - "field_mapping_main_super_large_large_medium_small"
          - "date_coverage"
          - "pit_key"
          - "freshness_sla"
          - "watermark"
          - "failure_queue_resolution"
        notes: "2000 积分可调取; 需由 buy/sell small/medium/large/extra-large 字段映射出 main/super_large/large/medium/small 净额并验证口径。"
      - source_id: "tushare_moneyflow_dc_5000"
        provider: "tushare"
        capability: "moneyflow_dc"
        role: "direct_bucket_candidate"
        minimum_points: 5000
        evidence_status: "unknown"
        production_eligibility: "blocked"
        gate: "token_backed_no_persist_probe_then_field_date_pit_freshness_watermark"
        required_validation:
          - "no_persist_probe"
          - "field_mapping_main_super_large_large_medium_small"
          - "date_coverage"
          - "pit_key"
          - "freshness_sla"
          - "watermark"
          - "failure_queue_resolution"
        notes: "字段更直接含主力/超大/大/中/小净流入，但历史从 2023-09-11 起，不能覆盖全历史回测。"
      - source_id: "tushare_moneyflow_ths_6000"
        provider: "tushare"
        capability: "moneyflow_ths"
        role: "cross_source_check"
        minimum_points: 6000
        evidence_status: "unknown"
        production_eligibility: "blocked"
        gate: "token_backed_no_persist_probe_and_cross_source_reconciliation"
        required_validation:
          - "no_persist_probe"
          - "field_mapping_main_super_large_large_medium_small"
          - "date_coverage"
          - "pit_key"
          - "freshness_sla"
          - "watermark"
          - "cross_source_reconciliation"
        notes: "同花顺口径资金流，适合与 moneyflow/moneyflow_dc 做一致性检查，不作为首个低成本门槛。"
      - source_id: "akshare_individual_fund_flow"
        provider: "akshare"
        capability: "individual_fund_flow"
        role: "current_registered_probe_candidate"
        minimum_points: 0
        evidence_status: "unknown"
        production_eligibility: "blocked"
        gate: "existing_need027_exact_flow_gate"
        required_validation:
          - "existing_need027_exact_flow_gate"
          - "field_mapping_main_super_large_large_medium_small"
          - "pit_key"
          - "freshness_sla"
          - "watermark"
          - "anti_scrape_stability"
          - "failure_queue_resolution"
        notes: "本地已注册但 live probe 反复 RemoteDisconnected；rank snapshot 不得 resolve exact-flow blocker。"
      - source_id: "tdxhub_xmtdx_history_fund_flow"
        provider: "tdxhub_or_xmtdx"
        capability: "history_fund_flow_candidate"
        role: "experimental_low_cost_candidate"
        minimum_points: 0
        evidence_status: "unknown"
        production_eligibility: "blocked"
        gate: "protocol_field_semantics_coverage_license_probe"
        required_validation:
          - "protocol_field_semantics"
          - "date_coverage"
          - "pit_key"
          - "freshness_sla"
          - "watermark"
          - "license_boundary"
        notes: "当前项目 tdxhub path 不提供 need_027 exact-flow；xmtdx/TDX MCP 只可作为协议级候选，需单独证明字段语义、覆盖、稳定性和授权边界。"
    notes: "CYQ 主力画像需要真实订单流；本地 raw_fund_flow_daily 停在 2026-04-24 且已登记 deprecated。恢复前不得作为生产证据；当前 fallback 标签 miaoxiang 只是 aif10 家族别名，但 aif10 仍未实现 individual_fund_flow，所以还要先探测 akshare capability、source probe、PIT availability、freshness 和反爬稳定性。"

priorities:
  - data_domain: "quotes_and_labels"
    preferred_source: "tdxhub_quote"
    fallback_1: "akshare"
    fallback_2: null
    reason: "行情、指数、复权优先 TDX，akshare 只兜底。"
  - data_domain: "gpcw_financials"
    preferred_source: "tdxhub_gpcw"
    fallback_1: "akshare"
    fallback_2: null
    reason: "财务三表、质量、成长、预告快报从 gpcw 主供。"
  - data_domain: "holder_aggregate"
    preferred_source: "tdxhub_gpcw"
    fallback_1: "tdxhub_f10"
    fallback_2: "miaoxiang"
    reason: "聚合口径优先 gpcw，明细事件由 F10/miaoxiang 补。"
  - data_domain: "holder_detail"
    preferred_source: "tdxhub_f10"
    fallback_1: "miaoxiang"
    fallback_2: null
    reason: "F10 raw/extra 能解析时优先 TDX，失败时 miaoxiang 补。"
  - data_domain: "institution_aggregate"
    preferred_source: "tdxhub_gpcw"
    fallback_1: "miaoxiang"
    fallback_2: null
    reason: "机构类型聚合由 gpcw 主供。"
  - data_domain: "institution_detail"
    preferred_source: "miaoxiang"
    fallback_1: "tdxhub_gpcw"
    fallback_2: null
    reason: "机构名明细不是 gpcw 强项。"
  - data_domain: "valuation_and_consensus"
    preferred_source: "miaoxiang"
    fallback_1: "akshare"
    fallback_2: null
    reason: "估值分位和卖方一致预期不由 TDX/gpcw 主供。"
  - data_domain: "survey_and_text"
    preferred_source: "miaoxiang"
    fallback_1: "akshare"
    fallback_2: null
    reason: "机构调研、文本、主营构成保留 miaoxiang。"
  - data_domain: "capital_events"
    preferred_source: "tdxhub_quote"
    fallback_1: "miaoxiang"
    fallback_2: "akshare"
    reason: "除权除息用 TDX；复杂资本事件细节由 miaoxiang/akshare 补。"
  - data_domain: "order_flow_fund_flow"
    preferred_source: "akshare"
