# 判例查询引擎 —— 登记表
#
# 系统只回答一件事: **一条人手写的选股公式, 历史上每次触发之后发生了什么, 在什么情形下表现更好。**
# 不产出策略、不拟合参数、不判定策略"够不够格"(goal.md 北极星段)。
#
# ── 为什么只有一张事实表 ───────────────────────────────────────────────────────
# `casebook_outcome_day` 是**每股每日**的固定窗口结果, **与策略无关**。
# 策略只贡献一张信号表(哪些股票日是它的触发点)。两个档案(策略档案 / 股票档案)是
# 同一张 pair_stats 的两个投影, 不是两套聚合 —— 两套聚合迟早一处改了 H 另一处没改。
#
# ── 两个基线, 没有第三种 ───────────────────────────────────────────────────────
#   base(X) = X 全部有效股票日的胜率        一股一数   "这只股什么都不做是什么样"
#   mkt(t)  = 第 t 个交易日全市场截面胜率     一天一数   "这一天的市场环境是什么样"
# 特别地: `(S, 全市场, 无情形)` 的池化胜率**不是基线**, 它是被比较者 —— 正是那个
# 让人看到 50.0% 却看不到同期市场 49.0% 的数字。
#
# 两条超额:
#   超额_自比 = wr − base(X)                剥掉"挑了哪些股"
#   超额_同日 = wr − mean(mkt(t)) over 格    剥掉"挑了哪些股"**和**"挑了哪些天"
# 两者相减 = 择日成分, 不另算。

version: 1

# 固定窗口口径。改这里等于改全部历史结论, 所以它在 config 不在代码。
horizons: [5, 10, 20]

window:
  entry: next_open          # 信号日 t 的**下一根** K 线开盘价 —— t 日收盘后才知道信号, 当日不可成交
  exit: close_after_h       # 入场后第 H 根 K 线收盘价; 即 close[t+1+H] / open[t+1] − 1
  win_rule: ret_gt_zero     # 胜 = ret > 0。**平盘算输** —— 保守侧, 且避免"恰好 0"被当赢
  censored_policy: null_never_zero   # 窗口越过该股最后一根 K → NULL + censored 标记, **永不当 0**(红线 3)

# 样本量阶梯。数不变, 但作用对象是 n_pair(信号侧与基线侧有效样本的调和合成), 不是原始 n。
# 等价说法: 按 95% 区间半宽分层。
sample_tiers:
  insufficient: 10          # < 10  → 报「先例不足」, 不给数字 (goal.md 达成判据的底线之一)
  referable: 30             # >= 10 可参考
  comparable: 200           # >= 200 可比较

effective_n:
  method: greedy_nonoverlap # 按 bar 序, 前一个入选信号之后 > H 根的才入选; 入选数即 n_eff
                            # 仿真验证它偏保守 1.1-1.5x(真实数据 1.9x), 不会低估
  pair_method: harmonic     # n_pair = 调和合成(信号侧 n_eff, 基线侧 n_eff)
  strategy_interval: month_block_bootstrap   # 策略整体的区间: 按自然月整块有放回重抽
  bootstrap_b: 2000         # 唯一同时吃掉「同日信号相关」与「H 日窗重叠」的算法。
                            # 跨股符号检验已退役: 它假设股票独立, 实测标准误低估 3.6x-10x

# 策略登记。**零登记的是股票**(在 v_price_kline_qfq 里出现过即入档, 含退市);
# 策略要一条登记, 因为它是人给的输入, 系统无从自己发现。
strategies: {}

# 情形维度字典。每个维度只登记这一次, 之后查询按它分桶。
dimensions: {}
