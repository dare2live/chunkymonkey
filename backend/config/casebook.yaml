# 判例查询引擎 —— 登记表
#
# 系统只回答一件事: **一条人手写的选股公式, 历史上每次触发之后发生了什么, 在什么情形下表现更好。**
# 不产出策略、不拟合参数、不判定策略"够不够格"(goal.md 北极星段)。
#
# ── 为什么只有一张事实表 ───────────────────────────────────────────────────────
# `casebook_outcome_day` 是**每股每日**的固定窗口结果, **与策略无关**。
# 策略只贡献一张信号表(哪些股票日是它的触发点)。两个档案(策略档案 / 股票档案)是
# 同一张 pair_stats 的两个投影, 不是两套聚合 —— 两套聚合迟早一处改了 H 另一处没改。
#
# ── 两个基线, 没有第三种 ───────────────────────────────────────────────────────
#   base(X) = X 全部有效股票日的胜率        一股一数   "这只股什么都不做是什么样"
#   mkt(t)  = 第 t 个交易日全市场截面胜率     一天一数   "这一天的市场环境是什么样"
# 特别地: `(S, 全市场, 无情形)` 的池化胜率**不是基线**, 它是被比较者 —— 正是那个
# 让人看到 50.0% 却看不到同期市场 49.0% 的数字。
#
# 两条超额:
#   超额_自比 = wr − base(X)                剥掉"挑了哪些股"
#   超额_同日 = wr − mean(mkt(t)) over 格    剥掉"挑了哪些股"**和**"挑了哪些天"
# 两者相减 = 择日成分, 不另算。

version: 1

# 固定窗口口径。改这里等于改全部历史结论, 所以它在 config 不在代码。
horizons: [5, 10, 20]

# 基线表与 pair_stats 用哪个 H。**显式写死, 不从 horizons 按位置取中位** ——
# 原实现是 `horizons[len//2]`, 那样往 horizons 里加一个 60 就会让基线 H 从 10 静默变成 20,
# 而基线 H 一变, 全部历史结论跟着变且不报错。加 H 是扩展, 换基线 H 是口径变更, 两件事。
baseline_horizon: 10

window:
  entry: next_open          # 信号日 t 的**下一根** K 线开盘价 —— t 日收盘后才知道信号, 当日不可成交
  exit: close_after_h       # 入场后第 H 根 K 线收盘价; 即 close[t+1+H] / open[t+1] − 1
  win_rule: ret_gt_zero     # 胜 = ret > 0。**平盘算输** —— 保守侧, 且避免"恰好 0"被当赢
  censored_policy: null_never_zero   # 窗口越过该股最后一根 K → NULL + censored 标记, **永不当 0**(红线 3)

# 样本量阶梯。数不变, 但作用对象是 n_pair(信号侧与基线侧有效样本的调和合成), 不是原始 n。
# 等价说法: 按 95% 区间半宽分层。
sample_tiers:
  insufficient: 10          # < 10  → 报「先例不足」, 不给数字 (goal.md 达成判据的底线之一)
  referable: 30             # >= 10 可参考
  comparable: 200           # >= 200 可比较

effective_n:
  # A1 信号侧: 按 bar 序 i 排序, last=-inf; for i: if i > last + H → 计数+1, last=i。
  #    = 互不重叠的持有窗个数。对任意间距都有定义; 不重叠窗在无长记忆的日收益下独立
  #    ⇒ 它是**下界**, 只会偏保守 (仿真 i.i.d. 下偏保守 1.1-1.5x, 真实数据 1.9x)。
  #    退役的候选: 原始 n(密集抽样下低估方差 2.4x) · n/H 或"减半"(对稀疏与成簇信号都错) ·
  #    自相关修正(信号不等距, rho_k 无定义) · 每股块自助(每股 83 个信号块内太少)。
  rule: greedy_nonoverlap
  # A2 基线侧闭式: base(X) 是"每天都是信号", A1 退化成 floor((n_days-1)/(H+1))+1。
  #    实测上限 = 最长 1,847 天 / 间隔 >10 → 168 ⇒ **本股层"可比较"对任何策略都不可达**。
  pair: harmonic            # A3: n_pair = 1 / (1/n_eff_sig + 1/n_eff_base)
  block: calendar_month     # A4 策略整体的区间: 按自然月整块有放回重抽
  bootstrap_b: 2000         #    唯一同时吃掉「同日信号相关」与「H 日窗重叠」的算法
  seed: 20260904            #    固定 seed 写进 casebook_strategy_stats, 结论可复现
  # A5 判定按 95% 区间**半宽**分层 —— 与 sample_tiers 的 200/30/10 在 p≈0.5 下 Wilson 等价。
  # 用半宽而不是原始 n: 同一个 n 在不同 p 下的分辨率不同, 而人要的是"这个数够不够准"。
  tiers_pp: [6.9, 16.8, 26.3]   # <=6.9 可比较 / <=16.8 可参考 / <=26.3 样本薄 / 其余 先例不足
  # 跨股符号检验(符号检验/Wilcoxon)**已退役**: 它假设股票独立, 而信号聚在同一批交易日,
  # 5,000 只股不是 5,000 个观测 —— 实测其标准误比月块重抽低估 3.6x(gs_raw_buy) 到 10x(activity)。

# 策略登记。**零登记的是股票**(在 v_price_kline_qfq 里出现过即入档, 含退市);
# 策略要一条登记, 因为它是人给的输入, 系统无从自己发现。
#
# kind 只有一种取值 `frozen_formula`: 求值走 bestchoice 冻结包, 经
# services.formula_challenge.load_formula_engine() 校验 sha256 后加载。
# **源码 hash 不在这里重复登记** —— 它是 formula_challenge.FORMULA_ENGINE_SHA256
# 的单一真相源, 抄一份到这里迟早两处不一致。
#
# 通达信文本求值器**不做** (goal.md 边界段): 公式在对话里转换成 Python 后再进系统。
strategies:
  gs_raw_buy:
    kind: frozen_formula
    formula_id: gs_raw_buy
    params: null              # null = 用公式自带默认参数; 本系统不拟合参数
    source_ref: "bestchoice/formula_engine.py::gs_raw_buy_signals"
  gs_pullback_confirm:
    kind: frozen_formula
    formula_id: gs_pullback_confirm
    params: null
    source_ref: "bestchoice/formula_engine.py::gs_pullback_confirm_signals"
  ma_base_breakout:
    kind: frozen_formula
    formula_id: ma_base_breakout
    params: null
    source_ref: "bestchoice/formula_engine.py::ma_base_breakout_signals"
  activity_breakout:
    kind: frozen_formula
    formula_id: activity_breakout
    params: null
    source_ref: "bestchoice/formula_engine.py::activity_breakout_signals"
  volume_base_breakout:
    kind: frozen_formula
    formula_id: volume_base_breakout
    params: null
    source_ref: "bestchoice/formula_engine.py::volume_base_breakout_signals"

# 情形维度字典。每个维度只登记这一次, 之后查询按它分桶。
dimensions: {}
