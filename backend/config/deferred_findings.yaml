# 登记不修台账 (2026-09-16 cutC_deferred_findings)。
#
# 本文件只登记「施工中发现、但不修不会写错数据/不挡当前判据/不是生产路径上正在发生的
# 红线违规」的问题——登记本身不是修复，是把"已知但暂不动"的状态从人的记忆搬进可机器
# 核对的台账，防止它下次被重新发现时又要从头调研一遍。
#
# 消费方: backend/services/deferred_findings.py::load_deferred_findings (fail-closed
# typed loader；未知键/缺键/id 不是 slug/日期格式错/decision 不在词表一律 ValueError)。
#
# 每条 finding 的字段含义:
#   id             小写 kebab slug，全局唯一。
#   asset          受影响的资产：文件路径:行号，或表名。
#   detector       会检测到它的门 id / 脚本路径 / file:line；没有检测器就写 none。
#                  写成仓库路径（含 / 且以 .py 或 .yaml 结尾，可带 :行号）时，loader 会
#                  校验该文件确实存在（fail-closed，防止台账自己先烂掉）。
#   escalates_when 可观测的升级条件——写到"哪个文件/门会出现什么"这一级，不是空话。
#   recorded       登记日期 YYYY-MM-DD。
#   decision       取值必须属于下面 decisions 词表。
#
# decisions 词表本身是参数（会随业主决定增减新的处置类型），放在这里而不是硬编码进
# loader —— 词表为空时任何 finding 的 decision 字段都无法通过校验（fail-closed，
# 不会静默放行）。
version: 1

decisions:
  - register        # 已登记为已知问题，暂不修，等 escalates_when 触发再处理
  - owner_decision   # 需要业主拍板取舍（例如换源/清理范围/接受某个已知偏差），非纯技术判断

