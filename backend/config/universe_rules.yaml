# 股票 Universe 规则配置 — 所有判断逻辑数据化, 不硬编码在代码里
#
# 第一性原理: K 线有交易 = 在交易. 没有 = 不在.
# 奥卡姆剃刀: 不需要中间表 (dim_all_ever_listed), K 线就是真相源.
#
# === 真相源优先级 (2026-06-17 用户决议: 升级到交易日历级) ===
# 交易日历 (dim_trading_calendar) 是"日期"的硬真相源 — 非交易日不能下单。
# 本 universe 是"股票"的硬真相源, 与交易日历同等优先级。2026-07-18 对抗复核
# 已证明 legacy assert_universe_clean/check_universe_filter 只覆盖静态前缀和代码形状，
# 没有形成统一 PIT 发布门；它们不得再被引用为完整硬门证据。恢复路径由
# goal.md Phase 1.1A 负责：typed policy snapshot + population scope + row-level PIT gate。
# owner: services/universe.py (政策快照) + 本文件 (规则) + 名义K线/stock_st (真相数据)。

policy:
  id: "active_a_share_trading_universe"
  version: 2

# --- 包含规则 (白名单, 只有这些前缀才进 universe) ---
include:
  board_prefixes:
    - "60"    # 沪主板
    - "00"    # 深主板
    - "30"    # 创业板 (涨跌停 20%)
    - "68"    # 科创板 (涨跌停 20%)
  exchange_ids:
    - "SSE"   # 上海证券交易所
    - "SZSE"  # 深圳证券交易所
  venue_by_prefix:
    "60": {exchange_id: "SSE", ts_suffix: "SH"}
    "68": {exchange_id: "SSE", ts_suffix: "SH"}
    "00": {exchange_id: "SZSE", ts_suffix: "SZ"}
    "30": {exchange_id: "SZSE", ts_suffix: "SZ"}

# --- 正式发布 eligibility ---
# 这是项目股票池的精确定义，不是“上市状态”的别名：观察日有名义日 K 线才表示
# 当日实际交易；无 K 线（停牌、已退市或尚未上市）均不进入该日项目输出。
eligibility:
  rule: "traded_on_observation_date"
  calendar_exchange_id: "SSE"

# --- 排除规则 ---
exclude:
  # 排除板块 taxonomy (用于 assert_universe_clean 的清晰报错; 白名单的补集)
  excluded_boards:
    "8": "北交所/新三板 (8x)"
    "4": "新三板 (4x)"
    "92": "北交所 (92x)"
    "83": "北交所/新三板 (83x)"
    "87": "新三板 (87x)"
    "88": "北交所 (88x)"
    "89": "北交所 (89x)"
    "15": "ETF/LOF 基金 (15x)"
    "16": "LOF 基金 (16x)"
    "18": "封闭基金 (18x)"
    "50": "上证基金 (50x)"
    "51": "ETF (51x)"
    "52": "ETF (52x)"
    "56": "ETF (56x)"
    "58": "科创 ETF (58x)"

  # 暂不排除 (记录但不执行)
  # new_stock_days: 60  # 新股上市 N 天内不参与 (流动性不稳)

# --- 板块涨跌停 ---
limit_up_pct:
  "60": 0.10   # 沪主板
  "00": 0.10   # 深主板
  "30": 0.20   # 创业板
  "68": 0.20   # 科创板

# --- 正式 PIT 依赖（dataset id；必须是 accepted source evidence） ---
truth_source:
  nominal_kline: "tier0.market_data.nominal_ohlcv_daily"
  st_membership: "tier0.security_identity.stock_st_daily"
  trading_calendar: "tier0.market_data.trading_calendar"

# --- legacy 当前枚举（不得参与历史 PIT policy/hash） ---
current_enumeration:
  identity_source: "dim_active_a_stock"
  st_name_patterns: ["ST", "*ST"]
  no_recent_kline_days: 90
