# 股票 Universe 规则配置 — 所有判断逻辑数据化, 不硬编码在代码里
#
# 第一性原理: K 线有交易 = 在交易. 没有 = 不在.
# 奥卡姆剃刀: 不需要中间表 (dim_all_ever_listed), K 线就是真相源.
#
# === 真相源优先级 (2026-06-17 用户决议: 升级到交易日历级) ===
# 交易日历 (dim_trading_calendar) 是"日期"的硬真相源 — 非交易日不能下单。
# 本 universe 是"股票"的硬真相源, 同等优先级 — 排除列表里的股票永不进任何
# 验证/回测/GT/选股。强制点: services.universe.assert_universe_clean() (硬门, 任何
# 最终股票集必入) + check_universe_filter.py 拦内联 K线前缀过滤绕过 (代码门)。
# owner: services/universe.py (单一计算点) + 本文件 (规则) + K线/stock_st (真相数据)。

# --- 包含规则 (白名单, 只有这些前缀才进 universe) ---
include:
  board_prefixes:
    - "60"    # 沪主板
    - "00"    # 深主板
    - "30"    # 创业板 (涨跌停 20%)
    - "68"    # 科创板 (涨跌停 20%)

# --- 排除规则 ---
exclude:
  # ST/退市风险警示股
  st_name_patterns:
    - "ST"     # ST + *ST
    - "*ST"

  # 退市判定: K 线无交易天数
  delisted:
    source: "kline"  # 从 K 线判断, 不从快照表
    no_trade_days: 90  # 连续 90 个自然日无交易 = 退市/长期停牌

  # 排除板块 taxonomy (用于 assert_universe_clean 的清晰报错; 白名单的补集)
  excluded_boards:
    "8": "北交所/新三板 (8x)"
    "4": "新三板 (4x)"
    "92": "北交所 (92x)"
    "83": "北交所/新三板 (83x)"
    "87": "新三板 (87x)"
    "88": "北交所 (88x)"
    "89": "北交所 (89x)"
    "15": "ETF/LOF 基金 (15x)"
    "16": "LOF 基金 (16x)"
    "18": "封闭基金 (18x)"
    "50": "上证基金 (50x)"
    "51": "ETF (51x)"
    "52": "ETF (52x)"
    "56": "ETF (56x)"
    "58": "科创 ETF (58x)"

  # 暂不排除 (记录但不执行)
  # new_stock_days: 60  # 新股上市 N 天内不参与 (流动性不稳)

# --- 板块涨跌停 ---
limit_up_pct:
  "60": 0.10   # 沪主板
  "00": 0.10   # 深主板
  "30": 0.20   # 创业板
  "68": 0.20   # 科创板

# --- 数据源优先级 ---
data_source:
  active_stocks: "dim_active_a_stock"            # 当前活跃列表 (名字/板块)
  kline: "price_kline_qfq_tushare"              # K 线 = 交易真相源 (2026-06-17 切 tushare 转正, 旧 tdxhub 降备援)
  st_calendar: "raw_tushare_stock_st"           # PIT ST 日历 (历史 t 是否 ST 的真相源)
  trading_calendar: "services.calendar"         # 交易日历 = 日期真相源 (universe 与之同优先级)
  # 不再使用: dim_all_ever_listed (快照不可靠, 2026-05-26 误标 573 只)
