# 股票 Universe 规则配置 — 所有判断逻辑数据化, 不硬编码在代码里
#
# 第一性原理: 当日**有成交** = 在交易. 没有 = 不在.
# 奥卡姆剃刀: 不需要中间表 (dim_all_ever_listed), K 线就是真相源.
#
# 2026-09-08 措辞更正: 原文写的是「K 线**有** = 在交易」。那句话在 tushare 供货的七年里
# 恰好成立 —— 因为它停牌日**整行不落**, 于是"有行"与"有成交"是同一件事。通达信自
# 2026-08-31 起把停牌日也落成一行(四价=前收, vol=0), 两者当场分家。实证:
# 000635.SZ 08-28 停牌无行、08-31 停牌有行, 同股同状况, 差别只在供货商。
# 所以第一性原理本身没错, 错的是把"有行"当成了它的等价表述。
#
# === 真相源优先级 ===
# 正式日期真相 = accepted SSE calendar generation（非 dim_trading_calendar serve projection）。
# 正式股票日级人口 = traded_on_observation_date（accepted 名义K ∩ board 白名单；**含 ST/*ST**）。
# 排除 = 非 60/00/30/68（B/BJ/三板/ETF 等）+ 观察日无名义 K（退市/未上市）
#        + 有行但当日无成交（停牌, 2026-09-08 起显式化, 见 policy.version 5 注）。
# stock_st = 独立「谁在何时是 ST」membership 证据，不是 universe denylist。
# legacy assert_universe_clean/check_universe_filter 静态前缀审计 ≠ 完整 PIT 门；
# row-level 证明见 observation_population.resolve_traded_on_observation_date。
# owner: services/universe.py + 本文件 + observation_population.py。

policy:
  id: "active_a_share_trading_universe"
  # v4 -> v5 (2026-09-08): eligibility 的**实现**从"观察日有名义日 K 线"改成
  # "观察日有名义日 K 线**且当日有成交**"。规则名 traded_on_observation_date 一字未改 ——
  # 它一直描述的就是"当日在交易", 变的是实现终于忠实于这个名字(见文件头的措辞更正)。
  #
  # 为什么选这条路而不是"在适配器里丢弃停牌行": 后续要在同花顺/通达信/东方财富之间换源,
  # 每接一个源都做一次"去停牌"转换就是 N 个适配器 N 次出错机会; 判据说清"有成交才算交易"
  # 之后, 它不再依赖任何供货商的行发射策略。
  #
  # 对历史完全 no-op: canonical_nominal_ohlcv_daily 全表 8,595,304 行(2019-01-02~2026-08-31)
  # 里 vol=0 与 vol IS NULL 各 0 行, 落在 (0,1手) 的只有 2026-08-31 的 6 行。
  # 即 v4 与 v5 对 2026-08-28 及以前的每一天产出同一个池。
  # 版本仍必须 bump: eligibility_rule 与 policy_version 都进 universe._semantic_hash 的载荷,
  # 判据函数变了而身份不变, 就是"声明与实际漂移"。
  #
  # "谁算真的成交了"由 domain 规格声明(nominal_ohlcv_schema.DOMAIN.activity_field='vol'),
  # 不在本文件硬编码 —— 不同域的"真的发生了"是不同字段(stock_st 就没有这个概念)。
  # 判据落点在 observation_population 的**策略层**, 不在分区层: 分区成员要与 accepted
  # 指针 row_count 对账, 在那里过滤会撞碎完整性证明。
  version: 5

# --- 包含规则 (白名单, 只有这些前缀才进 universe) ---
include:
  board_prefixes:
    - "60"    # 沪主板
    - "00"    # 深主板
    - "30"    # 创业板 (涨跌停 20%)
    - "68"    # 科创板 (涨跌停 20%)
  exchange_ids:
    - "SSE"   # 上海证券交易所
    - "SZSE"  # 深圳证券交易所
  venue_by_prefix:
    "60": {exchange_id: "SSE", ts_suffix: "SH"}
    "68": {exchange_id: "SSE", ts_suffix: "SH"}
    "00": {exchange_id: "SZSE", ts_suffix: "SZ"}
    "30": {exchange_id: "SZSE", ts_suffix: "SZ"}

# --- 正式发布 eligibility ---
# 这是项目股票池的精确定义，不是“上市状态”的别名：观察日有名义日 K 线才表示
# 当日实际交易；无 K 线（停牌、已退市或尚未上市）均不进入该日项目输出。
eligibility:
  rule: "traded_on_observation_date"
  calendar_exchange_id: "SSE"

# --- 排除规则 ---
exclude:
  # 排除板块 taxonomy (用于 assert_universe_clean 的清晰报错; 白名单的补集)
  excluded_boards:
    "8": "北交所/新三板 (8x)"
    "4": "新三板 (4x)"
    "92": "北交所 (92x)"
    "83": "北交所/新三板 (83x)"
    "87": "新三板 (87x)"
    "88": "北交所 (88x)"
    "89": "北交所 (89x)"
    "15": "ETF/LOF 基金 (15x)"
    "16": "LOF 基金 (16x)"
    "18": "封闭基金 (18x)"
    "50": "上证基金 (50x)"
    "51": "ETF (51x)"
    "52": "ETF (52x)"
    "56": "ETF (56x)"
    "58": "科创 ETF (58x)"

  # 暂不排除 (记录但不执行)
  # new_stock_days: 60  # 新股上市 N 天内不参与 (流动性不稳)

# --- 板块涨跌停 ---
limit_up_pct:
  "60": 0.10   # 沪主板
  "00": 0.10   # 深主板
  "30": 0.20   # 创业板
  "68": 0.20   # 科创板

# --- 正式 PIT 依赖（dataset id；必须是 accepted source evidence） ---
truth_source:
  nominal_kline: "tier0.market_data.nominal_ohlcv_daily"
  st_membership: "tier0.security_identity.stock_st_daily"
  trading_calendar: "tier0.reference.sse_trading_calendar_generation"

# --- legacy 当前枚举（不得参与历史 PIT policy/hash） ---
current_enumeration:
  identity_source: "dim_active_a_stock"
  st_name_patterns: ["ST", "*ST"]
  no_recent_kline_days: 90
