# technical_states.yaml — 技术形态识别 config (声明式 + 人话, 2026-06-21 P1)
#
# owner = backend/services/technical_states/ (档案系统维度①, 见 docs/stock_dossier_master_design.md)。
# 设计 (用户 J1/J2): 状态**公式结构本身进 config**(声明式条件列表), 加/改状态 = 改本文件不动代码;
#   参数用**人话指标名 + %/倍数单位**(均线斜率 高于 6.55%), 非后端变量(ma_slope: 0.0655)。
#   classifier.py 只持 evaluator(把每条条件解释成 sigmoid 软门取积) + 软隶属度 + 子态 + 多TF 聚合。
# 参数来源: sandbox/state_quantify P1/v3 (全宇宙5421股语义准确, OOS稳, 覆盖100%)。confirmed_by_owner 待 per-TF tune + 前端核。

meta:
  version: 2
  tuned_on: "2026-06-21 sandbox/state_quantify P1/v3 (全宇宙5421股语义准确, OOS稳, 覆盖100%, 80%干净归类)"
  confirmed_by_owner: false

# 多时间框架: 日线主, 周/月线辅助确认。窗口按 TF 缩放(bar 数), 防月线用 40个月窗。
timeframes:
  daily:   {resample: null, warmup: 120, windows: {ma: [5, 10, 20, 60], er: 40, pctile: 120, mom: 20, range: 60, vol: 20}}
  weekly:  {resample: "W",  warmup: 60,  windows: {ma: [4, 8, 13, 26],  er: 20, pctile: 52,  mom: 12, range: 26, vol: 10}}
  monthly: {resample: "ME", warmup: 30,  windows: {ma: [3, 6, 12, 24],  er: 9,  pctile: 24,  mom: 6,  range: 12, vol: 6}}

# 软隶属度: 温度越小归类越硬, 越大越柔(过渡态); 最低分=低于此最大分=无清晰主态(过渡态)
soft:
  温度: 0.0506
  最低分: 0.0648

# ── 指标字典: 人话名 → 内部计算 key + 单位 (config 全用人话, evaluator 按单位自动转内部值) ──
指标:
  价格分位:   {key: pctile,    单位: 比例}    # 0低位..1高位 (近120日 close 分位)
  区间宽度:   {key: range_pct, 单位: 比例}    # 近60日 (高-低)/均价
  均线斜率:   {key: ma_slope,  单位: 百分比}  # 20日均线 20日斜率
  二十日动量: {key: mom20,     单位: 百分比}  # 20日涨跌幅
  多头排列:   {key: ma_align,  单位: 比例}    # 0..1 (5>10>20>60 占比)
  量比:       {key: vol_ratio, 单位: 倍数}    # 当日量/20日均量
  距均线:     {key: ma_dist,   单位: 百分比}  # (close-ma20)/ma20

# ── 状态: 声明式人话条件 (evaluator 把每条算成 sigmoid 软门取积; 加状态=在此加一项, 不动代码) ──
# 条件: {指标, 判断: 高于|低于|平缓, 阈值: 人话单位, 锐度: 边界软硬(越大越硬)}。平缓=绝对值小于阈值(走平/滞涨)。
状态:
  低位横盘:
    描述: 价在低位 + 窄幅震荡 + 均线走平 (筑底)
    条件:
      - {指标: 价格分位, 判断: 低于, 阈值: 0.475, 锐度: 10.5}
      - {指标: 区间宽度, 判断: 低于, 阈值: 0.455, 锐度: 8.4}
      - {指标: 均线斜率, 判断: 平缓, 阈值: 4.0,   锐度: 30}
  放量突破:
    描述: 放量 + 大涨 + 上穿均线 (起涨)
    条件:
      - {指标: 二十日动量, 判断: 高于, 阈值: 5.3,  锐度: 7.1}
      - {指标: 量比,       判断: 高于, 阈值: 1.89, 锐度: 2.4}
      - {指标: 距均线,     判断: 高于, 阈值: 0.0,  锐度: 12}
  上升通道:
    描述: 均线向上 + 多头排列 + 价在均线上 (主升)
    条件:
      - {指标: 均线斜率,   判断: 高于, 阈值: 6.55, 锐度: 98.8}
      - {指标: 多头排列,   判断: 高于, 阈值: 0.628, 锐度: 19.8}
      - {指标: 二十日动量, 判断: 高于, 阈值: 0.0,  锐度: 8}
  缩量上涨:
    描述: 价涨但量缩 (动能衰竭预警)
    条件:
      - {指标: 二十日动量, 判断: 高于, 阈值: 2.0,  锐度: 5.5}
      - {指标: 量比,       判断: 低于, 阈值: 0.795, 锐度: 2.75}
      - {指标: 均线斜率,   判断: 高于, 阈值: 0.0,  锐度: 15}
  高位滞涨:
    描述: 价在高位 + 涨势停滞 (见顶)
    条件:
      - {指标: 价格分位,   判断: 高于, 阈值: 0.717, 锐度: 23.7}
      - {指标: 均线斜率,   判断: 平缓, 阈值: 3.0,  锐度: 30}
      - {指标: 二十日动量, 判断: 平缓, 阈值: 5.62, 锐度: 15}
  下跌通道:
    描述: 均线向下 + 价在均线下 + 动量负 (下跌)
    条件:
      - {指标: 均线斜率,   判断: 低于, 阈值: -5.92, 锐度: 86.8}
      - {指标: 距均线,     判断: 低于, 阈值: 0.0,  锐度: 12}
      - {指标: 二十日动量, 判断: 低于, 阈值: 0.0,  锐度: 8}
  缩量回踩:
    描述: 升势中小幅缩量回调 (健康回踩)
    条件:
      - {指标: 二十日动量, 判断: 低于, 阈值: -0.93, 锐度: 31.2}
      - {指标: 二十日动量, 判断: 高于, 阈值: -8.0, 锐度: 12}
      - {指标: 量比,       判断: 低于, 阈值: 0.851, 锐度: 13}
      - {指标: 均线斜率,   判断: 高于, 阈值: 0.0,  锐度: 12}

# ── 状态内细分 (所有形态都细分; 按修饰量分位, 阈值人话) ──
子态:
  低位横盘: [地量横盘, 温和横盘]
  放量突破: [温和突破, 巨量突破]
  上升通道: [温和上涨, 震荡上涨, 加速上涨]
  缩量上涨: [缩量延续]
  高位滞涨: [放量派发, 缩量惜售]
  下跌通道: [温和阴跌, 加速杀跌]
  缩量回踩: [浅回踩, 深回踩]
子态阈值:   # 数据驱动 (v3 全宇宙5421股分位); 修饰量: 路径效率/回撤/加速/量能zscore
  上升_路径效率: 0.1633   # 上升通道: 路径效率>此=温和(平滑)
  上升_回撤: 0.1376       # 配路径效率高 = 温和
  上升_加速: 0.0051       # 加速度>此=加速
  低位_量能: -0.7908      # 量能zscore<此=地量
  突破_量能: 0.5094       # 量能zscore>此=巨量
  高位_量能: 0.146        # 量能zscore>此=放量派发
  下跌_加速: 0.0052       # 加速度<-此 且放量 = 加速杀跌
  回踩_回撤: 0.158        # 回撤>此=深回踩

# ── 边界耦合 (J2: 状态间边界参数关联, 调一个→resolver 同步关联→重算列表→给出变化) ──
边界耦合:
  - 说明: 上升通道与下跌通道共用均线斜率边界 (一个进入≈另一个退出) — 互补对称, 调一个另一个镜像
    参数: [上升通道.均线斜率, 下跌通道.均线斜率]
    关系: 互补对称
  - 说明: 低位横盘(价低)与高位滞涨(价高)共价格分位轴 — 低位上界须 < 高位下界, 中间留过渡带
    参数: [低位横盘.价格分位, 高位滞涨.价格分位]
    关系: 互斥不重叠
  - 说明: 放量突破(量比高于)须明显高于缩量上涨/缩量回踩(量比低于)的上界 — 中间留中性带; 两个缩量阈彼此无需排序
    参数: [放量突破.量比, 缩量上涨.量比, 缩量回踩.量比]
    关系: 首项高于其余

# ── 量基准路由 (不同状态不同放量参照; P6 接入, 现 zvol 主信号) ──
量基准:
  突破:   {基准: 横盘箱体均量, 窗口: 60}
  持续:   {基准: 近期短均量,   窗口: 5}
  见顶:   {基准: 历史分位,     窗口: 120}
  默认:   {基准: 量能zscore,   窗口: 20}
