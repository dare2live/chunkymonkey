# technical_states.yaml — B2 形态识别 config (正交轴重建, 2026-07-02)
#
# 契约: docs/MASTER_TOPLEVEL_DESIGN.md §7 +
#       analysis/technical_states_audit_20260702.json (审查裁决)。
# 阈值纪律 (H6 CONFIRMED): 全部阈值 = 理论锚定取整值 (每条带 `# 锚:` 注释), **不跑 Optuna**
#   (B2 无 forward 消费方, grill 纪律; 寻优留 D2, 目标函数=标注 episode 一致率/下游效用)。
# 锐度不是自由参数 (H6): k = soft.过渡带锐度常数 / 过渡带 — 过渡带按人话单位声明, 量纲天然归一。
# 条件 DSL 全文件唯一 (medium: 旧三套收敛): {指标, 判断: 高于|低于|平缓, 阈值[, 过渡带]};
#   带过渡带=软门 (轴打分), 不带=硬布尔 (上下文/突破)。单位跟 指标.单位, 无原始量纲第二约定。
# C2 红线: 本文件与代码均无 bull/bear/方向/mtf_aligned 语义 — 多 TF 只输出各框描述标签。

meta:
  version: 4
  tuned_on: "2026-07-02 理论锚定取整 (H6 裁决: 无监督0.816寻优产物废弃; 实测取整代价 ~1.6% 标签)"
  confirmed_by_owner: false

data_start: "20190102"          # 锚: 对齐 K线窗口 (build_price_kline_qfq_tushare START=20190101, 首交易日 0102)
incremental_lookback_days: 750  # 锚: 增量切片须覆盖 月线 warmup 30月 + 最深窗 24月 消费 ≈ 31月×21.7交易日≈673 → 取整 750

# 三时间框架窗口 (周/月窗 = 日窗按 TF 缩放, 审查 keep; ISO 周分组 keep)
# warmup = 该框有效 bar 最小下标, 必须 >= 全特征最深回看 (截断不变性依赖此不变量):
#   daily 250 = pth 52周窗 (250 交易日, George-Hwang) 决定 (旧 120 → 形态起始晚 ~半年, 换 52周高文献锚);
#   weekly 60 >= pctile/pth 52; monthly 30 >= ma4 24。rv/rv_pct/rs 只日线 (突破检测器/RS 描述用)。
timeframes:
  daily:   {resample: null, warmup: 250,
            windows: {ma: [5, 10, 20, 60], er: 40, pctile: 120, mom: 20, range: 60, vol: 20,
                      pth: 250, rv: 20, rv_pct: 120, rs: 20}}
  weekly:  {resample: "W",  warmup: 60,
            windows: {ma: [4, 8, 13, 26], er: 20, pctile: 52, mom: 12, range: 26, vol: 10, pth: 52}}
  monthly: {resample: "ME", warmup: 30,
            windows: {ma: [3, 6, 12, 24], er: 9, pctile: 24, mom: 6, range: 12, vol: 6, pth: 12}}

soft:
  温度: 0.25              # 锚: 审查 medium 裁决 — 旧 τ=0.05 退化 argmax (软隶属零信息), 建议 0.2~0.3 取中
  过渡带锐度常数: 6.0     # 数学常数: k=6/过渡带 → sigmoid 在 阈值±过渡带/2 处 ≈ 0.047/0.953

# 指标登记: 人话名 → 内部特征 key + 人话单位 + 值域 (值域给联合 max_score 数值求解用, H2 归一)
指标:
  价格分位:   {key: pctile,        单位: 比例,   值域: [0.0, 1.0]}
  高点贴近度: {key: pth,           单位: 比例,   值域: [0.0, 1.0]}     # close/52周最高 high (George-Hwang)
  均线斜率:   {key: ma_slope,      单位: 百分比, 值域: [-50.0, 50.0]}  # MA20 的 20日变化率
  二十日动量: {key: mom20,         单位: 百分比, 值域: [-80.0, 300.0]}
  多头排列:   {key: ma_align,      单位: 比例,   值域: [0.0, 1.0]}
  量比:       {key: vol_ratio_eff, 单位: 倍数,   值域: [0.0, 20.0]}   # eff 视图: 涨跌停日 proxy (limits)
  量能zscore: {key: zvol_eff,      单位: 标准差, 值域: [-5.0, 5.0]}
  路径效率:   {key: er,            单位: 比例,   值域: [0.0, 1.0]}    # Kaufman Efficiency Ratio
  拟合优度:   {key: r2,            单位: 比例,   值域: [0.0, 1.0]}    # 对数价线性回归 R²
  距均线:     {key: ma_dist,       单位: 百分比, 值域: [-60.0, 100.0]}
  波动分位:   {key: rv_pctile,     单位: 比例,   值域: [0.0, 1.0]}    # 20日已实现波动的120日滚动分位

# ===== 5 正交轴 (契约 §2): 每轴独立分类, 轴内 softmax, 跨轴零竞争 (H7) =====
轴:
  位置:                    # A — George-Hwang 52周高效应 (强文献锚) + Weinstein stage 位置带
    列: axis_pos
    取值:
      low:
        - {指标: 价格分位, 判断: 低于, 阈值: 0.3, 过渡带: 0.1}    # 锚: 下三分位 (Weinstein Stage1/4 低位带, 取整)
        - {指标: 高点贴近度, 判断: 低于, 阈值: 0.75, 过渡带: 0.1}  # 锚: George-Hwang 远离 52周高 (距高 >25%)
      mid:
        - {指标: 价格分位, 判断: 高于, 阈值: 0.3, 过渡带: 0.1}
        - {指标: 价格分位, 判断: 低于, 阈值: 0.7, 过渡带: 0.1}
      high:
        - {指标: 价格分位, 判断: 高于, 阈值: 0.7, 过渡带: 0.1}    # 锚: 上三分位
        - {指标: 高点贴近度, 判断: 高于, 阈值: 0.8, 过渡带: 0.1}   # 锚: George-Hwang 贴近 52周高 (距高 <20%)
  趋势方向:                # B — Weinstein 条件桶 (非信号, C2: 只描述几何不 claim 方向)
    列: axis_trend
    取值:
      up:
        - {指标: 均线斜率, 判断: 高于, 阈值: 1.0, 过渡带: 2.0}    # 锚: Weinstein Stage2 均线上行; +1%/20日 ≈ 年化 13%, 取整 1
        - {指标: 多头排列, 判断: 高于, 阈值: 0.5, 过渡带: 0.5}    # 锚: 3 对均线序 >= 2 对多头
      flat:
        - {指标: 均线斜率, 判断: 平缓, 阈值: 1.0, 过渡带: 2.0}    # 锚: |斜率|<1% = 均线走平 (Stage1/3 特征)
      down:
        - {指标: 均线斜率, 判断: 低于, 阈值: -1.0, 过渡带: 2.0}   # 锚: Stage4 均线下行 (与 up 对称取整, 非旧 -2.36 寻优值)
        - {指标: 多头排列, 判断: 低于, 阈值: 0.5, 过渡带: 0.5}
  趋势纯度:                # C — Kaufman ER (中文献锚) + 回归拟合优度
    列: axis_purity
    取值:
      trending:
        - {指标: 路径效率, 判断: 高于, 阈值: 0.3, 过渡带: 0.2}    # 锚: Kaufman ER>0.3 = 趋势主导 (自适应均线惯例)
        - {指标: 拟合优度, 判断: 高于, 阈值: 0.5, 过渡带: 0.4}    # 锚: 对数价回归解释度过半
      choppy:
        - {指标: 路径效率, 判断: 低于, 阈值: 0.3, 过渡带: 0.2}
  量能:                    # D — Wyckoff volume (effort); 涨跌停日经 eff proxy 修正 (limits)
    列: axis_vol
    取值:
      shrink:
        - {指标: 量比, 判断: 低于, 阈值: 0.7, 过渡带: 0.4}        # 锚: 缩量 = 量 < 20日基准 70% (经典缩量门)
        - {指标: 量能zscore, 判断: 低于, 阈值: 0.0, 过渡带: 1.0}  # 锚: 低于自身 log 量均值
      normal:
        - {指标: 量比, 判断: 高于, 阈值: 0.7, 过渡带: 0.4}
        - {指标: 量比, 判断: 低于, 阈值: 1.5, 过渡带: 0.6}
      heavy:
        - {指标: 量比, 判断: 高于, 阈值: 1.5, 过渡带: 0.6}        # 锚: 放量 = 1.5x 基准 (经典放量门)
        - {指标: 量能zscore, 判断: 高于, 阈值: 1.0, 过渡带: 1.0}  # 锚: 高于均值 1 个标准差
  波动regime:              # E — 低波异象 (强文献锚); **值来自 B1 dim_stock_segment_daily (单一计算点)**
    列: axis_volregime
    来源: dim_stock_segment_daily     # rv_pctile + vol_regime 列; 阈值 owner = segments.yaml (本模块只消费, 契约 §8)

# ===== cell → 人话标签映射 (契约 §2): 顺序首中; load 校验 3x3x2x3=54 组合全覆盖, 缺 → 抛错 =====
# 9 态词汇由 cell 派生 (档案/前端保全, 单一计算点); "*" = 任意。放量下跌整态携带 (审查 keep: 全场最强 forward 描述 cell)。
cell映射:
  - {位置: low,  趋势: down, 纯度: "*", 量能: heavy, 标签: 放量下跌, 子标签: 低位放量下跌}   # Wyckoff SC 恐慌见底桶
  - {位置: mid,  趋势: down, 纯度: "*", 量能: heavy, 标签: 放量下跌, 子标签: 中位放量下跌}
  - {位置: high, 趋势: down, 纯度: "*", 量能: heavy, 标签: 放量下跌, 子标签: 高位放量下跌}   # breakdown 出货桶
  - {位置: "*", 趋势: down, 纯度: trending, 量能: shrink, 标签: 下跌通道, 子标签: 缩量阴跌}   # Weinstein Stage4
  - {位置: "*", 趋势: down, 纯度: trending, 量能: normal, 标签: 下跌通道, 子标签: 温和阴跌}
  - {位置: "*", 趋势: down, 纯度: choppy,   量能: shrink, 标签: 震荡下行, 子标签: 缩量震荡下行}
  - {位置: "*", 趋势: down, 纯度: choppy,   量能: normal, 标签: 震荡下行, 子标签: 温和震荡下行}
  - {位置: "*", 趋势: up, 纯度: trending, 量能: heavy,  标签: 上升通道, 子标签: 放量上涨}     # Weinstein Stage2
  - {位置: "*", 趋势: up, 纯度: trending, 量能: normal, 标签: 上升通道, 子标签: 温和上涨}
  - {位置: low,  趋势: up, 纯度: trending, 量能: shrink, 标签: 缩量上涨, 子标签: 低位缩量上涨} # 位置显式化 (旧态位置消歧从未实现 → cell 天然消歧)
  - {位置: mid,  趋势: up, 纯度: trending, 量能: shrink, 标签: 缩量上涨, 子标签: 中位缩量上涨}
  - {位置: high, 趋势: up, 纯度: trending, 量能: shrink, 标签: 缩量上涨, 子标签: 高位缩量上涨}
  - {位置: "*", 趋势: up, 纯度: choppy, 量能: shrink, 标签: 震荡上行, 子标签: 缩量震荡上行}
  - {位置: "*", 趋势: up, 纯度: choppy, 量能: normal, 标签: 震荡上行, 子标签: 温和震荡上行}
  - {位置: "*", 趋势: up, 纯度: choppy, 量能: heavy,  标签: 震荡上行, 子标签: 放量震荡上行}
  - {位置: low,  趋势: flat, 纯度: "*", 量能: shrink, 标签: 低位横盘, 子标签: 地量横盘}       # Wyckoff Accumulation / Stage1
  - {位置: low,  趋势: flat, 纯度: "*", 量能: normal, 标签: 低位横盘, 子标签: 温和横盘}
  - {位置: low,  趋势: flat, 纯度: "*", 量能: heavy,  标签: 低位横盘, 子标签: 低位放量换手}
  - {位置: mid,  趋势: flat, 纯度: "*", 量能: shrink, 标签: 中位盘整, 子标签: 缩量盘整}
  - {位置: mid,  趋势: flat, 纯度: "*", 量能: normal, 标签: 中位盘整, 子标签: 温和盘整}
  - {位置: mid,  趋势: flat, 纯度: "*", 量能: heavy,  标签: 中位盘整, 子标签: 放量盘整}
  - {位置: high, 趋势: flat, 纯度: "*", 量能: shrink, 标签: 高位滞涨, 子标签: 缩量惜售}       # Wyckoff Distribution / Stage3
  - {位置: high, 趋势: flat, 纯度: "*", 量能: normal, 标签: 高位滞涨, 子标签: 温和滞涨}
  - {位置: high, 趋势: flat, 纯度: "*", 量能: heavy,  标签: 高位滞涨, 子标签: 放量派发}

# ===== 上下文层 (两遍架构 pass-2, 审查 keep: 前序 <=t-1 PIT 0 diff) =====
# 前序依赖态不做瞬时态 (H7 根因: 连乘压死 5 条件态)。前序看**趋势轴取值**多数派 (非标签, 无方向 claim)。
上下文:
  前序窗口: 10                       # 锚: 沿用旧 context (PIT 已验), 两周
  规则:
    - 名称: 缩量回踩                  # Minervini VCP 回踩 / 道氏次级回调 — 前序升轴 + 当前 mild 缩量回调
      前序轴: 趋势方向
      前序值: up
      当前条件:                       # 硬条件 (人话单位; 值 = 旧 context keep 的取整人话值, 语义抽查留全量验收)
        - {指标: 二十日动量, 判断: 低于, 阈值: 1.0}    # 锚: <+1% 涨势暂歇
        - {指标: 二十日动量, 判断: 高于, 阈值: -10.0}  # 锚: >-10% 非深跌
        - {指标: 量比, 判断: 低于, 阈值: 1.0}          # 锚: 回踩缩量 (量不放大)
        - {指标: 距均线, 判断: 高于, 阈值: -6.0}       # 锚: 未破位 (>-6%; 破位归下跌 cell)
      标签: 缩量回踩
      子标签: 升势回踩
    - 名称: 中继平台                  # O'Neil base-on-base / 中文主升浪中继 — 前序升轴 + 当前中高位横盘
      前序轴: 趋势方向
      前序值: up
      当前轴: {趋势方向: flat, 位置: [mid, high]}
      标签: 中继平台
      子标签: 升势中继
      当前条件: []

# ===== 突破 event-in-context 检测器 (C1 CRITICAL; overlay 事件非态; D1 GT 起涨点原语) =====
# F0 教训明标: 裸突破 fwd10 win 40.8% 全场最差 = 接刀 — 只做描述/GT 标注原语, 不是买入信号。
突破:
  底盘位置值: [low, mid]    # 锚: C1 裁决 — 底盘前置, 高位破新高不算 (71% 高位触发是病根)
  底盘最少天数: 20          # 锚: 设计 §4 默认; O'Neil 最短底 ~4 周
  底盘统计上限: 250         # 锚: base_days 统计封顶 = 1 年 (增量切片前序需求与此绑定, 保证增量=全量)
  收缩分位门: 0.5           # 锚: VCP 波动收缩 = rv 处自身 120日分布下半 (中位取整)
  枯量窗: 5                 # 锚: O'Neil/VCP 突破前一周量枯 (dry-up)
  枯量中位量比门: 1.0        # 锚: 枯量窗中位实测量比不超 20日基准
  破高窗: 60                # 锚: 设计 §4 默认 — 破一个季度高
  触发量比门: 2.0           # 锚: 设计 §4 默认; O'Neil 突破日量 +50%~100% vs 均量, 取严格侧 2x (涨停日用 proxy)

# ===== A股涨跌停 (limits.py; 真相源 raw_tushare_stk_limit, 已编码板块 tier ±5/10/20%) =====
涨跌停:
  价格容差: 0.005           # 数学常数: A股价 2 位小数, 半 tick — 原始价空间精确比 (修旧 0.3% 相对容差误判炸板)
  需求proxy量比: 3.0        # 锚: 封涨停 = 需求截断; proxy 须显著 > 量能 heavy 门 1.5, 取 2x 门 (旧评审 critical 修复方向 keep)
  供给proxy量比: 3.0        # 锚: 封跌停对称 (H3/medium: 恐慌封死 = 供给最大化, 不是缩量阴跌)
  量能zproxy: 2.0           # 锚: 须 > heavy z 门 1.0, 取 2x 门 (与量比 proxy 同比例关系)

# ===== 单日 K 线构件 (candles.py; 几何常数, 审查 keep 沿用旧值) =====
单日形态:
  十字实体上限: 0.1         # 锚: 实体/全幅 <10% = 十字星 (蜡烛图经典几何)
  长实体下限: 0.7           # 锚: 实体/全幅 >70% = 大阳/大阴
  长影倍数: 2.0             # 锚: 影线 > 2x 实体 = 长影 (锤子/上吊/倒锤/流星)
  无波动幅度: 0.005         # 锚: 全幅 < 0.5% 收盘价 = 一字线

# ===== 命名形态 (patterns.py; 3 模板零参数, 完成bar命中不回贴 — 审查 keep) =====
# 新词表适配: "突破事件" = breakout overlay 事件 (瞬时放量突破态已删, C1)。
命名形态:
  老鸭头:
    序列: [上升通道, 缩量回踩, 中继平台, 突破事件]   # 头→鸭脖(回踩)→鸭头(中位平台)→鸭嘴出水(突破事件)
    窗口: 90
    provenance: "中文实战(主观性高, 仅描述不当alpha)"
  圆弧底突破:
    序列: [下跌通道, 低位横盘, 突破事件]
    窗口: 120
    provenance: "西方cup-handle近似(Bulkowski统计基础)"
  顶部派发转跌:
    序列: [上升通道, 高位滞涨, 下跌通道]
    窗口: 90
    provenance: "Stage3→4派发(Weinstein/Wyckoff)"

# ===== RS 基准 (rs_ratio 特征; Mansfield RS 日线代理, 原版 52周周线) =====
RS:
  基准: "000300.SH"         # 锚: KPI 超额基准 HS300 (goal.md)
