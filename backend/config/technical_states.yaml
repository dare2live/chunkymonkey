# technical_states.yaml — 技术形态识别 config (声明式 + 人话, 2026-06-21 D1 下跌侧修复)
#
# owner = backend/services/technical_states/ (档案系统维度①, 见 docs/stock_dossier_master_design.md)。
# 设计 (J1/J2): 状态**公式结构进 config**(声明式条件), 加/改状态=改本文件不动代码; 参数人话(均线斜率高于6.55%)。
#   classifier.py 只持 generic evaluator(解释条件成 sigmoid 软门取积) + 软隶属度 + 子态 + 多TF。
# 参数: sandbox/state_quantify probe_v4_descent (D1: 9态 Optuna 重调, 全宇宙5421股软可分0.816, 描述层非forward)。
# D1 改动 (评审 wf_e273c118 + P-1对账): 加 中继平台(填 pctile 0.475-0.717 GAP) + 放量下跌(价跌+放量, 位置子态);
#   下跌通道 改纯缩量阴跌(加量比<门, 与放量下跌分离); 缩量回踩 瞬时近死态(升势回踩=前序态依赖, D4上下文层接管, 暂占位)。

meta:
  version: 3
  tuned_on: "2026-06-21 sandbox/state_quantify probe_v4_descent (全宇宙5421股, 9态软可分0.816, 中继平台8.4%/放量下跌0.57%健康)"
  confirmed_by_owner: false

timeframes:
  daily:   {resample: null, warmup: 120, windows: {ma: [5, 10, 20, 60], er: 40, pctile: 120, mom: 20, range: 60, vol: 20}}
  weekly:  {resample: "W",  warmup: 60,  windows: {ma: [4, 8, 13, 26],  er: 20, pctile: 52,  mom: 12, range: 26, vol: 10}}
  monthly: {resample: "ME", warmup: 30,  windows: {ma: [3, 6, 12, 24],  er: 9,  pctile: 24,  mom: 6,  range: 12, vol: 6}}

soft:
  温度: 0.05
  最低分: 0.1168

指标:
  价格分位:   {key: pctile,    单位: 比例}
  区间宽度:   {key: range_pct, 单位: 比例}
  均线斜率:   {key: ma_slope,  单位: 百分比}
  二十日动量: {key: mom20,     单位: 百分比}
  多头排列:   {key: ma_align,  单位: 比例}
  量比:       {key: vol_ratio, 单位: 倍数}
  距均线:     {key: ma_dist,   单位: 百分比}

# 状态: 声明式人话条件 (evaluator 每条算 sigmoid 软门取积; 加状态=在此加一项)。锐度=门有效陡度(=门基准×态k, D1 v4调)。
状态:
  低位横盘:
    描述: 价在低位 + 窄幅震荡 + 均线走平 (筑底)
    理论锚定: Wyckoff Accumulation / Weinstein Stage1 (跨7源一致, 强确认)
    条件:
      - {指标: 价格分位, 判断: 低于, 阈值: 0.406, 锐度: 36.0}
      - {指标: 区间宽度, 判断: 低于, 阈值: 0.409, 锐度: 28.8}
      - {指标: 均线斜率, 判断: 平缓, 阈值: 4.0,   锐度: 30}
  放量突破:
    描述: 放量 + 大涨 + 上穿均线 (起涨)
    理论锚定: Wyckoff SOS / O'Neil pivot / Weinstein 1→2 (8源confirm事件, 缺确认门待D4)
    条件:
      - {指标: 二十日动量, 判断: 高于, 阈值: 15.65, 锐度: 17.8}
      - {指标: 量比,       判断: 高于, 阈值: 1.75,  锐度: 5.9}
      - {指标: 距均线,     判断: 高于, 阈值: 0.0,   锐度: 12}
  上升通道:
    描述: 均线向上 + 多头排列 + 价在均线上 (主升)
    理论锚定: Weinstein Stage2 / Wyckoff Markup / 道氏上升 (7源一致, 强确认)
    条件:
      - {指标: 均线斜率,   判断: 高于, 阈值: 0.68, 锐度: 75.4}
      - {指标: 多头排列,   判断: 高于, 阈值: 0.500, 锐度: 15.1}
      - {指标: 二十日动量, 判断: 高于, 阈值: 0.0,  锐度: 8}
  缩量上涨:
    描述: 价位偏中 + 量缩 (升势量缩, 高位=衰竭/低位=供给枯竭, 位置消歧待D4)
    理论锚定: 量价No-demand(高位) / VCP供给枯竭(低位) — 有争议态, 语义须位置化(评审)
    条件:
      - {指标: 二十日动量, 判断: 高于, 阈值: 2.0,  锐度: 5.5}
      - {指标: 量比,       判断: 低于, 阈值: 0.628, 锐度: 2.7}
      - {指标: 均线斜率,   判断: 高于, 阈值: 0.0,  锐度: 15}
  中继平台:
    描述: 价在中位 + 窄幅整理 + 价近均线 (主升中继清洗, 填 低位/高位 之间 GAP)
    理论锚定: 中文主升浪中继 / O'Neil base-on-base (D1新增, 填 pctile 0.475-0.717 缝)
    条件:
      - {指标: 价格分位, 判断: 高于, 阈值: 0.461, 锐度: 21.2}
      - {指标: 价格分位, 判断: 低于, 阈值: 0.769, 锐度: 21.2}
      - {指标: 区间宽度, 判断: 低于, 阈值: 0.487, 锐度: 21.2}
      - {指标: 均线斜率, 判断: 平缓, 阈值: 3.5,   锐度: 25}
      - {指标: 距均线,   判断: 高于, 阈值: -2.0,  锐度: 8}
  高位滞涨:
    描述: 价在高位 + 涨势停滞 (见顶派发)
    理论锚定: Wyckoff Distribution / Weinstein Stage3 (7源confirm, 缺UTAD动态拐点待D4)
    条件:
      - {指标: 价格分位,   判断: 高于, 阈值: 0.790, 锐度: 13.9}
      - {指标: 均线斜率,   判断: 平缓, 阈值: 3.0,  锐度: 30}
      - {指标: 二十日动量, 判断: 平缓, 阈值: 7.2,  锐度: 15}
  下跌通道:
    描述: 均线向下 + 价在均线下 + 动量负 + 缩量 (纯缩量阴跌主跌)
    理论锚定: Weinstein Stage4 / Wyckoff Markdown / 道氏下降 (7源一致, 强确认)
    条件:
      - {指标: 均线斜率,   判断: 低于, 阈值: -2.36, 锐度: 57.8}
      - {指标: 距均线,     判断: 低于, 阈值: 0.0,  锐度: 12}
      - {指标: 二十日动量, 判断: 低于, 阈值: 0.0,  锐度: 8}
      - {指标: 量比,       判断: 低于, 阈值: 1.50, 锐度: 7.7}
  放量下跌:
    描述: 价跌 + 放量 + 价在均线下 (恐慌杀跌; 高位=出货breakdown/低位=恐慌见底SC, 位置子态)
    理论锚定: 量价Selling Climax/Stopping Vol / Wyckoff SC (D1新增, 用户点名缺态)
    条件:
      - {指标: 二十日动量, 判断: 低于, 阈值: -8.2, 锐度: 36.9}
      - {指标: 量比,       判断: 高于, 阈值: 2.17, 锐度: 12.3}
      - {指标: 距均线,     判断: 低于, 阈值: 0.0,  锐度: 10}
  缩量回踩:
    描述: "升势中小幅缩量回调 (健康回踩) — 瞬时近死态(全宇宙0.01%, 升势回踩本质=前序态依赖, D4上下文层接管, 暂占位)"
    理论锚定: Minervini VCP / 道氏次级回调 (8源confirm但需前序SOS上下文, 瞬时表达不了)
    条件:
      - {指标: 二十日动量, 判断: 低于, 阈值: -0.56, 锐度: 5.2}
      - {指标: 二十日动量, 判断: 高于, 阈值: -7.25, 锐度: 4.2}
      - {指标: 量比,       判断: 低于, 阈值: 1.027, 锐度: 2.6}
      - {指标: 距均线,     判断: 高于, 阈值: -3.95, 锐度: 8}
      - {指标: 多头排列,   判断: 高于, 阈值: 0.466, 锐度: 4}

# 状态内细分 (所有形态都细分; 放量下跌 按位置消歧=用户核心)
子态:
  低位横盘: [地量横盘, 温和横盘]
  放量突破: [温和突破, 巨量突破, 涨停突破]
  上升通道: [温和上涨, 震荡上涨, 加速上涨]
  缩量上涨: [缩量延续]
  中继平台: [缩量中继, 震荡中继]
  高位滞涨: [放量派发, 缩量惜售]
  下跌通道: [温和阴跌, 缩量阴跌]
  放量下跌: [高位放量下跌, 低位放量下跌, 中位放量下跌]
  缩量回踩: [浅回踩, 深回踩]
子态阈值:   # 数据驱动 (v3 全宇宙分位 + D1 放量下跌位置/中继量能)
  上升_路径效率: 0.1633
  上升_回撤: 0.1376
  上升_加速: 0.0051
  低位_量能: -0.7908
  突破_量能: 0.5094
  高位_量能: 0.146
  回踩_回撤: 0.158
  中继_量能: 0.0      # 中继平台: 量能zscore<此=缩量中继, 否则震荡中继
  放量下跌_高位: 0.6  # 放量下跌: 价格分位>此=高位放量下跌(出货)
  放量下跌_低位: 0.3  # 价格分位<此=低位放量下跌(恐慌见底SC), 之间=中位放量下跌(延续)
  涨停_门: 0.5        # 放量突破: 涨停标志>此=涨停突破 (D3 A股一字板/封板)

# A股涨跌停修正 (D3, limits.py; up/down_limit 真相源已编码板块tier ±10/20%, 不必单独分板路由)
涨停:
  需求proxy量比: 3.0   # 涨停日 vol_ratio 封板截断 → 用此proxy使放量突破不被误判'无量假突破'
  贴板容差: 0.003      # 复权后 limit 微小误差容差

# 资金流向 + 换手率 (档案维度③, capital.py; 真相源 moneyflow主力净额 + daily_basic换手率)
资金:
  净流入累计门: 0.0     # 20日主力净额累计 > 此=主力净流入 (万元; 0=按符号)
  换手活跃分位: 0.8     # 换手率自身120日分位 > 此=换手活跃
  换手低迷分位: 0.2     # < 此=换手低迷(地量)

# 主力意图解读 (同花顺"暗盘追踪"解读语义, 用可靠维度重锚, capital.zhuli_intent)
# **measured裁决 (2026-06-21, sandbox/mingan_redesign)**: 东财日度桶零和 (elg+lg+md+sm=0) → 中小单净 ≡ −大单净,
#   暗盘=伪维度 (只是明盘取负); 同花顺L2暗盘量级差20x 物理复现不了 (need_027 BLOCKED)。
#   → 砍伪暗盘。改用 明盘(主力大单净 net_amount, 89%对齐同花顺明盘) × 价格(pct_change) 两个**真独立**维度。
# "隐蔽资金"语义 = 量价背离 (主力大单流出但价涨=隐性承接吸筹; 流入但价跌=隐性派发), 诚实代理非伪造暗盘金额。
# 口径: 档案描述维度 (无forward claim); 选股需含成本OOS另证。evidence: 同花顺暗盘追踪 IMG_6718-6743 (26条) 归纳
主力意图:
  主力清淡门: 1.5       # |净额占成交额%| < 此 = 主力大单参与清淡 (洗盘低吸/缩量阴跌类)
  价格涨门: 0.5         # pct_change > 此(%) = 价涨
  价格跌门: 0.5         # pct_change < -此(%) = 价跌
  规则:                # 6象限 (明盘方向 × 价格方向); 有序匹配命中即停 (先主力清淡, 后背离, 后一致)
    - 意图: 洗盘低吸          # 同花顺"洗盘低吸/开始吸筹" (6718-6725 纯暗盘大额+价微动)
      条件: {明盘弱: true, 价格: 涨}              # 主力大单清淡但价涨 = 隐蔽承接
      背离: 隐性承接
      解读: 主力大单参与清淡但价格上涨 — 隐蔽资金低吸/主力洗盘吸筹
    - 意图: 缩量阴跌          # 主力清淡且价跌 (无承接)
      条件: {明盘弱: true, 价格: 跌}
      背离: 量价一致
      解读: 主力大单参与清淡且价格下跌 — 无承接缩量阴跌
    - 意图: 诱空吸筹建仓      # 同花顺"诱空建仓/暗度陈仓" (恩捷/露笑/宝鼎: 明出价不跌)
      条件: {明盘: 出, 价格: 涨}                  # 背离: 主力流出但价涨
      背离: 隐性承接
      解读: 主力大单净流出但价格上涨 — 明面诱空暗地承接吸筹
    - 意图: 拉高派发诱多      # 对称背离: 主力流入但价跌
      条件: {明盘: 入, 价格: 跌}
      背离: 隐性派发
      解读: 主力大单净流入但价格下跌 — 拉高接盘派发诱多
    - 意图: 主力推升看多      # 同花顺"后市看多/拆单控盘" (晶方/万通: 明入价涨)
      条件: {明盘: 入, 价格: 涨}                  # 量价一致向上
      背离: 量价一致
      解读: 主力大单净流入且价格上涨 — 主力真金推升看多
    - 意图: 主力做空出逃      # 同花顺"积极做空" (赛力斯: 明出价跌)
      条件: {明盘: 出, 价格: 跌}                  # 量价一致向下
      背离: 量价一致
      解读: 主力大单净流出且价格下跌 — 主力出逃做空
  默认意图: 资金分歧
  默认解读: 主力净额与价格方向不明确 — 资金意图分歧

# 筹码分布 + 胜率 (档案维度④, chips.py; 真相源 cyq_perf; 鱼尾出货预警)
筹码:
  高获利盘: 85.0        # winner_rate(0-100) > 此=高位派发压力
  低获利盘: 15.0        # < 此=低位惜售
  集中门: 0.5           # (cost95-cost5)/cost50 < 此=单峰集中(吸筹完成)
  集中松动门: 0.1        # 集中度20日变化 > 此=单峰转多峰(派发松动, 鱼尾出货预警; 长江《筹码分布因子》分盈亏 + goal CYQ出货)

# 成交量/量能 (档案L2, vol.py; 真相源 price_kline vol; L1 features已有vol_ratio放量突破, L2独立成维=量能解读)
成交量:
  放量门: 1.5      # vol/MA20 > 此=放量
  缩量门: 0.7      # < 此=缩量
  价格涨门: 0.5    # pct > 此(%)=价涨 (量价配合)
  价格跌门: 0.5    # < -此=价跌

# 相对强度 RS (评审HIGH盲点, rs.py; 个股 vs 大盘, 直服超额HS300>0 KPI)
RS:
  基准: "000300.SH"     # HS300 (超额KPI锚; 也可换 000905.SH中证500/399006.SZ创业板)
  窗口: 20              # Mansfield RS 均线窗
  零轴死区: 0.005       # RS vs 均线 死区(防抖)

# 单日K线形态 (D5, candles.py; 几何阈值, 位置消歧锤子/上吊, A股一字板特判)
单日形态:
  十字实体上限: 0.1    # 实体/全幅 < 此 = 十字星
  长实体下限: 0.7      # 实体/全幅 > 此 = 大阳/大阴(光头光脚)
  长影倍数: 2.0        # 影线 > 倍数×实体 = 长影(锤子/上吊/倒锤/流星)
  无波动幅度: 0.005    # 全幅 < 此×收 = 一字线

# 修饰指标 (子态规则用; 名→内部key, 阈值=子态阈值名=原始量纲不换算)
修饰指标:
  路径效率: er
  回撤: maxdd
  加速度: accel
  量能zscore: zvol
  价格分位: pctile
  涨停: is_up_limit

# 子态规则 (D2: 全 config 驱动, 消除 _sub_state 硬编码; evaluator 按序匹配, 无条件=默认)
# 规则: {则: 子态, 条件: [{指标: 修饰指标, 大于|小于: 子态阈值名}, ...全 AND]} | {则: 子态}(默认)
子态规则:
  上升通道:
    - {则: 加速上涨, 条件: [{指标: 加速度, 大于: 上升_加速}]}
    - {则: 温和上涨, 条件: [{指标: 路径效率, 大于: 上升_路径效率}, {指标: 回撤, 小于: 上升_回撤}]}
    - {则: 震荡上涨}
  低位横盘:
    - {则: 地量横盘, 条件: [{指标: 量能zscore, 小于: 低位_量能}]}
    - {则: 温和横盘}
  放量突破:
    - {则: 涨停突破, 条件: [{指标: 涨停, 大于: 涨停_门}]}
    - {则: 巨量突破, 条件: [{指标: 量能zscore, 大于: 突破_量能}]}
    - {则: 温和突破}
  缩量上涨:
    - {则: 缩量延续}
  中继平台:
    - {则: 缩量中继, 条件: [{指标: 量能zscore, 小于: 中继_量能}]}
    - {则: 震荡中继}
  高位滞涨:
    - {则: 放量派发, 条件: [{指标: 量能zscore, 大于: 高位_量能}]}
    - {则: 缩量惜售}
  下跌通道:
    - {则: 缩量阴跌, 条件: [{指标: 量能zscore, 小于: 中继_量能}]}
    - {则: 温和阴跌}
  放量下跌:
    - {则: 高位放量下跌, 条件: [{指标: 价格分位, 大于: 放量下跌_高位}]}
    - {则: 低位放量下跌, 条件: [{指标: 价格分位, 小于: 放量下跌_低位}]}
    - {则: 中位放量下跌}
  缩量回踩:
    - {则: 深回踩, 条件: [{指标: 回撤, 大于: 回踩_回撤}]}
    - {则: 浅回踩}

# 上下文层 (D4 两遍架构 pass-2; context.py): 用前序态(≤t-1)refine 上下文依赖态。缩量回踩复活在此。
# PIT: 前序窗口只用历史 bar; 当前条件用当前 bar; decision_date=t 无未来。当前条件用内部key+原始量纲(0.01=1%)。
上下文:
  前序窗口: 10                       # 看前 N 根 bar 的主导态
  缩量回踩:                          # 前序升势 + 当前小回调 = 健康回踩 (瞬时表达不了)
    前序态: [上升通道, 中继平台, 放量突破]
    当前条件:
      - {指标: mom20,     小于: 0.01}    # 动量轻度 (<+1%)
      - {指标: mom20,     大于: -0.10}   # 不大跌 (>-10%)
      - {指标: vol_ratio, 小于: 1.0}     # 量缩
      - {指标: ma_dist,   大于: -0.06}   # 价仍近均线 (>-6%, 未破位; 破位则归下跌通道)

# 命名形态 (D5b, patterns.py): 态序列模板 (派生纯函数标签, 完成bar命中不回贴=PIT三时点)。
# 加命名形态=在此加一项, 不动代码。provenance 标主观性(西方经典有统计基础/中文实战主观)。
命名形态:
  老鸭头:                                            # 头→鸭脖→鸭头(均线粘合平台)→鸭嘴出水
    序列: [上升通道, 缩量回踩, 中继平台, 放量突破]    # 评审: 鸭头在中位平台(中继平台)非低位筑底
    窗口: 90
    provenance: "中文实战(主观性高, 仅描述不当alpha)"
  圆弧底突破:                                         # 西方 cup-handle 近似
    序列: [下跌通道, 低位横盘, 放量突破]
    窗口: 120
    provenance: "西方cup-handle近似(有Bulkowski统计基础)"
  顶部派发转跌:                                       # 头肩顶 / Stage3→4 近似
    序列: [上升通道, 高位滞涨, 下跌通道]
    窗口: 90
    provenance: "Stage3→4派发(Weinstein/Wyckoff)"

# 边界耦合 (J2: 状态间边界参数关联, 调一个同步)
边界耦合:
  - 说明: 上升通道与下跌通道共均线斜率边界 (一进一退) — 互补对称镜像
    参数: [上升通道.均线斜率, 下跌通道.均线斜率]
    关系: 互补对称
  - 说明: 低位横盘<中继平台<高位滞涨 共价格分位轴 — 三档不重叠留过渡带
    参数: [低位横盘.价格分位, 中继平台.价格分位, 高位滞涨.价格分位]
    关系: 有序升
  - 说明: 放量突破/放量下跌(量比高于) 须 > 缩量上涨/下跌通道(量比低于) 的上界 — 放量缩量留中性带
    参数: [放量突破.量比, 缩量上涨.量比]
    关系: 首项高于其余

# 量基准路由 (P6 接入, 现 zvol 主信号)
量基准:
  突破:   {基准: 横盘箱体均量, 窗口: 60}
  持续:   {基准: 近期短均量,   窗口: 5}
  见顶:   {基准: 历史分位,     窗口: 120}
  默认:   {基准: 量能zscore,   窗口: 20}
