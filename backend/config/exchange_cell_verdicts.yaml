# 交易所格级裁决登记表 (exchange cell verdicts)。
#
# 是什么: 逐个 T 格 (日, venue, 6 位码, 价 2 位, 量 2 位) 登记"交易所逐笔证据
# 与供应商重落新表在这一格对不上, 已经人工核过, 原因与处置是什么"。T 格不是
# 一整天 / 一整市场 / 一种席位名写法的豁免, 是这一格两侧全部未匹配行的多重集
# (exchange_unmatched / vendor_unmatched) —— 登记的对象是"这些具体的行",
# 不是"这一类差异以后都算过"。同一份差异形状 (比如某个营业部两种写法) 在不
# 同的日子 / 不同的码上再次出现, 需要各自的格各自登记, 不会因为字符串对相同
# 就被一条登记通吃。
#
# 唯一接受通道: backend/services/exchange_cell_verdicts.py 的
# load_exchange_cell_verdicts() 读取并校验本文件, 消费方只能通过它拿到的
# CellVerdictSet 调 consume(); 没有第二条路径可以让某一格跳过登记直接放行。
#
# 为什么没有命令行放行旗子 (--allow-*): 命令行参数是一次性的, 不会把"当时
# 两侧的行到底是什么"钉下来——下一次供应商数据变了 (回补/又多报/改了个字),
# 同一个旗子还会继续放行一个它从没见过的新形状。登记必须落进这份文件, 带证
# 据字段与核验日期, 才能在下一次 verify 时被重新核对。
#
# 为什么一条登记必须钉住两侧全部未匹配行的多重集 (而不是只记一个数, 或只记
# 一侧): 只记数量的话, 供应商换了一笔份数不变的行也会被同一条登记放行; 只记
# 一侧的话, 另一侧多出来的行会被悄悄吞掉、永远不会被人看见。把两侧未匹配行
# 的完整字符串多重集都钉进登记, 意味着任何一侧发生变化——回补、多报、哪怕只
# 是某个席位名改了一个字——都会让这条登记与观测对不上号。
#
# 失效 (stale) 时怎么办: 判定为失败 (registry_stale / registry_contradiction),
# 不是静默跳过, 也不会退化成"当它没登记过"。已注册的格如果和当下观测对不
# 上, consume() 会把它标记出来, 要求人重新核验或删除这条登记; 旧登记不会替
# 一个它没见过的新形状背书。
