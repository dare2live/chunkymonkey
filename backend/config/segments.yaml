# segments.yaml — 股票分层规则 (owner=docs/MASTER_TOPLEVEL_DESIGN.md Tier1)
# 用户定调: 分层前置在所有策略之前, 属数据变量加工, 每天数据获取之后跑。
# 单一计算点: 所有策略的 cell 定义 / 画像维度 / edge 筛选器从 dim_stock_segment_daily 取, 禁各自算。
# 分位法 (非绝对阈值): 市值/换手按当日全市场分位分段 — 自适应跨年市值水平漂移 (2019 vs 2026)。
# 概念(东财)不进本表: 多对多标签非互斥分层；消费者应经版本化 classification snapshot 契约读取，
# 历史 PIT = fact_dc_member_daily (observation-date)；禁把 raw_tushare_dc_member /
# dim_stock_dc_* 当前快照 / 退役 v_dc_industry_pit(无 out_date) 当 PIT 真相。
version: 1

mktcap_segments:          # 按流通市值 circ_mv 当日分位
  micro: [0.0, 0.2]       # 微盘: 后20%
  small: [0.2, 0.5]
  mid:   [0.5, 0.8]
  large: [0.8, 1.0]       # 大盘: 前20%

turnover_segments:        # 按换手率 turnover_rate 当日分位
  low:  [0.0, 0.33]
  mid:  [0.33, 0.67]
  high: [0.67, 1.0]

industry_source: v_sw_industry_pit   # 行业=申万L1 PIT (in_date<=t<out_date)
data_start: "20190102"               # 对齐 K线/daily_basic 窗口

vol_regime:               # 波动 regime 轴 (2026-07-02 B2 设计 H8: 单一计算点落 B1, 形态模块只消费)
  kline_table: price_kline_qfq_tushare   # 当前派生分析输入；名义 OHLCV/公司行动才是待迁移的成交真相
  rv_return_window: 20    # 锚: 已实现波动率 = 滚动 20 交易日 (~1月) 收益 std (低波异象文献月度惯例)
  rv_pctile_window: 120   # 锚: 半年滚动分位, 对齐 pctile 家族 (F1 §5: rolling 分位, 禁全样本分位=未来信息)
  threshold: 0.5          # 锚: 中位二分 low_vol/high_vol (B2 任务契约取整值)
