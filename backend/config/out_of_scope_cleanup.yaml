version: 1
# out_of_scope_cleanup.yaml — cleanup_out_of_scope_rows.py 的登记表 (cut_bshare_purge, 2026-09-18)。
#
# 与 out_of_scope_scan.yaml 同生同灭: 那份文件判"扫库时哪些代码段属于范围外类别"
# (check_out_of_scope_rows.py 唯一消费方), 本文件判"哪些表允许按范围外类别删行、
# 怎么删"(cleanup_out_of_scope_rows.py 唯一消费方)。两份文件在 out_of_scope_scan.yaml
# 头注登记的合并计划落地时 (S1 vendor_scope v2 合入后) 一起并入 vendor_scope.yaml,
# 届时本文件删除。
#
# 不登记的表即便审计 FAIL 也不删 (plan 只报数, 进 unregistered 清单) —— 逼出裁决而
# 不是静默扩大删除范围。
#
# 每条 kind 的键集不同 (loader fail-closed 校验):
#   plain_delete               — {db, table, code_column, kind, key_columns, why}
#   disclosure_event_canonical — {db, table, code_column, kind, domain, why}
#     (key_columns 由 domain 解析出的对象的 .grain 给出, 不许在本文件重复声明)
#   holders_top10_canonical    — {db, table, code_column, kind, why}
#     (holders_top10 不是 DisclosureEventDomain 域, 没有 module:attr 可指——
#     grain/partition_field/dataset_id 一律由 loader 从 holders_top10_schema 常量取,
#     指针用 holders_top10_acceptance.partition_pointer_stats 重算; 本文件不重复声明)
#
# domain 写法 module:attr (与 vendor_scope.py:_resolve_code_source 的私有解析同形状,
# 本文件的 loader 不 import 该私有函数, 自行按 partition(":") + importlib + getattr
# 实现十行等价逻辑), loader 会 importlib 解析并校验 canonical_table == table。

dispositions:
  - db: org_holding
    table: canonical_org_holding_detail_period
    code_column: stock_code
    kind: disclosure_event_canonical
    domain: "services.data_sources.org_holding_acceptance:DOMAIN"
    why: "带 accepted_partition 指针的标准表: 删行后按 domain 重算受影响 available_date 分区的 row_count/content_hash; 分区删空则删指针 (CHECK row_count>0)"
  - db: org_holding
    table: raw_org_holding_aif10
    code_column: stock_code
    kind: plain_delete
    key_columns: [report_date, stock_code, holder_code, fund_derivecode]
    why: "canonical 的 legacy 上游 (accept_org_holding_partition_from_legacy 从它读 material, sync_period 用 _new_grains_only 判新), 必须与 canonical 同事务删, 否则下一次 merge 回灌"
  - db: smartmoney
    table: raw_qfii_holding_quarterly
    code_column: stock_code
    kind: plain_delete
    key_columns: [report_date, stock_code, holder_name]
    why: "无戳直写表, 无发布面"
  - db: tushare_raw
    table: raw_tushare_top_list
    code_column: ts_code
    kind: plain_delete
    key_columns: [trade_date, ts_code, reason]
    why: "无戳 raw 镜像 (legacy_raw_plane role=compatibility)"
  - db: smartmoney
    table: canonical_top10_float_holders_period
    code_column: stock_code
    kind: holders_top10_canonical
    why: "带 accepted_partition 指针的标准表, 分区键 notice_date; 指针用 holders_top10_acceptance.partition_pointer_stats 重算 (它不是 DisclosureEventDomain 域)"
