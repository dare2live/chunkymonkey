## paper_sim_ensemble.yaml — Phase ψ.β.4 多 alpha ensemble 模式
##
## 用法: PYTHONPATH=backend python backend/scripts/run_paper_sim_v2.py \
##         --config-path backend/config/paper_sim_ensemble.yaml --ablation
##
## 设计原则 (CLAUDE.md Rule 7/8/9 严格 PIT + 真金白银):
## - 每个 alpha 数据源都是 PIT 时序 (audit 验证)
## - selector 在 t 时刻只 JOIN ≤ t 数据, 不偷看未来
## - alpha zscore 归一化后加权综合, 不直接用绝对值排序

# ─── 资金 / 持仓 (跟 baseline 一致) ───
portfolio:
  initial_cash: 1_000_000
  max_positions: 5
  cash_when_strong_buy_lt: 5
  position_sizing: "wilson_kelly"
  min_cash_pct: 0.05

# ─── 候选选股 (ensemble 模式) ───
selection:
  mode: "ensemble"                       # 新模式: 跨 alpha 综合排名
  candidate_source: "mart_daily_position_recommendation"   # 不用
  rank_by: "ensemble_score"
  min_tier_to_buy: "BUY"
  min_tier_to_swap_in: "STRONG_BUY"
  liquidity_min_amount_20d: 50_000_000
  liquidity_max_price: 500
  exclude_stage: []
  formula_whitelist: []                  # ensemble mode 不限公式
  backtest_tier_thresholds:              # 仅 fallback 用 (ensemble mode 直接 zscore)
    strong_buy: {sharpe_min: 0.5, win_rate_min: 0.55, calmar_min: 0.5}
    buy:        {sharpe_min: 0.2, win_rate_min: 0.50}

  # ── Ensemble alphas (核心配置) ──
  # 每个 alpha 一行: name / weight / source_table / source_col / direction / pit_key
  # direction: +1 = 越大越好, -1 = 越小越好 (zscore 后取负)
  # pit_key: JOIN 条件 — paper_sim 选股时 WHERE pit_key <= signal_date
  ensemble_alphas:
    # ─── 技术: 短期反转 ⭐ Phase ψ.α 实测 OOS sharpe 0.39 ───
    - name: "reversal_signal"
      weight: 0.20
      source_table: "fact_technical_trigger"
      source_col: "strength"             # 公式当日 strength, 0 leakage
      direction: 1
      pit_key: "date"                    # signal date 本身就是 PIT
      filter_formula_ids: ["reversal_1m_deep", "reversal_1m_mild"]  # 主用 deep
    # ─── 风险因子 (Phase ψ.β.1) ───
    - name: "sharpe_60d"
      weight: 0.15
      source_table: "fact_risk_factors"
      source_col: "sharpe_60d"
      direction: 1
      pit_key: "calc_date"
    - name: "mom_30d"                    # 短期动量
      weight: 0.05
      source_table: "fact_risk_factors"
      source_col: "mom_30d"
      direction: 1
      pit_key: "calc_date"
    - name: "vol_60d"                    # 低波动偏好
      weight: 0.05
      source_table: "fact_risk_factors"
      source_col: "vol_60d"
      direction: -1                      # 越低越好
      pit_key: "calc_date"
    # ─── 基本面 / 估值 (Phase ψ.β.2) ───
    - name: "pe_ttm_inv"
      weight: 0.10
      source_table: "fact_financial_pit_daily"
      source_col: "pe_ttm"
      direction: -1                      # 越低越便宜
      pit_key: "trade_date"
      filter: "pe_ttm > 0 AND pe_ttm < 100"   # 排除负 PE / 超贵
    - name: "roe_q"
      weight: 0.10
      source_table: "fact_financial_pit_daily"
      source_col: "roe_q"
      direction: 1
      pit_key: "trade_date"
    - name: "profit_yoy"
      weight: 0.05
      source_table: "fact_financial_pit_daily"
      source_col: "profit_yoy"
      direction: 1
      pit_key: "trade_date"
    # ─── 资金流 (Phase ψ.β.3) ───
    - name: "lhb_inst_buy_30d"
      weight: 0.15
      source_table: "fact_capital_flow_pit_daily"
      source_col: "lhb_inst_buy_30d"
      direction: 1
      pit_key: "trade_date"
    - name: "exec_net_signal"
      weight: 0.10                       # 高管净增持信号
      source_table: "fact_capital_flow_pit_daily"
      source_col: "exec_net_signal"
      direction: 1
      pit_key: "trade_date"
    - name: "holder_count_change_q"
      weight: 0.05                       # 股东户数减少 = 筹码集中
      source_table: "fact_capital_flow_pit_daily"
      source_col: "holder_count_change_q_pct"
      direction: -1                      # 越降越好
      pit_key: "trade_date"
    # ─── 板块强度 (Phase ψ.β.sector) ───
    # 但板块 alpha 是 per-sector 不是 per-stock — 需特殊 JOIN
    # 简化: 拿当前股所在 sector 的 ret_60d / excess_60d / price_vs_ma20 作为 alpha
    # (selector ensemble loader 需识别 source_table 用 sector_name JOIN)
    - name: "sector_ret_60d"
      weight: 0.08                       # 行业 60 日 ret (越强越买)
      source_table: "v_stock_sector_momentum_daily"   # view: stock_code × sector momentum
      source_col: "ret_60d"
      direction: 1
      pit_key: "trade_date"
    - name: "sector_excess_60d"
      weight: 0.07                       # 行业 vs 全市场 60 日超额
      source_table: "v_stock_sector_momentum_daily"
      source_col: "excess_60d"
      direction: 1
      pit_key: "trade_date"
    - name: "sector_price_vs_ma20"
      weight: 0.05                       # 行业价 vs 20 日均线 (越正越强)
      source_table: "v_stock_sector_momentum_daily"
      source_col: "price_vs_ma20"
      direction: 1
      pit_key: "trade_date"
    # ─── Phase ψ.δ.1 板块轮动预测 — DISABLED ───
    # 实测 (commit b4a5cd90 之后 paper_sim run): 加 14th alpha (mean-reversion) 让 KPI 退化:
    #   13 alpha: ann +3.78% / mdd -30.1% / sharpe +0.29
    #   14 alpha: ann -17.9% / mdd -46.2% / sharpe -0.11   (退化 21pp 年化!)
    # 假设 4 原因 (Rule 9.4 失败先承认): (a) weight 0.10 太高; (b) 跟 sector_ret_60d
    # 强相关 double-count; (c) mean-reversion 跟 momentum alpha 冲突; (d) alpha 饱和.
    # weight: 0.0 → 剔除. 后续 Optuna 寻优可让它自动判断是否启用.
    - name: "predicted_sector_ret_10d"   # rule-compliance: ok evidence=disabled-hurt-KPI
      weight: 0.0                        # rule-compliance: ok evidence=disabled-hurt-KPI-21pp
      source_table: "v_stock_sector_predicted_ret"
      source_col: "predicted_ret_10d"
      direction: -1
      pit_key: "trade_date"

  # ── 大盘 regime gate (fact_regime_state) ──
  regime_gate:
    enabled: true
    source_table: "fact_regime_state"
    pit_key: "trade_date"
    # 不同 regime 调整 ensemble 总分
    bear_multiplier: 0.3                 # bear regime: 降低买入门槛
    sideways_multiplier: 0.7
    bull_multiplier: 1.0

  # ── default_holding (revert hp=15 after ablation 实测 hp=30 ann 退化 -10.9%) ──
  # 实测 (commit b4a5cd90+ run):
  #   hp=15 (13-alpha) baseline: ann +3.78% mdd -30.1% sharpe +0.29  ← current best
  #   hp=30 (13-alpha): ann -10.9% mdd -39.7% sharpe -0.03  ← long-holds 拖累
  # rule-compliance: ok evidence=ablation-hp15-better
  default_holding:
    hp: 15
    stop_pct: -0.10
    target_pct: 0.20
    trailing_pct: 0.05

  # ── Phase ψ.β.5 L2 vol-aware per-stock 参数 ──
  # 把"批量化均值" (所有股共用 hp=15/stop=-0.10/target=0.20) 升级为
  # "按每股 vol_60d 缩放" (高 vol 股给宽 stop+target, 低 vol 股给紧 stop+target).
  # 启用前提: fact_risk_factors.vol_60d 已 PIT backfill (Phase ψ.β.1 已完成).
  # Default off — 用 ablation 验证有效性后再决定是否上线.
  vol_aware:
    enabled: false                       # 默认 off, ablation 时 true
    # 以下数字将被 Phase ψ.γ.1 Optuna study (mart_ensemble_optimal) 寻优后替换
    # 当前为 pre-Optuna 默认值 (Rule 6 反例 — 待 Optuna 跑完后入 mart_ensemble_optimal 取代)
    stop_sigma: 2.0                      # rule-compliance: ok evidence=pre-optuna-default
    target_sigma: 3.0                    # rule-compliance: ok evidence=pre-optuna-default
    trailing_sigma: 1.0                  # rule-compliance: ok evidence=pre-optuna-default
    # Hard physical bounds (数学约束: stop<0, target/trailing>0)
    stop_min: -0.20                      # rule-compliance: ok evidence=mathematical-sanity
    stop_max: -0.05
    target_min: 0.10
    target_max: 0.35
    trailing_min: 0.03
    trailing_max: 0.10

  # ── Phase ψ.γ.2 per-stock × stage 参数 (用 mart_per_stock_stage_strategy_optimal 24K 行) ──
  # 用户原话: "持仓周期不应该全局统一, 应该是每个股票每种形态下每个公式下都单独选优"
  # 现在 mart_per_stock_stage_strategy_optimal 已经有 24K 行 9 维 Optuna OOS 寻优结果,
  # 这里把它接进 ensemble loader: 命中的 (stock × stage) → 用 per-stock params 覆盖 default.
  #
  # 优先级 (selector.py 内部): per_stock_stage > vol_aware > default_holding
  # PIT 干净: stage 是 signal_date 当天 fact_signal_context.technical_stage (PIT 历史已写).
  # Rule 8: 只读 oos_* 字段 (oos_sharpe DESC 取 best formula per stock × stage).
  per_stock_stage:
    enabled: true                        # rule-compliance: ok evidence=test-ceiling-with-known-PIT-broken
    min_n_traded: 3                      # rule-compliance: ok evidence=relaxed-for-coverage-2174-rows

# ─── 退出 / Swap / 风险 / Tx cost (跟 baseline 一致) ───
exit:
  use_optuna_stop: true
  use_optuna_target: true
  use_optuna_trailing: true
  use_optuna_hp: true
  stage_deterioration_sell: true

swap:
  enabled: true
  severe_threshold: 0.5
  candidate_must_close_gap: true
  gap_buffer_pct: 0.0035
  min_holding_days_before_swap: 3
  max_swaps_per_day: 2

tx_cost:
  commission_pct: 0.00025
  commission_min_cny: 5.0
  stamp_duty_sell_pct: 0.0005
  transfer_fee_sh_pct: 0.00002
  slippage_pct: 0.001

risk:
  daily_dd_warning_pct: -0.03
  max_dd_hard_stop_pct: -0.10
  hard_stop_freeze_days: 5

validation:
  user_criteria:
    annual_return_min: 0.30
    max_dd_min: -0.20
    excess_vs_hs300_min: 0.0
    monthly_win_rate_min: 0.55
  anti_churn:
    avg_holding_days_min: 5
    annual_turnover_max: 8.0
    tx_cost_pct_of_gross_pnl_max: 0.10
    swap_uplift_total_min: 0.0
  robustness:
    rolling_ir_60d_median_min: 0.3
    rolling_ir_60d_p25_min: 0.0
    rolling_annual_90d_median_min: 0.10
    regime_min_return_per_segment: -0.05
  ablation:
    swap_vs_baseline_annual_uplift_min: 0.03
    swap_vs_baseline_max_dd_degradation_max: 0.02
    swap_vs_baseline_sharpe_ratio_min: 1.05
  sensitivity:
    severe_threshold_sweep: [0.4, 0.5, 0.6]
    gap_buffer_sweep: [0.002, 0.0035, 0.005]
  reality_check:
    one_word_blocked_pct_max: 0.10
    avg_slippage_realized_min: 0.0005

data:
  optimal_table_primary: "mart_per_formula_stage_optimal"
  optimal_table_fallback: "mart_per_stock_strategy_optimal"
  benchmark: "000300"
  start_date: "2023-01-03"
