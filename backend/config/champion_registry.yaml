# champion_registry.yaml — champion model 单一真相源声明 (governance).
#
# 背景 (2026-06-11 体检 HIGH): champion model_id 散在 3 处且互相冲突:
#   - scripts/daily_update.sh:50          CHAMPION_MODEL_ID=lgbm_20260517_governance_v1_20d
#   - SESSION_HANDOFF.md:34               Model ID = lgbm_phase5_v9b_20260523T083000Z (实为 F2 训练模型, 不是 promote champion)
#   - smartmoney.duckdb::mart_model_lifecycle  status='champion' = baseline60_driftsafe_..._20260507_055705
#
# 第一性原理 (CLAUDE.md §1.0): champion 的运行时真相源是 mart_model_lifecycle.status='champion',
# 不是任何 hardcode 字符串. 本 yaml 是"声明的治理期望值 + 来源/提升证据", reader 会拿它跟
# DB lifecycle 真相源对账 (champion_registry.assert_consistent_with_db), 不一致即 raise —
# 防 daily_update.sh / handoff 再各写各的.
#
# 改 champion: 先 promote 进 mart_model_lifecycle (DB 真相), 再同步更新本 yaml 的
# expected.model_id + promoted_at + source_commit, 跑 assert_consistent_with_db() 验证一致.

schema_version: 1

# 治理声明的当前 champion (= 应与 DB lifecycle status='champion' 一致)
expected:
  # NOTE: 该值取自 2026-06-11 体检时 smartmoney.duckdb::mart_model_lifecycle 实际 champion
  # (deployed_at=2026-05-07 06:04:25). daily_update.sh 的 lgbm_20260517_governance_v1_20d
  # 与 handoff 的 lgbm_phase5_v9b 均与 DB 真相不一致 — 留给 daily-update-wiring 组按本 yaml 收敛.
  model_id: baseline60_driftsafe_qfq_factor_vwap_model_selection_run_20260507_055705
  promoted_at: "2026-05-07"        # = mart_model_lifecycle.deployed_at 日期
  source_commit: unknown           # measured: 体检时 DB lifecycle 无 commit lineage; 后续 promote 须填
  notes: >-
    体检确认: 运行时 champion 来自 DB lifecycle, 非 daily_update.sh hardcode.
    若实际想用的 champion 不是这个 (e.g. 想切到 lgbm_20260517_governance_v1_20d),
    须先在 mart_model_lifecycle promote 该 model_id, 再回填本 yaml — 不允许只改 yaml/脚本绕过 DB.

# 角色区分: F2 训练 / 寻优阶段模型 (不是 promote champion, 仅作 lineage 记录)
roles:
  f2_training_model:
    model_id: lgbm_phase5_v9b_20260523T083000Z
    note: SESSION_HANDOFF 主线 F2 checkpoint 模型, 训练/寻优用, 非已 promote 的运行时 champion.

# DB 真相源定位 (reader 对账用)
db_truth_source:
  database: smartmoney.duckdb
  table: mart_model_lifecycle
  status_value: champion
