# A 股法定节假日 — 交易日历的唯一判断依据
#
# 第一性原理: 交易日 = 周一~周五 − 法定节假日。**没有例外**。
#   实证 (2026-08-31): 用本文件配置 + 周末规则推导 1999-2026 全部 13,162 天,
#   与当时在库的 raw_tushare_trade_cal 逐日比对 —— 真实交易日 8797 / 推导 8797,
#   多算 0、少算 0。另单独验证"周末开市"例外: 2005~2026 共 22 年合计 0 天
#   (A 股与上班调休不同, 节假日调休补班日股市不开市)。
#
# 为什么不从数据源取:
#   未来交易日曾是引入 baostock 的唯一理由 (check_continuity_integrity 要求 today 之后
#   仍有 >=60 个已登记交易日)。2026-08-31 baostock 因并发探测被风控拉黑后实测:
#   扶摇日历端点窗口锁死 [今日-1年, 今日]、通达信只能由已发生 K 线反推、妙想无日历产品线
#   —— **三源结构性地都给不了未来交易日**。而节假日是国务院每年 Q4 公布的公开信息,
#   本就该是配置而非取数。配置化后日历不依赖任何供应商, 且可生成任意远的未来。
#
# 维护方式 (每年一次, 约 10 行):
#   国务院公布次年放假安排后, 在下面加一个年份条目。格式 "YYYYMMDD" (单日) 或
#   "YYYYMMDD~YYYYMMDD" (连续段), 只列**工作日中休市的那些天**, 周末不用列。
#
# 空列表 vs 缺失年份 (两者语义**不同**, 不可混淆):
#   `'1990': []` = **已确认该年无法定节假日**(如 1990 只有 12-19~12-31 共 13 天,
#                  元旦要到 1991-01-01), 推导器正常放行。
#   年份缺失     = **未配置**, 推导器 fail-closed 拒绝(见下)。
#   —— 若不做这个区分, 每个"恰好无假期"的年份都会被误判为未配置并打挂生产。
#
# 未配置年份的语义 (重要):
#   缺年份 = 只按周末规则推导 = 交易日**偏多**(多出该年约 16~24 个节假日),
#   是**上界不是精确值**。消费方必须把这类年份视为 unconfirmed, 不可当已确认日历用。
#
# 校验: 推导结果须与 K 线实际交易日一致 ("K 线有交易 = 在交易", 见 CLAUDE.md 第一性原理)。
#   配置写错会静默污染全系统, 该校验是唯一保险, 不可省。
version: 1
