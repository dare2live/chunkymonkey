# SERVE 读侧 entity registry — owner=docs/MASTER_TOPLEVEL_DESIGN.md §3.1/§5.1
#
# 唯一取数声明处 (不变量4 单概念单真相源): 非成员消费者禁内联 FROM raw_* (check_serve_read_layer D1 + moth serve-read-layer-doors 守; 2026-07-08 收口后 D1 全量扫 backend/services+scripts, 见 data_module_members.yaml)。
# PIT 锚 + 口径清洗由读层强制 (不变量1 统一主键+PIT锚)。
# 每 entity 是一条声明 = 血缘的"声明链"一环 (展示→entity→源表→sync域→tushare)。
#
# 字段:
#   db            : database_manifest 别名 (路由真相源, 不 hardcode .duckdb)
#   table         : 物理表名
#   layer         : data_layers 层 (L0 raw / L1k 复权K线 / L1 / L2 / L3)
#   code_col      : 个股代码列; code_col=='ts_code' → 输出归一为 6 位
#   asof_col      : PIT 锚列 (决策 t 只用 asof_col <= t)
#   asof_format   : iso (YYYY-MM-DD) | yyyymmdd (YYYYMMDD) — 决定 as_of 比较前怎么归一
#   columns       : 取哪些列 (preflight 会对 schema 核对, 漂移=FAIL)
#   vendor        : 数据厂商 (血缘 provenance)
#   available_after: eod 盘后收盘可用 (决策侧 JOIN t-1) | preopen 盘前 | ann_date 公告
#
# ── 水龙头契约 (2026-07-02 用户定调: 数据与数据源分开管理 — 源=水龙头, entity=桶, SERVE=分水中转) ──
# entity 名 = 业务概念 (桶), 是消费方唯一可见的名字; vendor (水龙头) 只出现在 raw 表名/vendor 字段/provenance。
# 换源三步 (消费方零改动): ①新 adapter 落新 raw 表并达标本 entity 契约 (columns/单位/PIT锚) ②新旧对账 ③改本文件 db/table 指针。
# 命名法 (数据分两类, 按"换了源水还是不是同一桶水"客观划线):
#   - 事实类 (K线/成交/股东名册/财报数字/涨跌停): 物理世界唯一真相, 源只是通道 → entity 名禁含 vendor 字样。
#   - 观点类 (行业/概念分类=taxonomy, 资金流单别=vendor算法): 分类体系本身是数据身份 → entity 名必须带体系名
#     (sw_industry=申万体系 / dc_member=东财概念 / moneyflow_dc=东财单别算法)；跨体系不可按名称冒充等价，边界见 MASTER taxonomy contract。
version: 1

clean_rules:
  # 全局日期口径 (消 _iso 散落副本; 不在 entity 重复定义目标格式)
  iso_date: {kind: yyyymmdd_to_iso}

entities:
  kline_qfq:
    db: market
    table: price_kline_qfq_tushare
    layer: L1k
    code_col: code
    asof_col: date
    asof_format: iso
    columns: [code, date, open, high, low, close, volume, amount]
    vendor: tushare
    available_after: eod

  moneyflow:
    db: tushare_raw
    table: raw_tushare_moneyflow
    layer: L0
    code_col: ts_code
    asof_col: trade_date
    asof_format: yyyymmdd
    # 2026-06-23 清洗迁移: 补 8 档买卖额 (data_loaders total_flow=全单买卖额之和的加工原料; SERVE 服务原始列, 求和=加工层纯函数)
    columns: [ts_code, trade_date, net_mf_amount, buy_sm_amount, buy_md_amount, buy_lg_amount, buy_elg_amount, sell_sm_amount, sell_md_amount, sell_lg_amount, sell_elg_amount]
    vendor: tushare
    available_after: eod

  valuation:
    db: tushare_raw
    table: raw_tushare_daily_basic
    layer: L0
    code_col: ts_code
    asof_col: trade_date
    asof_format: yyyymmdd
    columns: [ts_code, trade_date, pe_ttm, pb, ps_ttm, dv_ttm, turnover_rate, total_mv, circ_mv]
    vendor: tushare
    available_after: eod

  index_daily:
    db: tushare_raw
    table: raw_tushare_index_daily
    layer: L0
    code_col: ts_code
    code_input: ts_passthrough   # 指数码 000300.SH 直用 (code_to_ts_code 股票前缀规则对指数无效)
    asof_col: trade_date
    asof_format: yyyymmdd
    columns: [ts_code, trade_date, close]
    vendor: tushare
    available_after: eod

  moneyflow_dc:
    # 东财个股资金 (主力大单净额; flow-vendor=membership-vendor 红线, 与概念=东财同源)
    db: tushare_raw
    table: raw_tushare_moneyflow_dc
    layer: L0
    code_col: ts_code
    asof_col: trade_date
    asof_format: yyyymmdd
    columns: [ts_code, trade_date, net_amount, net_amount_rate, pct_change]
    vendor: eastmoney_via_tushare
    available_after: eod

  cyq:
    # 长江筹码分布/获利盘 (复权 qfq 空间, 实测核证 CLEAN)
    db: tushare_raw
    table: raw_tushare_cyq_perf
    layer: L0
    code_col: ts_code
    asof_col: trade_date
    asof_format: yyyymmdd
    columns: [ts_code, trade_date, winner_rate, cost_5pct, cost_50pct, cost_95pct, weight_avg]
    vendor: tushare
    available_after: eod

  stk_limit:
    # A股涨跌停真相源 (盘前可用; 2022+)
    db: tushare_raw
    table: raw_tushare_stk_limit
    layer: L0
    code_col: ts_code
    asof_col: trade_date
    asof_format: yyyymmdd
    columns: [ts_code, trade_date, up_limit, down_limit]
    vendor: tushare
    available_after: preopen

  share_float:
    # 解禁 (前瞻事件; PIT 锚=ann_date 公告日, 公告≤t 时未来 float_date 已知 0泄露)
    db: tushare_raw
    table: raw_tushare_share_float
    layer: L0
    code_col: ts_code
    asof_col: ann_date
    asof_format: yyyymmdd
    columns: [ts_code, ann_date, float_date, float_ratio]
    vendor: tushare
    available_after: ann_date

  block_trade:
    # 大宗交易 (折溢价 = 大资金态度)
    db: tushare_raw
    table: raw_tushare_block_trade
    layer: L0
    code_col: ts_code
    asof_col: trade_date
    asof_format: yyyymmdd
    columns: [ts_code, trade_date, price, amount]
    vendor: tushare
    available_after: t+1   # 2026-07-09 全审计HIGH修复: 原声明 eod 与 sync_registry 同域 t+1 方向
                            # 性矛盾(21 entity 中唯一冲突)。对齐 t+1(保守口径, 消费方 JOIN 只保守
                            # 不泄漏); 实测当日 23:38 数据已可用, 未来若需当日盘后消费再定点探针
                            # 实测发布时刻后放宽。

  report_rc:
    # 券商研报/分析师预期 (PIT 锚=report_date 发布日; tp 单位 ×0.0001元 消费侧 /10000, mythos§8)
    db: tushare_raw
    table: raw_tushare_report_rc
    layer: L0
    code_col: ts_code
    asof_col: report_date
    asof_format: yyyymmdd
    columns: [ts_code, report_date, rating, tp]
    vendor: tushare
    available_after: ann_date

  fundamentals:
    # 财报指标 (PIT 锚=ann_date 公告日, **非 end_date 期末** = leakage 红线 mythos§3a; end_date 报告期仅排序用)
    db: tushare_raw
    table: raw_tushare_fina_indicator
    layer: L0
    code_col: ts_code
    asof_col: ann_date
    asof_format: yyyymmdd
    # 2026-06-23 清洗迁移: 补 roe_dt (扣非ROE, data_loaders QUALITY_METRIC; 质量更干净剔非经常损益)
    columns: [ts_code, ann_date, end_date, roe, roe_dt, roe_yearly, netprofit_yoy, or_yoy, grossprofit_margin, debt_to_assets]
    vendor: tushare
    available_after: ann_date

  forecast:
    # 业绩预告 (前瞻 PEAD; PIT 锚=ann_date 公告日; 修订=新 ann_date 胜)
    db: tushare_raw
    table: raw_tushare_forecast
    layer: L0
    code_col: ts_code
    asof_col: ann_date
    asof_format: yyyymmdd
    columns: [ts_code, ann_date, end_date, type, p_change_min, p_change_max]
    vendor: tushare
    available_after: ann_date

  sw_daily:
    # 申万一级行业指数日线 (ts_code=申万行业码 801xxx, 非股票码 → ts_passthrough; flow-vendor=申万)
    db: tushare_raw
    table: raw_tushare_sw_daily
    layer: L0
    code_col: ts_code
    code_input: ts_passthrough
    asof_col: trade_date
    asof_format: yyyymmdd
    columns: [ts_code, trade_date, close]
    vendor: shenwan
    available_after: eod

  top_list:
    # 龙虎榜上榜明细 (净买额 + 上榜原因)
    db: tushare_raw
    table: raw_tushare_top_list
    layer: L0
    code_col: ts_code
    asof_col: trade_date
    asof_format: yyyymmdd
    columns: [ts_code, trade_date, net_amount, reason]
    vendor: tushare
    available_after: eod

  top_inst:
    # 龙虎榜机构席位 (exalter 席位名 + 净买; 机构席位 LIKE '机构' 消费侧过滤)
    db: tushare_raw
    table: raw_tushare_top_inst
    layer: L0
    code_col: ts_code
    asof_col: trade_date
    asof_format: yyyymmdd
    columns: [ts_code, trade_date, net_buy, exalter]
    vendor: tushare
    available_after: eod

  holders_top10:
    # 十大流通股东 (事实类桶 — 股东名册该谁是谁, 与源无关)。2026-07-02 正名 holders_tdx→holders_top10 (水龙头契约: 事实类禁 vendor 名; 0 代码消费方零成本)。
    # 现水龙头=东财妙想 aif10 (source decision evidence=analysis/miaoxiang_aif10_source_decision_20260624.md, 取代滞后约4月的 tushare top10_floatholders + 退役 tdx F10); 写入=holders_aif10.sync_holders_aif10 (source='miaoxiang'); PIT 锚=report_date (YYYYMMDD)。
    db: smartmoney
    table: fact_top10_holder_period
    layer: L1
    code_col: stock_code
    asof_col: report_date
    asof_format: yyyymmdd
    columns: [stock_code, report_date, holder_set, holder_rank, holder_name_norm, hold_ratio_float, change_status, hold_change_num, is_exit_row]
    vendor: aif10
    available_after: ann_date

  sw_industry:
    # 申万行业归属 PIT 视图 (RANGE PIT: in_date≤t<out_date; asof_col=in_date 取≤t, 消费侧补 out_date>t 第二腿)
    db: tushare_raw
    table: v_sw_industry_pit
    layer: L1
    code_col: stock_code
    asof_col: in_date
    asof_format: yyyymmdd
    columns: [stock_code, l1_code, l1_name, l2_name, in_date, out_date]
    vendor: shenwan
    available_after: eod

  dc_member:
    # 东财概念成员 (con_code=个股 ts_code格式, ts_code=板块BKxxxx.DC 字段语义陷阱; 最近快照≤t)
    db: tushare_raw
    table: raw_tushare_dc_member
    layer: L0
    code_col: con_code
    code_input: ts_from_plain   # con_code 存 ts_code 格式(600519.SH); 列名非'ts_code'故默认推断失效, 显式声明
    asof_col: trade_date
    asof_format: yyyymmdd
    columns: [con_code, ts_code, trade_date]
    vendor: eastmoney_via_tushare
    available_after: eod

  dc_index:
    # 东财概念指数 (板块码 ts_code=BKxxxx.DC passthrough; 概念名+热度 pct_change)
    db: tushare_raw
    table: raw_tushare_dc_index
    layer: L0
    code_col: ts_code
    code_input: ts_passthrough
    asof_col: trade_date
    asof_format: yyyymmdd
    columns: [ts_code, trade_date, name, pct_change]
    vendor: eastmoney_via_tushare
    available_after: eod

  limit_list_d:
    # 涨跌停每日明细 (市场情绪; limit=U涨停/D跌停/Z炸板; "limit" 保留字引号化; 消费侧 COUNT(DISTINCT ts_code) 聚合防重复行膨胀)
    db: tushare_raw
    table: raw_tushare_limit_list_d
    layer: L0
    code_col: ts_code
    code_input: ts_passthrough
    asof_col: trade_date
    asof_format: yyyymmdd
    columns: [trade_date, ts_code, limit]
    vendor: tushare
    available_after: eod

  # financial_gpcw entity 已删 (2026-06-26 通达信全删): signals_v2 不再读 raw_gpcw_detail (D1/D3 gpcw 过滤器退役)。

  institution_survey:
    # 机构调研明细 — 批2 切 tushare 唯一 2026-06-28 (raw_tushare_stk_surv 360k 已拉全 2021-08~)。
    # PIT 锚=surv_date 调研日; tushare stk_surv 无 notice_date(披露日) → available_after t+1 保守
    # (调研纪要盘后/隔日披露)。旧 aif10+akshare raw_institution_surveys 已退役物删。
    db: tushare_raw
    table: raw_tushare_stk_surv
    layer: L0
    code_col: ts_code
    asof_col: surv_date
    asof_format: yyyymmdd
    columns: [ts_code, name, surv_date, rece_org, org_type]
    vendor: tushare
    available_after: t+1
