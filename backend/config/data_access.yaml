    columns: [trade_date, exchange_id, rzrqye]
    vendor: tushare
    available_after: eod

  dc_index:
    # 东财板块指数 (S7: pulse builder → mart_sector_pulse_daily; dim current-snapshot residual)
    db: tushare_raw
    table: raw_tushare_dc_index
    layer: L0
