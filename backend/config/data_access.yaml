      [
        ts_code,
        trade_date,
        name,
        pct_change,
        leading,
        leading_code,
        leading_pct,
        total_mv,
        up_num,
        down_num,
        idx_type,
        level,
      ]
    vendor: eastmoney_via_tushare
    available_after: eod

  limit_list_d:
    # B2 stock-day limit publication (S7 serve_l0_leaf strangler).
    # Publication = fact_stock_limit_daily (smartmoney); raw_tushare_limit_list_d = rebuild input.
    # Grain = trade_date × ts_code × limit (U/D/Z); available_at = trade_date 18:00 Asia/Shanghai.
    db: smartmoney
