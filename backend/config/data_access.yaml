    asof_format: yyyymmdd
    columns: [trade_date, content_type, ts_code, name, pct_change, net_amount, buy_elg_amount, buy_sm_amount_stock]
    vendor: eastmoney_via_tushare
    available_after: eod

  moneyflow_mkt_dc:
