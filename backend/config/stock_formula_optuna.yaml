# Shared stock-formula optuna bucket/conviction policy.
# Bucket floor and high-conviction gates belong to config, not script literals.
min_n_per_bucket: 3
min_win_high_conviction: 0.60
min_n_high_conviction: 5
vol_bins:
  - [0, 0.7, "缩量"]
  - [0.7, 1.3, "平量"]
  - [1.3, 2.0, "温量"]
  - [2.0, 99, "爆量"]
amt_bins:
  - [0, 0.7, "额减"]
  - [0.7, 1.3, "额平"]
  - [1.3, 2.0, "额温"]
  - [2.0, 99, "额爆"]
p60_bins:
  - [0, 0.65, "深底"]
  - [0.65, 0.85, "中位"]
  - [0.85, 0.97, "高位"]
  - [0.97, 99, "新高"]
