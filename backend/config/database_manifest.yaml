version: 1
defaults:
  attach_mode: read_only
  missing_optional_attach: warn

# cut_lineage_drift §2.1 (2026-09-18): 运行时记账表, writer 以 conn 为参数 (谁在哪个库
# 删/落地就在哪个库建), 一表一库假设对它们不成立。每个在线库可选出现一份 —— 不是
# "必须每库都有", 只是"出现了不算幽灵"。services/lineage/builder.py::catalog_drift()
# 校验名单每个成员在 data_layers.yaml 里的 layer 必须是 infra, 否则 fail-closed
# RuntimeError (防止把非 infra 表塞进来绕过登记漂移检查)。
shared_bookkeeping_tables:
  - mart_data_deletion_record
  - dim_schema_version
  - accepted_partition
  - ingest_batch

databases:
  smartmoney:
    path: data/smartmoney.duckdb
    domain: business_control_plane
    owner: core_pipeline
    role: current business marts, operational/governance evidence, and manual paper state
    default_open_mode: read_write
    default_attach_mode: read_only
    online: true
    status: active
    retention_class: governed_control_plane

  reference:
    path: data/reference.duckdb
    domain: reference_truth
    owner: core_pipeline
    role: security identity cache, exchange trading calendar, and deletion evidence; read-only to consumers
    default_open_mode: read_write
    default_attach_mode: read_only
    online: true
    status: active
    retention_class: governed_control_plane
    table_patterns:
      - dim_active_a_stock
      - dim_trading_calendar

  market:
    path: data/market.duckdb
    domain: market_serving
    owner: market_data_pipeline
    role: current qfq analysis/serving series plus processing evidence; nominal execution truth is not yet materialized
    default_open_mode: read_write
    default_attach_mode: read_only
    online: true
    status: active
    retention_class: canonical_source_store
    table_patterns:
      - price_kline_qfq_tushare
      - v_price_kline_qfq

  feature_store:
    path: data/feature_store.duckdb
    domain: tier3_research_artifacts
    owner: research_packages
    role: >-
      Current institution-profile and rally ground-truth/negative/strata artifacts.
      This store does not contain the retired generic fact_feature_panel and does
      not by itself certify PIT safety, experiment validity, or StrategyRelease.
    default_open_mode: read_write
    default_attach_mode: read_only
    online: true
    status: active
    retention_class: rebuildable_feature_store
    table_patterns:
      - fact_inst_episode
      - mart_inst_profile*
      - fact_rally_ground_truth
      - fact_rally_negative
      - fact_rally_strata
      - period_windows
      # 判例引擎 T2/T3 (casebook.yaml): 全部写者是 services/casebook/{signals,outcome,
      # pair_stats}.py，恒 manifest.path_for("feature_store") —— 登记从第一版
      # (0637b0ba) 起就没对过，不是搬库 (cut_lineage_drift §3 项1)。
      - casebook_case
      - casebook_outcome_day
      - casebook_stock_baseline
      - casebook_market_day
      - casebook_pair_stats

  experiment_store:
    path: data/experiment_store.duckdb
    domain: alpha_validation_experiment
    owner: research_evidence_store
    role: >-
      Existing verdict, IC-scan, artifact-lineage, and PIT-audit evidence tables.
      It is isolated from daily_update. Its former target-state spec
      (strategy_validation_contract.md, B0→B5/StrategyRelease paradigm) retired
      2026-09-04 along with that paradigm; no replacement contract doc exists —
      current paradigm is 策略验证 per goal.md (判例引擎/北极星段), not a
      staged-release runtime.
    default_open_mode: read_write
    default_attach_mode: read_only
    online: true
    status: active
    retention_class: transient_experiment
    table_patterns:
      - fact_experiment_verdict*
      - fact_consumer_alpha_ic_scan*
      - pipeline_artifact_lineage*
      - experiment_pit_audit_log*

  org_holding:
    path: data/org_holding.duckdb
    domain: tier0_disclosure
    owner: disclosure_org_holding
    role: >-
      Low-cadence event/detail store: org_holding landing/canonical/raw plus
      that dataset's ingest_batch and accepted_partition. Split = write-lock
      vs daily facts (CLAUDE.md 规则7: 拆库只因写锁/retention/owner冲突, 不按
      加工阶段拆库 — 原引用 MASTER §5.6, 该文档已于 2026-09-04 退役),
      not a strategy-owned database. Land→accept stays atomic inside this file.
    default_open_mode: read_write
    default_attach_mode: read_only
    online: true
    status: active
    retention_class: canonical_source_store
    table_patterns:
      - landing_miaoxiang_org_holding
      - canonical_org_holding_detail_period
      - raw_org_holding_aif10
      # org_holding_population.py:13 PROBE_TABLE — 活表 (实测 1 行 observed_at
      # 2026-09-17), 此前从未登记过 (cut_lineage_drift §3 项2)。
      - org_holding_source_probe
      # ingest_batch/accepted_partition 移入顶层 shared_bookkeeping_tables (2026-09-18
      # cut_lineage_drift §2.1) —— 一个参数只在一处定义, 不再在这里留字面量副本。
    notes:
      - Formal org_holding land/accept writer is services.data_sources.org_holding_acceptance
      - raw_org_holding_aif10 remains NONCONFORMING strangler until DatasetSnapshot cutover

  tushare_raw:
    path: data/tushare_raw.duckdb
    domain: tier0_market_data
    owner: tier0.market_data
    role: >-
      TuShare Tier0 store containing raw api-mirror tables (raw_tushare_*) and
      the first formal margin landing/canonical/accepted boundary. Raw mirrors
      are written only by services/data_sources/sync_runner.py; formal margin
      publication is written only by services/data_sources/margin_acceptance.py.
      Dataset-level writer and retention truth lives in the typed sync_registry
      contract; this manifest owns the physical database boundary.
      Separate file = write-lock isolation from smartmoney (2026-06-11 DB
      management decision: new domains never grow the monolith).
    default_open_mode: read_write
    default_attach_mode: read_only
    online: true
    status: active
    retention_class: canonical_source_store
    table_patterns:
      - raw_tushare_*
      - landing_tushare_margin
      - canonical_margin_exchange_daily
      # 09-18 daily 域换源 (fuyao dump + baostock 前收盘价) 落地的 4 canonical + 5
      # landing 字面量 —— 与上面 landing_tushare_margin 同形, 全部字面量, 不加
      # landing_*/canonical_* 通配 (会把 smartmoney/org_holding 的同前缀 canonical
      # 表默认吸过来, 见 cut_lineage_drift §3 项4)。
      - landing_tushare_daily
      - canonical_nominal_ohlcv_daily
      - landing_tushare_stock_st
      - canonical_stock_st_daily
      - landing_tushare_trade_cal
      - landing_tushare_trade_cal_fragment
      - canonical_sse_trading_calendar_generation
      - landing_tushare_stk_holdertrade
      - canonical_stk_holdertrade_announcement
      # ingest_batch/accepted_partition 移入顶层 shared_bookkeeping_tables (2026-09-18
      # cut_lineage_drift §2.1) —— 一个参数只在一处定义, 不再在这里留字面量副本。
      # 2026-09-18 (ST 契约 v2 刀2): 字面量项 (自带 db, 直采最高优先级, 不靠 raw_tushare_*
      # 通配符猜库) —— baostock 日 K 水库, writer = services/data_sources/baostock_daily_k_reservoir.py。
      - raw_baostock_daily_k
    notes:
      - raw_tushare_* is replayable compatibility data written by sync_runner.
      - Formal margin tables are permanent evidence under the margin dataset contract; never delete this database as a rebuildable raw mirror.
