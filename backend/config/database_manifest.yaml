version: 1
defaults:
  attach_mode: read_only
  missing_optional_attach: warn

databases:
  smartmoney:
    path: data/smartmoney.duckdb
    domain: business_control_plane
    owner: core_pipeline
    role: current business marts, operational/governance evidence, and manual paper state
    default_open_mode: read_write
    default_attach_mode: read_only
    online: true
    status: active
    retention_class: governed_control_plane

  reference:
    path: data/reference.duckdb
    domain: reference_truth
    owner: core_pipeline
    role: security identity cache, exchange trading calendar, and deletion evidence; read-only to consumers
    default_open_mode: read_write
    default_attach_mode: read_only
    online: true
    status: active
    retention_class: governed_control_plane
    table_patterns:
      - dim_active_a_stock
      - dim_trading_calendar

  market:
    path: data/market.duckdb
    domain: market_serving
    owner: market_data_pipeline
    role: current qfq analysis/serving series plus processing evidence; nominal execution truth is not yet materialized
    default_open_mode: read_write
    default_attach_mode: read_only
    online: true
    status: active
    retention_class: canonical_source_store
    table_patterns:
      - price_kline_qfq_tushare
      - v_price_kline_qfq

  feature_store:
    path: data/feature_store.duckdb
    domain: tier3_research_artifacts
    owner: research_packages
    role: >-
      Current institution-profile and rally ground-truth/negative/strata artifacts.
      This store does not contain the retired generic fact_feature_panel and does
      not by itself certify PIT safety, experiment validity, or StrategyRelease.
    default_open_mode: read_write
    default_attach_mode: read_only
    online: true
    status: active
    retention_class: rebuildable_feature_store
    table_patterns:
      - fact_inst_episode
      - mart_inst_profile*
      - fact_rally_ground_truth
      - fact_rally_negative
      - fact_rally_strata
      - period_windows

  experiment_store:
    path: data/experiment_store.duckdb
    domain: alpha_validation_experiment
    owner: research_evidence_store
    role: >-
      Existing verdict, IC-scan, artifact-lineage, and PIT-audit evidence tables.
      It is isolated from daily_update and is not yet the complete research runtime
      defined by strategy_validation_contract.md.
    default_open_mode: read_write
    default_attach_mode: read_only
    online: true
    status: active
    retention_class: transient_experiment
    table_patterns:
      - fact_experiment_verdict*
      - fact_consumer_alpha_ic_scan*
      - pipeline_artifact_lineage*
      - experiment_pit_audit_log*

  tushare_raw:
    path: data/tushare_raw.duckdb
    domain: tushare_raw_mirror
    owner: sync_runner
    role: >-
      TuShare raw api-mirror tables (raw_tushare_*), written only by
      services/data_sources/sync_runner.py per sync_registry.yaml entries.
      Separate file = write-lock isolation from smartmoney (2026-06-11 DB
      management decision: new domains never grow the monolith).
    default_open_mode: read_write
    default_attach_mode: read_only
    online: true
    status: active
    retention_class: source_mirror_rebuildable
    table_patterns:
      - raw_tushare_*
