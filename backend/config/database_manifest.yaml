version: 1
defaults:
  attach_mode: read_only
  missing_optional_attach: warn

databases:
  smartmoney:
    path: data/smartmoney.duckdb
    domain: business_control_plane
    owner: core_pipeline
    role: primary business facts, marts, governance evidence, and model outputs
    default_open_mode: read_write
    default_attach_mode: read_only
    online: true
    status: active
    retention_class: governed_control_plane

  market:
    path: data/market.duckdb
    domain: market_truth
    owner: market_data_pipeline
    role: K-line, trading calendar, benchmark, and market source truth
    default_open_mode: read_write
    default_attach_mode: read_only
    online: true
    status: active
    retention_class: canonical_source_store

  alpha158:
    path: data/alpha158.duckdb
    domain: factor_feature_store
    owner: alpha158_pipeline
    role: >-
      qlib Alpha158 K线技术因子面板 (consumer_alpha 矩阵的因子来源)。2026-06-14 地基-reset 收口:
      旧 panel (418万行/3.8G, 建于 reset 前 PIT 纪律收紧之前, 不可信任) 已删。重算契约: 验证
      Alpha158 时用干净 PIT 管道重建 (复用 features.py/oos_ic 模式 + pit_guard 核证), 纳 data_layers
      L2_feature 治理。见 analysis/model_validation_reliability_design_20260614.md §3/§7。
    default_open_mode: read_write
    default_attach_mode: read_only
    online: false
    status: planned   # 2026-06-14: 旧不可信 panel 已删; 重算后转 active
    retention_class: rebuildable_feature_store

  etf:
    path: data/etf.duckdb
    domain: etf_data
    owner: etf_pipeline
    role: ETF facts and benchmark support data
    default_open_mode: read_write
    default_attach_mode: read_only
    online: true
    status: active
    retention_class: governed_source_store

  # phase5_predictions partition 退役 2026-06-14 — model 层 reset 删除; offline 预测 artifact (.duckdb 文件 57M
  # + data/phase5_exports/) 已删孤儿。重建 model 层时按 DB 分区契约重新声明。

  feature_store:
    path: data/feature_store.duckdb
    domain: feature_cache
    owner: planned_feature_pipeline
    role: planned split target for large rebuildable feature/cache tables
    default_open_mode: read_write
    default_attach_mode: read_only
    online: false
    status: planned
    retention_class: planned_rebuildable_store
    table_patterns:
      - fact_feature_panel_candidate*  # @archived wiped-2026-06-14-reset
      - mart_feature_rank_matrix_cache*

  experiment_store:
    path: data/experiment_store.duckdb
    domain: alpha_validation_experiment
    owner: experiment_pipeline
    role: >-
      isolated store for alpha-validation experiment outputs
      (fact_experiment_verdict, fact_consumer_alpha_ic_scan,
      pipeline_artifact_lineage, experiment_pit_audit_log). Created at S0 of the
      alpha validation program. Wipeable after a validation cycle; CONSTRAINT:
      must NOT be consumed by daily_update live path (isolate experiment from
      serving to avoid result contamination). Declared ahead of S0 so new tables
      route here directly (no second migration) — see
      analysis/db_management_design_20260614.md §13.
    default_open_mode: read_write
    default_attach_mode: read_only
    online: true
    status: active  # 2026-06-14 S0: build_experiment_store.py 建 4 留档表
    retention_class: transient_experiment
    table_patterns:
      - fact_experiment_verdict*
      - fact_consumer_alpha_ic_scan*
      - pipeline_artifact_lineage*
      - experiment_pit_audit_log*

  tushare_raw:
    path: data/tushare_raw.duckdb
    domain: tushare_raw_mirror
    owner: sync_runner
    role: >-
      TuShare raw api-mirror tables (raw_tushare_*), written only by
      services/data_sources/sync_runner.py per sync_registry.yaml entries.
      Separate file = write-lock isolation from smartmoney (2026-06-11 DB
      management decision: new domains never grow the monolith).
    default_open_mode: read_write
    default_attach_mode: read_only
    online: true
    status: active
    retention_class: source_mirror_rebuildable
    table_patterns:
      - raw_tushare_*
      - mart_p0a_feature_label_panel*
