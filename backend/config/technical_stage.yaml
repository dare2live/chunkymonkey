# Stan Weinstein technical_stage 共享规则参数
# 这是一组共用的阶段识别口径，不应散落在脚本或测试里。
ma_fast_days: 50
ma_mid_days: 150
ma_slow_days: 250
range_lookback: 300
breakout_recent_days: 10
drawdown_max_stage2: 0.15
drawdown_lookback_days: 60
stage1_pos_max: 0.30
stage1_slope_max_abs: 0.02
stage1_vol_ratio_max: 0.8
stage15_vol_ratio_min: 1.5
stage15_recent_below_min_count: 2
volume_ma_days: 20
slope_lookback_days: 20
stage3_price_above_ma_mid_multiple: 1.15
stage3_slope_min: 0.0
stage4_slope_max: -0.02

# residual 只处理有足量历史、但未命中显式 Stan Weinstein 阶段规则的状态。
# residual label 只允许 1/3/4；Stage 1.5/2 只由显式突破/上升趋势规则产生。
residual_above_mid_stage: "3"
residual_below_mid_down_stage: "4"
residual_below_mid_other_stage: "1"
