# market_pulse.yaml — Tier2 市场感知阈值真相源
# 现行边界: docs/MASTER_TOPLEVEL_DESIGN.md + docs/strategy_validation_contract.md。
# 历史设计证据: git log --grep market_pulse_design (evidence-only)。
# 用户定调: "看钱在哪里从哪里流出流向哪里 … 哪里资金悄悄的在流入、哪里悄悄在流出"。
# 三个 namespace 并列 (vendor 自洽红线, 任何计算禁跨 namespace JOIN):
#   dc_industry = 东财行业层级；dc_concept = 东财概念多标签；二者不可混成一个东财桶
#   sw_industry = 申万行业层级 (sw_daily × index_daily 基准)
# 感知层只描述现状不给买卖暗示; RS top3 过滤器等信号层候选进 D2 消融另验 (设计文档 §1)。
version: 2

# ── RS 相对强度 (sw 链专属: 板块滚窗累计收益 − HS300 同窗累计收益, 百分点) ──
rs_window_4w: 20              # 4 周 ≈ 20 交易日 (aleabitoreddit RS 双窗短窗, 设计文档 §2)
rs_window_12w: 60             # 12 周 ≈ 60 交易日 (长窗)
benchmark_code: "000300.SH"   # RS 分母基准 (raw_tushare_index_daily; 与 KPI 超额基准同源)

# ── 悄悄流入/流出 (dc 链专属: 价格没动但钱连续进 = 吸筹嫌疑; 反向 = 派发嫌疑) ──
quiet_px_band_pct: 1.0        # |pct_change| < 1% 视作"价格没动" (设计文档 §2 默认, 待用户调参)
quiet_min_net_amount: 0       # 流入: net_amount > 该值; 流出: net_amount < -该值 (单位=元, 0=任何净流入/出)

# ── 全市场快照 ──
top_n_sectors: 3              # top/bottom N 板块进 mart_market_pulse_daily.top_sectors_json (aleabitoreddit top3/bottom3);
                              # C4 /pulse/warnings 复用同值做"跌出 RS top-N"预警线 (同一 top3 语义, 不另开阈值)

# ── v2 情绪周期/水位 (2026-07-02 v2 第一批, 契约=设计文档 "v2 增强设计" §1-7) ──
sec_board_cutoff: "093059"    # 秒板界定: limit_list_d.first_time <= 09:30:59 (开盘一分钟内封板即"秒板");
                              # 源 first_time 无前导零 (实测样本 "95236"=09:52:36), 引擎比较前 lpad 6 位归一
mkt_valuation_code: "000300.SH"  # 大盘估值/换手行 (raw_tushare_index_dailybasic; 与 benchmark_code 同值但独立键 —
                                 # RS 分母与估值口径解耦, 改其一不隐式牵连另一个)

# ── C4 退潮预警 (routers/market_pulse.py 消费; 描述性预警线, 非买卖信号) ──
warning_quiet_outflow_days: 3 # dc 链连续悄悄流出天数 >= 该值 进退潮预警卡 (C4 契约 2026-07-02 默认, 待用户调参)

# ── 迟到列回补 (历史根因证据: git log --grep data_foundation_root_causes) ──
lookback_late_days: 3         # 每次 build_latest 对最近 N 个已存在源日 DELETE+重插 (t+1 披露域
                              # margin/龙虎榜/limit 早跑日 NULL/半值行的治愈窗口)。3 = 覆盖 t+1 常规
                              # 迟到 + 一次失败重放周期 (audit 20260703 pulse finding: margin 实测比
                              # daily 晚 ~9h 到库, 失败进 open 队列由次日晨 drain 补)

# ── v3 资金流形态分类学 (flow_regime, 2026-07-03, 契约=设计文档 "v3 设计" v3.1) ──
# 三个正交维度: 量级 (cum_ratio 归一到板块市值) × 突然性 (flow_z 对自身历史) × 价格响应 (streak 窗价格累计)。
# 判定序 (第一命中): surge_in/surge_out (脉冲) → accum_*_silent/driving (累积) → neutral。
# 标签 key 英文入库; 前端中文显示名 = 脉冲流入/流出 · 横盘累积流入/流出 · 上行/下行累积流入/流出。
flow_z_surge: 2.5             # 脉冲门: flow_z >= 2.5 且 net>0 → surge_in; <= -2.5 且 net<0 → surge_out
                              # (net 同号 guard: 深负均值序列里 z 可为正, 防把流出日误标脉冲流入)
accum_min_streak: 5           # 累积门: 连续同号净流向天数 |flow_streak| >= 5
silent_px_band: 3.0           # 横盘带 (百分点): streak 窗价格累计 |px_cum| < 3% = 横盘累积;
                              # >= +3% = 上行累积 (accum_in_driving); <= -3% = 下行累积 (accum_out_driving)
zscore_window: 120            # flow_z 滚窗: 当日 net 对自身近 120 个交易日 (不含当日) 的 z-score;
                              # 窗口不满 / std=0 → NULL (尾对齐不外推, 与 RS 同纪律)
cum_window: 20                # cum_ratio_20d 累计窗: 近 20 交易日累计净流入 / 板块市值 (%);
                              # 窗口内净流值不足 20 个 → NULL (不知道≠0)

# ── data_start (分链, 全部对齐 sync_registry.yaml 实测源起点, 不外推) ──
data_start_dc: "20240102"     # from sync_registry: moneyflow_ind_dc data_start (E8 探底实测)
data_start_sw: "20190102"     # from sync_registry: sw_daily data_start (对齐 K线/daily_basic 窗口)
data_start_market: "20230103" # from sync_registry: limit_list_d data_start; moneyflow_mkt_dc 20230417 起, 之前 mkt_net_amount=NULL

# ── 启用的东财 taxonomy namespace；源 content_type 映射只在 taxonomy.yaml 定义 ──
dc_namespaces: ["dc_industry", "dc_concept"]

# ── 当前源截面质量下限（只防供应商整批坍缩，不代替逐键 parity）──
# 20260716 实测可映射SW=414；DC 下限直接由 taxonomy.yaml 的节点 floors 派生，禁止复制。
current_snapshot_quality_floor:
  measured_trade_date: "20260716"
  min_sw_mappable_rows: 380

# DC namespace 身份/content_type/level 词汇归 taxonomy.yaml；本文件不复制分类事实。
