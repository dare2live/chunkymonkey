version: 1

backends:
  local:
    status: active
    execution_mode: same_host_command
    artifact_mode: local_manifest
    notes:
      - Default backend for data validation, backtests, narrow model runs, and small parameter searches.

  modal:
    status: active
    execution_mode: external_worker_artifact_manifest
    artifact_mode: provider_manifest
    notes:
      # adapter: services/compute/modal_adapter.py reuses the local plan gate
      # (input_snapshot + objective + rollback_plan + required gate evidence)
      # before any Modal SDK call. Credentials in ~/.modal.toml (profile dare2live).
      # budget evidence: 2026-06-11 user-set $30/mo cap for tushare backfill + alpha sweep offload.
      - budget_monthly_usd=30
      - Active for model_training and parameter_search offload (tushare big backfill + alpha sweep).
      - Adapter emits an artifact manifest (input_snapshot hash + objective + rollback_plan + gate evidence) per submission.
      - Submission is blocked unless input_snapshot, objective, rollback_plan, and required gate evidence are all present.

job_families:
  data_validation:
    # owner_module 字段 2026-07-06 移除: 曾指 services/data_quality.py, 该模块零调用方
    # (孤儿, 从未真正实现调用下方 required_gates 三脚本) 已整体退役; owner_module 本身无
    # 任何代码消费 (纯描述性字段), 三个 gate 各自独立存在, 无需单一"owner 模块"占位。
    purpose: Validate source freshness, PIT safety, row coverage, and table health before starting substantive work.
    allowed_backends:
      - local
    command_family: data_validation
    required_plan_fields:
      - input_snapshot
      - objective
      - rollback_plan
    required_gates:
      - data_health_snapshot
      - data_audit
      - source_watermark_sla
    artifact_contracts:
      - id: data_health_snapshot
        kind: report
        required: true
        path_glob: data/reports/data_health*.json
      - id: source_watermark_sla
        kind: report
        required: false
        path_glob: data/audit/watermark_sla*.json

  backtest_validation:
    owner_module: backtest_validation
    purpose: Run paper simulation, Phase4, PBO, DSR, and promotion-readiness validation on existing artifacts.
    allowed_backends:
      - local
    command_family: backtest_validation
    required_plan_fields:
      - input_snapshot
      - objective
      - rollback_plan
    required_gates:
      - backtest_preflight
      - paper_sim
      - phase4_gate
    artifact_contracts:
      - id: phase4_gate
        kind: report
        required: true
        path_glob: data/reports/phase4_gate*.json
      - id: paper_sim_kpi
        kind: table
        required: true
        table: mart_paper_sim_kpi  # 2026-07-07 全库死代码普查实测: 表当前不存在(策略层待edge重建);
                                    # 本条为backtest_validation job family的未来契约声明非当前活门, 该
                                    # family 本身也无实际执行器消费(build_experiment_store.py 自述"执行器
                                    # 待重写"), 保留作重建时的 schema 参考不删
        min_rows: 1

  model_training:
    owner_module: ml_lifecycle
    purpose: Train or replay ranking models while preserving PIT, train-log, checkpoint, and prediction artifacts.
    allowed_backends:
      - local
      - modal
    command_family: model_training
    required_plan_fields:
      - input_snapshot
      - objective
      - rollback_plan
    required_gates:
      - leakage_audit
      - train_log_integrity
      - phase4_gate
    artifact_contracts:
      - id: best_checkpoint
        kind: file
        required: true
        path_glob: data/reports/optuna/*.best.json
      - id: train_log
        kind: table
        required: true
        table: fact_model_train_log  # 2026-07-07 全库死代码普查实测: 表当前不存在, 同上未来契约声明, 不删
        min_rows: 1
      - id: predictions
        kind: table
        required: true
        table: mart_p0b_oos_predictions  # 2026-07-07 全库死代码普查实测: 表当前不存在, 同上未来契约声明, 不删
        min_rows: 1

  parameter_search:
    owner_module: optimization
    purpose: Explore feature, parameter, and strategy search spaces only after the search plan proves useful.
    allowed_backends:
      - local
      - modal
    command_family: parameter_search
    required_plan_fields:
      - input_snapshot
      - objective
      - rollback_plan
    required_gates:
      - plan_validator
      - backtest_preflight
      - checkpoint_manifest
    artifact_contracts:
      - id: search_space
        kind: report
        required: true
        path_glob: data/reports/optuna/*.json
      - id: pipeline_manifest
        kind: table
        required: true
        table: mart_pipeline_run_manifest
        min_rows: 1
