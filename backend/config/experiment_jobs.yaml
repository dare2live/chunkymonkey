version: 1

backends:
  local:
    status: active
    execution_mode: same_host_command
    artifact_mode: local_manifest
    notes:
      - Default backend for data validation, backtests, narrow model runs, and small parameter searches.

  modal:
    status: active
    execution_mode: external_worker_artifact_manifest
    artifact_mode: provider_manifest
    notes:
      # adapter: services/compute/modal_adapter.py reuses the local plan gate
      # (input_snapshot + objective + rollback_plan + required gate evidence)
      # before any Modal SDK call. Credentials in ~/.modal.toml (profile dare2live).
      # budget evidence: 2026-06-11 user-set $30/mo cap for tushare backfill + alpha sweep offload.
      - budget_monthly_usd=30
      - Active for model_training and parameter_search offload (tushare big backfill + alpha sweep).
      - Adapter emits an artifact manifest (input_snapshot hash + objective + rollback_plan + gate evidence) per submission.
      - Submission is blocked unless input_snapshot, objective, rollback_plan, and required gate evidence are all present.

job_families:
  data_validation:
    owner_module: data_quality
    purpose: Validate source freshness, PIT safety, row coverage, and table health before model or backtest work.
    allowed_backends:
      - local
    command_family: data_validation
    required_plan_fields:
      - input_snapshot
      - objective
      - rollback_plan
    required_gates:
      - data_health_snapshot
      - data_audit
      - source_watermark_sla
    artifact_contracts:
      - id: data_health_snapshot
        kind: report
        required: true
        path_glob: data/reports/data_health*.json
      - id: source_watermark_sla
        kind: report
        required: false
        path_glob: data/audit/watermark_sla*.json

  backtest_validation:
    owner_module: backtest_validation
    purpose: Run paper simulation, Phase4, PBO, DSR, and promotion-readiness validation on existing artifacts.
    allowed_backends:
      - local
    command_family: backtest_validation
    required_plan_fields:
      - input_snapshot
      - objective
      - rollback_plan
    required_gates:
      - backtest_preflight
      - paper_sim
      - phase4_gate
    artifact_contracts:
      - id: phase4_gate
        kind: report
        required: true
        path_glob: data/reports/phase4_gate*.json
      - id: paper_sim_kpi
        kind: table
        required: true
        table: mart_paper_sim_kpi
        min_rows: 1

  model_training:
    owner_module: ml_lifecycle
    purpose: Train or replay ranking models while preserving PIT, train-log, checkpoint, and prediction artifacts.
    allowed_backends:
      - local
      - modal
    command_family: model_training
    required_plan_fields:
      - input_snapshot
      - objective
      - rollback_plan
    required_gates:
      - leakage_audit
      - train_log_integrity
      - phase4_gate
    artifact_contracts:
      - id: best_checkpoint
        kind: file
        required: true
        path_glob: data/reports/optuna/*.best.json
      - id: train_log
        kind: table
        required: true
        table: fact_model_train_log
        min_rows: 1
      - id: predictions
        kind: table
        required: true
        table: mart_p0b_oos_predictions
        min_rows: 1

  parameter_search:
    owner_module: optimization
    purpose: Explore feature, parameter, and strategy search spaces only after the search plan proves useful.
    allowed_backends:
      - local
      - modal
    command_family: parameter_search
    required_plan_fields:
      - input_snapshot
      - objective
      - rollback_plan
    required_gates:
      - plan_validator
      - backtest_preflight
      - checkpoint_manifest
    artifact_contracts:
      - id: search_space
        kind: report
        required: true
        path_glob: data/reports/optuna/*.json
      - id: pipeline_manifest
        kind: table
        required: true
        table: mart_pipeline_run_manifest
        min_rows: 1

  consumer_alpha_validation:
    owner_module: experiment_consumer_alpha
    purpose: >-
      Validate which new data candidates carry real PIT-clean alpha by running the
      (data candidate x consumer) matrix, before any pipeline is built. Verify-only:
      never tunes formula thresholds (goal.md freeze). Outputs route to the isolated
      experiment_store DB (must NOT be consumed by daily_update live path).
    allowed_backends:
      - local
      - modal
    command_family: consumer_alpha_validation
    required_plan_fields:
      - input_snapshot
      - objective
      - rollback_plan
    required_gates:
      - data_health_snapshot
      - pit_audit
      - leakage_consumer_scan
    artifact_contracts:
      - id: consumer_alpha_verdict
        kind: table
        required: true
        table: fact_experiment_verdict
        min_rows: 1
      - id: consumer_alpha_pit_audit
        kind: table
        required: true
        table: experiment_pit_audit_log
        min_rows: 1
      - id: consumer_alpha_lineage
        kind: table
        required: true
        table: pipeline_artifact_lineage
        min_rows: 1
      - id: consumer_alpha_ic_scan
        kind: table
        required: false
        table: fact_consumer_alpha_ic_scan
      - id: consumer_alpha_verdict_json
        kind: report
        required: false
        path_glob: analysis/consumer_alpha_verdict_*.json
