# Foundation-done aggregate gate (F1–F10)
#
# Authority: docs/MASTER_TOPLEVEL_DESIGN.md §11 (FND-GATE 十维) §3
# Owner script: backend/scripts/check_foundation_done.py
# Doctor section + moth claim + offline tests wire this file.
#
# Semantics:
#   - Real gaps → FAIL (fail-closed)
#   - Typed walls (S7 20 ssot hard-stop + 3 retired / org mass by-date provider land banned +
#     daily incremental-by-period required)
#     are PASS when the wall is honestly maintained — they must NOT block
#     foundation-phase closure incorrectly
#   - Type-B enrichment was a defer wall; FIXED 2026-07-23 (canonical ACCEPTED)
#   - F8 §15 behavior PASS only when §15-VERIFY evidence lists
#     ≥3 consecutive L3 knives with commits/knife ≤1.5 and pre_knife=true
#     (do NOT loosen thresholds to force PASS)
#   - Aggregate gate exit 0 for PASS|PARTIAL; exit 1 only on FAIL
#   - phase_closure_ready (E/F may schedule) requires every criterion PASS

version: 1
authority: docs/MASTER_TOPLEVEL_DESIGN.md §11 (FND-GATE 十维)

# S7 typed hard-stop wall (F2) — counts are the wall, not residual debt
s7_ssot_wall:
  ssot: 20
  fill: 1
  compatibility: 22
  kinds:
    sync_orphan: 10
    serve_l0_declared: 8
    blocked_no_publication: 2
  # retired (not ssot): stk_factor_pro + express/fina_mainbz (2026-07-23/24);
  # stk_holdernumber restored 2026-07-24 → ssot/serve_l0_declared

# E0 accept breadth (F6)
e0_breadth:
  holders_dataset_id: tier0.disclosure.top10_float_holders_period
  stk_dataset_id: tier0.disclosure.stock_holder_trade_announcement
  daily_dataset_id: tier0.market_data.nominal_ohlcv_daily
  org_dataset_id: tier0.disclosure.org_holding_detail_period
  holders_db: smartmoney
  stk_db: tushare_raw
  daily_db: tushare_raw
  org_db: smartmoney
  min_holders_daily_overlap: 120
  # org: mass by-date invent banned; population floor blocks canary false-green
  min_org_accepted_stocks: 500
  org_population_dataset_id: tier0.disclosure.org_holding_detail_period

# B5 / qfq (F4) — Type-B enrichment FIXED (was defer wall; cleared 2026-07-23)
b5:
  qfq_brick_id: price_kline_qfq_tushare
  qfq_trust: LINEAGE_OK
  qfq_db: market
  qfq_table: price_kline_qfq_tushare
  # Empty = no typed defer wall; institution_profile_edge must not be partial
  # without a listed defer code (gate still enforces).
  type_b_defer_codes: []

# §15 behavior (F8) — PASS after §15-VERIFY (2026-07-21)
# Evidence authority: git log --grep section15_verify
section_15:
  status: PASS
  reason: section15_verify_three_consecutive_l3_knives
  max_commits_per_knife: 1.5
  required_consecutive_l3_knives: 3
  # PASS requires ≥3 knives each with positive commits + pre_knife=true;
  # mean commits/knife must be ≤ max_commits_per_knife (not loosened).
  evidence:
    measured_at: "2026-07-21"
    commits_per_knife: 1.0
    artifact: git log --grep section15_verify
    knives:
      - name: e0-hist
        commits: 1
        pre_knife: true
        sha: "4f7a13af083f21494b720806c9a3d3607d33be4c"
        subject: "feat(foundation): E0-HIST F6 PASS — holders/stk local-raw chunked accept"
      - name: fnd-gate
        commits: 1
        pre_knife: true
        sha: "eefd19e532c7403202664a304d7f9191ff2f4109"
        subject: "feat(foundation): FND-GATE — machine-checkable F1–F10 foundation-done aggregate"
      - name: section15-verify
        commits: 1
        pre_knife: true
        subject: "feat(foundation): §15-VERIFY — F8 PASS knife-merge evidence (this knife)"

# Strategy ladder (F9) — RX may be scheduled; Optuna/Release stay banned.
strategy_pause:
  goal_must_contain:
    - "RX_AUTH="
    - "Optuna"
    - "StrategyRelease"

# Dual-track (F10)
dual_track:
  retire_notes: data/lineage/legacy_retire_notes.md
  must_contain:
    - "residual = NONE"
