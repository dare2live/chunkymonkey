version: 1
# out_of_scope_scan.yaml — check_out_of_scope_rows.py 的最小 typed 声明 (S3, 2026-09-12;
# 2026-09-19 刀 B2 §2.4/§3: 删 landing_exemptions/observed, 加
# databases_without_security_code_columns)。
#
# 这是 backend/config/vendor_scope.yaml (v2, 已随刀 B2 合入) 的**过渡文件**, 不是它的
# 替代品。两者管的是同一件事的两个不同侧面:
#   - vendor_scope.yaml 的 out_of_scope_classes / dispositions[*].mode 决定
#     "某个 (source, api) 取数时该怎么处置"(request_exclude / response_exclude /
#     code_exclude / ...) —— 是取数策略, 消费方是各适配器 (miaoxiang.py 等)。
#   - 本文件只决定"运行时不变量检查扫哪些代码列、认哪些代码段属于范围外类别、
#     哪些库按设计没有证券代码列"——是事实核查, 消费方只有 check_out_of_scope_rows.py
#     一个。
#
# S1 的 vendor_scope v2 合入后应做的合并 (到时候删除本文件):
#   - security_code_columns **不要**改读 vendor_scope 那份: 两者同名但语义不同 ——
#     vendor_scope 的那份判「哪些 (source, api) 必须登记处置」(面对 sync_registry 的声明面,
#     今天 4 个), 本文件的那份判「扫库时认哪些列名」(面对库里实际长出来的列, 今天 6 个,
#     多 secucode / symbol)。照搬会让扫描丢掉这两列 = 那些列里的范围外行永远报 PASS。
#     两份的关系由 test_vendor_scope_code_columns_are_subset_of_scanned_columns 钉住(子集, 非相等)。
#   - classes[*].code_patterns 改读 vendor_scope.out_of_scope_classes[*].code_patterns
#     (公式已统一到 services.data_sources.out_of_scope_codes, 本文件的 CodePattern/
#     class_regex 已经是同一个模块, 只是两份 code_patterns 声明还没合并成一份)。
#
# databases_without_security_code_columns 是唯一合法的"无代码列"豁免形态 (§3, 取代
# 旧 landing_exemptions/observed 一档"报数不算失败"): 一个库要么枚举到 ≥1 个代码列
# 并逐列扫 (0 行才 PASS), 要么被这里显式声明"预期无证券代码列"且实际枚举也为空才
# PASS; 声明与实况任一不符即非 PASS (声明过期 = 该库长出了代码列 = FAIL, 不是悄悄
# 放行)。没有声明的库枚举到 0 个代码列, 仍然是 UNVERIFIED enumeration_empty, 不改判。
#
# 机器判据边界 (b_share_exclusion_r1.md §2.3 C3, check_out_of_scope_rows.py 头注复述):
# 本文件登记的是"范围外类别"(业主裁定永不做的证券类别, 无版本号, 在所有表包括 raw
# 上以 0 行执法), 不是"股票池过滤"(universe_rules.yaml 里那种有版本 hash、只在
# serve/发布面执法的政策)。两者绝不合并到一份文件——合并会让"股票池收紧"变成
# 悄悄改一个只在 raw 层执法的范围外类别, 或反过来把范围外类别降级成一条可以被
# policy_version bump 悄悄修改的政策。

security_code_columns:
  # 6 种已知代码列名 (机器枚举实测: 手工列 15 张表会漏 raw_tushare_dc_member.con_code
  # 与 fact_dc_member_daily.con_code 各 10,596 行——所以这里只声明"认哪些列名",
  # 具体落在哪些表由 check_out_of_scope_rows.py 对每个活库的 information_schema
  # 发现式枚举, 不在此处或任何地方手写表清单)。
  - ts_code
  - stock_code
  - con_code
  - code
  - secucode
  - symbol

classes:
  b_share:
    ruling: "业主 2026-09-12 裁定: B 股不在本项目范围, 以后也不做, 获取完的数据删除清理干净"
    code_patterns:
      # 上交所 B 股 900000-900999 独占段, 深交所 B 股 200000-200999 独占段;
      # 两段历史上从未挪作他用 (b_share_exclusion_r1.md §5.1)。带不带交易所后缀都要
      # 判 (落库既有裸 6 位也有带后缀写法), 但后缀必须匹配对应交易所, 防止
      # "包含 900" 这种子串误判 (如 9000011 七位数、600900.SH 都不该命中)。
      - {prefix: "900", suffix: SH}
      - {prefix: "200", suffix: SZ}

databases_without_security_code_columns:
  # 格式: {db: <database_manifest.yaml 里的库别名>, why: <非空说明>}。db 必须
  # manifest.require() 通过; 不重复。判据见 check_out_of_scope_rows.py 头注 §3
  # 分支表——声明了且实际枚举也为空才判 PASS; 声明了但枚举到代码列 → 照常逐列扫
  # 并追加一行 FAIL (stale_declaration), 声明不能让枚举被跳过; 未声明库枚举为空
  # 仍是 UNVERIFIED enumeration_empty。
  - db: experiment_store
    why: "database_manifest: alpha_validation_experiment, 4 张表 (verdict / ic_scan /
      artifact_lineage / pit_audit_log) 只存 run_id / 哈希 / 判决, 按设计无证券代码列
      (spec_bshare_b2.md §1.2, 2026-09-19 information_schema 实枚: 31 列 0 命中)。"
