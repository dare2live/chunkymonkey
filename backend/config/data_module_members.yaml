# 数据模块成员 roster — 不变量4 (单概念单真相源 / SERVE 单一读路) 执法 (2026-06-23 边界法决议2)
#
# 成员 = 数据模块的子模块本身 (采集/清洗/加工/serving/审计/infra/真相源), 允许连数据源/读 raw —
#   它们就是数据模块, 不是"绕过的外人" (解 SERVE 建在 adapter 之上的循环依赖)。
# 非成员 (策略/信号/展示/回测消费者) 内联读 raw L0 = 违规 → 必须走 services.data_access.DataAccess.get()。
# owner=analysis/data_module_toplevel_design_20260622.md §1.5 / §2 (ACQUIRE→STORE→SERVE→CONSUME)。
# 用法: check_serve_read_layer.py --bypass-scan 读本 roster, 扫非成员内联 raw 读 (WARN→后续升硬门)。
version: 1

# 目录级成员 (整包是数据模块)
member_dirs:
  - backend/services/data_access/      # SERVE 读层 (清洗单一执行点)
  - backend/services/data_sources/     # 采集 sync_runner (acquire)
  - backend/services/pipeline/         # daily_update 四阶段编排 (获取/清洗/加工/存储) — 数据模块自己的更新引擎, 非外部消费者 (2026-06-23 重设计)
  - backend/services/technical_states/ # 纯函数派生 (读 SERVE 传入序列, 不直连)
  - backend/services/perf/             # 性能/并行基础设施 (shard/reducer, 导快照非消费raw)
  - backend/services/lineage/          # M5 血缘中枢 (字典+总指挥; 读 information_schema 元数据描述单一路径架构, 不变量4 自描述副产物, 非消费 PIT 数据)

# scripts 文件名前缀级成员 (basename 前缀)
member_script_prefixes:
  - build_        # 加工 builder (物化 L1/L2, bulk 读 clean canonical / 经 data_loaders)
  - audit_        # 审计工具 (直查真相源, 不能经被审对象读层)
  - check_        # 门脚本自身
  - db_           # DB 生命周期 (compact/delete/partition)
  - ingest_       # 采集落库
  - migrate_      # 迁移工具
  - plan_         # retention 计划
  - cleanup_      # 清理工具
  - profile_      # 字段画像
  - measure_      # 一次性度量 (评估后入 sandbox)

# 具体 service 文件成员 (infra/写侧/真相源/审计)
member_service_files:
  - duck_adapter.py          # DB adapter (SERVE 建其上)
  - db_connection.py
  - database_manifest.py     # 库路由
  - market_db.py             # 写侧
  - market_schema.py         # DDL
  - market_read.py           # K线读 helper (serving 内部)
  # etf_db.py 已删 2026-06-29 (批3d: ETF 子系统整体退役物删)
  - experiment_store.py      # L4 store
  - security_master.py       # 身份/dim 真相源
  - universe.py              # 交易日历级硬真相源 (不能依赖派生读层)
  - kline_source.py          # K线写侧 normalize
  - data_audit.py            # 审计
  - institution_profile.py   # M3 加工 builder (2026-07-02 W1: 读 raw/L1 物化 feature_store L2 画像;
                             #   与 build_price_kline_qfq_tushare 同性质; 消费方读其产物走 SERVE entity[A阶段接])
  - segments.py              # M3 加工 builder (2026-07-02 B1: 读 raw daily_basic+PIT行业 物化分层标签, 单一计算点)
  - technical_states/        # M3 加工 builder (2026-07-02 B2 正交轴形态识别; upstream=price_kline_qfq+daily/stk_limit原始价触板+index_daily+dim_trading_calendar+dim_stock_segment_daily[E轴]; consumer=D1 GT/D2 L0/C前端档案/B4 stage分布)
  - market_pulse.py          # M3 加工 builder (2026-07-02 B4: follow-the-money 板块/全市场脉搏, 两链隔离; upstream=moneyflow_ind_dc/dc_index/sw_daily/index_daily/limit_list_d/daily/moneyflow_mkt_dc/index_member_all/dim_stock_segment_daily; consumer=C4 pulse API+D2 板块上下文)
  - data_quality.py          # 审计
