    mart_per_formula_stage_optimal:
      description: "Per (formula × stage × train_end_date) 严格 walk-forward Optuna (Phase ψ.α B)"
      pit_key: train_end_date
      fields:
        formula_id:        {type: TEXT, role: pk}
        formula_variant:   {type: TEXT, role: pk}
        stage_filter:      {type: TEXT, role: pk}
        train_end_date:    {type: DATE, role: pk + pit-key}
        optimal_hp:        {type: INTEGER}
        optimal_stop_pct:  {type: DOUBLE, unit: fraction}
        optimal_target_pct: {type: DOUBLE, unit: fraction}
        oos_sharpe:        {type: DOUBLE, unit: dimensionless, role: business-canonical}

    mart_ensemble_optimal:
      description: "Phase ψ.γ.1 ensemble 20 维 Optuna 全寻优 best_params + OOS (新)"
      pit_key: built_at
      fields:
        study_name:        {type: TEXT, role: pk}
        best_params_json:  {type: JSON}
        walk_forward_mode: {type: TEXT}
        oos_sharpe:        {type: DOUBLE, role: business-canonical}
        oos_calmar:        {type: DOUBLE}

  etf.duckdb:
    description: ETF 数据 (单独 DB, 跟主流不混)

## 跨表 JOIN 模板 (Rule 7 PIT 防 leakage)
join_templates:

  pit_max_by_stock_date: |
    -- 取每股 ≤ signal_date 的最新 PIT 行
    SELECT t.*
      FROM <table> t
      JOIN (
        SELECT stock_code, MAX(<pit_key>) AS pit
          FROM <table>
         WHERE <pit_key> <= ?  -- signal_date
         GROUP BY stock_code
      ) p ON p.stock_code = t.stock_code AND p.pit = t.<pit_key>

  asof_kline_to_event: |
    -- ASOF JOIN: K 线 × 财报 announce_date (财报日发布后, forward 填充到下次发布)
    SELECT k.date, k.code, k.close, f.<field>
      FROM market.v_price_kline_qfq k
      ASOF JOIN <event_table> f
        ON k.code = f.stock_code AND k.date >= f.announce_date

## 已知字段命名不一致 (技术债, §11.5 #17 渐进 fix)
known_inconsistencies:
  date_field_names:
    - "fact_signal_context.date  vs  fact_risk_factors.calc_date  vs  fact_financial_pit_daily.trade_date"
    - "→ 应统一为 pit_key 角色字段, 物理名保留向后兼容"
  unit_volume:
    - "v_price_kline_qfq.volume: tdxhub=手, akshare_sina=股"
    - "→ Phase ψ.β.align _vwap sanity check 已挡; 长期方案: ingest 时 normalize 到 '手'"
  outlier_cap:
    - "holder_count_change_q_pct cap=90 — Phase ψ.β.3 hardcoded in backfill SQL"
    - "→ 长期: 单独 outlier policy yaml + 写入前 governance"
