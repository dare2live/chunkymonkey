# Brick registry (L2 primitives / L3 FeatureBlocks + Type-B edge) — B5 strangler
#
# Authority: analysis/data_brick_architecture_20260721.md
# Gate: backend/scripts/check_brick_registry.py (+ moth claim + doctor section)
#
# Orthogonal to legacy data_layers.yaml:
#   - data_layers L2_feature / L3_model = wiped physical Type-B vocab (compatibility)
#   - THIS file = brick-architecture L0–L3 semantic layers (L2=primitive, L3=composite/Type-B)
#
# Rules:
#   - L2 depends_on ⊆ L1/L0 reference_nodes | other L2 bricks (never L3/L4)
#   - L3 feature_blocks: max_composite_hops along L3 chain (default 2)
#   - no silent raw_* / raw_tushare_* depends_on (allow_raw_bypass only with evidence)
#   - every FEATURE_BLOCK_ID in backend/services must appear under feature_blocks
#   - every data_layers tables:* → L2_feature must appear in some outputs (Type-B deep reg)
#   - status=partial requires typed partial_reasons; type_b_edge requires store=feature_store
#
# qfq physical lineage FIXED (batch_id/ingested_at/factor_as_of on rebuild).
# B5 registry/qfq FIXED; Type-B institution_profile_edge enrichment ACCEPTED
# after E0-HIST (canonical enrichment filled; 新进 null hold_change_num typed OK).

version: 1
max_composite_hops: 2

reference_nodes:
  accepted_nominal_ohlcv_daily:
    layer: L1
    kind: accepted_canonical
  accepted_stock_st_daily:
    layer: L1
    kind: accepted_canonical
  DatasetSnapshot.holders_top10:
    layer: L1
    kind: snapshot_binding
  canonical_top10_float_holders_period:
    layer: L1
    kind: accepted_canonical
  # adj_factor consumed by qfq derive; still L1-ish vendor fact, not an L2 brick yet
  adj_factor:
    layer: L1
    kind: corporate_action_factor

bricks:
  price_kline_qfq_tushare:
    layer: L2
    kind: primitive
    depends_on: [accepted_nominal_ohlcv_daily, adj_factor]
    outputs: [price_kline_qfq_tushare, kline_qfq]
    owners:
      - backend/scripts/build_price_kline_qfq_tushare.py
    config_hash: derive_qfq_from_accepted_v2_lineage
    availability_axis: available_at
    status: declared
    lineage:
      method: latest_factor_rebase_qfq
      as_of_policy: rebuild_snapshot_latest_adj_factor_per_stock
      nominal_source: accepted_canonical_nominal_ohlcv_daily
      factor_source: raw_tushare_adj_factor
      physical_lineage_columns: [batch_id, ingested_at, factor_as_of]
      read_placeholders: []
      trust: LINEAGE_OK
      not_execution_truth: true
      method_note: >-
        Historical OHLC levels rewrite on each full rebuild when latest
        adj_factor changes; pin batch_id/factor_as_of for reproducibility.
        Method is typed, not a missing-lineage defect.
    notes: >-
      S5/S7 derive --from-accepted; physical lineage on rebuild path;
      not execution truth; B5 residual = Type-B enrichment PARTIAL only

  fact_stock_form_daily:
    layer: L2
    kind: primitive
    depends_on: [accepted_nominal_ohlcv_daily]
    outputs: [fact_stock_form_daily]
    owners:
      - backend/services/technical_states
    config_hash: technical_states_form_from_accepted_v1
    availability_axis: available_at
    status: declared
    notes: "S5 derive form; Type A axes; no direction claim"

  # Distinct brick_id from L3 feature_block stock_state_stage_pattern_v1
  # (same definition_version string is OK; node ids must not collide across layers).
  tier1_stock_state_stage_pattern_v1:
    layer: L2
    kind: primitive
    depends_on: [accepted_nominal_ohlcv_daily, fact_stock_form_daily]
    outputs: [StockStateDaily, stock_state_stage, pattern_event]
    owners:
      - backend/config/tier12_publish.yaml
    config_hash: "184d82ed71a15d61768ce001250b8de86efa1aa0e5ae742bfdf5619d5c24fdd4"
    availability_axis: available_at
    status: declared
    notes: "Tier1 base publish (L2); definition_version=stock_state_stage_pattern_v1"

  MarketContextSnapshot:
    layer: L2
    kind: primitive
    depends_on: [accepted_nominal_ohlcv_daily]
    outputs: [MarketContextSnapshot, market_risk_on, project_board_adv_dec_ratio]
    owners:
      - backend/config/tier12_publish.yaml
    config_hash: market_sensing_project_breadth_v0
    availability_axis: available_at
    status: declared
    notes: "Tier2 base publish (L2); B2 FeatureBlock composes this snapshot"

  # Declared Type-A pulse composite kept thin (no hop inflation)
  mart_market_pulse_daily:
    layer: L2
    kind: primitive
    depends_on: [accepted_nominal_ohlcv_daily, fact_stock_form_daily]
    outputs: [mart_market_pulse_daily]
    owners:
      - backend/services/market_pulse.py
    config_hash: market_pulse_daily_v2
    availability_axis: available_at
    status: partial
    partial_reasons:
      - code: pending_deeper_l3_split
        detail: >-
          Registered as L2 serve/display primitive; optional L3 composite split
          deferred (not required for Type-B orphan coverage).
    notes: "display/Type-A mart; L2 serve primitive pending optional L3 split"

feature_blocks:
  stock_state_stage_pattern_v0:
    layer: L3
    kind: feature_block
    depends_on:
      - accepted_nominal_ohlcv_daily
      - accepted_stock_st_daily
      - fact_stock_form_daily
    outputs: [stock_state_stage, pattern_event]
    owners:
      - backend/services/institution_follow_b1.py
    config_hash: trend_up_or_breakout_v0
    availability_axis: decision_time_visible_only
    status: declared
    notes: "institution_follow B1 FeatureBlock (legacy v0 definition)"

  stock_state_stage_pattern_v1:
    layer: L3
    kind: feature_block
    depends_on:
      - accepted_nominal_ohlcv_daily
      - fact_stock_form_daily
    outputs: [stock_state_stage, pattern_event]
    owners:
      - backend/services/main_rally_b1.py
    config_hash: trend_up_or_breakout_v1
    availability_axis: decision_time_visible_only
    status: declared
    notes: "main_rally B1 FeatureBlock; consumes L2 form (+ Tier1 publish path)"

  market_sensing_project_breadth_v0:
    layer: L3
    kind: feature_block
    depends_on:
      - accepted_nominal_ohlcv_daily
      - MarketContextSnapshot
    outputs: [market_risk_on, project_board_adv_dec_ratio]
    owners:
      - backend/services/institution_follow_b2.py
      - backend/services/main_rally_b2.py
    config_hash: risk_on_adv_dec_ratio_ge_1_v0
    availability_axis: decision_time_eod_available_at_required
    status: declared
    notes: "B2 FeatureBlock; L3 over L2 MarketContextSnapshot (1 hop)"

  institution_event_holders_disclosure_v0:
    layer: L3
    kind: feature_block
    depends_on:
      - accepted_nominal_ohlcv_daily
      - DatasetSnapshot.holders_top10
      - canonical_top10_float_holders_period
    outputs: [disclosure_event_eligible, institution_increase_score]
    owners:
      - backend/services/institution_follow_b4.py
    config_hash: increase_event_day_chase3_v0
    availability_axis: notice_date_and_available_at_required_null_excluded
    status: declared
    notes: "B4 FeatureBlock; L1 disclosure inputs (E0 PARTIAL)"

  # ── Type-B / feature_store edge (data_layers L2_feature tables) ────────────
  institution_profile_edge_v0:
    layer: L3
    kind: type_b_edge
    store: feature_store
    depends_on:
      - price_kline_qfq_tushare
      - DatasetSnapshot.holders_top10
      - canonical_top10_float_holders_period
    outputs:
      - period_windows
      - fact_inst_episode
      - mart_inst_profile
      - mart_inst_profile_dim
    owners:
      - backend/services/institution_profile.py
    config_hash: canonical_spine_legacy_enrichment_projection
    availability_axis: research_rebuild_only_no_decision_time_claim
    status: declared
    notes: >-
      Type-B edge; wipeable feature_store; not FeatureBlock strategy ladder.
      Enrichment ACCEPTED after E0-HIST (canonical carries fields; legacy_only
      for periods absent from canonical).

  rally_gt_edge_v2:
    layer: L3
    kind: type_b_edge
    store: feature_store
    depends_on:
      - price_kline_qfq_tushare
      - fact_stock_form_daily
      - accepted_stock_st_daily
    outputs:
      - fact_rally_ground_truth
      - fact_rally_negative
      - fact_rally_strata
    owners:
      - backend/services/rally_gt.py
    config_hash: v2_20260702
    availability_axis: post_outcome_label_research_only
    status: declared
    notes: >-
      Type-B GT with forward labels; edge-isolated in feature_store;
      taxonomy_version=v2_20260702; never SERVE as Type A
