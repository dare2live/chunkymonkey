version: 1
_doc: >-
  (数据候选 x 消费者) alpha 验证矩阵定义 (S0, owner=analysis/alpha_validation_program_spec_20260614.md §3)。
  死亡条款#2 (判断死): 矩阵轴 + 映射铁律走 config 不 hardcode 进 executor。executor
  (backend/scripts/experiment_consumer_alpha_validation.py) 读本文件枚举 cell = 每个
  data_candidate x 其 mapping 命中的 consumer。S0 只枚举不计算 (dry 空矩阵); IC 计算留 S3。

# 消费者轴 (矩阵的列, spec §3.1)。kind 决定数据如何被消费 (映射铁律):
#   formula_signal = 技术价量数据喂给现成技术公式当买卖信号
#   feature_ic     = 基本面/事件/筹码数据无现成公式, 走 ML 特征面板算 IC
consumers:
  - id: technical_formula
    kind: formula_signal
    metrics: [oos_rank_ic, oos_ic_ir, oos_sharpe, n_windows]
    note: 20 技术公式 (18 live + 2 held-back; 突破/回踩/反转/均线/MACD/RSI/海龟/放量)
  - id: feature_panel_ic
    kind: feature_ic
    metrics: [oos_rank_ic, oos_ic_ir, oos_sharpe, n_windows]
    note: fact_feature_panel 因子族 IC (基本面/事件/筹码数据的唯一诚实消费路径)

# 映射铁律 (spec §3.1): 数据域 -> 消费者 kind。executor 按 landing 字段路由。
mapping_law:
  technical: formula_signal           # 技术数据 -> 公式信号供给
  fundamental: feature_ic             # 基本面 -> 特征面板 IC
  event: feature_ic                   # 事件 (业绩预告/股东/回购) -> 特征 IC
  chip: feature_ic                    # 筹码 -> 特征 IC
  infra: feature_ic                   # 行业树等基础设施 -> 中性化底座后入特征

# 数据候选轴 (矩阵的行, spec §3.2; 优先级 from data_access_surface_menu)。
# landing -> mapping_law -> 命中 consumer; consumer_ids 显式声明覆盖默认路由。
data_candidates:
  - id: forecast_express_pead
    priority: P0
    domain: earnings_forecast
    landing: event
    tushare_apis: [forecast, express, disclosure_date]
    alpha_hypothesis: 业绩预告/快报 = PEAD 预期差事件, ann_date 早于财报, PIT 干净
    status: data_ready          # S1 已回填
  - id: income_fina_indicator
    priority: P0
    domain: financial_statement
    landing: fundamental
    tushare_apis: [income, fina_indicator]
    alpha_hypothesis: 质量/成长/价值因子底座 (现仅 fina_mainbz)
    status: data_ready          # S1 已回填
  - id: cyq_chips
    priority: P1
    domain: chip_distribution
    landing: chip
    tushare_apis: [cyq_chips]
    alpha_hypothesis: 完整分布自算获利盘/集中度; 救活被冻 winner_rate
    status: data_pending
  - id: kpl_limit_step
    priority: P1
    domain: limit_up_ladder
    landing: technical          # 打板/连板天梯既可公式也可特征
    consumer_ids: [technical_formula, feature_panel_ic]
    tushare_apis: [kpl_list, limit_step]
    alpha_hypothesis: 连板情绪周期 = 主升浪猎手北极星直接相关
    status: data_pending
  - id: holder_events
    priority: P2
    domain: insider_shareholder
    landing: event
    tushare_apis: [stk_holdertrade, repurchase, stk_holdernumber]
    alpha_hypothesis: 增减持/回购/户数 = 经典事件 + 筹码集中代理
    status: data_pending
  - id: sw_industry_tree
    priority: P2
    domain: industry_taxonomy
    landing: infra
    tushare_apis: [index_classify, sw_daily]
    alpha_hypothesis: 行业中性化底座 (治行业 fallback 99.978% leakage 反例)
    status: data_pending
